oduct in cattle is extra-label use, and AMDUCA requires a science-based (FARAD) withdrawal interval (W6 Clinical Prescribing in Livestock); the W15 slide warns that gentamicin drops carry a prolonged withdrawal time of 18 months, longer than her 8 months to slaughter.","wrong":{"0":"Gentamicin is not on the Group I prohibited list (chloramphenicol, clenbuterol, DES, fluoroquinolones, nitroimidazoles, nitrofurans, glycopeptides).","1":"Any use off the label, including a different species or route, is extra-label use that still needs a withdrawal interval.","3":"There is no cattle label for this horse product, so the withdrawal must be science-based (FARAD) rather than taken from a label.","4":"Restrictions tied to lactating or older female dairy cattle apply to sulfonamides and phenylbutazone (Group II), not this heifer."},"lec":"Integration: W15 + W6","weeks":[15,6],"mods":[4,2],"disc":"Public health and pharmacology","species":"Cattle","type":"Interpretation"},{"stem":"A 3-year-old intact female domestic shorthair cat in the last week of gestation has a deep forelimb laceration repaired under light sedation and a local infiltration block. The owner wants the kittens to survive. For postoperative analgesia a student proposes a course of an NSAID, and the clinician objects because of the effect on the fetuses. Which fetal effect underlies the clinician's concern?","options":["Fetal teratogenesis","Fetal bradycardia","Fetal ion trapping","Prolonged maternal hypotension","Premature ductus closure"],"correct":4,"why":"In late gestation the Week 1 life-stages slides list NSAIDs as generally contraindicated because prostaglandin inhibition reduces uterine blood flow, causes premature closure of the ductus arteriosus, and impairs fetal renal function. Teratogenesis is the early-gestation risk, so the timing in the stem points to the ductus. Local anesthetic techniques, which the slides strongly recommend, give minimal fetal exposure.","wrong":{"0":"Teratogenesis and spontaneous abortion are early-gestation risks, and this queen is in the last week.","1":"Fetal bradycardia is listed for alpha-2 agonists, not NSAIDs.","2":"Ion trapping is described for opioids and local anesthetics crossing the placenta, not NSAIDs.","3":"Prolonged maternal hypotension that compromises uteroplacental perfusion is the slides' reason to avoid acepromazine."},"lec":"W1: Physiological Life Stages","weeks":[1],"mods":[1],"disc":"Anesthesia","species":"Cat","type":"Mechanism"},{"stem":"A 15-year-old spayed female domestic shorthair cat has had weight loss, polyuria, and polydipsia for 8 months. Creatinine is 4.1 mg/dL (0.8-2.4 mg/dL), and urine specific gravity is 1.012. On abdominal ultrasound both kidneys measure 2.5 cm in length and have irregular margins. The renal pelvis measures 1 mm in the transverse plane, and no anechoic cortical structures or masses are seen. Which diagnosis best fits?","options":["Polycystic kidney disease","Hydronephrosis","Perinephric pseudocyst","Acute interstitial nephritis","Chronic kidney disease"],"correct":4,"why":"Normal feline renal length is 3.0-4.5 cm (Week 3 abdominal ultrasound), so 2.5-cm kidneys with irregular margins are small and irregular, the pattern the slides list for CKD in cats. The long history and azotemia fit. Every other option on the slides causes renomegaly.","wrong":{"0":"Polycystic kidney disease causes renomegaly with multiple anechoic structures in the cortex.","1":"Hydronephrosis enlarges the kidney with a dilated pelvis, and this pelvis is under 2 mm, which is normal.","2":"A perinephric pseudocyst is listed as a cause of renomegaly, not small kidneys.","3":"Leptospirosis or acute interstitial nephritis produces enlarged, diffusely hyperechoic kidneys."},"lec":"W3: Basics of Abdominal Ultrasound","weeks":[3],"mods":[1],"disc":"Imaging","species":"Cat","type":"Diagnosis"},{"stem":"A 14-year-old Thoroughbred gelding has lost weight over 2 months and now has ventral edema, tachypnea, and dull percussion over the ventral thorax on both sides. Ultrasound shows bilateral pleural fluid. Echocardiography shows normal cardiac structure and function. Thoracocentesis yields cloudy, non-bloody fluid. Cytology shows a highly cellular sample dominated by an expanded population of large, atypical lymphoid cells, with few non-degenerate neutrophils and no bacteria. Which interpretation fits best?","options":["Septic pleuritis","Thoracic lymphoma","Cardiogenic effusion","Hemothorax","Hypoalbuminemic transudate"],"correct":1,"why":"The Week 10 Effusions slides list lymphoma under thoracic neoplasia as a cause of pleural effusion and use cytology to evaluate cells and infectious agents. The Week 7 Large Animal Tumors slides describe equine lymphoma as an expanded atypical lymphoid population that exfoliates as individual round cells and may involve nodes, organs, or effusions, which matches this fluid.","wrong":{"0":"Septic pleuritis produces an exudate with degenerate neutrophils and bacteria, and this fluid has neither.","2":"Cardiogenic effusion is a listed cause of pleural fluid, but echocardiography is normal and the fluid is full of atypical lymphoid cells.","3":"Hemothorax follows trauma or bleeding disorders and yields bloody fluid, which this is not.","4":"A hypoalbuminemic transudate is low in cells, while this fluid is highly cellular with atypical lymphoid cells."},"lec":"Integration: W10 + W7","weeks":[10,7],"mods":[3,2],"disc":"Oncology","species":"Horse","type":"Interpretation"},{"stem":"A 5-year-old Pug had a traumatic proptosis of the right eye 4 months ago that was replaced. The right eye now has no menace response and no direct PLR, and light shone in the right eye does not constrict the left pupil; the left eye is normal. Fundic exam of the right eye shows a pale, recessed optic disc with an otherwise normal-looking retina. Which diagnosis is most likely?","options":["Optic neuritis","Optic nerve atrophy","SARDS","Progressive retinal atrophy","Rhegmatogenous retinal detachment"],"correct":1,"why":"Blindness with absent PLRs localizes to the retina or optic nerve (W14 eye exam rules of thumb), and a pale, recessed disc after trauma is optic nerve atrophy. The W15 Posterior Segment lecture lists trauma, especially proptosis, as a common cause, along with orbital disease, PRA, and glaucoma.","wrong":{"0":"Optic neuritis makes the disc swollen and hyperemic with fuzzy margins, not pale and recessed.","2":"SARDS causes acute vision loss with a normal fundus at first and an extinguished ERG, not a pale disc after trauma.","3":"PRA is inherited and bilateral, with night blindness first, vessel attenuation, and tapetal hyperreflectivity.","4":"A detachment would show retina displaced from its normal position, and this retina looks normal."},"lec":"W15: Posterior Segment","weeks":[15],"mods":[4],"disc":"Ophthalmology","species":"Dog","type":"Diagnosis"},{"stem":"A 7-year-old spayed female boxer with multicentric lymphoma received doxorubicin 7 days ago in week 4 of a CHOP protocol. At a scheduled recheck she is bright and eating, with no vomiting or diarrhea, and her rectal temperature is 38.6°C (101.5°F). CBC: neutrophils 800/µL (reference 3,000-11,500), platelets 210,000/µL (reference 200,000-500,000), hematocrit 41% (reference 37-55%). Which plan is most appropriate?","options":["Hospitalize, IV antibiotics","Blood and urine cultures","Oral antibiotics at home","Next doxorubicin at full dose","Activity restriction only"],"correct":2,"why":"A neutrophil count below 1,000/µL without fever is normothermic neutropenia. The slides recommend oral antibiotics at home, stopping them when neutrophils rebound in 5-7 days, hospitalizing only if she becomes lethargic or febrile, and reducing the dose of that drug next time.","wrong":{"0":"Hospitalization with IV antibiotics is the plan for febrile neutropenia (treated as sepsis), and she is afebrile and bright.","1":"Even in febrile neutropenia the slides say blood and urine cultures are usually not indicated.","3":"The slides call for a dose reduction of the drug that caused the myelosuppression.","4":"Restricting traumatic activity is the plan for chemotherapy-induced thrombocytopenia, and her platelets are normal."},"lec":"W7: Introduction to Oncology","weeks":[7],"mods":[2],"disc":"Oncology","species":"Dog","type":"Management"},{"stem":"A 3-year-old male Brittany used for upland hunting has fever, weight loss, and rapid, shallow breathing. Ultrasound shows bilateral pleural effusion, and thoracocentesis yields a foul-smelling, turbid fluid with degenerate neutrophils and filamentous bacteria. He has been stabilized with oxygen and needle drainage, but the fluid reaccumulates within hours. Culture-based antibiotics have been started. Which drainage plan is most appropriate?","options":["Repeated needle thoracocentesis","Thoracic duct ligation","Bilateral chest tubes, lavage","Subtotal pericardectomy","Rutin and a low-fat diet"],"correct":2,"why":"A septic exudate with degenerate neutrophils and bacteria in a hunting dog is pyothorax, which in dogs follows grass awn migration or wounds (Nocardia, Actinomyces). The Effusions treatment slide lists supportive care, drainage with bilateral chest tubes or thoracotomy, lavage, constant or intermittent suction, and 4-6 weeks of antibiotics. Bilateral, reaccumulating fluid needs chest tubes with lavage.","wrong":{"0":"Needle drainage helped stabilize him, but the slide's drainage plan for pyothorax is chest tubes or thoracotomy with lavage.","1":"Thoracic duct ligation is the surgical treatment for chylothorax, not for a septic exudate.","3":"Pericardectomy is paired with duct ligation for chylothorax and does not drain an infected pleural space.","4":"Rutin and a low-fat diet are medical treatments for chylothorax, not pyothorax."},"lec":"W10: Effusions","weeks":[10],"mods":[3],"disc":"Cardiorespiratory","species":"Dog","type":"Next step"},{"stem":"A 16-year-old Paint gelding was treated for 8 weeks for a wound on the prepuce that the owner thought came from a kick. Despite lavage and non-adherent dressings, the lesion has become a raised, proliferative, partly ulcerated mass. There is no excessive movement, foreign body, or infection to explain delayed healing. An aspirate from deep in the lesion shows cohesive clusters of atypical epithelial cells with keratinization and nuclear abnormalities, mixed with neutrophils. Which diagnosis is most likely?","options":["Exuberant granulation tissue","Equine sarcoid","Melanocytic tumor","Cutaneous lymphoma","Squamous cell carcinoma"],"correct":4,"why":"The Week 7 large animal tumor slides list squamous cell carcinoma for the eye or external genitalia, presenting as a persistent ulcer or proliferative lesion, with atypical epithelial cells, keratinization, and nuclear abnormalities on cytology, often with inflammation. The Week 3 wound slides attribute exuberant granulation tissue to delayed healing from movement, infection, foreign body, poor blood supply, or malnutrition, none of which apply here. A biopsy would then assess invasion.","wrong":{"0":"Proud flesh is the classic equine healing complication, but it needs a cause of delayed healing and would not yield atypical epithelial cells.","1":"Sarcoids occur on skin, scars, eyelids, and limbs and give poorly cellular aspirates of spindle cells, not cohesive epithelial clusters.","2":"Melanocytic tumors are typical of older grey horses under the tail or around the anus and contain melanin.","3":"Lymphoma exfoliates as individual round lymphoid cells, not cohesive epithelial clusters."},"lec":"Integration: W3 + W7","weeks":[3,7],"mods":[1,2],"disc":"Oncology","species":"Horse","type":"Diagnosis"},{"stem":"A 4-year-old male neutered Dachshund was attacked by a larger dog 3 hours ago. He has several puncture wounds over the left lateral thorax with subcutaneous emphysema. After oxygen and dorsal thoracocentesis to remove pleural air, he is stable, the wounds are covered, and antibiotics have been started. What is the next step for the chest wall wounds?","options":["Primary closure of punctures","Bandage and monitor only","Systemic antibiotics alone","Radiographs, then discharge","Full surgical exploration"],"correct":4,"why":"Bite wounds are penetrating trauma, and the pleural air shows the chest wall may have been breached. The Respiratory Emergency Considerations thoracic wall slide says to cover and protect penetrating wounds, start antibiotics, stabilize any pneumothorax or hemothorax, and then explore the wounds fully to check whether the pleural space was invaded, with debridement, lavage, culture, reconstruction, and drainage as needed.","wrong":{"0":"Closing small punctures looks tidy, but it skips the full exploration the slide requires to find deeper injury.","1":"Covering the wounds was the first step, but the slide's surgical plan is full exploration once he is stable.","2":"Antibiotics are on the slide's list, but they do not replace exploring the wounds for pleural invasion.","3":"The slides warn that trauma is usually polytrauma, and the wounds still need exploration, not discharge."},"lec":"W10: Respiratory Emergencies","weeks":[10],"mods":[3],"disc":"Surgery","species":"Dog","type":"Next step"},{"stem":"A 25-kg, 4-year-old spayed female mixed-breed dog is having a ventral midline celiotomy for a gastric foreign body. Before closure, the surgeon gives an intraperitoneal splash block of lidocaine 2% (20 mg/mL) at 4 mg/kg, diluted to a total of 0.5 mL/kg. The surgeon now wants to add an incisional line block with more lidocaine 2%. Which additional volume of lidocaine 2% keeps the total dose within the recommended limit?","options":["7.5-10 mL","10-15 mL","2.5-5 mL","5-7.5 mL","No further lidocaine"],"correct":2,"why":"The Week 3 surgical approaches slides cap total lidocaine 2% at 6-8 mg/kg when an incisional line block is added to a splash block. For 25 kg that is 150-200 mg; the splash already used 100 mg (4 mg/kg), leaving 50-100 mg, which is 2.5-5 mL of a 20 mg/mL solution.","wrong":{"0":"This is the whole 6-8 mg/kg allowance (150-200 mg) and ignores the 100 mg already given in the splash block.","1":"This is the 0.4-0.6 mL/kg dilution volume for a splash block, not a lidocaine dose.","3":"This subtracts a 2 mg/kg splash dose, the bottom of the 2-4 mg/kg range, rather than the 4 mg/kg actually given.","4":"Four mg/kg is the top of the splash range but still below the 6-8 mg/kg total limit, so a line block is allowed."},"lec":"W3: Surgical Approaches to the Abdomen","weeks":[3],"mods":[1],"disc":"Surgery","species":"Dog","type":"Calculation"},{"stem":"A 10-month-old intact male Bengal from a cattery was diagnosed with effusive FIP (Rivalta-positive abdominal effusion, A:G ratio 0.4, FCoV RT-PCR positive on the fluid) and started oral GS-441524. The effusion resolved by week 2, and at week 10 he is bright and has gained weight. The owner asks whether stopping treatment at 12 weeks is reasonable. Which test result is most useful for predicting remission?","options":["Serum FCoV antibody titer","Fecal FCoV RT-PCR","Serum AGP concentration","Blood FCoV RT-PCR","Repeat Rivalta test"],"correct":2,"why":"Improvement within days, effusion resolution by 2 weeks, and weight gain fit a good response to the 6-12 week antiviral course. The slides state that normalization of AGP (alpha-1 acid glycoprotein, an acute phase protein) is useful for predicting remission, alongside CBC and chemistry rechecks at 2, 6, and 12 weeks.","wrong":{"0":"Serum FCoV antibodies only confirm exposure to the virus and do not track FIP remission.","1":"Fecal RT-PCR reflects enteric FCoV shedding, which about 70-80% of infected cats do intermittently without FIP.","3":"Blood PCR confirms exposure, so it cannot show whether the FIP inflammatory process has resolved.","4":"The Rivalta test separates exudates from transudates and needs effusion, which resolved at week 2."},"lec":"W5: Viral Diseases in Companion Animals","weeks":[5],"mods":[2],"disc":"Infectious disease","species":"Cat","type":"Next step"},{"stem":"A 2-year-old cat has had a right head tilt, nystagmus, and miosis with ptosis of the right eye for 3 weeks. Otoscopy under anesthesia shows a smooth, pink mass filling the horizontal canal and extending through the tympanic membrane, and cytology shows bacteria with neutrophils. The owner declines ventral bulla osteotomy, so the mass is removed by traction-avulsion followed by a middle ear flush. Which follow-up plan best reduces the risk of regrowth?","options":["Repeat traction-avulsion monthly","Topical aminoglycoside ear drops","Total ear canal ablation","Maintenance ear cleaning only","Glucocorticoids for 4-8 weeks"],"correct":4,"why":"A young cat with a smooth pink middle-ear mass, bacterial otitis, vestibular signs, and Horner syndrome has an aural inflammatory polyp. Traction-avulsion alone has about 50% recurrence, and the W13 otitis lecture says following it with 4-8 weeks of oral and/or topical glucocorticoid reduces the recurrence rate.","wrong":{"0":"Scheduled repeat avulsions are not the slide's plan; recurrence is reduced with glucocorticoids, and VBO is the lower-recurrence surgery.","1":"Aminoglycosides carry the highest risk of ototoxicity, which matters more when the tympanic membrane is breached.","2":"TECA is a salvage procedure for end-stage otitis or neoplasia, not routine polyp follow-up.","3":"Cleaning removes canal debris but does not address regrowth from the middle ear, which is what the glucocorticoid course targets."},"lec":"W13: Otitis Externa and Media/Interna","weeks":[13],"mods":[4],"disc":"Surgery","species":"Cat","type":"Management"},{"stem":"A 12-year-old neutered male domestic shorthair cat has seven dermal nodules on the trunk, limbs, and head that appeared over 2 months. Aspirates of three nodules confirm mast cell tumor. Abdominal palpation reveals marked splenomegaly, and a blood smear shows circulating mast cells. Which interpretation best fits these findings?","options":["Metastatic splenic MCT","Benign cutaneous MCTs","Metastatic intestinal MCT","Nodular cutaneous lymphoma","Disseminated histiocytic sarcoma"],"correct":0,"why":"Week 13 Nodular Diseases notes that feline cutaneous MCTs are usually benign lesions of the head, pinnae, and neck, but multiple tumors at multiple body sites are probably metastatic disease from the spleen, with a poor prognosis. Week 6 Mast Cell Tumors adds that splenic MCT commonly involves other organs and can appear as mast cell leukemia on a blood smear, matching this cat's splenomegaly and circulating mast cells.","wrong":{"1":"Benign cutaneous MCTs in cats are typically on the head, pinnae, and neck and cured by surgery, not spread over many sites with splenomegaly.","2":"Intestinal MCT metastasizes to lymph nodes, liver, and spleen, but nothing here localizes disease to the gut.","3":"Nodular cutaneous lymphoma also causes many nodules, but these aspirates confirmed mast cells.","4":"Disseminated histiocytic sarcoma is described in Bernese mountain dogs, Rottweilers, and retrievers, and this cytology is mast cell tumor."},"lec":"Integration: W6 + W13","weeks":[6,13],"mods":[2,4],"disc":"Oncology","species":"Cat","type":"Interpretation"},{"stem":"A 2-year-old Quarter Horse filly in quarantine after purchase has a rectal temperature of 105.1°F (40.6°C; RI 99-101°F), is depressed, and will not eat. She has a large, painful left retropharyngeal lymph node and bilateral purulent nasal discharge, and the rebreathing exam is normal. PCR on a nasal wash is positive for Streptococcus equi subsp. equi. Which treatment is most appropriate now?","options":["Penicillin","Hot packs and NSAIDs only","Intranasal live vaccine","Bronchoalveolar lavage","Release after one negative PCR"],"correct":0,"why":"PCR confirms strangles, and this filly is systemically sick (high fever, depression, anorexia), which the W12 Equine Medical Respiratory Conditions lecture separates from horses that are not sick. Sick horses need antibiotics, and penicillin is the drug of choice, while she stays isolated.","wrong":{"1":"Hot packs, soft feed, and NSAIDs without antibiotics are the plan for strangles cases that are not sick.","2":"Strangles vaccine must never be given to an infected or exposed animal.","3":"BAL samples the lower airway for diffuse nonseptic disease; the rebreathing exam is normal and this disease is in the upper airway.","4":"Release requires 3 negative PCRs or cultures, and shedding continues for 2-3 weeks."},"lec":"W12: Equine Respiratory Conditions","weeks":[12],"mods":[4],"disc":"Infectious disease","species":"Horse","type":"Management"},{"stem":"An 8-week-old female Toy Poodle (1.1 kg) has been weak and has eaten little for 24 hours since moving to a new home. Rectal temperature is 38.6 C, and serum potassium is 4.4 mmol/L (RI 3.6-5.5). A lead II ECG at 50 mm/sec shows a regular rhythm with a P wave before every QRS complex, a constant P-R interval, and normal QRS complexes. There are 50 small boxes between consecutive R waves. Which cause of this rhythm should be checked for first?","options":["Hyperkalemia","Hypothermia","Hyperthyroidism","Fever","Hypoglycemia"],"correct":4,"why":"At 50 mm/sec, heart rate is 3000 divided by the small boxes between R waves, so 3000/50 = 60 bpm, a sinus bradycardia for a puppy (normal up to 220 bpm). The Interpreting ECGs table lists hypoglycemia, hypothermia, hyperkalemia, late shock, and drugs as bradycardia causes, and the Arrhythmias Part 1 slide on sinus bradycardia warns that puppies get hypoglycemic. With normal temperature and potassium, hypoglycemia in a young toy puppy that is not eating is the cause to check first.","wrong":{"0":"Hyperkalemia is on the bradycardia list, but this puppy's potassium is within the reference interval.","1":"Hypothermia also slows the heart, but her rectal temperature of 38.6 C is normal.","2":"Hyperthyroidism is a listed cause of sinus tachycardia, so it does not explain a rate of 60 bpm.","3":"Fever is a listed cause of sinus tachycardia, and this puppy is bradycardic with a normal temperature."},"lec":"W8: Interpreting ECGs","weeks":[8],"mods":[3],"disc":"Cardiorespiratory","species":"Dog","type":"Calculation"},{"stem":"A 9-year-old neutered male Beagle started topical dorzolamide solution in the right eye 6 weeks ago for primary glaucoma. The right upper and lower lids are now red, swollen, and losing pigment along the margins, while the lids of the left eye are normal. Skin scrapings are negative and cytology shows no bacteria. Which diagnosis is most likely?","options":["Demodectic blepharitis","Discoid lupus erythematosus","Meibomianitis","Puppy strangles","Topical drug reaction"],"correct":4,"why":"Blepharitis with depigmentation limited to the eye receiving a new topical drug, after infection is ruled out with scrapings and cytology, fits drug reaction blepharitis (W14 Diseases of the Eyelids). The slide lists topical ophthalmic medications (preservatives, neomycin, dorzolamide, cyclosporine, and nepafenac) as causes, and notes that this reaction frequently occurs with depigmentation.","wrong":{"0":"Demodex is an infectious cause of blepharitis, but skin scrapings are negative.","1":"Discoid lupus affects the nasal planum and periocular skin with loss of nasal cobblestone architecture, and it would not track the one medicated eye.","2":"Meibomianitis causes swelling of the glands or ductal openings and does not explain depigmentation tied to a new drug.","3":"Puppy strangles is an immune reaction to staphylococcal flora in puppies, not a 9-year-old dog."},"lec":"W14: Diseases of the Eyelids","weeks":[14],"mods":[4],"disc":"Ophthalmology","species":"Dog","type":"Diagnosis"},{"stem":"A 10-year-old bay Arabian gelding has a single, firm, well-circumscribed 2-cm dermal nodule on the side of the head that has been present for 6 months without change. He is otherwise healthy. A fine-needle aspirate is highly cellular and contains mostly individual round cells, many with abundant purple cytoplasmic granules. Which diagnosis is most likely?","options":["Mast cell tumor","Lymphoma","Melanocytic tumor","Equine sarcoid","Squamous cell carcinoma"],"correct":0,"why":"Individual round cells place the lesion in the round cell family, which in horses includes lymphoma and mast cell tumor (Week 7 Large Animal Tumors). Purple cytoplasmic granules are the key clue for mast cell tumor, and the slides note that equine cutaneous mast cell lesions are often localized, fitting a single stable nodule.","wrong":{"1":"Lymphoma also exfoliates as individual round cells, but it is an expanded atypical lymphoid population without cytoplasmic granules.","2":"Melanocytic tumors are typical of older grey horses under the tail or around the anus, with melanin in the tumor cells, and the slides advise identifying which cell carries any pigment.","3":"Sarcoids are mesenchymal and often poorly cellular, yielding spindle cells rather than a cellular round cell aspirate.","4":"Squamous cell carcinoma forms cohesive clusters of epithelial cells, usually at the eye or external genitalia."},"lec":"W7: Large Animal Tumors","weeks":[7],"mods":[2],"disc":"Oncology","species":"Horse","type":"Diagnosis"},{"stem":"A 6-year-old spayed female Shiba Inu has idiopathic chylothorax confirmed by fluid analysis, including fluid and serum triglyceride comparison. Repeated thoracocentesis, a low-fat diet, and rutin have failed, and thoracic duct ligation is planned through a lateral thoracotomy. Which intercostal space gives access to the thoracic duct?","options":["4th intercostal space","5th intercostal space","9th intercostal space","8th intercostal space","Ventral median sternotomy"],"correct":3,"why":"Chylothorax that fails medical management is treated surgically by thoracic duct ligation. The Surgical Approaches to the Thorax lateral thoracotomy table places the thoracic duct at the 8th interspace on both the left and the right, and the median sternotomy slide lists the thoracic duct among structures for which sternotomy is not ideal.","wrong":{"0":"The 4th space is used for the PDA, pulmonic stenosis, and heart base structures, not the thoracic duct.","1":"The 5th space is used for cranial lung lobectomy.","2":"The left 9th space is used for the caudal esophagus.","4":"Median sternotomy gives wide bilateral access, but the slides say it is not ideal for the thoracic duct or dorsal mediastinum."},"lec":"W10: Surgical Approaches to the Thorax","weeks":[10],"mods":[3],"disc":"Surgery","species":"Dog","type":"Next step"},{"stem":"A 4-year-old Thoroughbred filly has arthroscopic removal of a chip fragment from the carpus. Preparation, draping, and the procedure follow strict aseptic technique with no break in sterility. The trainer asks for a 7-day course of a broad-spectrum antibiotic after surgery \"just in case.\" Which antimicrobial plan best follows the stewardship guidance?","options":["No antimicrobials at any point","7-day broad-spectrum course","Antibiotics until suture removal","5-day narrow-spectrum course","Stop prophylaxis within 24 h"],"correct":4,"why":"This is a clean procedure, but the Week 2 asepsis slides list orthopedic procedures among the indications for prophylaxis under strict guidelines, with the 24-hour rule to discontinue. Postoperative courses of 5-10 days and 'just in case' antibiotics are listed as misuse, and antibiotics do not replace aseptic technique.","wrong":{"0":"Clean surgeries do not need postoperative antibiotics, but orthopedic procedures are a listed exception for prophylaxis.","1":"'Just in case' broad-spectrum courses are listed as misuse.","2":"A course lasting until suture removal is a prolonged postoperative course, which the slides call misuse.","3":"Choosing narrow spectrum is good practice, but 5-10 day postoperative courses are still listed as misuse."},"lec":"W2: Surgical Asepsis and Sterility","weeks":[2],"mods":[1],"disc":"Surgery","species":"Horse","type":"Management"},{"stem":"A 2-year-old spayed female Doberman pinscher bled excessively from her incision after spay as a puppy and is now scheduled for elective stifle surgery in 4 weeks. Platelet count is 260,000/µL (reference 200,000-450,000), PT and aPTT are within reference intervals, buccal mucosal bleeding time is prolonged, and quantification shows a low concentration of structurally normal von Willebrand factor. The surgeon wants a transfusion plan ready. Which transfusion approach is listed for her disease?","options":["Planned autologous donation","Intraoperative blood salvage","Platelet concentrate","DEA 1.1-negative pRBC","Xenotransfusion"],"correct":0,"why":"A normal platelet count and coagulation times with a prolonged BMBT indicate a primary hemostatic defect, and a low concentration of normal vWF in a Doberman is type 1 von Willebrand disease (Week 9 Coagulation Disorders). The Week 4 Transfusion Medicine slides list planned autologous transfusion, donated a few weeks before a known procedure, specifically for type 1 vWD.","wrong":{"1":"Emergency autotransfusion of salvaged blood is for unplanned intraoperative hemorrhage, not a procedure planned 4 weeks ahead.","2":"Platelet products are for thrombocytopenia such as IMTP, and her platelet count is normal.","3":"pRBCs restore oxygen-carrying capacity but supply no vWF, and she is not anemic.","4":"Xenotransfusion is an emergency option for cats receiving dog blood, not a plan for a dog."},"lec":"Integration: W4 + W9","weeks":[4,9],"mods":[2,3],"disc":"Clinical pathology","species":"Dog","type":"Management"},{"stem":"A 7-year-old neutered male domestic shorthair cat with a nasal bridge swelling and stertor was diagnosed with nasal cryptococcosis by cytology and a serum cryptococcal antigen titer of 1:2048. After 2 months of fluconazole the titer is 1:128, and this week the swelling and stertor have fully resolved. He has no CNS or ocular signs. How long should fluconazole continue?","options":["4-6 months beyond clinical cure","3-6 months, until signs resolve","4-6 months, to resolution","2 months past resolution","Lifelong maintenance azole"],"correct":3,"why":"A 16-fold fall over 2 months matches the expected 2-4 fold antigen decrease per month, so the cat is responding. For cryptococcosis the slides advise treating for 2 months past resolution of clinical signs, with monthly rechecks and serum antigen monitoring.","wrong":{"0":"4-6 months beyond clinical cure is the coccidioidomycosis recommendation, where relapse is common.","1":"At least 3-6 months, until no clinical signs, is the blastomycosis itraconazole guideline.","2":"4-6 months to resolution of clinical signs is the histoplasmosis itraconazole course.","4":"The slides give cryptococcosis a defined end point, 2 months past resolution, rather than lifelong therapy."},"lec":"W6: Systemic Fungal Infections","weeks":[6],"mods":[2],"disc":"Infectious disease","species":"Cat","type":"Management"},{"stem":"A beef herd was moved onto a turnip and kale field 3 weeks ago. Several cows are now weak and tachycardic, with pale, slightly icteric mucous membranes. One cow's PCV is 13% (reference 24-46%) with a regenerative response, and her blood smear shows many Heinz bodies. There is no external or body cavity bleeding. Which immediate management step is most important?","options":["Methylene blue 1-2% IV","Feed withdrawal","Ascorbic acid 30 mg/kg IV","Vitamin K1 1-5 mg/kg SC","Thiamine 5 mg/kg IM"],"correct":1,"why":"With no bleeding and a regenerative anemia, Week 4 Approach to Anemia places this in increased destruction, where oxidative toxins are identified by history, and Heinz bodies confirm oxidative injury. Week 12 Toxins describes Brassica anemia after 2-3 weeks of eating turnip tops or kale, treated by immediate withdrawal of the feed, with activated charcoal, laxatives, and supportive care.","wrong":{"0":"Methylene blue treats nitrate-induced methemoglobinemia from forages such as sorghum, which strikes within hours of eating, not after 3 weeks.","2":"Ascorbic acid is listed for methemoglobinemia in red maple toxicity, mainly in horses.","3":"Vitamin K1 treats sweet clover (dicoumarol) poisoning, a bleeding disorder rather than Heinz body hemolysis.","4":"Thiamine is for bracken fern thiaminase effects, and bracken causes marrow suppression, not regenerative Heinz body anemia."},"lec":"Integration: W4 + W12","weeks":[4,12],"mods":[2,4],"disc":"Clinical pathology","species":"Cattle","type":"Management"},{"stem":"A 7-year-old male Great Dane (62 kg) with dilated cardiomyopathy and a thin-walled, poorly contracting left ventricle on echocardiography needs general anesthesia to repair an infected wound that cannot wait. He is induced with fentanyl and a benzodiazepine and maintained on low-dose isoflurane with a fentanyl CRI, and a dobutamine CRI is running. Twenty minutes later his EtCO2 is 62 mmHg (RI 35-45) and IPPV is started. Which peak inspiratory pressure best protects his cardiac output?","options":["10-15 cmH2O","7-8 cmH2O","Under 20 cmH2O","2-4 cmH2O","10-12 cmH2O"],"correct":1,"why":"A thin, dilated, weak ventricle with poor systolic function is DCM, and the Anesthesia in Cardiovascularly Compromised Patients slides set two goals: support systolic function with an inotrope and support cardiac output by preserving venous return, using IPPV with a minimal peak inspiratory pressure of 7-8 cmH2O. Positive pressure ventilation decreases venous return and preload (Week 1 Mechanical Ventilation), so the lowest effective pressure is chosen.","wrong":{"0":"10-15 cmH2O is the routine Week 1 closed-chest setting for small animals, but the DCM slide lowers peak pressure to 7-8 cmH2O to preserve venous return.","2":"Under 20 cmH2O is the Week 1 closed-chest guide for large animals, not a dog with a failing ventricle.","3":"2-4 cmH2O is a PEEP value from Week 1, not a peak inspiratory pressure.","4":"10-12 cmH2O is the Week 1 limit for manual breaths, which is still above the DCM recommendation."},"lec":"W11: Cardiovascular Anesthesia","weeks":[11],"mods":[3],"disc":"Anesthesia","species":"Dog","type":"Management"},{"stem":"An 11-year-old spayed female Miniature Poodle weighing 6 kg has stage B2 myxomatous mitral valve disease, with a grade III/VI left apical holosystolic murmur and an LA:Ao of 1.7. She received her pimobendan this morning. She is premedicated with methadone and midazolam, induced with propofol, and maintained on isoflurane for dental extractions. Twenty minutes in, MAP is 54 mmHg and HR is 58 beats/min in sinus rhythm. Temperature is 37.6°C, ETCO2 is 40 mmHg, and the vaporizer has already been turned down. Which drug is most appropriate next?","options":["Glycopyrrolate","Crystalloid bolus","Phenylephrine","Esmolol","Lidocaine"],"correct":0,"why":"The Week 1 hypotension approach is to reduce depth, give fluids if the patient is hypovolemic, give an anticholinergic if it is bradycardic, and only then use vasopressors; 58 beats/min is below the anesthetized small-dog range of 80-120. For mitral valve disease the Week 11 cardiovascular anesthesia slides stress avoiding bradycardia, which lengthens the time for regurgitation, and keeping glycopyrrolate or atropine available. They also note that fluids for hypotension are often contraindicated in cardiac patients.","wrong":{"1":"A bolus is step 2 of the Week 1 approach, but Week 11 warns that fluids are often contraindicated in cardiac patients and keeps IV fluids conservative to avoid pulmonary edema.","2":"Vasopressors come last in the Week 1 approach, and Week 11's mitral goal is to reduce afterload, not raise it.","3":"Esmolol is a beta-blocker listed for tachycardia, and it would slow this heart further.","4":"Week 11 uses lidocaine for VPCs or VT that affect blood pressure, and this dog is in sinus rhythm."},"lec":"Integration: W1 + W11","weeks":[1,11],"mods":[1,3],"disc":"Anesthesia","species":"Dog","type":"Next step"},{"stem":"An 11-year-old Warmblood mare has had a malodorous, purulent discharge from the left nostril for 2 months, with mild swelling and dull percussion over the left rostral maxillary area. Endoscopy shows pus at the left sinus drainage angle. CT shows fluid in the left rostral maxillary and ventral conchal sinuses and a periapical lesion at the root of the upper left 09 tooth. Which treatment addresses the cause?","options":["Extract the infected tooth","Antimicrobials alone","Topical enilconazole","10% formalin injections","Trephination and lavage only"],"correct":0,"why":"The Surgery of the Equine Airway slides state that 60% of sinusitis is secondary and that dental disease is its most common cause, with the upper 09s (and caudal 08s) draining into the rostral maxillary and ventral conchal sinuses. Treatment of dental sinusitis is to remove the infected tooth and then manage the sinusitis with flushing.","wrong":{"1":"Antimicrobials are used for primary sinusitis and tried only once, and they do not remove an infected tooth root.","2":"Enilconazole is the topical treatment for fungal rhinitis plaques, which are not described here.","3":"Formalin injections treat progressive ethmoid hematoma, not dental sinusitis.","4":"Flushing manages the sinusitis, but without removing the infected tooth the cause remains."},"lec":"W10: Equine Airway Surgery 1","weeks":[10],"mods":[3],"disc":"Surgery","species":"Horse","type":"Management"},{"stem":"A 3-year-old intact male outdoor domestic shorthair cat has 4 days of lethargy, anorexia, and labored breathing. Rectal temperature is 40.2°C (38.1-39.2°C), and there are two healing puncture wounds over the right lateral thorax. Thoracic radiographs show fluid opacity with scalloped, retracted lung borders confined to the right hemithorax. Views repeated in a different recumbency show the fluid in the same position, not moving with gravity. Which diagnosis is most likely?","options":["Hydrothorax","Chylothorax","Pyothorax","Hemothorax","Pneumothorax"],"correct":2,"why":"Fluid that is loculated and does not move with gravity is encapsulated, which the Week 3 thoracic radiograph slides attribute to pyothorax and chronic pleuritis. The slides list systemic infection, penetrating wounds, and foreign bodies as causes of pyothorax and note that it often involves one hemithorax in cats, matching the fever, the thoracic puncture wounds, and the right-sided fluid.","wrong":{"0":"Hydrothorax from heart failure or hypoproteinemia is free fluid that moves with gravity, and it does not explain the fever.","1":"Chylothorax is often idiopathic or follows thoracic duct disruption, and the slides do not link it to encapsulated fluid.","3":"Hemothorax follows trauma, coagulopathy, or neoplasia, but encapsulated fluid with fever points to pyothorax.","4":"Pneumothorax is gas, which elevates the heart and removes peripheral lung markings rather than adding fluid opacity."},"lec":"W3: Thoracic Radiographs","weeks":[3],"mods":[1],"disc":"Imaging","species":"Cat","type":"Diagnosis"},{"stem":"A 9-month-old female dog was adopted from a shelter on a tropical island where heartworm is endemic and flown to Canada 3 weeks ago. She never received heartworm preventive and is clinically normal. Today her heartworm antigen test and modified Knott's test are both negative, and a monthly macrocyclic lactone is started. What heartworm testing plan is most appropriate?","options":["No further testing needed","Antibody test for exposure now","Antigen retest in 6 months","Melarsomine series now","Test only in mosquito season"],"correct":2,"why":"The Week 4 Introduction to Vector-Borne Diseases slides state that in endemic areas and the tropics heartworm transmission is year-round, so she may have been infected in the months before she left. The Week 9 Vascular Parasitic Diseases slides state that the antigen test detects adult female worms and turns positive as early as 6 months post-infection, with a prepatent period of about 6-7 months, so negative tests now cannot exclude a recent infection and she should be retested in about 6 months.","wrong":{"0":"Negative results are reassuring, but antigen and microfilariae are not detectable until months after infection.","1":"The Week 9 slides list the antibody test as not used in dogs and useful in cats, where it shows exposure.","3":"Melarsomine is the adulticide for confirmed infections, and she has no diagnosis.","4":"Seasonal transmission applies to temperate regions, but her exposure happened in the tropics where transmission is year-round."},"lec":"Integration: W9 + W4","weeks":[9,4],"mods":[3,2],"disc":"Infectious disease","species":"Dog","type":"Next step"},{"stem":"A 9-year-old spayed female domestic shorthair cat has persistent, unexplained thrombocytosis on three CBCs over 2 months: platelets 1,900,000/µL (reference 300,000-800,000) with mature-appearing platelets, no blasts in the blood, and normal WBC and hematocrit. There is no evidence of infection or inflammation. A bone marrow aspirate shows increased, well-differentiated megakaryocytes with orderly maturation, and blasts make up 2% of marrow cells. How is this disorder best classified?","options":["Acute MPD","Chronic LPD","Acute LPD","Reactive hyperplasia","Chronic MPD"],"correct":4,"why":"The Week 7 bone marrow slides place megakaryocytic leukemia under myeloproliferative disease (MPD), with lymphocytes and plasma cells under lymphoproliferative disease (LPD). Chronic leukemias are well differentiated and include thrombocythemia, while acute leukemias are blasts, with more than 20% marrow blasts suggesting acute leukemia (normal is under 5%). Persistent, unexplained thrombocytosis with mature megakaryocytes and 2% blasts is therefore a chronic MPD.","wrong":{"0":"Acute leukemias are made of blasts, and marrow blasts here are 2%, well under the 20% that suggests acute leukemia.","1":"Chronic LPD is chronic lymphocytic leukemia, and this proliferation is megakaryocytic, not lymphoid.","2":"Acute LPD would show lymphoid blasts, and this marrow shows mature megakaryocytes.","3":"Megakaryocytic hyperplasia occurs with infection or inflammation, and this cytosis is persistent and unexplained with neither present."},"lec":"W7: Bone Marrow and Leukemia","weeks":[7],"mods":[2],"disc":"Clinical pathology","species":"Cat","type":"Interpretation"},{"stem":"A farrow-to-finish pig farm vaccinates all breeding stock and growers against erysipelas. Several 5-month-old finishing pigs are now lame with swollen hocks and carpi, and none have skin plaques. A herd ELISA on 20 finishers shows 85% seropositive. The producer asks how to confirm whether Erysipelothrix rhusiopathiae is causing the lameness. Which sample is best?","options":["Repeat herd ELISA","Paired serum ELISA","Fecal culture","Synovial fluid PCR","Skin scraping cytology"],"correct":3,"why":"Lameness with swollen joints fits the chronic polyarthritis form of erysipelas. The slides state ELISA monitors herd exposure and vaccination success but cannot differentiate vaccine from infection antibodies, so in this vaccinated herd serology cannot confirm disease; culture and PCR of blood, tissues, or synovial fluid identify the organism.","wrong":{"0":"Repeating the herd ELISA has the same problem, because vaccine and infection antibodies look alike.","1":"Paired titers still measure antibody that vaccination also produces, so they cannot attribute the result to infection.","2":"Healthy pigs carry the organism in lymphoid tissue and shed it intermittently, so a fecal isolate would not prove it caused the arthritis.","4":"No skin lesions are present, and the slides list culture and PCR, not scrapings, for diagnosis."},"lec":"W5: Bacterial Diseases in Livestock","weeks":[5],"mods":[2],"disc":"Infectious disease","species":"Pig","type":"Next step"},{"stem":"A 10-year-old neutered male Boxer has received chlorambucil and high-dose prednisone for 4 months for an immune-mediated disease. Over 3 weeks he has developed very thick crusts on the pinnal margins, elbows, hocks, and trunk. The owner rates his itch at 2/10. Broad superficial scrapings that include crust show numerous Sarcoptes mites, eggs, and scybala on every slide, and impression cytology shows no acantholytic keratinocytes. Which diagnosis best fits?","options":["Norwegian scabies","Classic sarcoptic mange","Generalized demodicosis","Pemphigus foliaceus","Cheyletiellosis"],"correct":0,"why":"Norwegian scabies is a severe Sarcoptes infestation in a severely immunocompromised host, so the mites grow unchecked and the dog develops very thick crusting that is not pruritic (W12 Pruritic Diseases Part I). Long-term immunosuppressive drugs, minimal itch, and mites found easily on every scraping fit this form.","wrong":{"1":"Classic sarcoptic mange is typically intensely pruritic (9-10/10), and mites are found on only 25-50% of scrapings, unlike this dog.","2":"Generalized demodicosis can follow immunosuppressive therapy, but these scrapings show Sarcoptes mites, eggs, and scybala rather than Demodex.","3":"Pemphigus foliaceus causes crusting with mild pruritus, but it requires acantholytic keratinocytes, which are absent, and it does not explain the mites.","4":"Cheyletiellosis causes heavy scale on the dorsal and lateral trunk with large surface mites (walking dandruff), not burrowing Sarcoptes with scybala."},"lec":"W12: Pruritic Diseases Part I","weeks":[12],"mods":[4],"disc":"Dermatology","species":"Dog","type":"Diagnosis"},{"stem":"A 6-year-old pet pygmy goat wether had a cystotomy at another practice 10 months ago. He now has stranguria, and a second cystotomy retrieves a calculus that formed around a strand of old suture. The previous record describes the bladder closure material as a natural, braided fiber with high tissue reactivity and strong initial tensile strength that is absorbed slowly, over about 2 years. Which suture material was most likely used?","options":["Silk","Polyester","Chromic catgut","Polyglactin 910","Nylon"],"correct":0,"why":"Silk is the only natural, braided material on the Week 2 suture slides that is absorbed slowly over about 2 years with high tissue reactivity. The slides warn that silk is contraindicated in hollow organs and is a potential nidus for calculus formation in the bladder, which explains this complication.","wrong":{"1":"Polyester is braided and nonabsorbable, but it is synthetic with low tissue reactivity and remains a permanent foreign body.","2":"Chromic catgut is natural but twisted rather than braided, and it is an absorbable gut suture removed by enzymatic digestion far sooner than 2 years.","3":"Polyglactin 910 is braided but synthetic and is fully absorbed in 56-70 days.","4":"Nylon is synthetic with very low tissue reactivity and minimal absorption."},"lec":"W2: Suture Materials and Needles","weeks":[2],"mods":[1],"disc":"Surgery","species":"Small ruminant","type":"Interpretation"},{"stem":"A 7-year-old spayed female Labrador retriever weighing 30 kg has been under isoflurane for 4 hours for a TPLO and is mechanically ventilated at 10 breaths/min with a tidal volume of 350 mL. The capnograph reads an ETCO2 of 56 mmHg. An arterial blood gas drawn at the same moment shows pH 7.38 (7.35-7.45), PaCO2 41 mmHg (35-45 mmHg), and PaO2 410 mmHg on 100% oxygen. Which factor best explains the difference between the two CO2 values?","options":["Rapid shallow breathing","Increased alveolar dead space","Water in the sample line","Slow deep breaths","Hypoventilation"],"correct":2,"why":"In healthy anesthetized dogs ETCO2 is usually 5-10 mmHg lower than PaCO2 (Week 1 monitoring), so an ETCO2 well above a normal PaCO2 points to a measurement problem rather than a change in the patient. The capnography slide lists moisture in the sample line or probe as the cause of ETCO2 reading higher than PaCO2. The normal PaCO2 also rules out hypoventilation, which the slides define by PaCO2 above 45 mmHg.","wrong":{"0":"Rapid shallow breaths remove the alveolar plateau and make ETCO2 read lower than PaCO2, and this ventilator delivers 10 breaths/min at about 12 mL/kg.","1":"Increased dead space makes ETCO2 lower than PaCO2, the opposite of this reading.","3":"Slow deep breaths give a full alveolar plateau so ETCO2 approximates PaCO2; they do not push it 15 mmHg above.","4":"Hypoventilation would raise the arterial PaCO2 above 45 mmHg as well, and the arterial value is normal."},"lec":"W1: Anesthesia Monitoring","weeks":[1],"mods":[1],"disc":"Anesthesia","species":"Dog","type":"Interpretation"},{"stem":"A 15-year-old spayed female domestic shorthair cat is suddenly blind. Both pupils are dilated with poor PLRs, and fundic exam shows bilateral bullous retinal detachments with subretinal fluid and retinal hemorrhages. Systolic pressure by Doppler is 240, 235, and 245 mmHg in a quiet room. Creatinine is 3.2 mg/dL (RI 0.8-2.4), the platelet count is normal, and PT and aPTT are normal. What mechanism best explains the retinal lesions?","options":["Immune-mediated microangiopathy","Increased hydrostatic pressure","Vasculitis from infection","Hyperviscosity syndrome","Thrombocytopenic hemorrhage"],"correct":1,"why":"The Week 9 Systemic and Pulmonary Hypertension slides list CKD as a cause of systemic hypertension, which Doppler measures as systolic pressure, and repeated calm readings this high confirm it. The Week 15 Ocular Manifestations of Systemic Disease slides describe hypertensive retinopathy (hemorrhages, edema, and detachments with subretinal effusion) as caused by an increase in intravascular hydrostatic pressure, very common in older cats and usually secondary to renal disease.","wrong":{"0":"Immune-mediated microangiopathy is listed under diabetes on the Week 15 slides, and this cat has hypertension from CKD with no sign of diabetes.","2":"Rickettsial agents such as Ehrlichia incite a retinal vasculitis, but nothing here suggests infection, and the blood pressure explains the findings.","3":"Hyperviscosity is a vasculopathy that causes ocular hemorrhage, but it does not explain severe hypertension with renal azotemia.","4":"Thrombocytopenia causes retinal bleeding, but her platelet count and clotting times are normal."},"lec":"Integration: W9 + W15","weeks":[9,15],"mods":[3,4],"disc":"Ophthalmology","species":"Cat","type":"Mechanism"},{"stem":"A 9-year-old neutered male domestic shorthair cat weighing 5 kg arrests during anesthesia for dental extractions. Chest compressions and ventilation at 10 breaths/min with 100% oxygen are started. The ECG shows ventricular fibrillation, which persists after a shock at 2 J/kg and a second at 4 J/kg. Low-dose epinephrine has been given. Venous pH is 7.18 (reference 7.35-7.45), and electrolytes, including calcium and potassium, are within reference intervals. Which drug should be added for this rhythm?","options":["Lidocaine","Sodium bicarbonate","Calcium gluconate","Atropine","Amiodarone"],"correct":4,"why":"Ventricular fibrillation is a shockable rhythm, and persistence after more than two shocks makes it refractory. For refractory shockable rhythms the Week 1 CPR slides add an antiarrhythmic and list amiodarone 5 mg/kg for cats, with lidocaine listed for dogs. Bicarbonate is reserved for pH below 7, and calcium gluconate for low calcium or hyperkalemia.","wrong":{"0":"Lidocaine is the antiarrhythmic the slides list for dogs, not cats.","1":"Sodium bicarbonate 1 mEq/kg is for prolonged CPR with pH below 7, and this cat's pH is 7.18.","2":"Calcium gluconate is for low calcium or hyperkalemia, and both are normal here.","3":"Atropine is vagolytic therapy given once, early; it does not treat refractory ventricular fibrillation."},"lec":"W1: Anesthetic Complications and CPR","weeks":[1],"mods":[1],"disc":"Anesthesia","species":"Cat","type":"Next step"},{"stem":"At routine slaughter, a 2-year-old steer has firm, caseous, partly mineralized granulomatous lesions in the mediastinal and bronchial lymph nodes. The lymph nodes are submitted to an approved laboratory. Histopathology shows granulomatous lymphadenitis with acid-fast bacilli, and PCR on the tissue detects Mycobacterium bovis genetic material. Which result is still needed to confirm bovine tuberculosis before the source herd is traced?","options":["Acid-fast histopathology","Mycobacterial culture","M. bovis PCR","Interferon gamma test","Gross lesion inspection"],"correct":1,"why":"Slaughter surveillance sends suspicious granulomatous lesions to an approved laboratory, where histopathology identifies the pathologic changes and acid-fast bacteria and PCR detects M. bovis genetic material. The Week 6 Public Health 3 slides name culture and isolation of the bacteria as the confirmation (gold standard), and a positive animal is then traced back to its source herd.","wrong":{"0":"Histopathology shows the granulomatous changes and acid-fast bacteria, but it is not the gold standard, and it has already been done.","2":"PCR detects M. bovis genetic material and supports the diagnosis, but the slides name culture as the confirmation.","3":"The bovine interferon gamma blood test is follow-up testing for live CFT responders, not confirmation of lesions found at slaughter.","4":"Gross lesions trigger the submission and make the animal a suspect, not a confirmed case."},"lec":"W6: Public Health 3: Bovine TB and Testing","weeks":[6],"mods":[2],"disc":"Public health and pharmacology","species":"Cattle","type":"Next step"},{"stem":"A 10-month-old intact female Staffordshire terrier has multifocal to patchy alopecia with erythema, comedones, and scale on the face, forelimbs, and trunk, and several lesions are larger than 2.5 cm. Deep skin scrapings from several sites show many live Demodex canis mites. Cytology of a few papules shows cocci with neutrophils. An oral isoxazoline is started, with topical chlorhexidine for the papules. Which additional recommendation is most appropriate?","options":["Search for underlying disease","Triple-combination parasiticide","Benign neglect instead","Stop at first negative scrape","Ovariohysterectomy"],"correct":4,"why":"Lesions over 2.5 cm in several body regions of a dog under 12-18 months old make this juvenile-onset generalized demodicosis, treated with an isoxazoline plus topical therapy for secondary infection (W12 Focal-to-Multifocal Alopecia). The generalized demodicosis treatment slide adds: if juvenile-onset, spay or neuter.","wrong":{"0":"Concurrent systemic illness and long-term immunomodulatory therapy are history points the slides check, but for juvenile-onset generalized disease the slide's added step is to spay or neuter.","1":"The slide warns not to use triple or quad combination products when an isoxazoline is used to treat mites.","2":"Benign neglect suits localized juvenile lesions (90% resolve), not generalized disease with lesions over 2.5 cm.","3":"The slides continue treatment for 1 month beyond two consecutive negative monthly scrapings, not until the first negative one."},"lec":"W12: Focal-to-Multifocal Alopecia","weeks":[12],"mods":[4],"disc":"Dermatology","species":"Dog","type":"Management"},{"stem":"A 2-year-old male neutered domestic shorthair cat was hit by a car 5 days ago. His pulmonary contusions have improved, and he is now stable for repair of a traumatic diaphragmatic hernia. At celiotomy, the liver and some small intestine have herniated through a radial tear in the muscular diaphragm. They are not adhered and are gently returned to the abdomen. Which step comes next?","options":["Suture from the ventral margin","Anchor sutures around ribs","Extend the incision cranially","Suture from the dorsal margin","Rapid full lung re-inflation"],"correct":3,"why":"The tear is radial, and the viscera have already been reduced without adhesions. The Thoracic Trauma surgical technique slides say to begin suturing a radial tear at its most dorsal margin and to anchor circumferential tears by suturing around the ribs. Lungs are inflated gradually because of the risk of re-expansion pulmonary edema, especially in cats.","wrong":{"0":"Starting ventrally reverses the slide's instruction to begin a radial tear at the most dorsal margin.","1":"Sutures around the ribs anchor a circumferential tear, and this tear is radial.","2":"The slides extend the incision cranially only when viscera are adhered in the thorax, and these were not.","4":"The slides call for gradual inflation because cats are prone to re-expansion pulmonary edema."},"lec":"W10: Thoracic Trauma","weeks":[10],"mods":[3],"disc":"Surgery","species":"Cat","type":"Next step"},{"stem":"Three of 40 housed 7-month-old beef calves became blind over 2 days. They walk into walls and have no menace response, but pupil size and PLRs are normal in both eyes. Corneas and anterior chambers are clear, and fundic exam is normal. The ration contains good-quality green forage, and the calves have no access to old paint, batteries, or machinery. Which diagnosis is most likely?","options":["Lead poisoning","Hypovitaminosis A","In utero BVDV infection","Polioencephalomalacia","Silage eye"],"correct":3,"why":"Blindness with normal PLRs points to a lesion behind the reflex arc, such as cortical disease (W14 eye exam rules of thumb), and the W15 large animal lesson lists cerebrocortical necrosis/polioencephalomalacia as a cause of cortical blindness in cattle. Normal pupils argue against lead (no menace with mydriasis), and a normal fundus argues against hypovitaminosis A, which causes optic nerve compression and atrophy with retinal degeneration.","wrong":{"0":"Lead poisoning causes loss of menace with mydriasis, and these pupils are normal.","1":"Hypovitaminosis A blinds through optic nerve compression, nerve atrophy, and retinal degeneration, and these fundi are normal.","2":"BVDV in utero causes congenital defects such as cataract, retinal atrophy, and microphthalmia present from birth.","4":"Silage eye from Listeria presents as uveitis, and these eyes are quiet."},"lec":"W15: Large Animal Eye Disease","weeks":[15],"mods":[4],"disc":"Ophthalmology","species":"Cattle","type":"Diagnosis"},{"stem":"A 9-year-old Arabian endurance gelding finished an 80-km ride in hot, humid weather after sweating heavily for hours. He is now dull with mild muscle tremors. An arterial sample from the transverse facial artery shows pH 7.53, PaCO2 49 mmHg, HCO3- 37 mmol/L, and PaO2 92 mmHg (arterial reference values: pH 7.35-7.45, PaCO2 35-45 mmHg, HCO3- 21-27 mmol/L, PaO2 85-100 mmHg). Which mechanism best explains this blood gas?","options":["Lactic acid gain","Hypoventilation","Massive sweat loss","Hyperventilation","Diarrheal bicarbonate loss"],"correct":2,"why":"A high pH with a high bicarbonate is a primary metabolic alkalosis, and the raised PaCO2 is the expected compensation because both values move in the same direction. The Acid-Base slides list causes of metabolic alkalosis as loss of chloride in excess of ECF, high GI obstruction, diuretics, and, in horses, massive sweat loss, which fits this endurance horse.","wrong":{"0":"Lactate accumulates with hard exercise, but gain of acid causes metabolic acidosis, and this horse is alkalemic.","1":"The PaCO2 is high, but primary hypoventilation causes acidemia, while here the pH is high and the CO2 is compensatory.","3":"Hyperventilation causes respiratory alkalosis with a low PaCO2, and his PaCO2 is high.","4":"Loss of base through diarrhea causes a normal anion gap metabolic acidosis, the opposite of this result."},"lec":"W11: Acid-Base and A-a Gradient","weeks":[11],"mods":[3],"disc":"Clinical pathology","species":"Horse","type":"Mechanism"},{"stem":"A 10-year-old spayed female Shih Tzu had acute primary angle-closure glaucoma in the left eye 5 months ago. That eye now has no menace response or dazzle reflex, buphthalmia, and optic disc cupping, and IOP is 44 mmHg (RI 15-25) despite a topical CAI and beta-blocker. The right eye is normal on a prophylactic beta-blocker. She no longer squints or rubs the left eye, but she sleeps most of the day, rarely greets the family, and has stopped playing. The owner believes she has adapted and asks to keep using the drops. Which response is most appropriate?","options":["Continue drops; she has adapted","Salvage procedure for comfort","Add an oral opioid","Gonioshunt to restore vision","Add topical pilocarpine"],"correct":1,"why":"No menace or dazzle, buphthalmia, and disc cupping mean the eye has permanently lost vision, so the W15 Glaucoma slides say the goal of therapy changes to comfort, with enucleation, pharmacologic ablation, or evisceration as salvage options. The quality-of-life slides warn that adaptation does not mean the pain goes away: signs become chronic, such as lethargy, long periods of sleep, and fewer interactions, and pain relief requires normalizing IOP, which the drops have not done.","wrong":{"0":"The owner reads the lack of squinting as adaptation, but the slides state adaptation does not mean the pain goes away, and her lethargy and sleep are chronic pain signs.","2":"The slides state opioids may modestly blunt discomfort or sedate but do not relieve pressure pain.","3":"Gonioshunts are IOP-lowering surgery, but this eye has already lost vision, so the goal becomes comfort through a salvage procedure.","4":"The slides state parasympathomimetics are not for first-line use and do not work well in dogs and cats."},"lec":"W15: Glaucoma","weeks":[15],"mods":[4],"disc":"Ophthalmology","species":"Dog","type":"Management"},{"stem":"A 4-year-old intact male coonhound in eastern Texas hunts rabbits and has had waxing and waning fever, weight loss, muscle atrophy, and a stiff gait for 2 months. Radiographs show extensive periosteal bone proliferation along the long bones, and a skeletal muscle biopsy confirms Hepatozoon americanum. He improves after 2 weeks of trimethoprim-sulfadiazine, clindamycin, and pyrimethamine. Which long-term plan does the lecture recommend next?","options":["Decoquinate for 2 years","Toltrazuril with doxycycline","Imidocarb dipropionate","Doxycycline for 28 days","Atovaquone with azithromycin"],"correct":0,"why":"Periosteal proliferation with confirmed H. americanum (acquired by ingesting Gulf Coast ticks or parasitized prey in the Southeast USA) is American canine hepatozoonosis, which is manageable but not cured. After initial triple therapy, the slides list decoquinate 10-20 mg/kg PO q12h mixed with food for 2 years, often lifelong, because relapses are common.","wrong":{"1":"Toltrazuril and doxycycline are listed for Hepatozoon canis, the Old World disease from the brown dog tick.","2":"Imidocarb is listed for H. canis and Babesia canis, not for long-term control of H. americanum.","3":"Doxycycline for 28 days is the E. canis regimen, and Hepatozoon is a protozoan managed with a coccidiostat.","4":"Atovaquone with azithromycin treats B. gibsoni and Cytauxzoon, not hepatozoonosis."},"lec":"W4: Vector-Borne Diseases in Small Animals","weeks":[4],"mods":[2],"disc":"Infectious disease","species":"Dog","type":"Management"},{"stem":"An 11-year-old neutered male West Highland white terrier has severe crusting, fissuring, and ulceration of all footpads, so walking is painful, plus crusts around the eyes and mouth. He has received phenobarbital for 4 years. CBC: normocytic, normochromic, nonregenerative anemia. Chemistry: ALP 1,240 U/L (RI 20-150), AST 98 U/L (RI 10-50), glucose 265 mg/dL (RI 70-140), albumin 2.0 g/dL (RI 2.5-4.0). Abdominal ultrasound shows a honeycomb liver, and plasma amino acids are low. Which prognosis is most appropriate to discuss?","options":["6-12 months with lomustine","Good with zinc supplements","About 50% complete remission","Usually under 6 months","Curable with wide excision"],"correct":3,"why":"An older male small-breed dog on phenobarbital with severe footpad fissuring, hyperglycemia, raised liver enzymes, a honeycomb liver, and hypoaminoacidemia has superficial necrolytic dermatitis (hepatocutaneous syndrome). The W12 erosive dermatoses lecture calls SND a marker of serious internal disease with a poor prognosis, typically under 6 months of survival (one study reported 12 months or more with IV amino acid infusions and a high-protein diet).","wrong":{"0":"Survival of 6-12 months with lomustine is the figure for epitheliotropic T-cell lymphoma.","1":"A good prognosis with zinc applies to zinc-responsive dermatosis of young Nordic breeds, which is not linked to liver disease.","2":"About 50% complete remission is the canine pemphigus foliaceus figure, and PF requires acantholytic keratinocytes.","4":"A good prognosis with surgery applies to early squamous cell carcinoma, not to a metabolic disease."},"lec":"W12: Erosive and Crusting Dermatoses","weeks":[12],"mods":[4],"disc":"Dermatology","species":"Dog","type":"Interpretation"},{"stem":"A 9-year-old Thoroughbred gelding has a fresh laceration through the medial part of the upper eyelid that will be sutured standing. He is sedated, and an auriculopalpebral block has stopped him squeezing the lids, but he still flinches when the wound edges are touched with forceps. Which additional block best provides analgesia for the repair?","options":["Second auriculopalpebral block","Topical proparacaine drops","Supraorbital nerve block","Infraorbital nerve block","Mandibular nerve block"],"correct":2,"why":"The auriculopalpebral block is a motor block of the facial nerve (CN VII) that gives akinesia, so the lid stops moving but keeps its sensation (W14 eye exam lesson). The supraorbital (frontal) block is a sensory block of CN V that covers the medial two-thirds of the upper lid, where this laceration is.","wrong":{"0":"Repeating a motor block deepens akinesia but adds no sensory analgesia.","1":"Topical anesthetic is used on the slides for corneal sampling and applanation tonometry, not as the block for a lid laceration repair.","3":"The infraorbital block desensitizes the ipsilateral lip, nostril, and face (Week 2 equine anesthesia), not the upper eyelid.","4":"The mandibular block desensitizes the mandible and its teeth (Week 2 equine anesthesia)."},"lec":"W14: Eye Exam and Ocular Pharmacology","weeks":[14],"mods":[4],"disc":"Anesthesia","species":"Horse","type":"Next step"},{"stem":"A 3-month-old female alpaca cria grows slowly and tires when the herd runs. She has a holosystolic plateau murmur loudest on the right chest wall and a softer systolic murmur at the left heart base. Mucous membranes are pink, PCV is 32% (RI 25-45%), pulses are normal (not bounding), and there is no jugular distension, ascites, or split second heart sound. Which congenital defect is most likely?","options":["Patent ductus arteriosus","Tetralogy of Fallot","Ventricular septal defect","Atrial septal defect","Tricuspid dysplasia (Ebstein-like)"],"correct":2,"why":"The Congenital Cardiac Conditions slides list ruminants, horses, and alpacas for VSD and describe a holosystolic murmur heard best on the right. A VSD can also create a functional pulmonic stenosis, which explains the softer left basilar murmur. Mild signs fit the slide note that clinical signs range from none to exercise intolerance depending on defect size.","wrong":{"0":"PDA occurs in any species, but it causes a continuous left basilar murmur with bounding pulses, and this cria's pulses are normal.","1":"Tetralogy includes a VSD, but the slides describe cyanosis-driven polycythemia and exertional weakness, and this cria is pink with a normal PCV.","3":"ASD is listed for ruminants and pigs, but its clue is a split second heart sound, which is absent here.","4":"Tricuspid dysplasia produces right heart enlargement and right-sided CHF, and this cria has no jugular distension or ascites."},"lec":"W8: Congenital Cardiac Disease","weeks":[8],"mods":[3],"disc":"Cardiorespiratory","species":"Camelid","type":"Diagnosis"},{"stem":"A 20-kg, 5-year-old neutered male Border collie is anesthetized with isoflurane for a 3-hour abdominal procedure. The endotracheal tube was premeasured to the thoracic inlet, and both sides of the chest rise symmetrically. The volume-controlled ventilator is set at a tidal volume of 500 mL, respiratory rate 10 breaths/min, I:E ratio 1:2, PEEP 3 cmH2O, and the peak inspiratory pressure reads 15 cmH2O. ETCO2 is 32 mmHg. Which ventilator-related lung injury do these settings most risk?","options":["Barotrauma","Atelectrauma","Biotrauma","Volutrauma","Endobronchial intubation"],"correct":3,"why":"Volutrauma is lung injury from excessive stretch caused by high tidal volumes (Week 1 mechanical ventilation). This dog receives 500 mL, or 25 mL/kg, well above the small-animal guide of 10-15 mL/kg, while PIP, PEEP, rate, and I:E ratio are within the listed small-animal settings. Barotrauma is the pressure-related form.","wrong":{"0":"Both cause overdistension, but barotrauma is pressure-related and the PIP of 15 cmH2O is within the closed-chest range of 10-15 cmH2O.","1":"Atelectrauma comes from cyclic opening and closing of collapsed alveoli, which the PEEP of 3 cmH2O helps prevent.","2":"Biotrauma is the downstream cytokine response, not the mechanical injury these settings create.","4":"A tube that is too long causes endobronchial intubation, but this tube was premeasured and both sides of the chest rise."},"lec":"W1: Mechanical Ventilation","weeks":[1],"mods":[1],"disc":"Anesthesia","species":"Dog","type":"Mechanism"},{"stem":"A 7-year-old male Doberman Pinscher with dilated cardiomyopathy collapses at home. Heart rate is 180 bpm with frequent multiform VPCs, pulses are weak, mucous membranes are pale, the CRT is 3 seconds, systolic pressure is 78 mmHg, and crackles are heard. POCUS shows B-lines and left atrial enlargement. Lactate is 5.2 mmol/L (RI under 2.5). Oxygen and IV furosemide have been started. Which additional therapy best supports his perfusion?","options":["Dobutamine CRI","Isotonic crystalloid boluses","Norepinephrine CRI","IV pimobendan bolus","Synthetic colloid bolus"],"correct":3,"why":"Poor contractility with pulmonary edema and hypotension is cardiogenic shock with concurrent heart failure, so the Shock and Sepsis slides say fluid therapy is typically contraindicated and an inotrope is needed. The slides list dobutamine (adverse effects: tachyarrhythmias) and pimobendan, an inodilator given at 0.15 mg/kg IV that does not cause arrhythmias. With frequent multiform VPCs already present, pimobendan is the safer inotrope.","wrong":{"0":"Dobutamine is a listed inotrope for poor contractility, but the slides warn it causes tachyarrhythmias, which this dog already has.","1":"Fluids are the cornerstone of most shock, but the slides make cardiogenic shock with heart failure the exception.","2":"Norepinephrine is the first-line vasopressor for vasodilation in distributive shock, not for a weak, failing pump.","4":"Colloids expand volume, but the slides warn against them in patients prone to fluid overload, including those with cardiac disease."},"lec":"W9: Shock and Sepsis","weeks":[9],"mods":[3],"disc":"Cardiorespiratory","species":"Dog","type":"Management"},{"stem":"A US importer plans to bring a 5-year-old sport horse from a region of Africa where a Culicoides-borne disease causing high fever, supraorbital swelling, frothy nasal discharge, and up to 90% fatality in naive horses is reported. The receiving veterinarian is setting up isolation in an insect-proof facility. Based on the lecture, how long should the horse be isolated?","options":["21 days","7-14 days","3-5 days","16-42 days","40 days"],"correct":4,"why":"A Culicoides vector, supraorbital swelling, frothy discharge, and about 90% fatality in naive horses describe African horse sickness, an orbivirus. Incubation is usually 7-14 days but can reach 21 days, so the slides recommend isolating for 40 days for quarantine purposes.","wrong":{"0":"21 days is the longest reported incubation, and the slide's quarantine period extends beyond it to 40 days.","1":"7-14 days is the typical (cardiac form) incubation and would miss horses with longer incubations.","2":"3-5 days is the short incubation of the pulmonary form only.","3":"16-42 days is the EIA seroconversion window for Coggins testing, a different equine virus."},"lec":"W5: Equine Vector-Borne and Viral Diseases","weeks":[5],"mods":[2],"disc":"Infectious disease","species":"Horse","type":"Prevention"},{"stem":"A 10-year-old spayed female Dachshund has a grade IV/VI left apical holosystolic murmur and 2 days of tachypnea and cough. She has had no seizures, electrocution, near-drowning, or upper airway obstruction. Lateral thoracic radiographs show a straight caudodorsal cardiac margin forming a tent, elevation of the left caudal mainstem bronchus, pulmonary veins wider than their paired arteries, and a hazy interstitial to alveolar opacity in the caudodorsal lung fields. The VD view shows divergence of the caudal mainstem bronchi. Which interpretation best explains the lung opacity?","options":["Non-cardiogenic pulmonary edema","Cardiogenic pulmonary edema","Bacterial pneumonia","Pulmonary thromboembolism","Left bronchial compression"],"correct":1,"why":"The tent-shaped caudodorsal margin, elevated left mainstem bronchus, and 'cowboy legs' are signs of left atrial enlargement, and veins larger than arteries indicate volume overload with mitral insufficiency (Week 3 thoracic radiographs). The Week 8 congestive heart failure slides tie pulmonary edema to left-sided backward heart failure, and the Week 8 pulmonary pattern slide gives cardiogenic edema a variable distribution, so a caudodorsal location does not exclude it.","wrong":{"0":"Non-cardiogenic edema is typically caudodorsal, but it follows seizures, near-drowning, electrocution, or airway obstruction and does not explain left atrial and venous enlargement.","2":"Pneumonia gives a ventral alveolar distribution.","3":"Thromboembolic disease enlarges the pulmonary arteries, not the veins.","4":"An enlarged left atrium can compress the bronchus and cause cough, but compression does not create an interstitial to alveolar lung opacity."},"lec":"Integration: W3 + W8","weeks":[3,8],"mods":[1,3],"disc":"Imaging","species":"Dog","type":"Interpretation"},{"stem":"On a 900-head dairy heifer-raising operation, many 6- to 10-month-old heifers have sessile and pedunculated warts on the head, neck, and shoulders that have persisted for months, and new groups keep becoming affected. Biopsy confirms papillomas rather than SCC, and PCR identifies a bovine papillomavirus strain that is not in the commercial vaccine. Shared halters and ear taggers are already being disinfected. Which additional control measure is most appropriate?","options":["Commercial wart vaccine","Whitfield's ointment","Long-acting oxytetracycline","Surgical removal of all warts","Autogenous wart vaccine"],"correct":4,"why":"Juvenile cattle with head, neck, and shoulder warts have bovine papillomavirus infection, and the W14 farm animal dermatology lecture notes that control in naive animals is tough. When the commercial vaccine may not contain the farm's strain, autogenous vaccines made from tissue collected on the farm are the option, and they suit a large herd rather than a small one, alongside equipment hygiene.","wrong":{"0":"The slide's question for a commercial vaccine is whether the strain is represented, and here it is not.","1":"Whitfield's ointment is a keratolytic antifungal for ringworm.","2":"Long-acting oxytetracycline is an antibiotic option for Dermatophilus, and warts are viral.","3":"Irritating or removing warts is an individual option for lesions that mostly regress on their own; it does not control spread in a large herd."},"lec":"W14: Farm Animal Dermatology","weeks":[14],"mods":[4],"disc":"Infectious disease","species":"Cattle","type":"Prevention"},{"stem":"A 12-year-old neutered male domestic shorthair cat has a firm, well-circumscribed, alopecic dermal nodule on a digit. FNA cytology shows a uniform population of plasma cells. The owner says her dog had the same type of tumor removed and was cured, and she asks for the same plan. Which recommendation is most appropriate?","options":["Oncology referral","Excision alone, then recheck","Watchful waiting for regression","Vincristine chemotherapy","Imiquimod 5% cream"],"correct":0,"why":"In dogs, cutaneous plasmacytomas on the digits, ears, and mouth are benign, and complete excision gives an excellent prognosis. The W13 Nodular Diseases lecture notes that in cats, plasma cell tumors are typically extensions of disease in the bone marrow or visceral organs, so referral to an oncologist is recommended.","wrong":{"1":"Excision alone cures the canine plasmacytoma, but a feline plasma cell tumor usually reflects marrow or visceral disease.","2":"Watchful waiting suits histiocytomas in young dogs, which regress over 8-12 weeks.","3":"Vincristine is the treatment for transmissible venereal tumor.","4":"Imiquimod is used for viral papillomas and Bowen's disease, not plasma cell tumors."},"lec":"W13: Nodular Diseases","weeks":[13],"mods":[4],"disc":"Oncology","species":"Cat","type":"Next step"},{"stem":"A 2-year-old Vietnamese potbellied pig weighing 45 kg is scheduled for an elective gastrotomy to remove a toy seen on radiographs. She is bright, has not vomited, and is eating and drinking normally. The team is planning her preparation before IM premedication. Which fasting plan is most appropriate?","options":["Food withheld 2-4 hours","Food withheld 6-12 hours","No fasting","Food withheld 6-8 hours","Food and water withheld 24 hours"],"correct":1,"why":"Pigs have rapid gastric emptying, so 2-4 hours of fasting is usual before sedation, but the Week 2 pig slides extend this to 6-12 hours for stomach or small intestine surgery. Fasting matters because pig gastric content is highly acidic (pH 1.5-2.5) and aspiration causes direct lung tissue damage. Water stays freely available.","wrong":{"0":"2-4 hours is the routine pig fast, and it is too short before stomach surgery.","2":"Only pre-weaning piglets are not fasted, because of their hypoglycemia risk.","3":"6-8 hours is the fasting time most anesthetists recommend for horses.","4":"The slides advise free access to water and warn that prolonged fasting increases stress and discomfort."},"lec":"W2: Pig Anesthesia","weeks":[2],"mods":[1],"disc":"Anesthesia","species":"Pig","type":"Prevention"},{"stem":"A 9-year-old Warmblood mare in Connecticut, where Ixodes ticks are common, has 10 days of squinting and tearing in both eyes. Both eyes show miosis and aqueous flare, and intraocular pressure is low. She is also reluctant to lift her head above horizontal. A Lyme multiplex assay shows a high OspC antibody level. Trauma, corneal disease, and lens-induced causes are excluded, and the rest of the infectious workup is negative. Which antimicrobial is most appropriate?","options":["Enrofloxacin","Metronidazole","Ceftriaxone","No antimicrobials","Minocycline"],"correct":4,"why":"Miosis, aqueous flare, and low IOP are anterior uveitis signs, and Week 15 Uveitis lists Borrelia burgdorferi among the infectious causes in horses. Week 5 Vector-Borne Diseases in Horses describes Lyme uveitis as rapidly progressive and bilateral, recommends treating seropositive horses with compatible signs once other causes are excluded, and notes that a high OspC marks early infection that responds to antibiotics like doxycycline or minocycline; tetracyclines are on the recommended list.","wrong":{"0":"Enrofloxacin is on the Week 5 list of drugs not recommended for equine Lyme disease.","1":"Metronidazole is listed as not recommended for equine Lyme disease.","2":"Ceftriaxone is not recommended; the cephalosporin on the recommended list is ceftiofur.","3":"Withholding treatment is the Week 5 approach for healthy seropositive horses, but this mare has compatible signs with other causes excluded."},"lec":"Integration: W5 + W15","weeks":[5,15],"mods":[2,4],"disc":"Ophthalmology","species":"Horse","type":"Management"},{"ste
