m":"A 3-year-old neutered male Labrador retriever collapsed after a long run on a hot afternoon; his rectal temperature on arrival was 42.2°C (108°F). Six hours after cooling he has petechiae on the gums and ventral abdomen. CBC: platelets 32,000/µL (reference 200,000-450,000), PCV 46% (reference 35-55%), WBC within reference interval. He receives no medications, has no tick exposure, and a repeat clean venipuncture confirms the platelet count. Which category of thrombocytopenia best fits this dog?","options":["Increased destruction","Decreased production","Pseudothrombocytopenia","Consumption","Thrombopathy"],"correct":3,"why":"The slides list vasculitis from heat stroke (with SIRS, sepsis, and DIC) under consumption, where platelets are used up because they are somewhere doing their job. The acute onset after hyperthermia, with no drugs, ticks, or other cytopenias, points away from destruction and production causes, and the clean redraw shows the count is real.","wrong":{"0":"Increased destruction is a major category, but its listed triggers (Anaplasma, Rickettsia, Leishmania, immune-mediated disease, TMS) are absent here.","1":"Decreased production is the rare bone marrow category (infectious, immune-mediated, neoplasia, toxin, MDS), and none of these fits an acute event right after heat stroke.","2":"Platelet clumping is common, but the repeat clean stick confirmed the low count, and petechiae show a real deficit.","4":"A thrombopathy is a function defect that bleeds with a normal count, and this dog's count is clearly low."},"lec":"W4: Approach to Anemia and Thrombocytopenia","weeks":[4],"mods":[2],"disc":"Clinical pathology","species":"Dog","type":"Interpretation"},{"stem":"A 25-kg, 4-year-old male Labrador Retriever with a gastrointestinal foreign body has vomited for 3 days. On arrival he had a heart rate of 170 bpm, weak pulses, pale mucous membranes, a CRT of 2.5 seconds, and lactate of 4.8 mmol/L (RI under 2.5). After two 400-mL boluses of lactated Ringer's solution, his heart rate is 110 bpm, mucous membranes are pink, the CRT is 1.5 seconds, systolic pressure is 110 mmHg, lactate is 2.0 mmol/L, and urine output is 2 mL/kg/h. He now goes to surgery for an enterotomy under isoflurane. What crystalloid rate should run during anesthesia?","options":["75 mL/h","125 mL/h","50-75 mL/h","375-500 mL/h","1,500-2,250 mL/h"],"correct":1,"why":"His values now meet the Week 9 Shock and Sepsis resuscitation endpoints (dog HR 80-140 bpm, pink mucous membranes, CRT 1-2 seconds, SAP 100-120 mmHg, lactate under 2.5 mmol/L, diuresis over 1 mL/kg/h), so shock boluses stop. The Week 1 Anesthesia Planning slide sets the fluid rate under anesthesia at 5 mL/kg/hour for dogs, so 25 kg x 5 mL/kg/h = 125 mL/h.","wrong":{"0":"75 mL/h is 3 mL/kg/h, the Week 1 anesthetic rate for cats, not dogs.","2":"50-75 mL/h is 2-3 mL/kg/h, the Week 9 holding rate for a hypothermic cat in shock while it is rewarmed, not a dog under anesthesia.","3":"375-500 mL/h is another 15-20 mL/kg shock aliquot, which is no longer needed once endpoints are reached.","4":"1,500-2,250 mL is the 60-90 mL/kg total shock dose for a dog, a ceiling for resuscitation, not an anesthetic rate."},"lec":"Integration: W9 + W1","weeks":[9,1],"mods":[3,1],"disc":"Anesthesia","species":"Dog","type":"Calculation"},{"stem":"A 9-year-old spayed female miniature schnauzer with diabetes mellitus, controlled for 2 years on twice-daily insulin, collapses at home. Her PCV is 13% (reference 37-55%) with a strongly regenerative response, spherocytes, and saline autoagglutination. Infectious disease testing, thoracic radiographs, and abdominal ultrasound find no trigger, and she has had no new drugs or vaccines. After stabilization at your general practice, the owner asks about the long-term plan. Which plan best fits the lecture's guidance?","options":["Prednisone 2-4 mg/kg/day at home","Specialist referral","Prednisone 0.5-1 mg/kg/day","Prednisone 0.1-0.25 mg/kg/day","Insulin withdrawal during treatment"],"correct":1,"why":"Two of the five IMHA criteria are met (spherocytes, autoagglutination) and no trigger was found, so this is primary IMHA needing immunosuppression. The slides list a patient with a second disease that makes treating the IMD difficult, such as a diabetic on insulin, as a reason to refer to a specialist, and note that concurrent disease can make prednisone a poor choice.","wrong":{"0":"This is the standard immunosuppressive dose, but the slides single out a diabetic on insulin as the case to refer rather than manage routinely.","2":"0.5-1 mg/kg/day is the anti-inflammatory range, too low to stop immune destruction of red cells.","3":"0.1-0.25 mg/kg/day is the physiologic dose and has no immunosuppressive effect.","4":"Nothing in the lecture supports stopping insulin; the concurrent disease still needs management, which is why referral is advised."},"lec":"W4: Common Immune-Mediated Diseases","weeks":[4],"mods":[2],"disc":"Clinical pathology","species":"Dog","type":"Management"},{"stem":"A 7-year-old Warmblood gelding ran through a wooden fence overnight and was found 14 hours later. A 6-cm wound over the right lateral thorax sucks air in and out with each breath, and he is dyspneic. The wound edges are swollen with purulent material. Which description best fits this injury?","options":["Open pneumothorax; contaminated wound","Closed pneumothorax; infected wound","Tension pneumothorax; contaminated wound","Open pneumothorax; infected wound","Closed pneumothorax; clean-contaminated wound"],"correct":3,"why":"The Week 10 Thoracic Trauma slides define an open pneumothorax as one caused by penetration or rupture of the chest wall, as with bites, stabs, gunshots, or impalement, and air moving through this wound confirms it. The Week 3 Wound Management slides classify traumatic wounds older than 12 hours or overtly infected as infected (dirty) and call for antibiotics, lavage, debridement, and drainage.","wrong":{"0":"The pneumothorax type is r   var tags = [q.weeks.map(weekLabel).join(" + ")].concat([q.disc, q.species, q.type].filter(Boolean));
  h += '</details><p class="meta" style="margin-top:12px">' + esc(tags.join(" · ")) + '</p>' +
    '<div class="navrow"><button type="button" id="rprev"' + (pos === 0 ? " disabled" : "") + '>Previous</button><button type="button" id="back">Back to results</button>' +
    '<button type="button" class="primary" id="rnext"' + (pos === list.length - 1 ? " disabled" : "") + '>Next</button></div></section>' +
    '<section class="sheet"><h3 style="margin-top:0">All questions</h3>' + gridHtml(true) + '<div class="legend">Green = correct, red = missed<span></span>flagged during the exam</div></section>';
  app.innerHTML = h;
  document.getElementById("rprev").onclick = function () { S.cur = list[pos - 1]; render(); toTop(); };
  document.getElementById("rnext").onclick = function () { S.cur = list[pos + 1]; render(); toTop(); };
  document.getElementById("back").onclick = function () { S.screen = "results"; render(); toTop(); };
  document.getElementById("mo").onchange = function () { S.missedOnly = this.checked; render(); };
  Array.prototype.forEach.call(document.querySelectorAll("[data-go]"), function (b) { b.onclick = function () { var g = +b.getAttribute("data-go"); if (S.missedOnly && missed().indexOf(g) < 0) S.missedOnly = false; S.cur = g; render(); toTop(); }; });
}
function render() {
  showTimer();
  if (S.screen === "disclaimer") disclaimerScreen();
  else if (S.screen === "start") startScreen();
  else if (S.screen === "exam") examScreen();
  else if (S.screen === "results") resultsScreen();
  else reviewScreen();
}
render();
</script>
