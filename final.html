<style>
:root {
  --navy:#14294B; --teal:#1F7A8C; --aqua:#E8F4F6; --yellow:#F5C518; --ink:#16202E; --muted:#4F5D6E; --rule:#C9D6DD;
  --bg:#FBFCFC; --paper:#FFFFFF; --on:#FFFFFF; --red:#B8392F; --redbg:#FBECEA; --green:#2E7D4F; --greenbg:#E7F3EC;
  --serif:Caladea, Cambria, Georgia, serif; --sans:"Source Sans 3", "Segoe UI", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --navy:#A9C7E8; --teal:#62B7C8; --aqua:#1A3140; --ink:#E4EAF0; --muted:#A6B4C2; --rule:#33465C;
    --bg:#0F1826; --paper:#14202F; --on:#0F1826; --red:#F0948A; --redbg:#3A1F1E; --green:#86CDA2; --greenbg:#17301F;
  }
}
* { box-sizing:border-box; }
html { -webkit-text-size-adjust:100%; }
body { margin:0; font-family:var(--serif); color:var(--ink); background:var(--bg); font-size:17px; line-height:1.55; overflow-wrap:break-word; }
header { background:var(--bg); border-bottom:3px solid var(--navy); position:sticky; top:0; z-index:5; }
.hwrap { max-width:760px; margin:0 auto; padding:10px 16px 9px; display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; }
.kicker { font-family:var(--sans); font-size:13px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; color:var(--teal); text-decoration:none; }
header h1 { font-size:21px; margin:0; color:var(--navy); line-height:1.25; }
.timer { font-family:var(--sans); font-size:19px; font-weight:700; color:var(--navy); display:flex; align-items:center; gap:10px; font-variant-numeric:tabular-nums; }
.timer.low { color:var(--red); }
main { max-width:760px; margin:0 auto; padding:18px 16px 32px; }
section.sheet { background:var(--paper); border:1px solid var(--rule); border-radius:2px; padding:22px 24px; margin-bottom:18px; }
h2 { color:var(--navy); margin:0 0 12px; font-size:26px; line-height:1.25; }
h3 { color:var(--navy); margin:22px 0 8px; font-size:19px; padding-bottom:4px; border-bottom:1px solid var(--rule); }
p { margin:0 0 12px; }
.lead { color:var(--muted); }
button, .btn { font-family:var(--sans); font-size:16px; font-weight:600; border-radius:3px; border:1px solid var(--navy); background:var(--paper); color:var(--navy); padding:9px 16px; cursor:pointer; line-height:1.3; }
button.primary { background:var(--navy); color:var(--on); }
button.teal { background:var(--teal); border-color:var(--teal); color:var(--on); }
button:disabled { opacity:.4; cursor:default; }
button:focus-visible, input:focus-visible, summary:focus-visible { outline:3px solid var(--yellow); outline-offset:2px; }
header button { padding:5px 12px; font-size:15px; }
ol.steps { padding-left:22px; }
ol.steps li { margin-bottom:8px; }
.notice { border-left:4px solid var(--yellow); background:var(--aqua); padding:14px 16px; margin:0 0 16px; }
.notice p:last-child { margin-bottom:0; }
.agree { font-family:var(--sans); font-size:17px; font-weight:600; display:flex; align-items:center; gap:10px; margin:6px 0 4px; cursor:pointer; }
.agree input { width:22px; height:22px; margin:0; accent-color:var(--navy); }
.qhead { display:flex; justify-content:space-between; align-items:baseline; gap:6px 12px; flex-wrap:wrap; margin-bottom:12px; padding-bottom:8px; border-bottom:1px solid var(--rule); }
.qnum { color:var(--navy); font-weight:700; font-size:21px; }
.meta { font-family:var(--sans); color:var(--muted); font-size:14px; }
.stem { margin:0 0 16px; white-space:pre-wrap; }
.opt { display:flex; align-items:flex-start; gap:12px; width:100%; text-align:left; border:1px solid var(--rule); background:var(--paper); color:var(--ink); border-radius:3px; padding:10px 12px; margin-bottom:8px; font-family:var(--serif); font-weight:400; font-size:inherit; }
.opt .let { flex:0 0 30px; height:30px; border:1px solid var(--navy); border-radius:50%; color:var(--navy); font-family:var(--sans); font-weight:700; display:flex; align-items:center; justify-content:center; }
.opt.sel { border-color:var(--navy); background:var(--aqua); box-shadow:inset 3px 0 0 var(--navy); }
.opt.sel .let { background:var(--navy); color:var(--on); }
.opt.correct { border-color:var(--green); background:var(--greenbg); }
.opt.correct .let { background:var(--green); border-color:var(--green); color:var(--on); }
.opt.wrongpick { border-color:var(--red); background:var(--redbg); }
.opt.wrongpick .let { background:var(--red); border-color:var(--red); color:var(--on); }
.opt .txt { padding-top:2px; min-width:0; }
.navrow { display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; margin-top:16px; }
.flagbtn.on { background:var(--yellow); border-color:var(--yellow); color:#16202E; }
.grid { display:grid; grid-template-columns:repeat(10, minmax(0, 1fr)); gap:5px; }
.grid button { padding:6px 0; font-size:14px; position:relative; font-weight:600; min-width:0; }
.grid button.ans { background:var(--aqua); }
.grid button.cur { outline:3px solid var(--teal); outline-offset:1px; }
.grid button.flg::after { content:""; position:absolute; top:3px; right:3px; width:8px; height:8px; border-radius:50%; background:var(--yellow); border:1px solid #8A6D00; }
.grid button.r-ok { background:var(--greenbg); border-color:var(--green); color:var(--green); }
.grid button.r-bad { background:var(--redbg); border-color:var(--red); color:var(--red); }
.legend { font-family:var(--sans); font-size:14px; color:var(--muted); margin-top:8px; }
.legend span { display:inline-block; width:10px; height:10px; border-radius:50%; background:var(--yellow); border:1px solid #8A6D00; margin:0 4px 0 10px; }
.big { font-size:42px; font-weight:700; color:var(--navy); line-height:1.2; margin-bottom:6px; }
table { table-layout:fixed; border-collapse:collapse; width:100%; font-size:16px; margin-bottom:10px; }
th { font-family:var(--sans); font-size:14px; text-transform:uppercase; letter-spacing:.04em; color:var(--navy); text-align:left; padding:6px 8px; border-bottom:2px solid var(--navy); }
td { border-bottom:1px solid var(--rule); padding:7px 8px; vertical-align:top; }
td.num, th.num { text-align:right; white-space:nowrap; font-variant-numeric:tabular-nums; }
th.c1 { width:52%; } th.c2 { width:18%; } th.c3 { width:12%; } th.c4 { width:18%; }
tr.low td { background:var(--redbg); }
tr.low td:first-child { box-shadow:inset 4px 0 0 var(--red); }
tr.strong td { background:var(--greenbg); }
tr.tip td { background:var(--redbg); color:var(--red); font-family:var(--sans); font-weight:700; font-size:15px; padding-top:0; }
tr.tip td:first-child { box-shadow:inset 4px 0 0 var(--red); }
.bar { height:8px; background:var(--aqua); border:1px solid var(--rule); overflow:hidden; margin-top:7px; }
.bar i { display:block; height:100%; background:var(--teal); }
tr.low .bar i { background:var(--red); }
tr.strong .bar i { background:var(--green); }
.callout { border:1px solid var(--red); background:var(--redbg); padding:12px 14px; margin:12px 0; }
.callout b { color:var(--red); }
.callout.ok { border-color:var(--green); background:var(--greenbg); }
.callout.ok b { color:var(--green); }
details.wk { border-bottom:1px solid var(--rule); padding:6px 0; }
details.wk summary { cursor:pointer; font-family:var(--sans); font-weight:700; color:var(--navy); font-size:16px; padding:4px 0; }
details.wk summary .s { font-weight:400; color:var(--muted); }
details.wk.low summary { color:var(--red); }
details.wk table { margin-top:6px; }
.why { background:var(--aqua); border-left:4px solid var(--navy); padding:12px 14px; margin-top:14px; }
.why b { color:var(--navy); }
.pick { border:1px solid var(--red); border-left-width:4px; padding:12px 14px; margin-top:10px; }
details.others { margin-top:12px; }
details.others summary { cursor:pointer; font-family:var(--sans); font-weight:600; color:var(--navy); }
.pill { display:inline-block; font-family:var(--sans); border:1px solid var(--teal); color:var(--teal); border-radius:2px; padding:1px 8px; font-size:14px; font-weight:600; }
.chk { font-family:var(--sans); font-size:15px; display:flex; align-items:center; gap:8px; }
.modal { position:fixed; inset:0; background:rgba(15,24,38,.6); display:flex; align-items:center; justify-content:center; padding:16px; z-index:10; }
.modal section.sheet { max-width:480px; width:100%; margin:0; }
.hidden { display:none !important; }
footer { max-width:760px; margin:0 auto; text-align:center; color:var(--muted); font-size:14px; padding:14px 16px 28px; border-top:1px solid var(--rule); }
.paused { text-align:center; padding:44px 20px; }
@media (max-width:600px) {
  body { font-size:16px; }
  .grid { grid-template-columns:repeat(5, minmax(0, 1fr)); }
  h2 { font-size:22px; }
  .big { font-size:34px; }
  section.sheet { padding:16px 14px; }
  .navrow button { flex:1 1 40%; }
  header h1 { font-size:18px; }
  th.c1 { width:56%; } th.c2 { width:26%; } th.c3 { width:18%; }
  th.c4, td.c4 { display:none; }
  table { font-size:15px; }
}
@media print {
  header { position:static; }
  .navrow, .grid, .legend, .timer { display:none !important; }
}
</style>

<script>
var CFG = {"id":"final","title":"Systems 4 Final Mock Exam","intro":"100 questions across Modules 1-4 (Weeks 1-15), built from the Systems 4 FCM, IIO, CVR, and SSI lecture slides. 120 minutes: 4 blocks of 25, about 30 minutes each.","minutes":120,"block":25,"final":true,"xnote":"Some questions combine material from two modules or weeks. They count toward every week they draw on.","submitNote":"You will see your score by week, lecture, module, discipline, and species, then review every question with explanations."};
var QS = [{"stem":"A 3-week-old Suffolk lamb has a 3-hour-old, 4-cm laceration on the hind limb from a fence. The wound is packed with soil and sheep feces. The lamb is bright, and the clinician clips the area and begins lavage before deciding on closure. Which antiseptic solution best addresses the main infectious risk of this wound?","options":["Chlorhexidine 0.05%","Hydrogen peroxide","Povidone-iodine 0.1-1%","Chlorhexidine 4% scrub","Isotonic saline alone"],"correct":1,"why":"Lambs are among the species most susceptible to tetanus (Week 3 wound management), and soil and fecal contamination means possible exposure to Clostridium spores. The antiseptic slide lists hydrogen peroxide as an effective sporicide to use when Clostridium spore exposure is possible, while noting it is cytotoxic and a weaker general antiseptic. Tetanus prevention also belongs in this lamb's wound plan.","wrong":{"0":"0.05% chlorhexidine is the wound concentration with residual activity, but the slides give the sporicidal role to hydrogen peroxide.","2":"Povidone-iodine is inactivated by organic debris, and this wound is packed with soil and feces.","3":"Scrub formulations are for surgical prep; wounds need a dilute solution formulation.","4":"Saline is a suitable isotonic lavage fluid, but the slides name hydrogen peroxide for possible Clostridium spore exposure."},"lec":"W3: Wound Management","weeks":[3],"mods":[1],"disc":"Surgery","species":"Small ruminant","type":"Management"},{"stem":"A 4-year-old Holstein cow has had falling milk yield and a poor appetite for 10 days. Temperature is 40.0 C and heart rate is 110 bpm. Heart sounds are muffled with a splashing \"washing machine\" sound, the jugular veins are distended, and there is brisket edema. When the withers are pinched she grunts and stays rigid instead of dipping her back. Ultrasound shows pericardial fluid with fibrin strands. Where should pericardiocentesis be performed to collect fluid for cytology and culture?","options":["Right 4th intercostal space","Dorsal 8th intercostal space","8-10 cm caudal to the xiphoid","Left 6th intercostal space","Left 9th intercostal space"],"correct":3,"why":"A positive withers pinch test indicates cranial abdominal pain from hardware disease, and muffled heart sounds with a washing machine sound, jugular distension, and fibrinous effusion indicate traumatic pericarditis. The Pericardial Effusions in Large Animals slides place pericardiocentesis at the left 6th intercostal space with local anesthetic, noting the fluid is often a foul-smelling exudate to submit for cytology, culture, and sensitivity.","wrong":{"0":"The right 4th or 5th space is the small animal site chosen to avoid coronary arteries, not the site on the farm animal slide.","1":"A dorsal 7th to 9th space is the Week 10 site for removing pleural air, not pericardial fluid.","2":"The site 8-10 cm caudal to the xiphoid is the Week 10 cattle abdominocentesis site, which samples peritoneal fluid.","4":"The left 9th space is the Week 10 thoracotomy approach to the caudal esophagus, not a pericardiocentesis site."},"lec":"W9: Pericardial Disease","weeks":[9],"mods":[3],"disc":"Cardiorespiratory","species":"Cattle","type":"Next step"},{"stem":"A 10-year-old spayed female mixed-breed dog has systolic pressures of 190-200 mmHg by Doppler on three visits over 4 weeks, each measured in a quiet room after acclimation. She takes no medications, and no workup has been done beyond a physical exam, which shows no murmur and no respiratory signs. What is the best next step?","options":["Diagnose idiopathic hypertension","Recheck pressure in 12 months","Workup for underlying disease","Start sildenafil","Echocardiographic TR velocity"],"correct":2,"why":"Calm, repeated readings over several visits make white coat syndrome (sympathetic activation) unlikely, so the hypertension is persistent. The Systemic and Pulmonary Hypertension slides state that secondary hypertension, with concurrent disease such as CKD, HAC, hyperthyroidism, pheochromocytoma, diabetes, liver disease, or intracranial lesions, is the most common form, so a search for an underlying disease comes next.","wrong":{"0":"Idiopathic hypertension may be more common than once thought (18-20%), but secondary hypertension is the most common form and must be looked for first.","1":"Waiting a year ignores persistent hypertension that the slides say must be measured for diagnosis and monitoring.","3":"Sildenafil treats precapillary pulmonary hypertension, not systemic arterial hypertension.","4":"Tricuspid regurgitation velocity over 3.0 m/sec assesses pulmonary hypertension, which is not the problem in this dog."},"lec":"W9: Systemic and Pulmonary Hypertension","weeks":[9],"mods":[3],"disc":"Cardiorespiratory","species":"Dog","type":"Next step"},{"stem":"A 17-year-old Warmblood gelding has had a chronic cough and increased expiratory effort for three winters, worse when stabled on hay and straw, and he has a visible heaves line. BAL cytology supports equine asthma. He now needs general anesthesia for orthopedic surgery that cannot be done standing. Which perianesthetic problem should the team plan for most specifically because of his airway disease?","options":["Muscle weakness from HYPP","Paraphimosis from acepromazine","Gastric ulceration from fasting","Hypoxemia under anesthesia","Post-anesthetic myopathy"],"correct":3,"why":"An older horse with a seasonal, stable-related cough, expiratory effort, and a heaves line has moderate to severe equine asthma, also called recurrent airway obstruction or heaves (W12 Equine Medical Respiratory Conditions). W2 Equine Anesthesia lists RAO as a pre-existing condition whose anesthetic considerations are hypoxemia (low SpO2 and/or PaO2) and airway obstruction at recovery.","wrong":{"0":"HYPP is a Quarter Horse sodium channel disease that causes muscle weakness at recovery and is unrelated to asthma.","1":"Penile prolapse or paraphimosis is an acepromazine risk mainly in stallions, not a consequence of airway disease.","2":"Fasting over 4 hours raises gastric ulcer risk in any horse, not specifically one with asthma.","4":"Post-anesthetic myopathy follows hypotension and long anesthesia in heavy breeds, not airway disease."},"lec":"Integration: W12 + W2","weeks":[12,2],"mods":[4,1],"disc":"Anesthesia","species":"Horse","type":"Interpretation"},{"stem":"A 4-year-old neutered male Labrador retriever ate an anticoagulant rodent bait 4 days ago and is now lethargic with pale mucous membranes and lumbar discomfort. PCV is 24% (37-55%), and PT is 38 seconds (11-17 seconds). Abdominal radiographs show loss of detail with streaky soft tissue opacity in the space ventral to the lumbar vertebrae and around the kidneys, while serosal detail of the peritoneal organs remains good. Which radiographic diagnosis is most likely?","options":["Peritoneal hemorrhage","Retroperitoneal urine leakage","Retroperitoneal hemorrhage","Pneumoretroperitoneum","Peritoneal carcinomatosis"],"correct":2,"why":"The retroperitoneum lies ventral to the vertebrae and contains the kidneys, so loss of detail with streaking there, with preserved peritoneal serosal detail, places the fluid in the retroperitoneal space (Week 2 abdominal radiographs). The slides list blood from coagulopathy, including rodenticide, among the causes of retroperitoneal effusion, and the prolonged PT and low PCV fit hemorrhage.","wrong":{"0":"Peritoneal fluid would reduce serosal detail of the peritoneal organs, which is preserved here.","1":"The slides list retroperitoneal urine after trauma or necrotic neoplasia, and this dog has neither but does have a coagulopathy.","3":"Gas would decrease opacity and outline structures clearly, not add streaky soft tissue opacity.","4":"Carcinomatosis causes hazy loss of peritoneal detail with nodular serosal margins, not a retroperitoneal pattern."},"lec":"W2: Abdominal Radiographs I","weeks":[2],"mods":[1],"disc":"Imaging","species":"Dog","type":"Interpretation"},{"stem":"A 4-year-old Quarter Horse gelding with irregular deworming has had three episodes of mild colic in 2 months, with fever and depression. Ultrasonography shows a thickened cranial mesenteric artery with altered blood flow, and larval culture of feces identifies Strongylus vulgaris. Which drug is directed at the migrating larvae causing the arterial lesion?","options":["Fenbendazole","Melarsomine","Doxycycline","Moxidectin","Prednisone"],"correct":3,"why":"S. vulgaris larvae migrate in the cranial mesenteric artery, causing endarteritis, thrombosis, and intestinal infarction that present as colic with fever. The Vascular Parasitic Diseases slides state that adult worms respond to all available anthelmintics but that the larvae require ivermectin or moxidectin, so moxidectin targets the larval stage that drives this disease.","wrong":{"0":"Fenbendazole is one of the anthelmintics that kill adult strongyles, but the slide names only ivermectin or moxidectin for the larvae.","1":"Melarsomine is the canine heartworm adulticide in the same lecture, not a treatment for equine strongyle larvae.","2":"Doxycycline targets Wolbachia inside Dirofilaria, which has no role in S. vulgaris.","4":"Prednisone is used in canine heartworm treatment to limit inflammation from dying worms, not to kill strongyle larvae."},"lec":"W9: Vascular Parasitic Diseases","weeks":[9],"mods":[3],"disc":"Infectious disease","species":"Horse","type":"Management"},{"stem":"A 12-year-old Warmblood gelding has progressive inspiratory stertor. Endoscopy shows both arytenoid cartilages thickened and distorted, with granulation tissue and a narrowed rima glottidis. The surgeon plans a partial arytenoidectomy under general anesthesia with orotracheal intubation. The anesthetist is planning for recovery, when the horse is extubated and must breathe through its upper airway again. Which airway plan is most appropriate?","options":["Phenylephrine nasal drops","Elective tracheostomy","Supplemental oxygen alone","Head and tail rope recovery","Pool-assisted recovery"],"correct":1,"why":"Arytenoid chondritis narrows the larynx, and the Week 11 equine airway slides list elective tracheostomy for surgery when upper respiratory tract obstruction is likely. The Week 2 equine anesthesia slides note that 42% of perioperative deaths in horses occur during recovery and that recovery requires the transition to nasal breathing, which this obstructed larynx cannot support. A tracheostomy tube bypasses the lesion.","wrong":{"0":"Phenylephrine drops reduce nasal edema, but this obstruction is laryngeal, not nasal.","2":"Supplemental oxygen helps prevent hypoxemia but does not open an obstructed airway.","3":"Ropes give stability and direction while the horse stands but do nothing for the airway.","4":"Pool-assisted recovery is ideal after orthopedic surgery and needs dedicated equipment, but it does nothing for an obstructed airway."},"lec":"Integration: W2 + W11","weeks":[2,11],"mods":[1,3],"disc":"Anesthesia","species":"Horse","type":"Management"},{"stem":"A 4-month-old Belgian draft filly bled for hours after removal of a jugular catheter and keeps oozing from a small wire laceration. She nurses well and has had no access to moldy hay or rodent bait. Platelet count is 210 x 10^3/uL (RI 100-350), buccal mucosal bleeding time is normal, PT is 10 seconds (RI 9-12), aPTT is 85 seconds (RI 35-55), and fibrinogen is normal. Which disorder is most likely?","options":["Prekallikrein deficiency","Hemophilia A","Von Willebrand disease","Moldy sweet clover toxicosis","Disseminated intravascular coagulation"],"correct":0,"why":"A normal platelet count and bleeding time show that primary hemostasis is intact, so this is a secondary (coagulation factor) defect. The Coagulation Disorders slides list rare inherited secondary disorders: hemophilia A (factor VIII, males only) and prekallikrein deficiency in Belgians and Miniature horses, with testing for the specific factor. A Belgian filly fits prekallikrein deficiency.","wrong":{"1":"Hemophilia A is an inherited factor defect, but the slides state it affects males only, and this is a filly.","2":"Von Willebrand disease is the most common inherited bleeding disorder in dogs, but it is a primary hemostatic defect with a prolonged bleeding time, and hers is normal.","3":"Moldy sweet clover blocks vitamin K-dependent factors, and the slides state PT prolongs first, but her PT is normal and she had no exposure.","4":"DIC causes both bleeding and clotting with abnormal platelets, FDPs, and other tests, while her platelets and fibrinogen are normal."},"lec":"W9: Coagulation Disorders","weeks":[9],"mods":[3],"disc":"Clinical pathology","species":"Horse","type":"Diagnosis"},{"stem":"A 400-cow dairy tests every cow by ELISA, and 62% are positive for bovine leukemia virus antibodies. The herd has never received any BLV vaccine. The owner already uses single-use needles and an electric dehorner and now wants to reduce transmission to newborn heifer calves through colostrum; culling all positive cows is not affordable. Which colostrum strategy fits this herd?","options":["Colostrum from negative cows","Pasteurized colostrum","Pooled fresh colostrum","Colostrum from vaccinated cows","Frozen colostrum"],"correct":4,"why":"With no BLV vaccine, a positive ELISA means infection, so 62% marks a high-prevalence herd. The slides recommend colostrum from negative cows in low-prevalence herds and frozen colostrum in high-prevalence herds, alongside testing and separating positive and negative groups.","wrong":{"0":"The slides reserve colostrum from negative cows for low-prevalence herds, and this herd is high prevalence.","1":"Pasteurized colostrum and milk is the slide's control for Mycoplasma bovis in calves, not the BLV recommendation.","2":"BLV is blood-borne and lives in lymphocytes, so pooling fresh colostrum from a mostly positive herd spreads infection.","3":"No BLV vaccine exists, which is why a positive ELISA is read as infection."},"lec":"W5: Viral Diseases in Production Animals","weeks":[5],"mods":[2],"disc":"Infectious disease","species":"Cattle","type":"Prevention"},{"stem":"A 6-year-old Warmblood mare is kicked in the chest by a pasture mate in the morning and dies that afternoon. At necropsy, both lungs contain several separate, well-demarcated, dark red areas of hemorrhage, 2-5 cm across, with normal lung between them. No inflammatory exudate is present. Which morphologic diagnosis is best?","options":["Severe, chronic, multifocal pulmonary hemorrhage","Severe, acute, multifocal hemorrhagic pneumonia","Severe, acute, diffuse pulmonary hemorrhage","Severe, acute, multifocal pulmonary hemorrhage","Severe, acute, multifocal serohemorrhagic pneumonia"],"correct":3,"why":"Morphologic diagnoses are not just for exudates: a hemostatic lesion is written as the tissue plus the lesion, without an inflammatory suffix. Separate lesions with normal tissue between them are multifocal, and for non-inflammatory lesions the timeframe comes from the clinical history (hours here, so acute), as in the lecture's rodenticide ecchymosis example.","wrong":{"0":"Chronic describes lesions present from about 3 days to months, and the history shows these formed within hours.","1":"The -itis suffix denotes inflammation, and with no exudate this lesion is hemorrhage, not pneumonia.","2":"Diffuse means the whole tissue is involved, but these lesions are separate with normal lung between them.","4":"Serohemorrhagic is an inflammatory exudate term, and no exudate is present."},"lec":"W4: Morphologic Diagnosis","weeks":[4],"mods":[2],"disc":"Clinical pathology","species":"Horse","type":"Interpretation"},{"stem":"A 5-year-old neutered male domestic shorthair cat, now kept indoors with one calm, adult housemate cat, has ulcerated, crusted lesions on the nose and face, with sneezing and conjunctivitis. The lesions worsened after another clinic gave a glucocorticoid. Biopsy shows epithelial necrosis with eosinophils, and PCR on tissue detects FHV-1 DNA. A point-of-care FIV antibody test is positive, and an FIV Western blot confirms infection. Famciclovir is started. How should his FIV status change the plan?","options":["Longer treatment course","Add oral prednisolone","Start zidovudine (AZT)","Interferon in place of famciclovir","Separate from all cats for life"],"correct":0,"why":"Facial ulcers and crusts with respiratory and ocular signs, worsening on steroids, eosinophilic inflammation, and FHV-1 DNA on PCR fit feline herpesviral dermatitis, treated with famciclovir and reduction of immunosuppressive drugs (W13 Feline Dermatoses). For FIV-positive cats, W5 Companion Animal Viral Diseases advises treating the clinical disease with a possibly longer course, especially for infections, and avoiding steroids and immunosuppressants.","wrong":{"1":"Steroids are a flare factor for FHV-1 (W13) and should be avoided in FIV-positive cats (W5).","2":"AZT must be used with care because it can cause nonregenerative anemia, and it does not target FHV-1.","3":"Interferon lacks evidence of benefit, while famciclovir is the antiviral listed for herpesviral dermatitis.","4":"The slides say FIV-positive cats can live with other cats if there is no fighting, as in this calm household, so lifelong isolation is not required."},"lec":"Integration: W13 + W5","weeks":[13,5],"mods":[4,2],"disc":"Infectious disease","species":"Cat","type":"Management"},{"stem":"A veterinarian with a valid VCPR diagnoses a bacterial infection in a lactating dairy goat whose milk is sold. No drug is FDA-approved for this indication in goats, so she plans extra-label use of a cattle-approved antimicrobial that is not on any prohibited or restricted list. Before treating, which step does AMDUCA require?","options":["Cattle label withdrawal time","Veterinary Feed Directive","State veterinarian approval","Records kept for 6 months","FARAD withdrawal interval"],"correct":4,"why":"Goats are a minor species; with a valid VCPR, a diagnosis, no approved drug, and a permitted drug, extra-label use is allowed. The final step of the AMDUCA decision tree is establishing a scientifically based withdrawal interval through FARAD and documenting it, because ELDU deviates from labeled withdrawal times.","wrong":{"0":"Use in a different species is ELDU, so the cattle label withdrawal time does not apply and a science-based interval is needed.","1":"A VFD covers medicated feed for group treatment, not an individual extra-label prescription.","2":"AMDUCA requires a VCPR, a diagnosis, and a withdrawal interval, not state veterinarian approval.","3":"ELDU records must be kept for at least 2 years, not 6 months."},"lec":"W6: Prescribing in Livestock Species","weeks":[6],"mods":[2],"disc":"Public health and pharmacology","species":"Small ruminant","type":"Next step"},{"stem":"A 6-year-old neutered male domestic shorthair cat has had chin lesions for 5 months. The chin and lip commissures have comedones, papules, crusts, and erythema, and the chin is now swollen, painful, and scarred, with draining tracts. Medicated chlorhexidine wipes, then a topical antibiotic ointment for 6 weeks, did not help. Skin scrapings, trichoscopy, Wood's lamp, and fungal culture are negative, and there is no sneezing or ocular discharge. Cytology shows neutrophils with cocci, and biopsy shows follicular plugging, furunculosis, and scarring. Which treatment is most appropriate now?","options":["Chlorhexidine wipes, more often","Benzoyl peroxide 5% gel","Oral antibiotics and steroids","Oral cyclosporine","Famciclovir"],"correct":2,"why":"Comedones, papules, and crusts on the chin and lip commissures with follicular plugging on biopsy are feline chin acne, an idiopathic disorder of follicular keratinization with no evidence of FHV-1 or FCV (W13 Feline Dermatoses). The slide tiers treatment: mild cases get medicated wipes, moderate cases get an antibiotic ointment or 5% benzoyl peroxide gel, and severe cases get systemic antibiotics and glucocorticoids, which fits this cat with furunculosis and scarring after topical therapy failed.","wrong":{"0":"Chlorhexidine wipes are the mild-case treatment, and wipes have already failed in a cat with furunculosis and scarring.","1":"Benzoyl peroxide 5% gel is a moderate-case topical, and moderate topical therapy has already failed here.","3":"Oral glucocorticoids and/or cyclosporine are listed for severe idiopathic facial dermatitis in Persians and Himalayans, which causes black waxy facial exudate rather than chin comedones.","4":"Famciclovir treats feline herpesviral dermatitis, and the slides state chin acne has no evidence of FHV-1; this cat has no respiratory or ocular signs."},"lec":"W13: Feline Dermatoses","weeks":[13],"mods":[4],"disc":"Dermatology","species":"Cat","type":"Management"},{"stem":"A 5-year-old neutered male domestic shorthair cat is maintained on isoflurane in a mixture of 70% nitrous oxide and 30% oxygen for dental extractions. At the end of the procedure the vaporizer and both flowmeters are turned off, and the cat is disconnected from the breathing system to breathe room air while still intubated. Within 2 minutes SpO2 falls from 98% to 86%. Respiratory rate is 14 breaths/min with good chest excursions, ETCO2 was 38 mmHg just before disconnection, the endotracheal tube is patent, and breath sounds are normal on both sides. Which mechanism best explains the fall in SpO2?","options":["Second gas effect","Hypoventilation","Diffusion hypoxia","Intrapulmonary shunt","Alveolar dead space"],"correct":2,"why":"Nitrous oxide was stopped and the cat went straight to room air. The Week 1 induction slides describe diffusion hypoxia: when N2O is discontinued it leaves the blood rapidly and re-enters the alveoli, diluting and displacing oxygen, so 100% oxygen should be given immediately after stopping N2O. Good chest movement, a normal ETCO2, and normal breath sounds argue against hypoventilation or an airway problem.","wrong":{"0":"The second gas effect is N2O speeding the uptake of other inhalants at the start of anesthesia, not a cause of hypoxemia when N2O stops.","1":"Hypoventilation raises PaCO2 through a low minute volume, but this cat has good chest excursions and a normal ETCO2.","3":"Shunt (V/Q of 0) from atelectasis or airway obstruction causes hypoxemia, but the timing right after N2O was stopped, with normal breath sounds, points to diffusion hypoxia.","4":"Alveolar dead space is ventilated but not perfused lung (V/Q infinite), as with an embolus, and nothing here suggests it."},"lec":"W1: Induction and Maintenance","weeks":[1],"mods":[1],"disc":"Anesthesia","species":"Cat","type":"Mechanism"},{"stem":"A 4-year-old spayed female domestic shorthair cat that hunts mice around a neighbor's barn presents with acute dyspnea, pale mucous membranes, and a hemothorax on TFAST. The owners keep no rodent bait at home, and the cat has no history of abnormal bleeding. PCV is 22% (RI 30-45), platelets are 310,000/µL (RI 200,000-500,000), PT is 68 seconds (RI 9-20), and aPTT is 48 seconds (RI 15-25). Liver enzymes, bilirubin, and albumin are within reference intervals. Which explanation best fits these findings?","options":["Disseminated intravascular coagulation","Hemophilia A","von Willebrand disease","NSAID-induced thrombopathy","Relay toxicosis from prey"],"correct":4,"why":"A normal platelet count with a markedly prolonged PT, a prolonged aPTT, and cavity bleeding is a secondary hemostatic defect, most commonly from rodenticide or liver disease (W9 Common Coagulation Disorders). Rodenticide toxicity is rare in cats, but W9 notes they can have relay toxicosis from ingested prey, and W12 Cardiovascular and Respiratory Toxins notes exposure is possible by eating a dead rodent that ate the bait.","wrong":{"0":"DIC combines primary and secondary defects with platelet consumption, and this platelet count is normal.","1":"Hemophilia A is an inherited factor VIII deficiency of males, and this is a female with no prior bleeding history.","2":"von Willebrand disease is a primary hemostatic defect with mostly normal screening tests (at most a prolonged aPTT), not a markedly prolonged PT.","3":"NSAIDs cause thrombopathy, a primary platelet function defect, whereas this cat has a secondary (coagulation factor) defect."},"lec":"Integration: W12 + W9","weeks":[12,9],"mods":[4,3],"disc":"Clinical pathology","species":"Cat","type":"Interpretation"},{"stem":"An 11-year-old spayed female Miniature Schnauzer with pituitary-dependent hyperadrenocorticism has thoracic radiographs before a dental procedure. She has no cough and a normal resting respiratory rate. The bronchial walls throughout both lungs appear as thin, sharply marginated, mineral-opaque rings and parallel lines. The bronchi taper normally, and there are no soft-tissue nodules, alveolar changes, or hazy interstitial opacity. Which interpretation fits best?","options":["Pulmonary osteomas","Bronchiectasis","Peribronchial cuffing","Bronchial mineralization","Miliary interstitial nodules"],"correct":3,"why":"The Imaging of the Thorax II slides describe bronchial mineralization (dystrophic mineralization of the bronchial wall or of endobronchial plugs) as a sequel of chronic bronchitis that is most common in cats but can be seen in dogs with hyperadrenocorticism. Mineral-opaque, sharply marginated bronchial walls in a dog with known hyperadrenocorticism and no respiratory signs fit this finding.","wrong":{"0":"Pulmonary osteomas are mineral opacities, but the slides describe them as discrete nodules not adjacent to a bronchus, not lines along the bronchial walls.","1":"Bronchiectasis affects the bronchi, but its radiographic hallmark is bronchi that fail to taper, and these taper normally.","2":"Peribronchial cuffing also makes donuts and tram lines, but it comes from soft-tissue cells or fluid around the bronchi, not mineral.","4":"Miliary nodules are a structured interstitial pattern of many small nodules, and none are present."},"lec":"W8: Pulmonary Patterns","weeks":[8],"mods":[3],"disc":"Imaging","species":"Dog","type":"Interpretation"},{"stem":"Before a 25-kg dog is anesthetized, the team notices that the CO2 absorbent granules in the circle system are completely desiccated, but there is no time to replace them. The dog is maintained with desflurane through that circle at low fresh gas flow. Throughout the procedure ETCO2 stays at 38-42 mmHg, the granules show no color change, and SpO2 reads 98-99%. Which toxic product is the main concern with this combination?","options":["Compound A","Rebreathed carbon dioxide","Hepatotoxic metabolites","Carbon monoxide","Excess heat and water"],"correct":3,"why":"The Week 1 equipment slides warn that desflurane produces carbon monoxide, mainly in the presence of desiccated absorbent. A normal ETCO2 and no color change show the absorbent is still removing CO2, so rebreathing is not the problem. The monitoring slides list abnormal hemoglobins such as carboxyhemoglobin among pulse oximeter limitations, so a normal SpO2 does not exclude this risk.","wrong":{"0":"Compound A is the nephrotoxic product (in rats) of sevoflurane reacting with the granules, not desflurane.","1":"Exhausted absorbent causes CO2 rebreathing with a color change and high ETCO2, and neither is present.","2":"High hepatic metabolism and liver toxicity are listed for halothane, not desflurane.","4":"Heat and water are normal products of the absorbent reaction with CO2 and are not the toxic concern with dry granules."},"lec":"W1: Anesthesia Equipment","weeks":[1],"mods":[1],"disc":"Anesthesia","species":"Dog","type":"Interpretation"},{"stem":"An 8-year-old spayed female Chihuahua has slowly progressive cloudiness in both eyes. The edema began temporally and now extends axially in both corneas, with small bullae. The eyes are not painful, there are no corneal vessels, fluorescein stain is negative, and IOP is 16 mmHg OU (RI 15-25). Which medical treatment is most appropriate?","options":["Topical 5% NaCl","Grid keratotomy","Topical cyclosporine","Topical antibiotic drops","Topical EDTA drops"],"correct":0,"why":"Non-painful bilateral edema that starts temporally and spreads axially in a predisposed breed, with no vessels, no ulcer, and normal IOP, is corneal endothelial dystrophy (W14 Corneal Injury and Disease). Endothelial decompensation is managed with topical hyperosmotics (5-10% NaCl), with Gunderson flaps, thermokeratoplasty, or keratoplasty as surgical options.","wrong":{"1":"Grid keratotomy treats indolent superficial ulcers, and there is no ulcer here.","2":"Cyclosporine is used for immune-mediated keratitis such as pannus and for KCS, not endothelial failure.","3":"Antibiotics are toxic to epithelial cells and should not be used when there is no ulcer.","4":"EDTA drops are used for corneal degeneration and as an anti-melting agent, not endothelial decompensation."},"lec":"W14: Corneal Injury and Disease","weeks":[14],"mods":[4],"disc":"Ophthalmology","species":"Dog","type":"Management"},{"stem":"A 4-month-old intact male Great Dane puppy has fever, tachypnea, and crackles over the cranioventral lung fields, and thoracic radiographs show an alveolar pattern consistent with bacterial pneumonia. The clinician starts the combination listed in lecture for canine bacterial pneumonia: high-dose ampicillin q6h plus enrofloxacin 20 mg/kg q24h. Which adverse effect is most important to discuss with the owner for this patient?","options":["Retinal blindness","Nephrotoxicity","Enamel discoloration","Cartilage damage","Keratoconjunctivitis sicca"],"correct":3,"why":"Of the two drugs, enrofloxacin carries the age-related risk: the slides list failure of cartilage development in young animals, along with seizures and blindness in cats. A 4-month-old giant-breed puppy is still growing, so cartilage damage is the key point to discuss.","wrong":{"0":"Enrofloxacin blindness is listed for cats, not dogs.","1":"Nephrotoxicity (with ototoxicity) is listed for aminoglycosides, which are not in this protocol.","2":"Tooth enamel effects are listed for tetracyclines, not penicillins or fluoroquinolones.","4":"KCS is the classic sulfonamide adverse effect, not a listed effect of ampicillin or enrofloxacin."},"lec":"W6: Antimicrobial Stewardship","weeks":[6],"mods":[2],"disc":"Public health and pharmacology","species":"Dog","type":"Management"},{"stem":"A 2-year-old female alpaca kept in a fenced dry-lot pen with no deer access has had progressive hind limb weakness for 2 days and is now sternal and unable to rise. Temperature, heart rate, and respiratory rate are within reference intervals. Clipping the neck and axillae reveals several large, reddish-brown ticks with silvery-gray mottled markings on the dorsal shield. Alongside supportive NSAIDs and fluids, which treatment is indicated?","options":["Fenbendazole and steroids","Ectoparasite treatment","Imidocarb dipropionate","Oxytetracycline","Deer and snail control"],"correct":1,"why":"Large reddish-brown ticks with silvery mottled markings on the shield identify Dermacentor, which the Week 5 production animal vector slides list as a carrier of tick paralysis. The slides treat tick paralysis in alpacas and cattle with supportive care (NSAIDs, fluids) plus ectoparasite treatment, and name meningeal worm as the main differential, which needs exposure to deer.","wrong":{"0":"Fenbendazole with or without steroids treats meningeal worm, the slides' differential, but this alpaca has no deer exposure and is carrying ticks.","2":"Imidocarb is listed for tick-borne blood parasites such as Babesia and Anaplasma, not for paralysis caused by the tick itself.","3":"Oxytetracycline treats anaplasmosis, another Dermacentor-borne disease, which causes anemia and icterus rather than paralysis.","4":"Keeping out deer and removing snails prevents meningeal worm, not tick paralysis."},"lec":"W5: Vector-Borne Diseases in Production Animals","weeks":[5],"mods":[2],"disc":"Infectious disease","species":"Camelid","type":"Management"},{"stem":"A 10-year-old spayed female Cocker Spaniel has had a loud, harsh cough for 4 months but is otherwise well, with no fever. Crackles on inspiration and an expiratory wheeze are heard. Radiographs show a bronchial pattern. Bronchoscopy shows mucus and a rough, hyperemic mucosa, and BAL fluid has neutrophilic inflammation with increased mucus, no eosinophils, and a negative bacterial culture. Baermann fecal and heartworm antigen tests are negative. Which diagnosis is most likely?","options":["Chronic bronchitis","Eosinophilic bronchopneumopathy","Bacterial bronchitis","Heartworm disease","Lungworm infection"],"correct":0,"why":"The SA Lower Airway Part 2 slides define chronic bronchitis as a frequent cough for 2 or more consecutive months without other disease, seen in middle-aged to older small breeds such as Cockers, often with inspiratory crackles and an expiratory wheeze. It is a diagnosis of exclusion, and BAL shows neutrophilic or mixed inflammation with increased mucus. This dog's negative culture, Baermann, and heartworm tests exclude the active diseases on the slide's list (infection, parasites, heartworm).","wrong":{"1":"Eosinophilic bronchopneumopathy affects young dogs, especially Siberian huskies, and BAL shows eosinophilic inflammation, which is absent here.","2":"Bacterial infection is an active disease the slides require excluding before chronic bronchitis is diagnosed, and this dog's BAL culture is negative.","3":"Heartworm is on the slides' list of active diseases to rule out, and this dog's heartworm antigen test is negative.","4":"Parasites are on the exclusion list, and the Baermann, the first test the slides list for lungworms, is negative."},"lec":"W11: SA Lower Airway 2","weeks":[11],"mods":[3],"disc":"Cardiorespiratory","species":"Dog","type":"Diagnosis"},{"stem":"A group of 4-month-old finishing pigs is raised outdoors on dirt lots where they root heavily. Many have a chronic cough, increased respiratory effort, and poor growth, with no fever and low mortality. A Baermann examination of pooled feces finds larvae. At necropsy of a cull pig, adult worms are visible in the bronchi, and histopathology shows eosinophilic bronchitis. Which treatment is indicated?","options":["Tulathromycin","Ivermectin","Florfenicol","Ceftiofur","Tilmicosin"],"correct":1,"why":"Rooting outdoors exposes pigs to earthworms, the intermediate hosts of Metastrongylus lungworms. Larvae on Baermann, adult worms at necropsy, and eosinophilic bronchitis confirm the diagnosis on the Lower Airway Disease in Pigs slides, which list fenbendazole or macrocyclic lactones as treatment; ivermectin is a macrocyclic lactone (Week 9 Vascular Parasitic Diseases).","wrong":{"0":"Tulathromycin is on the slides' list for bacterial pneumonia, which this parasitic, afebrile problem is not.","2":"Florfenicol treats bacterial lower airway disease such as APP, not lungworms.","3":"Ceftiofur is a bacterial option that pigs in the slides' PRRS case improved on only briefly, and it does not kill nematodes.","4":"Tilmicosin is another antibacterial on the slides' treatment list and has no effect on Metastrongylus."},"lec":"W11: Lower Airway Disease in Pigs","weeks":[11],"mods":[3],"disc":"Infectious disease","species":"Pig","type":"Management"},{"stem":"A 10-year-old neutered male Rottweiler has had 6 weeks of right forelimb lameness that became suddenly non-weight-bearing yesterday. Radiographs show an aggressive lytic and proliferative lesion of the distal radial metaphysis with a fracture through the lesion. Thoracic radiographs are normal, and an aspirate is consistent with osteosarcoma. The owner's priority is pain control. Which local therapy is recommended?","options":["Palliative radiation therapy","Carboplatin chemotherapy","Amputation","Zoledronate infusion","Limb-sparing surgery"],"correct":2,"why":"An aggressive metaphyseal lesion in an older large-breed dog, confirmed on aspirate, is osteosarcoma, and the sudden non-weight-bearing lameness reflects a pathologic fracture with no visible metastasis. The slides state that if a pathologic fracture has occurred, amputation is the local therapy, and amputation is the standard of care for local control and quality of life.","wrong":{"0":"Radiation is a local option, but the slides list pathologic fracture as its risk, and this bone has already fractured.","1":"Chemotherapy does not provide local tumor control and is not recommended while pain is uncontrolled.","3":"Bisphosphonates are listed for use with radiation, not as treatment once the bone has fractured.","4":"Limb sparing is location- and lesion-dependent, and the slides name amputation once a pathologic fracture has occurred."},"lec":"W7: Sarcomas (OSA, HSA, STSA)","weeks":[7],"mods":[2],"disc":"Oncology","species":"Dog","type":"Next step"},{"stem":"A 7-year-old spayed female Miniature Schnauzer with diabetes mellitus, now well regulated, developed cloudiness in both lenses over 3 weeks. Retroillumination shows water clefts and opacities that began at the equator and now cover about 70% of each lens, and a fundic reflex is still seen peripherally. There is mild aqueous flare, she still navigates, and ERG and ocular ultrasound are normal. The owner wants to wait until she is completely blind before considering surgery. Which advice is best?","options":["Wait until mature","Topical lens-dissolving drops","Early surgical referral","Monitor without medication","Intracapsular lens extraction"],"correct":2,"why":"Rapid equatorial cataract with water clefts in a diabetic is a diabetic cataract at the immature stage (15-99%), with lens-induced uveitis (flare) that must be treated (W14 Disorders of the Lens). Regulated diabetics with immature to mature cataracts are good candidates, success is better when cataracts are removed early, and the slide warns not to wait until they are ripe; fast swelling can also rupture the lens.","wrong":{"0":"Waiting for maturity lowers success and risks lens rupture with massive lens-induced uveitis.","1":"There are currently no effective medical therapies that remove cataracts.","3":"Lens-induced uveitis must be treated and IOP monitored even if surgery is declined.","4":"Phacoemulsification is the preferred removal technique; intracapsular extraction is used for luxated lenses."},"lec":"W14: Disorders of the Lens","weeks":[14],"mods":[4],"disc":"Ophthalmology","species":"Dog","type":"Next step"},{"stem":"A 3-year-old silver-coated horse has several large uveal cysts, miotic and misshapen pupils, abnormal corneal curvature, and cataracts in both eyes. Other horses of the same coat color in the breeding herd have similar eyes. There has never been redness, squinting, or tearing, and there is no aqueous flare. Which underlying cause is most likely?","options":["PMEL17 mutation","MITF (S-gene) variant","Merle (M-gene) dysgenesis","Equine recurrent uveitis","In utero BVDV infection"],"correct":0,"why":"Multiple congenital anomalies (uveal cysts, miosis or dyscoria, abnormal corneal curvature, cataract) in a line sharing a coat color fit anterior segment dysgenesis/MCOA, which the W15 uvea lecture links to coat color genetics, especially the PMEL17 mutation in horses. The OMSD lecture also lists PMEL-17 (equine) among coat color related developmental anomalies.","wrong":{"1":"MITF (the S-gene) is a coat color related anomaly on the OMSD slide, but PMEL-17 is the one the slides label equine.","2":"Merle ocular dysgenesis (M-gene) belongs to merle coats, while PMEL-17 is the gene the slides tie to horses.","3":"ERU is recurrent immune-mediated inflammation, and this horse has never shown signs of uveitis.","4":"BVDV infection in utero causes ocular defects in calves, not horses."},"lec":"W15: Ocular Signs of Systemic Disease","weeks":[15],"mods":[4],"disc":"Ophthalmology","species":"Horse","type":"Mechanism"},{"stem":"A 9-year-old neutered male Labrador retriever had a 3-cm subcutaneous mast cell tumor excised from the flank with complete margins. The histopathology report states: well circumscribed growth, mitotic count 2 per 10 hpf, no multinucleated cells, low cytologic grade, and Ki67 index 31. Which reported feature increases this tumor's risk of recurrence or metastasis?","options":["Mitotic count","Growth pattern","Ki67 index","Cytologic grade","Multinucleated cells"],"correct":2,"why":"For subcutaneous MCT, the slides list mitotic count above 4 per 10 hpf, multinucleated cells, infiltrative growth, high cytologic grade, and Ki67 index above 23 as predictors of recurrence or metastasis. Comparing each value with its cutoff, only the Ki67 index of 31 crosses its threshold.","wrong":{"0":"Mitotic count raises risk only above 4 per 10 hpf, and 2 is below that cutoff.","1":"Infiltrative growth raises risk, but this tumor was well circumscribed.","3":"High cytologic grade raises risk, but this tumor was low grade.","4":"Multinucleated cells raise risk only when present, and none were seen."},"lec":"W6: Mast Cell Tumors","weeks":[6],"mods":[2],"disc":"Oncology","species":"Dog","type":"Interpretation"},{"stem":"Several 6-week-old dairy heifer calves have fever, cough, head tilt from otitis, and swollen carpal joints. Transtracheal wash culture from two untreated calves grows Mycoplasma bovis. The farm's usual first-line drug for calf pneumonia is procaine penicillin for 5 days. Which antimicrobial plan best fits this outbreak?","options":["Procaine penicillin, 3 weeks","Tulathromycin for 3 days","Extra-label metronidazole","Extra-label chloramphenicol","Tulathromycin for 3 weeks"],"correct":4,"why":"Pneumonia with otitis and arthritis plus a positive TTW culture fit multisystemic M. bovis. Week 11 Production Animal Lower Airway calls for longer-term coverage with drugs labeled for M. bovis, including tulathromycin, and Week 5 Bacterial Diseases in Livestock gives that coverage as about 3 weeks. Week 6 rules out the extra-label alternatives, because metronidazole and chloramphenicol are prohibited in food animals.","wrong":{"0":"Penicillin is the farm's routine drug but is not among the drugs listed as labeled for M. bovis in Weeks 5 and 11, so lengthening the course does not fix the choice.","1":"The drug fits, but Week 11 calls for longer-term coverage and Week 5 sets it at about 3 weeks, not 3 days.","2":"Nitroimidazoles such as metronidazole are prohibited for extra-label use in any food animal (Week 6).","3":"Chloramphenicol is on the Week 6 list of drugs never permitted for extra-label use in food animals."},"lec":"Integration: W6 + W11 (+ W5)","weeks":[6,11,5],"mods":[2,3],"disc":"Public health and pharmacology","species":"Cattle","type":"Management"},{"stem":"A farrow-to-finish farm switched its grower ration to include a large amount of cottonseed meal 6 weeks ago. Several growers now show abrupt muscle weakness, frothy salivation, generalized edema, and severe respiratory distress, and some die within a week of onset. Necropsy shows free fluid in the chest and abdomen, pulmonary edema, a mottled nutmeg liver, and a dilated, flabby heart. Which change to the feed program best prevents new cases?","options":["Remove ionophores from feed","Cottonseed meal below 9%","Thiamine supplement in feed","Oral probiotics before forage","Vitamin K1 in the ration"],"correct":1,"why":"Chronic ingestion of cottonseed meal (gossypol) causes cardiac failure with abrupt muscular weakness, frothy salivation, generalized edema, and severe respiratory distress in swine, and the necropsy (free fluid in chest and abdomen, pulmonary edema, nutmeg liver, dilated flabby heart) matches the W12 toxins lecture. The slide's prevention is to keep free gossypol under 100 ppm and to limit cottonseed meal to 9% of the total swine ration.","wrong":{"0":"Ionophores damage striated muscle, but this farm's change was cottonseed meal, and effusions with a nutmeg liver and a dilated, flabby heart are the gossypol picture on the slide.","2":"Thiamine replacement treats bracken fern thiaminase toxicity (bracken staggers), which causes incoordination rather than heart failure with effusions.","3":"Adapting animals with oral probiotics is the slide's prevention for nitrate poisoning in ruminants fed drought-stressed forage.","4":"Vitamin K1 treats dicoumarol from moldy sweet clover, which causes hemorrhage, not heart failure with edema."},"lec":"W12: CV and Respiratory Toxins","weeks":[12],"mods":[4],"disc":"Public health and pharmacology","species":"Pig","type":"Prevention"},{"stem":"A 7-year-old Warmblood mare has developed headshaking over 2 months. The right eye has a smooth, round, dark structure attached to the dorsal pupillary margin that now hangs into the axial visual field. There is no aqueous flare, miosis, or corneal edema, and IOP is normal. Ocular ultrasound shows a hyperechoic wall with an anechoic center. Which treatment is most appropriate?","options":["Enucleation","Cyst aspiration or laser","Topical atropine","Cyclosporine implant","Systemic flunixin meglumine"],"correct":1,"why":"A hyperechoic wall with an anechoic center identifies a fluid-filled iris cyst rather than a mass; in horses these arise at the corpora nigra (W15 Diseases of the Uvea). Iris cysts are usually incidental, but in horses they can cause headshaking and cause problems when they enter the axial field of view, so removal by aspiration or laser is indicated.","wrong":{"0":"Enucleation is not indicated for a benign cyst, and the slide warns not to confuse a cyst with a mass.","2":"Atropine is part of uveitis therapy, and this eye has no flare, miosis, or edema.","3":"Cyclosporine implants are used for immune-mediated disease such as ERU and IMMK.","4":"Systemic NSAIDs treat uveitis, whereas a cyst blocking the visual axis needs removal."},"lec":"W15: Diseases of the Uvea","weeks":[15],"mods":[4],"disc":"Ophthalmology","species":"Horse","type":"Management"},{"stem":"A 6-year-old spayed female domestic shorthair cat had a dental cleaning under general anesthesia 4 weeks ago and vomited during recovery. Since then she has developed progressive inspiratory stertor and open-mouth breathing that worsens when she eats. She has no sneezing and no nasal or ocular discharge, and otoscopic exams are normal. FeLV and FIV tests and a cryptococcal antigen titer are negative. Which diagnosis is most likely?","options":["Nasopharyngeal polyp","Nasal lymphoma","Cryptococcosis","Nasopharyngeal stenosis","Feline herpesvirus rhinitis"],"correct":3,"why":"Stertor that began after anesthesia with vomiting fits the Nasal Disorders slide on nasopharyngeal stenosis, which lists post-anesthesia, post-foreign body, and a history of vomiting as causes and stenting as a treatment option. The absence of discharge, normal ears, and negative cryptococcal antigen make the other nasal diseases less likely.","wrong":{"0":"Polyps also cause stertor, but nothing links them to recent anesthesia with vomiting, the history the slides tie to nasopharyngeal stenosis, and she has no discharge or otitis.","1":"Nasal tumors such as lymphoma cause unilateral progressing to bilateral nasal discharge or sneezing and can cause facial deformity, which she lacks.","2":"Cryptococcosis is the most common feline fungal infection, but her antigen titer, the slide's test, is negative.","4":"Herpesvirus causes sneezing, nasal and ocular discharge, and conjunctivitis, none of which are present."},"lec":"W10: Small Animal Nasal Disorders","weeks":[10],"mods":[3],"disc":"Cardiorespiratory","species":"Cat","type":"Diagnosis"},{"stem":"A 2-day-old Holstein bull calf was delivered by forced extraction during a difficult calving. He now has inspiratory stertor, coughing, and increasing respiratory effort. Palpation reveals fractures of the cranial ribs, and endoscopy and radiography show dorsoventral collapse of the trachea at the thoracic inlet. Which management is described for this problem in calves?","options":["Rest and NSAIDs only","Debridement, second-intention healing","Prosthetic laryngoplasty","Syringe-barrel tracheal stent","Permanent tracheostomy"],"correct":3,"why":"The tracheal collapse slide in the upper airway surgery lecture notes that in calves the trachea can collapse after trauma during dystocia, such as cranial rib fractures. For calves, the slide describes a temporary stent made from a 60 mL syringe barrel placed on the trachea.","wrong":{"0":"Rest and NSAIDs are the conservative plan for tracheal collapse in Shetland or Miniature ponies and donkeys, not the calf option on the slide.","1":"Debridement with second-intention healing is the plan for tracheal lacerations or kick wounds, not collapse.","2":"Prosthetic laryngoplasty abducts the arytenoid in recurrent laryngeal neuropathy and does not support a collapsed trachea.","4":"A tracheostomy bypasses upper airway obstruction above the stoma, but this collapse is at the thoracic inlet, and the slide's calf option is a stent."},"lec":"W11: Equine Upper Airway Surgery Cases","weeks":[11],"mods":[3],"disc":"Surgery","species":"Cattle","type":"Management"},{"stem":"A 4-year-old male neutered pit bull terrier has mild exercise intolerance and a soft systolic murmur. For 3 years he has eaten a boutique grain-free diet based on peas and lentils. Echocardiography shows a dilated, poorly contractile left ventricle with left atrial enlargement. Thoracic radiographs show no pulmonary edema or pleural fluid, the ECG shows sinus rhythm with no VPCs, and whole-blood taurine is within the reference interval. Pimobendan is started. Which additional recommendation is most likely to improve his outcome?","options":["WSAVA-approved diet","Taurine supplementation","L-carnitine supplementation","Sotalol therapy","Furosemide therapy"],"correct":0,"why":"A dilated, weak left ventricle in a dog of a listed breed fed a grain-free boutique diet fits diet-associated secondary DCM, which the Acquired Cardiac Diseases slides say is not all due to taurine. The slides tell clinicians to have owners purchase WSAVA-approved diets, note that returning to an appropriate diet has allowed some dogs to improve, and list changing a boutique diet in DCM treatment and prognosis (increased median survival).","wrong":{"1":"Taurine deficiency historically caused nutritional DCM in cats, but the slides stress that boutique diet DCM is not all due to taurine, and his taurine is normal.","2":"L-carnitine deficiency is the secondary DCM listed for Cockers, Goldens, and Newfies, while the key step for diet-associated DCM is changing the diet.","3":"Sotalol treats ARVC when a Holter recording shows over 50-100 VPCs per day, and this dog has no VPCs.","4":"Furosemide treats congestive heart failure, and he has no pulmonary edema or effusion."},"lec":"W8: Acquired Cardiac Disease","weeks":[8],"mods":[3],"disc":"Cardiorespiratory","species":"Dog","type":"Management"},{"stem":"An 8-year-old male Doberman Pinscher with dilated cardiomyopathy has fainted twice on walks and tires quickly. Heart rate is 150 bpm, femoral pulses are weak, and the CRT is 2.5 seconds. Lungs are clear, there is no jugular distension, and no fluid wave is felt. Thoracic radiographs show no pulmonary edema or pleural fluid. BUN is 48 mg/dL (RI 7-27) and creatinine is 2.1 mg/dL (RI 0.5-1.5) with a urine specific gravity of 1.045. Which physiologic process best explains his findings?","options":["Low-output forward failure","Left-sided backward failure","Right-sided backward failure","Pressure-overload hypertrophy","Pulmonary hypertension"],"correct":0,"why":"The CHF slides separate backward failure (respiratory signs, ascites) from signs of low cardiac output, called forward failure: exercise intolerance, syncope, pre-renal azotemia, and cyanosis. This dog has syncope, exercise intolerance, weak pulses, and azotemia with concentrated urine, but no edema, effusion, or ascites, so forward failure explains the picture.","wrong":{"1":"Left-sided backward failure is common with DCM, but it causes pulmonary edema, and his lungs and radiographs are clear.","2":"Right-sided backward failure causes ascites, hepatic congestion, and jugular pulses, none of which are present.","3":"Pressure overload causes concentric hypertrophy, but DCM is a pump failure with a dilated, weak ventricle.","4":"The slides link pulmonary hypertension to ascites with right ventricular hypertrophy on POCUS, which this dog does not have."},"lec":"W8: Congestive Heart Failure","weeks":[8],"mods":[3],"disc":"Cardiorespiratory","species":"Dog","type":"Interpretation"},{"stem":"A 3-year-old intact male Border collie was hit by a car 2 hours ago. Radiographs show a complete, short oblique fracture of the mid-diaphysis of the right tibia. Over the fracture is a 2-cm wound where road debris punctured the skin from the outside, with a small area of skin missing. The fragments did not protrude through the skin, the wound is clean, and no bone is missing. How should this fracture be classified?","options":["Open, first degree","Open, second degree","Open, third degree","Closed","Incomplete greenstick"],"correct":1,"why":"Communication between the fracture site and the outside makes it open (Week 3 MSK radiographs). The slides grade open fractures as first degree when a fragment punctures the skin with no soft tissue loss, second degree when the skin is punctured from outside with some soft tissue loss, and third degree when there is gross contamination and loss of soft tissue or bone. This wound was made from outside with some skin loss and no gross contamination.","wrong":{"0":"First degree means a fracture fragment punctured the skin with no loss of soft tissue.","2":"Third degree requires gross contamination and loss of soft tissue or bone.","3":"Closed is assumed only when the overlying skin is intact.","4":"Incomplete fractures such as greenstick disrupt only part of the bone, and this fracture is complete."},"lec":"W3: MSK Radiographs (Bone Disease and Fractures)","weeks":[3],"mods":[1],"disc":"Imaging","species":"Dog","type":"Interpretation"},{"stem":"A 7-year-old spayed female German shepherd weighing 32 kg has a bleeding splenic mass and a PCV of 16% (37-55%). She received a blood transfusion at another clinic 3 weeks ago. Because of the emergency, a whole blood transfusion is started at induction without a crossmatch. She is anesthetized with methadone, midazolam, propofol, isoflurane, and a fentanyl CRI for splenectomy. Twenty minutes into the transfusion, HR has risen from 95 to 170 beats/min and rectal temperature from 37.8°C to 40.1°C. MAP is 72 mmHg, ETCO2 is 41 mmHg, SpO2 is 98%, jaw tone is absent, and surgical stimulation has not changed. Which action is most appropriate first?","options":["Additional fentanyl bolus","Higher vaporizer setting","Stop the transfusion","Esmolol bolus","Dantrolene"],"correct":2,"why":"Week 1 lists nociception, awareness, hypovolemia, hypotension, hypercapnia, and hypoxemia as causes of tachycardia under anesthesia, and this dog has unchanged stimulation, absent jaw tone, and normal MAP, ETCO2, and SpO2. The Week 4 transfusion slides say any previously transfused dog should be crossmatched, describe acute hemolytic reactions with fever and tachycardia, and make stopping or slowing the transfusion the first step of treatment, followed by supportive care.","wrong":{"0":"Additional analgesia treats tachycardia from nociception, but a fentanyl CRI is running, stimulation has not changed, and pain would not explain fever.","1":"Deepening anesthesia treats awareness, but jaw tone is absent and the dog is not responding.","3":"Week 1 lists beta-blockers as specific treatment after the underlying cause is addressed, and here the cause is the transfusion.","4":"Dantrolene treats malignant hyperthermia, which occurs mainly in pigs and humans and raises ETCO2 with muscle rigidity."},"lec":"Integration: W1 + W4","weeks":[1,4],"mods":[1,2],"disc":"Anesthesia","species":"Dog","type":"Next step"},{"stem":"A 9-year-old Warmblood gelding recovers from 2.5 hours of general anesthesia in left lateral recumbency for stifle arthroscopy. His halter was left on throughout surgery. He stands after 50 minutes, is bright and eating, bears weight on all four limbs, and shows no sweating, muscle firmness, or pain on palpation. The left ear and upper lip droop, and the left nostril does not flare. Which preventive measure would most likely have avoided this complication?","options":["Dobutamine CRI","Phenylephrine nasal drops","Head and tail ropes","Shorter fasting time","Halter removal"],"correct":4,"why":"A non-painful, partial loss of facial nerve function after recumbency fits peripheral neuropathy, which the Week 2 equine slides attribute to prolonged pressure or stretching, naming the facial nerve among those commonly affected. The positioning slide says to remove the halter to protect the facial nerve. Myopathy would be painful, and myelomalacia would cause a dog-sitting posture.","wrong":{"0":"Dobutamine restores MAP to prevent post-anesthetic myopathy, which is painful, and this horse has no muscle pain.","1":"Phenylephrine nasal drops reduce nasal edema to prevent hypoxemia in recovery, not nerve injury.","2":"Head and tail ropes give stability and direction during recovery but do not protect the facial nerve during surgery.","3":"Fasting length affects gastric ulcer and ileus risk, not neuropathy."},"lec":"W2: Equine Anesthesia","weeks":[2],"mods":[1],"disc":"Anesthesia","species":"Horse","type":"Prevention"},{"stem":"A 9-year-old male neutered Labrador Retriever is in the ICU 18 hours after splenectomy for a splenic mass. He is alert, with pink mucous membranes, a CRT under 2 seconds, strong femoral pulses, and a systolic pressure of 120 mmHg. The continuous lead II ECG shows sinus complexes at about 130 bpm alternating with runs of wide, bizarre QRS complexes at about 140 bpm that have no preceding P waves. The wide complexes are not premature, and fusion complexes appear where the two rhythms change over. Which rhythm is this?","options":["Paroxysmal ventricular tachycardia","Accelerated idioventricular rhythm","Third-degree AV block","Atrial fibrillation","Multiform ventricular premature complexes"],"correct":1,"why":"The ventricular rate (about 140 bpm) is similar to the sinus rate (about 130 bpm), the wide complexes are not premature, and fusion beats mark the transitions. The Arrhythmias Part 1 slides define accelerated idioventricular rhythm (AIVR) by sinus and ventricular rates that are similar, note that it is common after GDV, and advise no specific treatment unless it becomes rapid. The same lecture lists splenic disease as a cause of arrhythmias that usually resolve.","wrong":{"0":"Runs of wide complexes suggest ventricular tachycardia, but the slides describe paroxysmal VT as a fast rhythm, whereas here the ventricular rate matches the sinus rate.","2":"Third-degree block has no relationship between P waves and QRS complexes with slow escape beats, but here normal sinus complexes are conducted between the runs.","3":"Atrial fibrillation is irregularly irregular with f waves instead of P waves, but this dog has normal P waves before every sinus complex.","4":"Wide bizarre complexes of different shapes suggest VPCs, but the slides stress that VPCs are premature, and these complexes are not."},"lec":"W8: Arrhythmias","weeks":[8],"mods":[3],"disc":"Cardiorespiratory","species":"Dog","type":"Diagnosis"},{"stem":"In August, 40 people develop acute gastroenteritis 1-2 days after eating raw oysters at a coastal festival. Leftover oysters from the same harvest are collected for testing. Which laboratory analysis of the oysters best supports the most likely agent?","options":["Virulence gene testing","Histamine measurement","Visual larval inspection","Enterotoxin PCR","Microaerophilic culture"],"correct":0,"why":"Raw shellfish such as oysters eaten in warm months point to Vibrio parahaemolyticus or V. vulnificus. Because pathogenic and nonpathogenic Vibrio both occur naturally in marine and estuarine water, the slides state that food analysis should test for virulence genes.","wrong":{"1":"Histamine marks scombrotoxin in improperly chilled fish such as tuna or mahi-mahi, not shellfish.","2":"Larval inspection fits Anisakis, acquired from raw or undercooked fish rather than oysters.","3":"Enterotoxin PCR is used for Clostridium perfringens in slowly cooled meat and poultry dishes.","4":"Microaerophilic culture is needed for Campylobacter, mainly from poultry and raw milk."},"lec":"W6: Public Health 2: Food Safety","weeks":[6],"mods":[2],"disc":"Public health and pharmacology","species":"Multiple","type":"Next step"},{"stem":"A 9-year-old neutered male Dachshund has PU/PD, polyphagia, a pot belly, and panting. Hair loss spares the head and limbs, the skin is thin with comedones, and he has had recurrent pyoderma. ALP is 860 U/L (RI 20-150) and ALT is 210 U/L (RI 10-100). An LDDST confirms hyperadrenocorticism, and abdominal ultrasound shows a 3-cm mass in the left adrenal gland. Which treatment best addresses the cause of his skin disease?","options":["Adrenalectomy","Pituitary radiation","Levothyroxine supplementation","Melatonin implants","Deslorelin acetate implant"],"correct":0,"why":"Truncal alopecia sparing the head and extremities, thin skin, comedones, recurrent pyoderma, and raised ALP and ALT fit hyperadrenocorticism, confirmed by LDDST (W13 Alopecia). The adrenal mass points to the 15% of cases caused by a functional adrenal cortical neoplasm, and the slide lists surgery for adrenal tumors; hair regrows once the endocrine disease is controlled.","wrong":{"1":"Radiation is the slide's option for pituitary tumors, which cause 85% of cases but not this adrenal mass.","2":"Levothyroxine treats hypothyroidism, which causes friction-site alopecia and a tragic expression rather than PU/PD with an adrenal mass.","3":"Melatonin is a trial treatment for alopecia X and canine recurrent alopecia, which have no systemic signs.","4":"Deslorelin implants are an alopecia X option for young plush-coated dogs without systemic illness."},"lec":"W13: Alopecia","weeks":[13],"mods":[4],"disc":"Dermatology","species":"Dog","type":"Management"},{"stem":"A 14-month-old Labrador retriever has had mild bilateral conjunctival hyperemia and mucoid discharge for 2 months. Many raised lymphoid follicles cover the bulbar surface of both third eyelids. STT is 21 mm/min OU (RI 15-25), fluorescein stain is negative, and there are no lash or lid abnormalities. Which treatment is most appropriate?","options":["Topical antibiotic ointment","Cyclosporine for 3-4 months","Systemic tetracycline","Topical steroid, slow taper","Excise the third eyelid gland"],"correct":3,"why":"Primary conjunctivitis is diagnosed by excluding secondary causes, and a normal STT, negative fluorescein, and normal lids and lashes do that here. Lymphoid follicles in a young dog indicate follicular conjunctivitis, which the W14 conjunctiva lecture treats with topical steroids and lubricants, tapering over a longer period (3-8 weeks).","wrong":{"0":"Topical antibiotics are used only for an infectious etiology, which nothing here suggests.","1":"Cyclosporine for 3-4 months is the trial for immune-mediated KCS, and tear production is normal.","2":"Systemic tetracycline is for Chlamydia felis in cats, which causes marked chemosis.","4":"Removing the third eyelid gland is contraindicated (68% develop KCS) and does not treat follicles."},"lec":"W14: Conjunctiva and Lacrimal System","weeks":[14],"mods":[4],"disc":"Ophthalmology","species":"Dog","type":"Management"},{"stem":"A 6-year-old spayed female American Cocker spaniel has acute glaucoma in the right eye with a dilated pupil, corneal edema, and episcleral injection. IOP is 62 mmHg OD (RI 15-25) and is still 55 mmHg after topical latanoprost every 15 minutes for 1 hour and IV mannitol. The lens is in normal position and the owner cannot travel for referral surgery, so aqueocentesis is planned. The draft anesthetic plan uses ketamine with diazepam for induction, but the anesthetist removes the ketamine. Which ketamine effect is the reason?","options":["Adrenal steroid synthesis inhibition","Bronchoconstriction","Profound muscle relaxation","Absence of analgesia","Raised intraocular pressure"],"correct":4,"why":"When IOP does not fall with a prostaglandin analogue or mannitol, W15 Glaucoma calls for aqueocentesis under deep sedation, preferably general anesthesia. W1 Induction and Maintenance lists increased HR, BP, ICP, and IOP among ketamine's effects, so ketamine works against the goal of lowering pressure in this eye.","wrong":{"0":"Inhibition of adrenal steroid synthesis for 2-6 hours after one dose is an etomidate effect.","1":"Ketamine causes bronchodilation, not bronchoconstriction.","2":"Ketamine causes muscle rigidity, which is why it is combined with a benzodiazepine.","3":"Ketamine provides analgesia and is even given as an analgesic CRI."},"lec":"Integration: W15 + W1","weeks":[15,1],"mods":[4,1],"disc":"Anesthesia","species":"Dog","type":"Mechanism"},{"stem":"A 450-kg Thoroughbred gelding lacerated a large vessel on a fence 3 days ago and was managed with a pressure bandage. Today he is weak, with a heart rate of 72 beats/min (reference 28-44), pale mucous membranes, and a PCV of 12% (reference 32-48%). The clinician decides he needs whole blood and aims to raise his PCV to 24%. A healthy Quarter Horse gelding donor has a PCV of 36%. Using the equine transfusion formula from lecture, what volume of whole blood should the recipient receive?","options":["12 L","36 L","24 L","18 L","1.2 L"],"correct":0,"why":"The lecture gives no PCV cutoff, so his weakness and tachycardia justify transfusing. The equine formula is (desired PCV minus patient PCV) divided by donor PCV, multiplied by blood volume (0.08 x BW kg): (24 minus 12)/36 x (0.08 x 450 = 36 L) = 0.333 x 36 = 12 L.","wrong":{"1":"36 L is the estimated blood volume (0.08 x 450 kg), so the PCV fraction step was skipped.","2":"24 L uses the desired PCV of 24% in the numerator without subtracting the patient's 12%.","3":"18 L divides the PCV difference by the desired PCV (24%) instead of the donor PCV (36%).","4":"1.2 L misplaces a decimal; 0.08 x 450 kg is 36 L, not 3.6 L."},"lec":"W4: Transfusion Medicine","weeks":[4],"mods":[2],"disc":"Clinical pathology","species":"Horse","type":"Calculation"},{"stem":"A 13-year-old spayed female domestic shorthair cat has 4 months of weight loss and intermittent vomiting. Abdominal ultrasound shows diffusely thickened small intestine and mildly enlarged mesenteric lymph nodes. Full-thickness intestinal biopsies taken at laparotomy show infiltration by small, mature lymphocytes, and the pathologist diagnoses low-grade (small cell) alimentary lymphoma. Which treatment fits this diagnosis?","options":["Diet change with or without prednisolone","Chlorambucil and prednisolone","Radiation therapy","Wide surgical resection","Vinblastine and prednisone"],"correct":1,"why":"Full-thickness biopsies (the preferred sample) separate small cell lymphoma from IBD, and the slides stress that the distinction changes therapy and prognosis. They contrast IBD (diet change with or without prednisolone) with small cell lymphoma (chlorambucil plus prednisolone), the slow-course form behind about 70% of feline GI lymphomas.","wrong":{"0":"Diet change with or without prednisolone is the IBD plan, and these biopsies confirmed lymphoma.","2":"Radiation therapy is recommended for solitary lymphoma such as nasal lymphoma, not diffuse intestinal disease.","3":"Wide surgical resection is the treatment listed for feline intestinal mast cell tumor, not diffuse small cell lymphoma.","4":"Vinblastine and prednisone is the post-operative protocol for high-risk canine mast cell tumors."},"lec":"W7: Lymphoma in Dogs and Cats","weeks":[7],"mods":[2],"disc":"Oncology","species":"Cat","type":"Management"},{"stem":"A 6-year-old neutered male Cocker spaniel has scooting and leaking anal sacs. Rectal exam finds thickened sacs with purulent discharge and no masses. Over 9 months he has had three sedated flush-and-infusion treatments at 2- to 4-week intervals, and his allergy and weight are being managed, yet the signs keep returning. The owner now asks about removing the sacs. Which complication should be discussed before this procedure?","options":["Facial nerve paralysis","Permanent hearing loss","Fecal incontinence","Hemorrhagic cystitis","Horner syndrome"],"correct":2,"why":"This is refractory anal sacculitis: the dog has had the expected 2-3 rounds of local flushing and infusion, and his underlying causes are being addressed. The W13 Butts, Paws, and Others lecture calls anal sacculectomy a salvage procedure for refractory cases or masses and lists its risks as fecal incontinence and rectal stricture.","wrong":{"0":"Facial nerve damage is a complication of TECA and bulla osteotomy, not anal sac surgery.","1":"Hearing impairment follows total ear canal ablation.","3":"Hemorrhagic cystitis is an adverse effect of cyclophosphamide.","4":"Horner syndrome is a risk of ear and bulla surgery."},"lec":"W13: Butts, Paws, and Others","weeks":[13],"mods":[4],"disc":"Surgery","species":"Dog","type":"Management"},{"stem":"In July, a 10-month-old beef heifer on pasture with many face flies has tearing, photophobia, and a central corneal ulcer in one eye, and two herdmates have similar signs. She is due to be sold for slaughter in 8 months. Under a valid VCPR, the owner asks to use a bottle of gentamicin eye drops left over from his horse. Which statement best describes this plan?","options":["Prohibited drug class","No withdrawal for eye drops","Withdrawal outlasts the sale","Legal with label withdrawal","Banned only in lactating dairy cows"],"correct":2,"why":"Summer onset, face flies, and a central ulcer spreading through the group point to IBK (W15 Large Animal Eye Disease). Using a horse pr
