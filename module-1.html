<style>
:root {
  --navy:#14294B; --teal:#1F7A8C; --aqua:#E8F4F6; --yellow:#F5C518; --ink:#16202E; --muted:#4F5D6E; --rule:#C9D6DD;
  --bg:#FBFCFC; --paper:#FFFFFF; --on:#FFFFFF; --red:#B8392F; --redbg:#FBECEA; --green:#2E7D4F; --greenbg:#E7F3EC;
  --serif:Caladea, Cambria, Georgia, serif; --sans:"Source Sans 3", "Segoe UI", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --navy:#A9C7E8; --teal:#62B7C8; --aqua:#1A3140; --ink:#E4EAF0; --muted:#A6B4C2; --rule:#33465C;
    --bg:#0F1826; --paper:#14202F; --on:#0F1826; --red:#F0948A; --redbg:#3A1F1E; --green:#86CDA2; --greenbg:#17301F;
  }
}
* { box-sizing:border-box; }
html { -webkit-text-size-adjust:100%; }
body { margin:0; font-family:var(--serif); color:var(--ink); background:var(--bg); font-size:17px; line-height:1.55; overflow-wrap:break-word; }
header { background:var(--bg); border-bottom:3px solid var(--navy); position:sticky; top:0; z-index:5; }
.hwrap { max-width:760px; margin:0 auto; padding:10px 16px 9px; display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; }
.kicker { font-family:var(--sans); font-size:13px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; color:var(--teal); text-decoration:none; }
header h1 { font-size:21px; margin:0; color:var(--navy); line-height:1.25; }
.timer { font-family:var(--sans); font-size:19px; font-weight:700; color:var(--navy); display:flex; align-items:center; gap:10px; font-variant-numeric:tabular-nums; }
.timer.low { color:var(--red); }
main { max-width:760px; margin:0 auto; padding:18px 16px 32px; }
section.sheet { background:var(--paper); border:1px solid var(--rule); border-radius:2px; padding:22px 24px; margin-bottom:18px; }
h2 { color:var(--navy); margin:0 0 12px; font-size:26px; line-height:1.25; }
h3 { color:var(--navy); margin:22px 0 8px; font-size:19px; padding-bottom:4px; border-bottom:1px solid var(--rule); }
p { margin:0 0 12px; }
.lead { color:var(--muted); }
button, .btn { font-family:var(--sans); font-size:16px; font-weight:600; border-radius:3px; border:1px solid var(--navy); background:var(--paper); color:var(--navy); padding:9px 16px; cursor:pointer; line-height:1.3; }
button.primary { background:var(--navy); color:var(--on); }
button.teal { background:var(--teal); border-color:var(--teal); color:var(--on); }
button:disabled { opacity:.4; cursor:default; }
button:focus-visible, input:focus-visible, summary:focus-visible { outline:3px solid var(--yellow); outline-offset:2px; }
header button { padding:5px 12px; font-size:15px; }
ol.steps { padding-left:22px; }
ol.steps li { margin-bottom:8px; }
.notice { border-left:4px solid var(--yellow); background:var(--aqua); padding:14px 16px; margin:0 0 16px; }
.notice p:last-child { margin-bottom:0; }
.agree { font-family:var(--sans); font-size:17px; font-weight:600; display:flex; align-items:center; gap:10px; margin:6px 0 4px; cursor:pointer; }
.agree input { width:22px; height:22px; margin:0; accent-color:var(--navy); }
.qhead { display:flex; justify-content:space-between; align-items:baseline; gap:6px 12px; flex-wrap:wrap; margin-bottom:12px; padding-bottom:8px; border-bottom:1px solid var(--rule); }
.qnum { color:var(--navy); font-weight:700; font-size:21px; }
.meta { font-family:var(--sans); color:var(--muted); font-size:14px; }
.stem { margin:0 0 16px; white-space:pre-wrap; }
.opt { display:flex; align-items:flex-start; gap:12px; width:100%; text-align:left; border:1px solid var(--rule); background:var(--paper); color:var(--ink); border-radius:3px; padding:10px 12px; margin-bottom:8px; font-family:var(--serif); font-weight:400; font-size:inherit; }
.opt .let { flex:0 0 30px; height:30px; border:1px solid var(--navy); border-radius:50%; color:var(--navy); font-family:var(--sans); font-weight:700; display:flex; align-items:center; justify-content:center; }
.opt.sel { border-color:var(--navy); background:var(--aqua); box-shadow:inset 3px 0 0 var(--navy); }
.opt.sel .let { background:var(--navy); color:var(--on); }
.opt.correct { border-color:var(--green); background:var(--greenbg); }
.opt.correct .let { background:var(--green); border-color:var(--green); color:var(--on); }
.opt.wrongpick { border-color:var(--red); background:var(--redbg); }
.opt.wrongpick .let { background:var(--red); border-color:var(--red); color:var(--on); }
.opt .txt { padding-top:2px; min-width:0; }
.navrow { display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; margin-top:16px; }
.flagbtn.on { background:var(--yellow); border-color:var(--yellow); color:#16202E; }
.grid { display:grid; grid-template-columns:repeat(10, minmax(0, 1fr)); gap:5px; }
.grid button { padding:6px 0; font-size:14px; position:relative; font-weight:600; min-width:0; }
.grid button.ans { background:var(--aqua); }
.grid button.cur { outline:3px solid var(--teal); outline-offset:1px; }
.grid button.flg::after { content:""; position:absolute; top:3px; right:3px; width:8px; height:8px; border-radius:50%; background:var(--yellow); border:1px solid #8A6D00; }
.grid button.r-ok { background:var(--greenbg); border-color:var(--green); color:var(--green); }
.grid button.r-bad { background:var(--redbg); border-color:var(--red); color:var(--red); }
.legend { font-family:var(--sans); font-size:14px; color:var(--muted); margin-top:8px; }
.legend span { display:inline-block; width:10px; height:10px; border-radius:50%; background:var(--yellow); border:1px solid #8A6D00; margin:0 4px 0 10px; }
.big { font-size:42px; font-weight:700; color:var(--navy); line-height:1.2; margin-bottom:6px; }
table { table-layout:fixed; border-collapse:collapse; width:100%; font-size:16px; margin-bottom:10px; }
th { font-family:var(--sans); font-size:14px; text-transform:uppercase; letter-spacing:.04em; color:var(--navy); text-align:left; padding:6px 8px; border-bottom:2px solid var(--navy); }
td { border-bottom:1px solid var(--rule); padding:7px 8px; vertical-align:top; }
td.num, th.num { text-align:right; white-space:nowrap; font-variant-numeric:tabular-nums; }
th.c1 { width:52%; } th.c2 { width:18%; } th.c3 { width:12%; } th.c4 { width:18%; }
tr.low td { background:var(--redbg); }
tr.low td:first-child { box-shadow:inset 4px 0 0 var(--red); }
tr.strong td { background:var(--greenbg); }
tr.tip td { background:var(--redbg); color:var(--red); font-family:var(--sans); font-weight:700; font-size:15px; padding-top:0; }
tr.tip td:first-child { box-shadow:inset 4px 0 0 var(--red); }
.bar { height:8px; background:var(--aqua); border:1px solid var(--rule); overflow:hidden; margin-top:7px; }
.bar i { display:block; height:100%; background:var(--teal); }
tr.low .bar i { background:var(--red); }
tr.strong .bar i { background:var(--green); }
.callout { border:1px solid var(--red); background:var(--redbg); padding:12px 14px; margin:12px 0; }
.callout b { color:var(--red); }
.callout.ok { border-color:var(--green); background:var(--greenbg); }
.callout.ok b { color:var(--green); }
details.wk { border-bottom:1px solid var(--rule); padding:6px 0; }
details.wk summary { cursor:pointer; font-family:var(--sans); font-weight:700; color:var(--navy); font-size:16px; padding:4px 0; }
details.wk summary .s { font-weight:400; color:var(--muted); }
details.wk.low summary { color:var(--red); }
details.wk table { margin-top:6px; }
.why { background:var(--aqua); border-left:4px solid var(--navy); padding:12px 14px; margin-top:14px; }
.why b { color:var(--navy); }
.pick { border:1px solid var(--red); border-left-width:4px; padding:12px 14px; margin-top:10px; }
details.others { margin-top:12px; }
details.others summary { cursor:pointer; font-family:var(--sans); font-weight:600; color:var(--navy); }
.pill { display:inline-block; font-family:var(--sans); border:1px solid var(--teal); color:var(--teal); border-radius:2px; padding:1px 8px; font-size:14px; font-weight:600; }
.chk { font-family:var(--sans); font-size:15px; display:flex; align-items:center; gap:8px; }
.modal { position:fixed; inset:0; background:rgba(15,24,38,.6); display:flex; align-items:center; justify-content:center; padding:16px; z-index:10; }
.modal section.sheet { max-width:480px; width:100%; margin:0; }
.hidden { display:none !important; }
footer { max-width:760px; margin:0 auto; text-align:center; color:var(--muted); font-size:14px; padding:14px 16px 28px; border-top:1px solid var(--rule); }
.paused { text-align:center; padding:44px 20px; }
@media (max-width:600px) {
  body { font-size:16px; }
  .grid { grid-template-columns:repeat(5, minmax(0, 1fr)); }
  h2 { font-size:22px; }
  .big { font-size:34px; }
  section.sheet { padding:16px 14px; }
  .navrow button { flex:1 1 40%; }
  header h1 { font-size:18px; }
  th.c1 { width:56%; } th.c2 { width:26%; } th.c3 { width:18%; }
  th.c4, td.c4 { display:none; }
  table { font-size:15px; }
}
@media print {
  header { position:static; }
  .navrow, .grid, .legend, .timer { display:none !important; }
}
</style>

<script>
var CFG = {"id":"m1","title":"Module 1 Practice Exam: Systems 4 FCM","intro":"60 questions from Weeks 1-3, built from the Systems 4 FCM lecture slides. 90 minutes: 3 blocks of 20, about 30 minutes each.","minutes":90,"block":20,"final":false,"xnote":"Some questions combine material from two or more weeks. They count toward every week they draw on.","submitNote":"You will see your score by week and by lecture, then review every question with explanations."};
var QS = [{"stem":"A 6-year-old neutered male Labrador retriever (34 kg) receives dexmedetomidine and methadone IM before a dental procedure. At 10 minutes his heart rate is 48 beats/min and mean arterial pressure (MAP) is 128 mmHg with pale pink mucous membranes. At 45 minutes, before induction, heart rate is 44 beats/min and MAP is 82 mmHg. Which mechanism best explains the bradycardia at 45 minutes?","options":["Reduced central sympathetic tone","Baroreceptor reflex to hypertension","Peripheral vasoconstriction","Direct myocardial depression","Opioid vagal stimulation alone"],"correct":0,"why":"By 45 minutes the MAP has returned to normal, so the early hypertension is gone but the bradycardia persists. That pattern is phase II of the alpha-2 response, a presynaptic central effect that lowers sympathetic tone. The lecture separates this from phase I, about 20 minutes of vasoconstriction, hypertension, and reflex bradycardia.","wrong":{"1":"This is the phase I mechanism, which fit the 10-minute values when MAP was 128 mmHg.","2":"Vasoconstriction belongs to phase I and does not explain a slow rate with a normal MAP.","3":"The lecture explains alpha-2 bradycardia through the two phases, not myocardial depression.","4":"The lecture attributes this two-phase pattern to the alpha-2 agonist, not the opioid."},"lec":"W1: Anesthesia Planning","weeks":[1],"mods":[1]},{"stem":"A dairy farmer asks why the veterinarian prefers a standing flank laparotomy over a ventral approach for exploring her cow's abdomen. Using data from the surgical approaches lecture, which complication is much more common with the ventral approach in cattle?","options":["Incisional infection","Abdominal hernia","Intraoperative hemorrhage","Delayed wound contracture","Nerve paralysis"],"correct":0,"why":"The lecture reports incisional infection in cattle at 35.7% with a ventral abdominal approach versus 2.4-5% with a flank approach. That large difference is a key reason flank approaches are preferred when possible.","wrong":{"1":"The lecture's comparison is about infection, not hernia.","2":"Hemorrhage is not the comparison the lecture gives.","3":"Contracture is a wound-healing issue, not an approach complication in cattle.","4":"Nerve injury is a recumbency risk, not the stated comparison."},"lec":"W3: Surgical Approaches","weeks":[3],"mods":[1]},{"stem":"A 7-year-old spayed female dog with diabetes mellitus has stranguria. Abdominal radiographs show a gas lucency outlining the bladder wall. The dog has not been catheterized and no cystocentesis has been done. What is the most likely finding?","options":["Bladder rupture","Cystic calculi","Gas from catheterization","Emphysematous cystitis","Emphysematous pyelitis"],"correct":3,"why":"Gas outlining the bladder wall in a diabetic dog that has not had a procedure fits emphysematous cystitis, which the abdominal radiographs II lecture shows in a diabetic dog.","wrong":{"0":"Rupture causes loss of abdominal detail and free fluid, not a gas outline of the wall.","1":"Calculi are mineral opacities, not gas outlines.","2":"No catheterization or cystocentesis was done.","4":"Pyelitis puts gas in the renal pelvis, not the bladder wall."},"lec":"W3: Abdominal Radiographs II","weeks":[3],"mods":[1]},{"stem":"A 5-year-old spayed female boxer is breathing spontaneously on isoflurane in 100% oxygen during a 90-minute mass removal. Arterial blood gas: pH 7.26 (7.35-7.45), PaCO2 62 mmHg (35-45), base excess -1 mEq/L (-4 to +4), PaO2 410 mmHg. Which interpretation fits these values?","options":["Metabolic acidosis","Respiratory acidosis","Mixed acidosis","Respiratory alkalosis","Compensated metabolic alkalosis"],"correct":1,"why":"The pH is low and the PaCO2 is above 45 mmHg, so the acidosis is respiratory, consistent with inhalant-induced hypoventilation. The base excess stays within -4 to +4, so there is no metabolic component. PaO2 is high because she is on 100% oxygen.","wrong":{"0":"A metabolic acidosis requires a base excess below -4; this one is normal.","2":"A mixed picture needs both a high PaCO2 and a low base excess.","3":"Alkalosis requires a high pH and, if respiratory, a low PaCO2.","4":"Base excess is normal and pH is low, so there is no metabolic alkalosis."},"lec":"W1: Anesthesia Monitoring","weeks":[1],"mods":[1]},{"stem":"A 4-year-old Labrador retriever in stage 2 labor with a nonviable fetal heart rate on ultrasound is brought in for cesarean section. She last ate 12 hours ago. Which airway plan is most appropriate at induction?","options":["Mask induction with isoflurane","Supraglottic airway device","Delayed intubation after prep","Prompt cuffed intubation","Uncuffed tube to limit trauma"],"correct":3,"why":"The life stages lecture warns of regurgitation risk in pregnancy and says to treat a pregnant patient as not fasted, whatever the time since her last meal. The airway must be secured quickly with a cuffed tube to protect against aspiration.","wrong":{"0":"Mask induction leaves the airway unprotected in a patient at risk of regurgitation.","1":"A supraglottic device does not enter the trachea, so it cannot seal against aspiration.","2":"Any delay leaves the airway unprotected in a patient treated as not fasted.","4":"An uncuffed tube does not seal the trachea against aspiration."},"lec":"W1: Physiological Life Stages","weeks":[1],"mods":[1]},{"stem":"Dental radiographs of a 3-year-old dog show 2 maxillary molars and 3 mandibular molars on each side. There are no retained deciduous teeth and no periapical changes. How should the molar count be interpreted?","options":["Normal canine dentition","Missing maxillary molar","Supernumerary mandibular molar","Retained deciduous molar","Feline-pattern dentition"],"correct":0,"why":"The lecture's normal dental formula for dogs gives 2 maxillary and 3 mandibular molars per side. This dog matches it.","wrong":{"1":"Two maxillary molars is normal for dogs.","2":"Three mandibular molars is normal for dogs.","3":"No deciduous teeth remain.","4":"The lecture gives cats 1 maxillary molar per side."},"lec":"W3: MSK Joints, Skull, Spine","weeks":[3],"mods":[1]},{"stem":"A JSAL dog has patchy alopecia and greasy, erythematous skin. After skin scrapes and tape cytology, the dog is bathed with KetoHex shampoo. How long should the shampoo stay on the skin before rinsing?","options":["1 minute","10 minutes","5 minutes","30 minutes","Rinse immediately"],"correct":1,"why":"The JSAL session states that KetoHex must be lathered and then allowed to sit for 10 minutes.","wrong":{"0":"One minute is too short for the active ingredients to work.","2":"Five minutes is half the stated contact time.","3":"Thirty minutes exceeds the stated contact time.","4":"Rinsing right away removes the product before it can work."},"lec":"W2: JSAL and FCM Skills","weeks":[2],"mods":[1]},{"stem":"At extubation after castration, Bashful (2.5 kg cat) suddenly develops inspiratory stridor and labored breathing. SpO2 falls from 98% to 88%. Which complication did the CBL list as a feline risk at intubation and extubation?","options":["Laryngospasm","Bronchospasm","Hypothermia","Fluid overload","Catecholamine arrhythmia"],"correct":0,"why":"The Bashful CBL lists cats as prone to laryngospasm during intubation and extubation. Stridor and desaturation at the moment of extubation fit that risk.","wrong":{"1":"The CBL names laryngospasm, not bronchospasm, as the feline airway risk at extubation.","2":"The CBL lists hypothermia as a size-related risk, but it does not cause stridor at extubation.","3":"Fluid overload is a size-related risk in the CBL, but it does not cause sudden stridor at extubation.","4":"Stress-related arrhythmia is a CBL risk, but it does not cause stridor."},"lec":"W2: CBL Bashful","weeks":[2],"mods":[1]},{"stem":"A trainer asks whether a 2-year-old Thoroughbred colt can be castrated standing at the barn instead of under general anesthesia. Which advantage of standing castration does the equine anesthesia lecture also stress?","options":["No induction or recovery","Lower eventration risk","Lower hemorrhage risk","Lower infection risk","Greater safety for the operator"],"correct":0,"why":"The equine anesthesia lecture prefers standing sedation whenever possible because it avoids the risks of induction and recovery and has lower morbidity and mortality (Week 2). The castration CBL lists standing castration as quick, while recumbent castration requires general anesthesia (Week 3).","wrong":{"1":"The CBL lists reduced eventration risk as an advantage of recumbent castration.","2":"The CBL lists reduced hemorrhage, with ligation, as a recumbent advantage.","3":"The CBL lists infection as a disadvantage of standing castration.","4":"The CBL lists danger to the operator as a disadvantage of standing castration."},"lec":"Integration W2+W3: Standing castration","weeks":[2,3],"mods":[1]},{"stem":"A 9-week-old Labrador puppy (5 kg) is anesthetized to repair a jaw fracture. He receives methadone and a local block, and his blood glucose is supported with 2.5% dextrose in LRS. The surgeon asks for meloxicam at discharge, but the anesthetist declines. What is the reason?","options":["Weight below 10 kg","Concurrent dextrose infusion","Age below 12 weeks","Recent methadone dose","Immature blood-brain barrier"],"correct":2,"why":"The life stages lecture states NSAIDs should not be used in patients younger than 12 weeks. At 9 weeks this puppy falls below that cutoff, so analgesia relies on opioids and local anesthesia.","wrong":{"0":"Weight is not the lecture's limit for NSAIDs in young patients.","1":"The lecture's NSAID limit is age, not the fluid choice.","3":"The lecture's NSAID limit is age, not a recent opioid dose.","4":"This is not the reason the lecture gives for avoiding NSAIDs in puppies."},"lec":"W1: Physiological Life Stages","weeks":[1],"mods":[1]},{"stem":"Bashful, a 7-month-old intact male cat (2.5 kg), is scheduled for castration at 9 a.m. He is eating normally and has normal glucose. The owner asks when to remove his food. What fasting time does the CBL recommend for cats?","options":["1-2 hours","4-6 hours","No fasting","12 hours","8-12 hours"],"correct":1,"why":"The Bashful CBL gives 4-6 hours as the recommended fasting time for cats. At 7 months Bashful is past the pediatric age where shorter or no fasting is used.","wrong":{"0":"Short fasting of 1-2 hours applies to pediatric patients over 6 weeks.","2":"No fasting applies to very young patients under 6 weeks.","3":"Twelve hours is longer than the CBL recommendation for cats.","4":"This range exceeds the CBL recommendation for cats."},"lec":"W2: CBL Bashful","weeks":[2],"mods":[1]},{"stem":"A 3-year-old dog has a large skin loss wound across the flexor surface of the carpus from a car accident. It is managed by second intention healing. Six weeks later the wound is closed, but the dog cannot fully extend the carpus. Which complication explains this?","options":["Exuberant granulation","Incisional dehiscence","Chronic seroma","Epithelial overgrowth","Wound contracture"],"correct":4,"why":"The wound lecture lists contracture as a complication of second intention healing and warns that it can impair the affected joint's ability to move. A wound across the flexor surface of the carpus fits that pattern.","wrong":{"0":"Proud flesh is the horse complication and protrudes above the skin.","1":"Dehiscence is separation of a sutured wound; this one healed open.","2":"A seroma is a fluid pocket and does not limit joint motion.","3":"The wound has closed, and overgrowth would not limit joint motion."},"lec":"W3: Wound Management","weeks":[3],"mods":[1]},{"stem":"On a lateral thoracolumbar radiograph of a dog with back pain, you need to count vertebrae to localize a narrowed disc space. The vertebra whose dorsal spinous process stands perpendicular to the spine is identified. Which vertebra is this landmark most commonly?","options":["T13","T11","L1","T7","The last rib-bearing vertebra"],"correct":1,"why":"The joints, skull, and spine lecture names the anticlinal vertebra as T11 (T10 or T11) and uses it to count vertebral bodies. T10-11 can be normally narrowed, so a narrowed space there must be read carefully.","wrong":{"0":"T13 is the last thoracic vertebra, not the anticlinal one.","2":"L1 is the first lumbar vertebra.","3":"T7 is too cranial.","4":"The last rib-bearing vertebra is T13."},"lec":"W3: MSK Joints, Skull, Spine","weeks":[3],"mods":[1]},{"stem":"A surgeon preps a dog's abdomen with three cycles of povidone-iodine scrub, then rinses each cycle with 70% isopropyl alcohol. A colleague points out a problem with this combination. Which concern did the lecture raise?","options":["Loss of 6-hour residual activity","Contact dermatitis risk","Reduced iodophor efficacy","Too few scrub cycles","Inactivation by organic debris"],"correct":2,"why":"The asepsis lecture states that combining povidone-iodine with alcohol is not recommended because the alcohol decreases the efficacy of the povidone-iodine. Three cycles meets the minimum the lecture gives.","wrong":{"0":"The 6-hour residual activity belongs to chlorhexidine, not povidone-iodine.","1":"This was not the concern the lecture raised for this combination.","3":"The lecture calls for a minimum of 3 cycles, which was met.","4":"This was not the problem the lecture raised for this combination."},"lec":"W2: Surgical Asepsis","weeks":[2],"mods":[1]},{"stem":"A 10-year-old dog with known right-sided heart failure and ascites has an abdominal ultrasound. The liver is enlarged with diffusely reduced echogenicity compared with a normal liver. Which differential best fits this pattern?","options":["Passive congestion","Hepatic lipidosis","Hepatic lymphoma","Hepatic cirrhosis","Normal hepatic parenchyma"],"correct":0,"why":"The ultrasound lecture lists acute hepatitis and passive congestion as causes of a diffusely hypoechoic liver. Right-sided heart failure makes passive congestion the best fit.","wrong":{"1":"The lecture lists lipidosis under diffuse hyperechogenicity.","2":"The lecture lists lymphoma under diffuse hyperechogenicity.","3":"The lecture lists cirrhosis under diffuse hyperechogenicity.","4":"A normal liver is uniformly hypoechoic to the spleen, but it is not enlarged or darker than normal."},"lec":"W3: Abdominal Ultrasound","weeks":[3],"mods":[1]},{"stem":"A 7-year-old dog has a large, deep subcutaneous pocket over the dorsal lumbar region after a mass excision. A ventral exit is not possible, and the surgeon wants to measure fluid output during recovery. Which drain best fits?","options":["Penrose drain","Jackson-Pratt drain","Fenestrated Penrose","Wet-to-dry bandage","Open wound management"],"correct":1,"why":"A Penrose drain relies on passive gravity flow and needs a dependent exit. The wound lecture describes the Jackson-Pratt as an active drain that creates negative pressure in a bulb, drains subcutaneous or deeper spaces, and lets you measure fluid.","wrong":{"0":"A Penrose relies on gravity and drains poorly without a ventral exit.","2":"The lecture says a Penrose should never be fenestrated.","3":"A bandage does not drain a closed deep pocket.","4":"This incision is closed; open management is for contaminated or infected wounds."},"lec":"W3: Wound Management","weeks":[3],"mods":[1]},{"stem":"On a lateral abdominal radiograph of a 10-year-old dog, the caudal border of the left kidney cannot be separated from an adjacent soft tissue mass of the same opacity. The two structures are in direct contact. Which radiographic principle explains why the border disappears?","options":["Summation sign","Border effacement","Mach band effect","Magnification","Superimposition artifact"],"correct":1,"why":"Two structures of the same opacity that touch lose their shared border; the lecture calls this the silhouette sign or border effacement. It shows the mass contacts the kidney, which helps localize it.","wrong":{"0":"The lecture uses border effacement, not summation, for touching structures of the same opacity.","2":"The lecture uses border effacement, not a Mach effect, for touching structures of the same opacity.","3":"Magnification changes apparent size; it does not erase a shared border.","4":"The lecture uses border effacement, not superimposition, for structures in direct contact."},"lec":"W2: Abdominal Radiographs I","weeks":[2],"mods":[1]},{"stem":"A 25 kg dog with a PCV of 26% and a recent history of blood loss is anesthetized. MAP is 78 mmHg breathing spontaneously. The mechanical ventilator is started, and within 3 minutes MAP falls to 55 mmHg and heart rate rises. The vaporizer setting has not changed. What best explains the hypotension?","options":["Isoflurane vasodilation","Low inspired oxygen","Vagal reflex activation","Exhausted CO2 absorbent","Reduced venous return"],"correct":4,"why":"The mechanical ventilation lecture lists decreased venous return and preload, leading to hypotension, as a key complication of positive pressure ventilation. The timing, right after the ventilator started, and the recent blood loss point to this cause.","wrong":{"0":"The vaporizer was unchanged and MAP was stable before ventilation began.","1":"Inspired oxygen does not change when the ventilator starts.","2":"A vagal reflex would lower heart rate, but heart rate rose.","3":"An exhausted absorbent does not explain a sudden pressure drop tied to starting IPPV."},"lec":"W1: Mechanical Ventilation","weeks":[1],"mods":[1]},{"stem":"A new technician tries to connect an E-cylinder of nitrous oxide to the oxygen hanger yoke of an anesthesia machine. The cylinder will not seat no matter how it is turned. Which design feature prevented the connection?","options":["First-stage pressure regulator","Oxygen flush valve","Pin Index Safety System","Flowmeter control knob","Cylinder pressure gauge"],"correct":2,"why":"The equipment lecture describes the Pin Index Safety System, which keys each gas cylinder to its own yoke. A nitrous oxide cylinder cannot seat on an oxygen yoke, so the wrong gas cannot be connected.","wrong":{"0":"The regulator lowers cylinder pressure from about 2000 psi to about 50 psi; it does not key cylinders to yokes.","1":"The flush valve delivers oxygen at 35-75 L/min; it plays no part in mounting a cylinder.","3":"The flowmeter sets fresh gas flow downstream; it cannot stop a cylinder from seating.","4":"A gauge shows cylinder pressure; it cannot block a connection."},"lec":"W1: Anesthesia Equipment","weeks":[1],"mods":[1]},{"stem":"Bashful (2.5 kg cat) is induced with alfaxalone at 2 mg/kg (10 mg/mL). Following the induction lecture, the full calculated dose is drawn up and given to effect in quarter increments. What volume is the first increment?","options":["0.13 mL","0.5 mL","0.25 mL","1.25 mL","0.031 mL"],"correct":0,"why":"Bashful's dose is 2.5 kg × 2 mg/kg = 5 mg, which is 0.5 mL of a 10 mg/mL solution (Week 2 CBL weight). Giving to effect in quarters means a first increment of 0.5 ÷ 4 = 0.125 mL, rounded to 0.13 mL (Week 1).","wrong":{"1":"This is the full calculated dose, not the first increment.","2":"This is half the dose.","3":"This is a decimal error in the dose calculation.","4":"This divides the increment by 4 a second time."},"lec":"Integration W1+W2: Bashful induction","weeks":[1,2],"mods":[1]},{"stem":"Dopey, a 1-year-old New Zealand rabbit (3.5 kg), is maintained under anesthesia for castration. No fluid pump is available. Using the CBL fluid rate for rabbits and a 60 drops/mL infusion set, what drip rate should be set?","options":["1 drop every 3.4 s","1 drop every 8.6 s","1 drop every 5.7 s","1 drop every 22.9 s","1 drop every 20 s"],"correct":2,"why":"Rabbits receive 3 mL/kg/h, so 3.5 kg × 3 = 10.5 mL/h. With a 60 drops/mL set that is 630 drops/h, or 0.175 drops/s, which is 1 drop every 5.7 seconds.","wrong":{"0":"This uses the dog rate of 5 mL/kg/h.","1":"This uses 2 mL/kg/h, below the rabbit rate.","3":"This uses a 15 drops/mL set, which is for medium-large dogs and horses.","4":"This uses 3 mL/h total without multiplying by body weight."},"lec":"W1: CBL Anesthesia Cases","weeks":[1],"mods":[1]},{"stem":"A 10-day-old lamb (6 kg) is presented for castration by elastic band. Both testes are descended, and the ewe was vaccinated before lambing. On palpation there is a soft, reducible swelling at the neck of the scrotum. Which finding makes banding unsafe?","options":["Age under 3 weeks","Scrotal hernia","Body weight of 6 kg","Both testes descended","Recent ewe vaccination"],"correct":1,"why":"A reducible swelling at the scrotal neck suggests a hernia. The castration CBL warns that banding over a hernia can trap intestines, causing intestinal necrosis. Age under 3 weeks is the correct window for banding.","wrong":{"0":"Banding is indicated in lambs under 3 weeks old.","2":"Weight is not a contraindication to banding at this age.","3":"Descended testes are required for banding.","4":"Ewe vaccination helps protect against tetanus."},"lec":"W3: CBL Castration","weeks":[3],"mods":[1]},{"stem":"A 4-month-old gilt (45 kg) receives azaperone 3 mg/kg deep IM in the neck using a 1.5-inch needle. Five minutes later staff move her to the prep area and place an ear catheter, but she struggles and is only lightly sedated. Which most likely explains the poor sedation?","options":["Azaperone dose too low","Injection into fat","Need for IV ketamine","Breed resistance","Handling before onset"],"correct":4,"why":"The pig lecture states azaperone takes about 20 minutes to work and the pig should be left undisturbed during that time. Stimulating her at 5 minutes undermines the sedation. The dose of 3 mg/kg sits inside the 0.5-5 mg/kg range, and a 1.5-inch needle in the neck reaches muscle.","wrong":{"0":"3 mg/kg is within the lecture's 0.5-5 mg/kg range.","1":"A 1.5-inch needle placed deep in the neck reaches muscle.","2":"Ketamine is added for deeper sedation, but the problem here is handling too early.","3":"The lecture does not describe breed resistance to azaperone."},"lec":"W2: Pig Anesthesia","weeks":[2],"mods":[1]},{"stem":"A 12-year-old spayed female miniature schnauzer has polyuria and a pot belly. On abdominal radiographs the gastric axis appears normal, but the liver extends well beyond the costal arch. What is the radiographic finding?","options":["Splenomegaly","Microhepatia","Gastric distension","Pancreatitis","Hepatomegaly"],"correct":4,"why":"The abdominal radiographs I lecture warns that in hepatomegaly the gastric axis may still be normal while the liver extends beyond the costal arch, and that more testing is needed. A normal gastric axis does not rule out an enlarged liver.","wrong":{"0":"The finding is liver extending past the costal arch, not the spleen.","1":"A small liver would not extend beyond the costal arch.","2":"The stomach itself is not described as distended.","3":"The lecture's pancreatitis signs are loss of detail in the right cranial abdomen, not liver past the costal arch."},"lec":"W2: Abdominal Radiographs I","weeks":[2],"mods":[1]},{"stem":"A 3-year-old dog that swims in farm ponds has vomiting and azotemia. Ultrasound shows enlarged kidneys that are diffusely hyperechoic, with reduced corticomedullary distinction. No medullary rim sign is seen. Which differential is listed for this pattern?","options":["Leptospirosis","Ethylene glycol toxicity","Renal neoplasia","Hydronephrosis","Polycystic disease"],"correct":0,"why":"The ultrasound lecture pairs renomegaly, diffuse hyperechogenicity, and reduced corticomedullary distinction with leptospirosis or acute interstitial nephritis. Pond exposure supports this differential.","wrong":{"1":"The lecture shows ethylene glycol with a hyperechoic cortex and a medullary rim sign.","2":"The lecture shows renal neoplasia as a mass, with FNA needed to tell it from infiltrative disease.","3":"Hydronephrosis shows a dilated renal pelvis.","4":"Polycystic kidneys show multiple anechoic cysts."},"lec":"W3: Abdominal Ultrasound","weeks":[3],"mods":[1]},{"stem":"A producer castrates 2-week-old piglets with an open scrotal technique. The veterinarian wants local anesthesia that blocks the testis and cord before incision without general anesthesia. Which technique fits the pig lecture?","options":["Intratesticular lidocaine","Lumbosacral epidural","Isoflurane by mask","Azaperone alone","Intramuscular xylazine alone"],"correct":0,"why":"The castration CBL places routine piglet castration at about 2 weeks of age using a scrotal technique (Week 3). The pig anesthesia lecture lists an intra-testicular block with lidocaine 2% or procaine 4% for castration (Week 2).","wrong":{"1":"An epidural is not the block the lecture lists for castration.","2":"Mask isoflurane is general anesthesia, which the veterinarian wants to avoid.","3":"Azaperone sedates but gives no local analgesia.","4":"Xylazine sedates but does not block the testis and cord."},"lec":"Integration W2+W3: Piglet castration","weeks":[2,3],"mods":[1]},{"stem":"A 9-year-old dog has a large liver mass seen on CT. Ventral midline exposure is not enough, so the surgeon plans to extend the incision cranially into a caudal median sternotomy. Which requirement does this extension add?","options":["Epidural anesthesia","Lateral recumbency","Nasogastric decompression","Assisted ventilation","Urinary catheterization"],"correct":3,"why":"Extending into the sternum gives better exposure of the cranial abdomen, including liver and diaphragm, but it opens the pleural cavity. The surgical approaches lecture states assisted ventilation is then required, along with sternal closure and thoracic drainage.","wrong":{"0":"Epidural anesthesia may help analgesia but is not required by the approach.","1":"The approach is done in dorsal recumbency.","2":"Gastric decompression is not a stated requirement of this extension.","4":"A urinary catheter is helpful but is not what the extension requires."},"lec":"W3: Surgical Approaches","weeks":[3],"mods":[1]},{"stem":"A new graduate calculates a single endotracheal tube size for a 22 kg mixed-breed dog using a body weight formula and prepares only that tube. During induction, the tube does not pass the larynx and the dog becomes apneic. Which preparation step would have prevented the delay?","options":["A body weight chart lookup","Nasal septum width estimate","Three tube sizes ready","The largest tube available","Tracheal palpation alone"],"correct":2,"why":"Tube size estimates are inaccurate; the lecture cites accuracy as low as 46% and 21% for common methods. Because no estimate is reliable, the lecture recommends preparing three tube sizes before induction.","wrong":{"0":"A chart is still an estimate and shares the same low accuracy.","1":"Septum width is another estimate with limited accuracy.","3":"Choosing one tube, even a large one, still leaves no backup size.","4":"Palpation is an estimate and still leaves only one tube ready."},"lec":"W1: Airway Devices","weeks":[1],"mods":[1]},{"stem":"A 40 kg dog in dorsal recumbency for a 3-hour orthopedic procedure has SpO2 90% on 100% oxygen. ETCO2 is 41 mmHg and PaCO2 is 45 mmHg. PaO2 is 68 mmHg. Increasing the vaporizer setting has no effect on SpO2. Which ventilation-perfusion problem best explains the hypoxemia?","options":["Alveolar dead space","Hypoventilation","Low inspired oxygen","Intrapulmonary shunt","Impaired gas diffusion"],"correct":3,"why":"PaO2 is far below the expected value on 100% oxygen while ETCO2 and PaCO2 are normal, so overall ventilation is adequate. Perfused areas of lung that receive no ventilation have a V/Q of 0, which the monitoring lecture defines as shunt.","wrong":{"0":"The lecture defines dead space as a V/Q of infinity, ventilated but not perfused, which does not explain low PaO2 with normal CO2.","1":"Hypoventilation raises PaCO2 above 45 mmHg, and it is not raised here.","2":"The dog is breathing 100% oxygen, so inspired oxygen is not low.","4":"Diffusion is not the V/Q problem the lecture uses to explain this pattern."},"lec":"W1: Anesthesia Monitoring","weeks":[1],"mods":[1]},{"stem":"Bashful, a 7-month-old domestic shorthair cat, is being prepared for castration. His recorded weight is 2.5 kg. Which breathing system does the anesthesia CBL recommend for a patient of his size?","options":["Rebreathing circle system","Mask with rebreathing bag","Supraglottic device only","Ventilator with circle system","Non-rebreathing system"],"correct":4,"why":"Bashful's record gives his weight as 2.5 kg (Week 2 CBL). The Week 1 anesthesia CBL recommends non-rebreathing systems for patients under 7 kg, because rebreathing systems resist ventilation in small patients.","wrong":{"0":"Rebreathing systems are for patients over 7 kg because of their resistance to ventilation.","1":"A mask does not change the weight-based breathing system choice.","2":"A supraglottic device is an airway, not a breathing system.","3":"A circle system is a rebreathing system, meant for patients over 7 kg."},"lec":"Integration W1+W2: Bashful breathing system","weeks":[1,2],"mods":[1]},{"stem":"A 6-year-old dog arrests during anesthesia. CPR begins: compressions at 110/min in 2-minute cycles and intubated ventilation at 10 breaths/min. During compressions ETCO2 is steady at 24 mmHg. At the pulse check there is no palpable pulse and ECG shows asystole. What does the ETCO2 value indicate?","options":["Return of spontaneous circulation","Excessive ventilation rate","Esophageal intubation","Adequate compression quality","Need for defibrillation"],"correct":3,"why":"ETCO2 during CPR reflects how much blood the compressions move through the lungs. The complications lecture uses an ETCO2 above 18 mmHg as a marker of effective CPR. The absent pulse and asystole show circulation has not returned, so compressions continue.","wrong":{"0":"ROSC would bring a pulse and an organized rhythm, not asystole.","1":"Over-ventilation lowers ETCO2; it would not explain an adequate value.","2":"A misplaced tube would not give a steady ETCO2 of 24 mmHg during compressions.","4":"Asystole is not a shockable rhythm."},"lec":"W1: Anesthetic Complications","weeks":[1],"mods":[1]},{"stem":"A 9-year-old Rottweiler has a 3-week lameness. Radiographs of the distal radius show a lytic lesion with rapid, progressive changes, cortical destruction, and irregular new bone production. What is the most appropriate next diagnostic step?","options":["Serial radiographs in 4 weeks","Empirical antifungal therapy","Immediate limb amputation","Joint fluid cytology","Bone aspirate or biopsy"],"correct":4,"why":"These features fit an aggressive lesion. The bone lecture lists neoplasia, fungal disease, and bacterial osteomyelitis as causes and stresses that diagnosis always needs cytology or histopathology of the lesion.","wrong":{"0":"Waiting 4 weeks delays the cytology or histopathology the lecture requires.","1":"Antifungals before a diagnosis treat only one differential.","2":"Amputation before a diagnosis skips the required cytology or histopathology.","3":"The lesion is in the bone, so joint fluid does not sample it."},"lec":"W3: MSK Bone and Fractures","weeks":[3],"mods":[1]},{"stem":"A veterinarian reviews five patients scheduled for sedation this morning and wants to use dexmedetomidine in the premedication of only one. All have normal temperament. Which patient is the most appropriate candidate?","options":["Healthy 4-year-old dog","8-week-old puppy","Dog with mitral valve disease","Cat with diabetes mellitus","Male cat with urethral obstruction"],"correct":0,"why":"The anesthesia planning lecture lists cautions for alpha-2 agonists: pediatric patients, dogs with mitral valve disease or dilated cardiomyopathy, blocked cats, and diabetic patients. Only the healthy adult dog has none of these.","wrong":{"1":"Pediatric patients are on the lecture's caution list for alpha-2 agonists.","2":"Mitral valve disease is on the lecture's caution list for alpha-2 agonists.","3":"Diabetic patients are on the lecture's caution list for alpha-2 agonists.","4":"Blocked cats are on the lecture's caution list for alpha-2 agonists."},"lec":"W1: Anesthesia Planning","weeks":[1],"mods":[1]},{"stem":"A 5-year-old Holstein cow has a standing right flank laparotomy. The surgeon closes the muscle layers and asks which material to use for the skin, which will be closed with a Ford interlocking pattern. Which suture material fits?","options":["Braided silk","Heavy monofilament","Braided polyglactin 910","Plain gut","Chromic gut"],"correct":1,"why":"The surgical approaches lecture closes flank skin with a Ford interlocking pattern in heavy monofilament, removed in 2-3 weeks (Week 3). The suture lecture explains that braided materials wick bacteria and carry a higher infection risk (Week 2).","wrong":{"0":"Silk is braided, and the suture lecture links braided suture to wicking and infection.","2":"Polyglactin 910 is braided, and the suture lecture says to avoid it in infected fields.","3":"Plain gut loses all strength by 10 days, too soon for skin removed at 2-3 weeks.","4":"Chromic gut is absorbable, and the lecture closes flank skin with monofilament removed at 2-3 weeks."},"lec":"Integration W2+W3: Cow flank closure","weeks":[2,3],"mods":[1]},{"stem":"A 9-year-old Warmblood gelding (550 kg) is anesthetized for arthroscopy. Ten minutes after positioning, systolic arterial pressure falls from 105 to 86 mmHg. Heart rate, isoflurane setting, and ETCO2 are unchanged. The only new event was an IV drug given 5 minutes earlier. Which drug most likely caused the drop?","options":["IV butorphanol","IV detomidine","IV sodium penicillin","IV ketamine","IV midazolam bolus dose"],"correct":2,"why":"The equine lecture warns that sodium penicillin can lower systolic pressure by 15-20 mmHg in anesthetized horses, which matches this 19 mmHg fall. That is why the lecture advises giving ancillary drugs such as antibiotics before sedation.","wrong":{"0":"Butorphanol is a premedication opioid, not the drug the lecture links to a pressure drop.","1":"Detomidine is given at premedication, and the lecture does not link it to this intraoperative drop.","3":"Ketamine is an induction drug, not the one the lecture links to hypotension.","4":"Midazolam is an induction co-agent, not the one the lecture links to hypotension."},"lec":"W2: Equine Anesthesia","weeks":[2],"mods":[1]},{"stem":"A 12 kg dog becomes apneic after propofol induction and is intubated. There is no mechanical ventilator. The technician closes the APL valve and begins manual breaths by squeezing the reservoir bag over about 1 second each. What peak airway pressure should the manometer stay under?","options":["4-6 cmH2O","20-25 cmH2O","30-35 cmH2O","No limit with an open chest","10-12 cmH2O"],"correct":4,"why":"Manual IPPV is a controlled breath: close the APL valve, squeeze the bag over no more than 1 second, watch the gauge, and reopen the APL valve. The ventilation lecture says the pressure should not go over 10-12 cmH2O in a closed chest, which inflates the lungs without causing barotrauma or impairing venous return.","wrong":{"0":"This is in the PEEP range and too low to inflate the lungs.","1":"This exceeds the manual IPPV limit and risks barotrauma.","2":"This is far above the limit and risks lung injury.","3":"The chest is closed, and pressure must always be watched."},"lec":"W1: Mechanical Ventilation","weeks":[1],"mods":[1]},{"stem":"A 500 kg Warmblood under isoflurane in dorsal recumbency for ventral midline colic surgery has rising PaCO2 and falling PaO2 on spontaneous breathing. The anesthetist starts mechanical ventilation. Which settings match the large animal guide?","options":["10-20/min, 5 L tidal","6-8/min, 1.5 L tidal","15-20/min, 2.5 L tidal","6-8/min, 5 L tidal","2-4/min, 10 L tidal"],"correct":3,"why":"The ventral midline approach puts the horse in dorsal recumbency, where hypoventilation and hypoxemia are common (Weeks 2 and 3). The ventilation lecture's large animal settings are 6-8 breaths/min and 10 mL/kg, which is 5 L for 500 kg (Week 1).","wrong":{"0":"10-20 breaths/min is the small animal rate.","1":"1.5 L is only 3 mL/kg, far too small.","2":"This rate is too fast and the volume too small.","4":"This rate is too slow and the volume twice the guide."},"lec":"Integration W1+W2+W3: Colic horse ventilation","weeks":[1,2,3],"mods":[1]},{"stem":"A 2-year-old dog has one scrotal testis; the other is not palpable. The owner asks why the retained testis should be removed rather than left alone since the dog will be sterile anyway. Which reason did the castration lecture emphasize?","options":["Higher hernia risk","Urine odor control","Behavioral aggression","Scrotal skin dermatitis","Higher neoplasia risk"],"correct":4,"why":"The castration lecture states that undescended abdominal testes are up to 14 times more likely to become neoplastic and are more prone to torsion. That health risk, not fertility, is the reason to remove it.","wrong":{"0":"Hernia risk is not the reason the lecture gives for removing a retained testis.","1":"Urine odor is listed as a reason to castrate cats, not the reason to remove a retained testis.","2":"Behavior is not the lecture's reason for removing a retained testis.","3":"The lecture does not cite skin disease as a reason."},"lec":"W2: Castration Procedures","weeks":[2],"mods":[1]},{"stem":"An 11-year-old spayed female Scottish terrier has anorexia and azotemia. Ultrasound shows bilateral hydroureter and hydronephrosis, with both ureters dilated down to the bladder. There is irregular thickening of the dorsal bladder wall at the bladder neck. What is the most likely cause of the obstruction?","options":["Urethral calculus","Emphysematous ureteritis","Trigonal bladder mass","Hepatic lipidosis","Pyelonephritis"],"correct":2,"why":"Both ureters are obstructed at the trigone, where they enter the bladder. The abdominal radiographs II lecture lists a trigonal bladder mass, such as transitional cell carcinoma, as a cause of ureteral obstruction.","wrong":{"0":"A urethral stone would distend the bladder rather than cause trigone thickening.","1":"The lecture shows emphysematous ureteritis as gas in the ureter, not a bladder neck mass.","3":"Lipidosis affects the liver, not the ureters.","4":"Pyelonephritis does not explain a mass at the trigone."},"lec":"W3: Abdominal Radiographs II","weeks":[3],"mods":[1]},{"stem":"A 2-year-old dog had a bite wound over the distal tibia 3 weeks ago and now is lame and febrile. Radiographs show an aggressive lesion with lysis and new bone production centered at the bite site. Which differential is most likely?","options":["Osteosarcoma","Fungal osteomyelitis","Degenerative joint disease","Non-aggressive bone cyst","Bacterial osteomyelitis"],"correct":4,"why":"The bone lecture lists bacterial osteomyelitis as a cause of aggressive lesions. A young dog with fever and a lesion at the site of a recent bite wound fits infection introduced by the bite.","wrong":{"0":"Neoplasia is aggressive, but the bite site and fever in a young dog point to infection.","1":"Fungal disease is aggressive, but nothing here links it to the bite.","2":"The lecture separates degenerative change from aggressive lesions.","3":"This lesion is aggressive, not non-aggressive."},"lec":"W3: MSK Bone and Fractures","weeks":[3],"mods":[1]},{"stem":"A beef producer wants to castrate a 2-week-old calf with a quick, bloodless method. The calf has two descended testes and no inguinal swelling. Which method fits these criteria?","options":["Burdizzo emasculatome","Elastic banding","Scrotal emasculation","Pull-and-twist removal","Open scrotal ligation"],"correct":1,"why":"The castration CBL lists elastic banding for calves under 3 weeks old as quick and bloodless. A 2-week-old calf with no hernia meets those conditions.","wrong":{"0":"The Burdizzo is for calves over 1 month, when the cord is large enough to crush.","2":"Emasculation is for larger animals, over 250 kg, and is not bloodless.","3":"Sharp removal is quick but causes bleeding and an open incision.","4":"Ligation is a surgical, not bloodless, method."},"lec":"W3: CBL Castration","weeks":[3],"mods":[1]},{"stem":"A 6-year-old Thoroughbred mare has a PCV of 38% at admission. She receives acepromazine IM for premedication. A sample drawn 40 minutes later shows a PCV of 28% with unchanged total protein, and she has received no IV fluids. What best explains the change?","options":["Hemodilution from fluids","Intravascular hemolysis","Occult blood loss","Splenic sequestration","Hemoconcentration error"],"correct":3,"why":"Acepromazine relaxes the splenic capsule, so red cells pool in the spleen. The equine lecture notes acepromazine lowers PCV by 20-30% through splenic sequestration. Unchanged total protein and no fluids argue against dilution or blood loss.","wrong":{"0":"She received no fluids, and dilution would also lower total protein.","1":"The drop is timed to acepromazine, which the lecture links to splenic sequestration, not hemolysis.","2":"Blood loss would lower total protein along with PCV.","4":"Error would not explain a drop that fits acepromazine's known effect."},"lec":"W2: Equine Anesthesia","weeks":[2],"mods":[1]},{"stem":"A 4-year-old English bulldog is anesthetized for a soft palate resection. The anesthetist wants the dog to regain airway reflexes as quickly as possible once the inhalant is turned off. Which property of the chosen inhalant most determines how fast the dog wakes up?","options":["Low MAC value","High vapor pressure","Higher oil:gas partition coefficient","Low molecular weight","Low blood:gas solubility"],"correct":4,"why":"The induction and maintenance lecture links a low blood:gas solubility to fast induction and fast recovery. The less inhalant that dissolves in blood, the faster it washes out once the vaporizer is turned off, so airway reflexes return sooner.","wrong":{"0":"MAC is the concentration at which 50% of patients do not move, a measure of potency, not recovery speed.","1":"The lecture links recovery speed to blood:gas solubility, not vapor pressure.","2":"The lecture links recovery speed to blood:gas solubility, not oil:gas partitioning.","3":"The lecture links recovery speed to blood:gas solubility, not molecular weight."},"lec":"W1: Induction and Maintenance","weeks":[1],"mods":[1]},{"stem":"A 4-year-old dog has a loud right-sided systolic murmur. On the VD thoracic radiograph the cardiac silhouette is enlarged on the right, with reduced distance between the right heart border and right thoracic wall, forming a reversed D shape. The apex is pushed to the left. Which interpretation fits?","options":["Left-sided cardiomegaly","Left atrial enlargement","Right-sided cardiomegaly","Generalized pericardial effusion","Mediastinal shift"],"correct":2,"why":"The thoracic lecture describes right-sided enlargement as a reversed D shape on the VD view with less space between the right heart border and right thoracic wall. The apex can be pushed left, giving a false impression of left-sided cardiomegaly.","wrong":{"0":"The leftward apex is a known trap; the enlargement is on the right.","1":"The lecture describes the reversed D as right-sided enlargement, not left atrial enlargement.","3":"The lecture ties the reversed D to right-sided enlargement, not effusion.","4":"A shift moves all mediastinal structures to one side."},"lec":"W3: Thoracic Radiographs","weeks":[3],"mods":[1]},{"stem":"A 1-year-old intact male domestic shorthair cat is castrated through two scrotal incisions. After both pedicles are replaced in the scrotal sac, the student asks how to manage the skin incisions. What does the castration lecture recommend?","options":["Close with intradermal suture","Close with tissue adhesive","Close with skin staples","Close with interrupted skin sutures","Leave them open to drain"],"correct":4,"why":"The feline castration technique in the lecture ends with leaving the scrotal incisions open to drain and heal by second intention. The lecture also notes that castration complications are rare in cats.","wrong":{"0":"The lecture leaves feline scrotal incisions open rather than closing them.","1":"The lecture leaves feline scrotal incisions open rather than gluing them.","2":"The lecture leaves feline scrotal incisions open rather than stapling them.","3":"The lecture leaves feline scrotal incisions open; skin sutures belong to the canine prescrotal closure."},"lec":"W2: Castration Procedures","weeks":[2],"mods":[1]},{"stem":"An equine clinician compares alpha-2 agonists for standing sedation of a 500 kg horse. She wants to understand which agent has the lowest alpha-2:alpha-1 selectivity and therefore the least sedation and analgesia per receptor effect. Which drug is that?","options":["Detomidine","Xylazine","Romifidine","Dexmedetomidine","Acepromazine"],"correct":1,"why":"The equine lecture ranks selectivity: xylazine 160:1, detomidine 260:1, romifidine 340:1, and dexmedetomidine 1620:1. Higher alpha-2 selectivity gives greater sedation and analgesia, so xylazine, with the lowest ratio, gives the least.","wrong":{"0":"Detomidine is 260:1, more selective than xylazine.","2":"Romifidine is 340:1, more selective than xylazine.","3":"Dexmedetomidine is the most selective at 1620:1.","4":"Acepromazine is not an alpha-2 agonist, so it has no place on the selectivity table."},"lec":"W2: Equine Anesthesia","weeks":[2],"mods":[1]},{"stem":"A 2-year-old cat has a 1 cm oral mucosal tear repaired after a fall. The surgeon wants a suture that loses its strength and absorbs quickly, ideally within about 10 days, so it does not need removal. Which suture best matches that profile?","options":["Chromic gut","Polyglecaprone 25","Plain gut","Polydioxanone","Nylon"],"correct":2,"why":"Oral mucosa heals quickly, and the suture lecture lists quick-absorbing sutures (7-14 days) for oral and ocular mucosa. Plain gut loses 100% of its strength by 10 days, matching the surgeon's goal.","wrong":{"0":"Chromic gut keeps 60% of its strength at 28 days, longer than needed.","1":"Polyglecaprone 25 is a moderate-duration suture for skin and subcutaneous tissue.","3":"Polydioxanone is slow, lasting 6 weeks or more, for fascia and tendon.","4":"Nylon is non-absorbable and would need removal."},"lec":"W2: Sutures and Needles","weeks":[2],"mods":[1]},{"stem":"A 2-year-old Thoroughbred colt is to be castrated at a training barn with no anesthesia machine. The owner wants recumbent castration with ligation to reduce eventration and hemorrhage risk. The colt is premedicated with xylazine and induced with ketamine and diazepam. How should anesthesia be maintained for about 30 minutes?","options":["Isoflurane by face mask","Total intravenous anesthesia","Standing sedation alone","Epidural anesthesia only","Inhalant via portable machine"],"correct":1,"why":"Recumbent castration with ligation needs general anesthesia (Week 3 CBL). Without an anesthesia machine, maintenance must be intravenous; the induction and maintenance lecture lists TIVA as well suited to field procedures while inhalants need a vaporizer (Week 1).","wrong":{"0":"Mask isoflurane needs a vaporizer and is impractical in a horse in the field.","2":"The owner chose recumbent castration, which requires general anesthesia.","3":"An epidural does not keep a horse unconscious and immobile.","4":"There is no anesthesia machine at the barn."},"lec":"Integration W1+W3: Field horse castration","weeks":[1,3],"mods":[1]},{"stem":"Dopey (3.5 kg, resting respiratory rate 52 breaths/min) is connected to a non-rebreathing system. Using a tidal volume of 10 mL/kg, the CBL physiological respiratory rate, and a circuit factor of 2, what fresh gas flow should be set?","options":["0.42 L/min","1.26 L/min","3.64 L/min","0.84 L/min","0.14-0.35 L/min"],"correct":3,"why":"Tidal volume is 3.5 kg × 10 mL/kg = 35 mL. Minute volume uses the physiological rate of about 12 breaths/min: 35 × 12 = 420 mL/min. Multiplying by the circuit factor of 2 gives 840 mL/min, or 0.84 L/min.","wrong":{"0":"This leaves out the circuit factor of 2.","1":"This uses a tidal volume of 15 mL/kg instead of 10 mL/kg.","2":"This uses Dopey's resting rate of 52 instead of the physiological rate of 12.","4":"This is the rebreathing-system range of 40-100 mL/kg/min."},"lec":"W1: CBL Anesthesia Cases","weeks":[1],"mods":[1]},{"stem":"A 12-year-old cat is extubated after a dental procedure and breathes room air in recovery. Twenty minutes later SpO2 is 87% with a good pleth waveform, and an arterial sample shows PaO2 52 mmHg. How should this hypoxemia be classified?","options":["Mild hypoxemia","Severe hypoxemia","Moderate hypoxemia","Expected on room air","Pulse oximeter artifact"],"correct":2,"why":"The complications lecture grades hypoxemia by both values: mild is PaO2 60-80 mmHg or SpO2 90-95%, moderate is PaO2 40-60 mmHg or SpO2 85-90%, and severe is below 40 mmHg or 85%. Both numbers here fall in the moderate band, so the cat needs oxygen supplementation and evaluation.","wrong":{"0":"Mild hypoxemia needs PaO2 of 60-80 mmHg or SpO2 of 90-95%.","1":"Severe hypoxemia is a PaO2 below 40 mmHg or SpO2 below 85%.","3":"A healthy cat on room air should have a PaO2 near 90-100 mmHg.","4":"A good pleth waveform and matching PaO2 make artifact unlikely."},"lec":"W1: Anesthetic Complications","weeks":[1],"mods":[1]},{"stem":"A flexible endoscope with heat-sensitive electronics must be sterile for another procedure in 1 hour. The hospital has an autoclave, an ethylene oxide unit, a gas plasma unit, and a 0.2% peracetic acid system. Which method fits this situation?","options":["Steam autoclave","Ethylene oxide","Peracetic acid 0.2%","Gas plasma","Glutaraldehyde 2% soak"],"correct":3,"why":"The scope cannot take heat, and it is needed within an hour. Gas plasma sterilizes at below 50°C in about an hour and needs no aeration, so the lecture calls it the top option for heat-intolerant items such as scopes.","wrong":{"0":"Autoclaving at 121°C or 134°C would damage heat-sensitive electronics.","1":"Ethylene oxide works at low temperature but takes many hours plus aeration.","2":"Peracetic acid runs in an automated liquid system; the lecture names gas plasma as the top option for heat-intolerant scopes.","4":"Glutaraldehyde is an irritant soak that needs gloves and rinsing, not the lecture's top choice for scopes."},"lec":"W2: Surgical Asepsis","weeks":[2],"mods":[1]},{"stem":"During maintenance of a 30 kg dog on isoflurane through a rebreathing circuit, the reservoir bag keeps collapsing. The technician repeatedly presses the oxygen flush valve to refill it. Over the next 10 minutes the dog begins to blink and its heart rate rises. Which explains the lighter plane?","options":["Vaporizer output rises with flow","Soda lime is exhausted","Flush bypasses the vaporizer","Fresh gas flow is too low","APL valve is fully closed"],"correct":2,"why":"The equipment lecture states that the flush valve delivers 35-75 L/min of pure oxygen that bypasses the vaporizer. Repeated flushing fills the circuit with oxygen that carries no isoflurane, so the dog lightens.","wrong":{"0":"Flush oxygen never passes through the vaporizer, so output cannot rise.","1":"Exhausted absorbent affects CO2 removal, not the inhalant concentration.","3":"Low flow may explain the collapsing bag, but the flushing is what lightened the dog.","4":"A closed APL valve fills the bag rather than collapsing it."},"lec":"W1: Anesthesia Equipment","weeks":[1],"mods":[1]},{"stem":"A 7-year-old pug with stertor and a hypoplastic trachea is scheduled for anesthesia. Intubation is expected to be difficult and may take several attempts. Before induction, the anesthetist provides 100% oxygen by face mask for 3 minutes. What is the main benefit of this step?","options":["Faster inhalant uptake","Reduced induction dose","Prevention of laryngospasm","Longer time to desaturation","Lower aspiration risk at intubation"],"correct":3,"why":"A slow, difficult intubation can leave the pug apneic for a while. The induction lecture states that pre-oxygenation increases the time to hypoxemia during apnea, which buys time for several intubation attempts.","wrong":{"0":"Mask oxygen is given before any inhalant is turned on, so it does not affect uptake.","1":"The lecture does not link pre-oxygenation to the induction dose.","2":"Laryngospasm prevention is a separate step, such as topical lidocaine in cats.","4":"The lecture's stated benefit is time before hypoxemia, not aspiration protection."},"lec":"W1: Induction and Maintenance","weeks":[1],"mods":[1]},{"stem":"A JSAL patient weighing 8.4 kg has roundworms. Pyrantel pamoate is prescribed at 10 mg/kg PO once, and the suspension is 50 mg/mL. You are using a 3 mL syringe marked to the tenth of a mL. What volume do you give?","options":["1.7 mL","1.68 mL","1.6 mL","16.8 mL","0.17 mL"],"correct":0,"why":"The dose is 8.4 kg × 10 mg/kg = 84 mg, and 84 mg ÷ 50 mg/mL = 1.68 mL. A 3 mL syringe measures to the tenth, so you round to 1.7 mL, as in the JSAL example.","wrong":{"1":"This is the exact calculation, but the 3 mL syringe cannot measure hundredths.","2":"Truncating rather than rounding underdoses the patient.","3":"This is a decimal error, ten times the correct volume.","4":"This is a decimal error, one tenth of the correct volume."},"lec":"W2: JSAL and FCM Skills","weeks":[2],"mods":[1]},{"stem":"A 2-year-old Yorkshire sow (180 kg) regurgitates during induction for a uterine prolapse repair, and gastric fluid enters the trachea before the airway is secured. Why is aspiration expected to cause especially severe lung injury in this species?","options":["Slow gastric emptying time","Large gastric fluid volume","Bacteria-rich gastric content","Gastric pH of 1.5-2.5","Difficult laryngeal anatomy"],"correct":3,"why":"The pig lecture describes pig gastric content as highly acidic, with a pH of 1.5-2.5, so aspirated fluid causes direct chemical damage to lung tissue. Ruminants and camelids have less acidic content where the main risk is bacterial.","wrong":{"0":"Pigs have rapid gastric emptying, about 2-4 hours.","1":"Volume matters, but the lecture links severity to acidity.","2":"Bacterial injury is the main concern in ruminants and camelids.","4":"Laryngeal anatomy makes intubation hard but does not set aspiration severity."},"lec":"W2: Pig Anesthesia","weeks":[2],"mods":[1]},{"stem":"A 600 kg Holstein cow needs a ventral abdominal approach, so she will be under general anesthesia in dorsal recumbency rather than standing. The anesthetist chooses the endotracheal tube. Which airway device fits this patient?","options":["Silicone tube, 28 mm ID","PVC tube, size 14","Cole tube","Supraglottic airway device","No airway device needed"],"correct":0,"why":"A ventral approach in cattle requires recumbency under general anesthesia rather than standing surgery (Week 3). The Week 1 anesthesia CBL lists silicone tubes of 28 mm internal diameter for species with elongated necks, such as horses and large ruminants.","wrong":{"1":"PVC tubes are mostly for small animals, and size 14 is the largest PVC size.","2":"Cole tubes are mainly for birds and some reptiles.","3":"Supraglottic devices are made for dogs, cats, and rabbits.","4":"A recumbent cow under general anesthesia needs a protected airway."},"lec":"Integration W1+W3: Cow airway","weeks":[1,3],"mods":[1]},{"stem":"A 4-year-old Quarter Horse has a 3-week-old wire laceration over the dorsal metatarsus managed by second intention. Pink, granular tissue now protrudes above the skin edges, and epithelium is not advancing over it. Which complication is this?","options":["Wound contracture","Incisional dehiscence","Chronic seroma","Hypertrophic epithelial overgrowth","Exuberant granulation tissue"],"correct":4,"why":"Granulation tissue that grows above the skin edges blocks the advancing epithelium. The wound lecture names exuberant granulation tissue, or proud flesh, as a complication of second intention healing in the horse.","wrong":{"0":"Contracture is the other complication the lecture lists, and it impairs joint motion rather than protruding.","1":"Dehiscence is separation of a sutured wound; this wound was left open.","2":"A seroma is a fluid pocket, not raised tissue.","3":"Epithelium is not advancing, so it is not overgrowing."},"lec":"W3: Wound Management","weeks":[3],"mods":[1]},{"stem":"A 6-year-old cat has dyspnea and reduced cranial chest compressibility. On the lateral radiograph the carina sits caudal to the sixth intercostal space and the trachea is displaced. The DV view shows a widened cranial mediastinum. Which is most likely?","options":["Generalized cardiac enlargement","Left atrial enlargement","Cranial lung lobe mass","Cranial mediastinal mass","Pleural effusion"],"correct":3,"why":"The thoracic lecture notes that a carina caudal to the sixth intercostal space on a lateral view signals cardiac displacement, not enlargement. Large mediastinal masses push the heart caudally and displace the trachea, and the DV view helps tell a mediastinal mass from a cranial lung lobe mass.","wrong":{"0":"The lecture says this carina position means displacement, not enlargement.","1":"Left atrial enlargement is an enlargement, and the carina position here signals displacement.","2":"A widened mediastinum on the DV view points to the mediastinum, not a lung lobe.","4":"Effusion does not explain a widened cranial mediastinum with cardiac displacement."},"lec":"W3: Thoracic Radiographs","weeks":[3],"mods":[1]},{"stem":"A 3-year-old cat is intubated with a 4.0 mm cuffed tube for a 2-hour dental procedure. The technician inflates the cuff until the pilot balloon feels firm. Using a cuff manometer, what seal pressure should the cuff be adjusted to?","options":["5-10 cmH2O","20-30 cmH2O","10-15 cmH2O","40-50 cmH2O","Leak-free at 40 cmH2O"],"correct":1,"why":"A firm pilot balloon does not tell you the pressure on the tracheal mucosa, and cats are prone to tracheal injury. The airway devices lecture gives a cuff seal pressure of 20-30 cmH2O, enough to prevent leaks and aspiration without compressing mucosal blood flow.","wrong":{"0":"This is too low to reliably prevent leaks and aspiration.","2":"This is below the recommended range, so a leak during IPPV is likely.","3":"This pressure can compress tracheal mucosa and cause injury, especially in cats.","4":"Inflating until no leak at 40 cmH2O overinflates the cuff for routine use."},"lec":"W1: Airway Devices","weeks":[1],"mods":[1]},{"stem":"A 4-month-old intact male puppy has abdominal radiographs before a foreign body is ruled out. He is bright, eating, and has normal bloodwork. The radiologist notes generally poor serosal detail with no gas pattern abnormalities and no mass effect. What is the most likely interpretation?","options":["Peritoneal effusion","Septic peritonitis","Normal for age","Emaciation","Carcinomatosis"],"correct":2,"why":"The abdominal radiographs I lecture notes that neonates and juveniles up to about 6 months old normally have reduced serosal detail. A bright, healthy 4-month-old with no other changes fits this normal age-related finding.","wrong":{"0":"Effusion is unlikely in a bright puppy with no distension.","1":"Peritonitis would make the puppy ill with abnormal bloodwork.","3":"This puppy is eating well and is not emaciated.","4":"Carcinomatosis does not fit a healthy puppy with normal bloodwork."},"lec":"W2: Abdominal Radiographs I","weeks":[2],"mods":[1]}];
var LET = ["A", "B", "C", "D", "E"];
var COURSE = { 1: "FCM", 2: "IIO", 3: "CVR", 4: "SSI" };
var MODS = { 1: "Module 1: Systems 4 FCM (Weeks 1-3)", 2: "Module 2: Systems 4 IIO (Weeks 4-7)", 3: "Module 3: Systems 4 CVR (Weeks 8-11)", 4: "Module 4: Systems 4 SSI (Weeks 12-15)" };
var DISC = ["Anesthesia", "Surgery", "Imaging", "Clinical pathology", "Infectious disease", "Oncology", "Cardiorespiratory", "Dermatology", "Ophthalmology", "Public health and pharmacology"];
var SPEC = ["Dog", "Cat", "Horse", "Cattle", "Small ruminant", "Pig", "Camelid", "Multiple"];
var TOTAL_SECONDS = CFG.minutes * 60;
var REVIEW_TIP = "Review this week's Socratic questions and Hard Practice Sets.";

function modOfWeek(w) { return w <= 3 ? 1 : (w <= 7 ? 2 : (w <= 11 ? 3 : 4)); }
function weekLabel(w) { return "Week " + w + " " + COURSE[modOfWeek(w)]; }
function isX(q) { return q.weeks.length > 1; }
function lecLabel(q) { return isX(q) ? "Integration questions" : q.lec.replace(/^W\d+:\s*/, ""); }
function pctOf(right, n) { return n ? Math.round(100 * right / n) : 0; }
function band(p) { return p < 50 ? "under-50" : (p < 70 ? "50-69" : (p < 85 ? "70-84" : "85-up")); }
function score(answers) {
  var res = { total: 0, n: QS.length, byWeek: {}, byLec: {}, byModule: {}, byDisc: {}, bySpecies: {}, cross: { right: 0, n: 0 } };
  function add(map, key, ok) { if (!map[key]) map[key] = { right: 0, n: 0 }; map[key].n++; if (ok) map[key].right++; }
  QS.forEach(function (q, i) {
    var ok = answers[i] === q.correct;
    if (ok) res.total++;
    q.weeks.forEach(function (w) {
      add(res.byWeek, w, ok);
      if (!res.byLec[w]) res.byLec[w] = {};
      add(res.byLec[w], lecLabel(q), ok);
    });
    q.mods.forEach(function (m) { add(res.byModule, m, ok); });
    if (q.disc) add(res.byDisc, q.disc, ok);
    if (q.species) add(res.bySpecies, q.species, ok);
    if (isX(q)) { res.cross.n++; if (ok) res.cross.right++; }
  });
  res.pct = pctOf(res.total, res.n);
  res.weeks = Object.keys(res.byWeek).map(Number).sort(function (a, b) { return a - b; });
  res.lowWeeks = res.weeks.filter(function (w) { return pctOf(res.byWeek[w].right, res.byWeek[w].n) < 70; });
  return res;
}
function gc(name) { try { if (window.goatcounter && window.goatcounter.count) { window.goatcounter.count({ path: name, title: name, event: true }); } } catch (e) {} }

var S = { screen: "disclaimer", cur: 0, answers: [], flags: [], left: TOTAL_SECONDS, paused: false, timerId: null, missedOnly: false, submitted: false };
for (var k = 0; k < QS.length; k++) { S.answers.push(null); S.flags.push(false); }
var KEY = "t4-practice-" + CFG.id;
function store(key, val) { try { window.localStorage.setItem(key, JSON.stringify(val)); } catch (e) {} }
function load(key) { try { var v = window.localStorage.getItem(key); return v ? JSON.parse(v) : null; } catch (e) { return null; } }
function save() { store(KEY, { answers: S.answers, flags: S.flags, left: S.left, cur: S.cur, submitted: S.submitted }); }

function esc(t) { return String(t).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
function fmt(s) { var m = Math.floor(s / 60), r = s % 60; return (m < 10 ? "0" : "") + m + ":" + (r < 10 ? "0" : "") + r; }
function toTop() { try { window.scrollTo(0, 0); } catch (e) {} }
var app = document.getElementById("app");

function tick() {
  if (S.paused || S.screen !== "exam") return;
  S.left = Math.max(0, S.left - 1);
  showTimer();
  if (S.left % 15 === 0) save();
  if (S.left === 0) { finish(); alert("Time is up. Your exam has been submitted."); }
}
function startTimer() { stopTimer(); S.timerId = setInterval(tick, 1000); }
function stopTimer() { if (S.timerId) clearInterval(S.timerId); S.timerId = null; }
function showTimer() {
  var box = document.getElementById("timerBox");
  box.classList.toggle("hidden", S.screen !== "exam");
  document.getElementById("timer").textContent = fmt(S.left);
  box.classList.toggle("low", S.left <= 600);
  document.getElementById("pauseBtn").textContent = S.paused ? "Resume" : "Pause";
}
document.getElementById("pauseBtn").onclick = function () { S.paused = !S.paused; render(); };

function disclaimerScreen() {
  app.innerHTML = '<section class="sheet"><h2>Before you start</h2><div class="notice">' +
    '<p>This practice exam is a resource to help you pinpoint where to spend more time fixing knowledge gaps.</p>' +
    '<p>The questions are AI generated and based on the lecture slides. Faculty are the experts. They likely shared more context in lecture that is not on the slides.</p>' +
    '<p><b>Best practice:</b> review your class notes and talk with faculty about any topic you are unsure about.</p>' +
    '<p>Think of this resource as a tool to help you decide how to spend your study time. Do not make this resource, or any AI resource, the only tool you use to prepare for your final exam.</p></div>' +
    '<label class="agree"><input type="checkbox" id="agree"> I understand</label>' +
    '<div class="navrow"><span></span><button class="primary" type="button" id="cont" disabled>Continue</button></div></section>';
  var a = document.getElementById("agree"), c = document.getElementById("cont");
  a.onchange = function () { c.disabled = !a.checked; };
  c.onclick = function () { if (!a.checked) return; gc(CFG.id + "-disclaimer-ok"); S.screen = "start"; render(); toTop(); };
}

function startScreen() {
  var saved = load(KEY);
  var h = '<section class="sheet"><h2>' + esc(CFG.title) + '</h2><p>' + esc(CFG.intro) + '</p>' +
    '<h3>How it works</h3><ol class="steps">' +
    '<li><b>Close your notes.</b> Every question is new. The point is to find out what you know right now.</li>' +
    '<li><b>Watch the clock.</b> The timer runs for ' + CFG.minutes + ' minutes (about 30 minutes per block of ' + CFG.block + '). You can pause it if you are interrupted.</li>' +
    '<li><b>Answer every question.</b> Choose one letter. Use Previous, Next, or the question grid to move around.</li>' +
    '<li><b>Flag questions to revisit.</b> Flagged questions show a yellow dot in the grid.</li>' +
    '<li><b>Expect integration questions.</b> ' + esc(CFG.xnote) + '</li>' +
    '<li><b>Submit when done.</b> ' + esc(CFG.submitNote) + '</li></ol>' +
    '<p class="meta">Your answers are saved in this browser as you go, so you can close the page and resume later on the same device.</p>' +
    '<div class="navrow"><span></span><span>';
  if (saved && saved.answers && saved.answers.length === QS.length) h += '<button type="button" id="resume">' + (saved.submitted ? "See last results" : "Resume saved attempt") + '</button> ';
  h += '<button class="primary" type="button" id="begin">Start the exam</button></span></div></section>';
  app.innerHTML = h;
  document.getElementById("begin").onclick = function () {
    for (var i = 0; i < QS.length; i++) { S.answers[i] = null; S.flags[i] = false; }
    S.left = TOTAL_SECONDS; S.cur = 0; S.submitted = false; S.screen = "exam"; S.paused = false; save(); gc(CFG.id + "-start"); startTimer(); render(); toTop();
  };
  var r = document.getElementById("resume");
  if (r) r.onclick = function () {
    S.answers = saved.answers; S.flags = (saved.flags && saved.flags.length === QS.length) ? saved.flags : S.flags;
    S.left = typeof saved.left === "number" ? saved.left : TOTAL_SECONDS; S.cur = saved.cur || 0; S.submitted = !!saved.submitted;
    if (S.submitted) { S.screen = "results"; } else { S.screen = "exam"; S.paused = false; startTimer(); }
    render(); toTop();
  };
}

function gridHtml(review) {
  var h = '<div class="grid">';
  QS.forEach(function (q, i) {
    var c = [];
    if (review) c.push(S.answers[i] === q.correct ? "r-ok" : "r-bad");
    else if (S.answers[i] !== null) c.push("ans");
    if (S.flags[i]) c.push("flg");
    if (i === S.cur) c.push("cur");
    h += '<button type="button" class="' + c.join(" ") + '" data-go="' + i + '" aria-label="Question ' + (i + 1) + '">' + (i + 1) + '</button>';
  });
  return h + '</div>';
}
function bindGrid() { Array.prototype.forEach.call(document.querySelectorAll("[data-go]"), function (b) { b.onclick = function () { S.cur = +b.getAttribute("data-go"); render(); toTop(); }; }); }

function examScreen() {
  if (S.paused) { app.innerHTML = '<section class="sheet paused"><h2>Paused</h2><p>The timer is stopped and the question is hidden. Select Resume to continue.</p><button class="primary" type="button" id="res2">Resume</button></section>'; document.getElementById("res2").onclick = function () { S.paused = false; render(); }; return; }
  var q = QS[S.cur], i = S.cur, answered = S.answers.filter(function (a) { return a !== null; }).length, nb = Math.ceil(QS.length / CFG.block);
  var h = '<section class="sheet"><div class="qhead"><span class="qnum">Question ' + (i + 1) + ' of ' + QS.length + '</span><span class="meta">Block ' + (Math.floor(i / CFG.block) + 1) + ' of ' + nb + ' &middot; ' + answered + ' answered</span></div>' +
    '<p class="stem">' + esc(q.stem) + '</p>';
  q.options.forEach(function (o, j) { h += '<button type="button" class="opt' + (S.answers[i] === j ? " sel" : "") + '" data-opt="' + j + '" aria-pressed="' + (S.answers[i] === j) + '"><span class="let">' + LET[j] + '</span><span class="txt">' + esc(o) + '</span></button>'; });
  h += '<div class="navrow"><button type="button" id="prev"' + (i === 0 ? " disabled" : "") + '>Previous</button>' +
    '<button type="button" class="flagbtn' + (S.flags[i] ? " on" : "") + '" id="flag">' + (S.flags[i] ? "Flagged" : "Flag for review") + '</button>' +
    (i < QS.length - 1 ? '<button type="button" class="primary" id="next">Next</button>' : '<button type="button" class="teal" id="sub2">Submit exam</button>') + '</div></section>' +
    '<section class="sheet"><h3 style="margin-top:0">Question navigator</h3>' + gridHtml(false) +
    '<div class="legend">Shaded = answered<span></span>flagged</div><div class="navrow"><span></span><button type="button" class="teal" id="sub">Submit exam</button></div></section>';
  app.innerHTML = h;
  Array.prototype.forEach.call(document.querySelectorAll("[data-opt]"), function (b) { b.onclick = function () { S.answers[i] = +b.getAttribute("data-opt"); save(); render(); }; });
  document.getElementById("prev").onclick = function () { S.cur--; render(); toTop(); };
  var nx = document.getElementById("next"); if (nx) nx.onclick = function () { S.cur++; render(); toTop(); };
  document.getElementById("flag").onclick = function () { S.flags[i] = !S.flags[i]; save(); render(); };
  document.getElementById("sub").onclick = askSubmit;
  var s2 = document.getElementById("sub2"); if (s2) s2.onclick = askSubmit;
  bindGrid();
}
function askSubmit() {
  var un = S.answers.filter(function (a) { return a === null; }).length, fl = S.flags.filter(Boolean).length;
  document.getElementById("modalText").textContent = (un ? un + " question" + (un === 1 ? " is" : "s are") + " unanswered and will be scored as wrong. " : "All " + QS.length + " questions are answered. ") +
