function modOfWeek(w) { return w <= 3 ? 1 : (w <= 7 ? 2 : (w <= 11 ? 3 : 4)); }
function weekLabel(w) { return "Week " + w + " " + COURSE[modOfWeek(w)]; }
function isX(q) { return q.weeks.length > 1; }
function lecLabel(q) { return isX(q) ? "Integration questions" : q.lec.replace(/^W\d+:\s*/, ""); }
function pctOf(right, n) { return n ? Math.round(100 * right / n) : 0; }
function band(p) { return p < 50 ? "under-50" : (p < 70 ? "50-69" : (p < 85 ? "70-84" : "85-up")); }
function score(answers) {
  var res = { total: 0, n: QS.length, byWeek: {}, byLec: {}, byModule: {}, byDisc: {}, bySpecies: {}, cross: { right: 0, n: 0 } };
  function add(map, key, ok) { if (!map[key]) map[key] = { right: 0, n: 0 }; map[key].n++; if (ok) map[key].right++; }
  QS.forEach(function (q, i) {
    var ok = answers[i] === q.correct;
    if (ok) res.total++;
    q.weeks.forEach(function (w) {
      add(res.byWeek, w, ok);
      if (!res.byLec[w]) res.byLec[w] = {};
      add(res.byLec[w], lecLabel(q), ok);
    });
    q.mods.forEach(function (m) { add(res.byModule, m, ok); });
    if (q.disc) add(res.byDisc, q.disc, ok);
    if (q.species) add(res.bySpecies, q.species, ok);
    if (isX(q)) { res.cross.n++; if (ok) res.cross.right++; }
  });
  res.pct = pctOf(res.total, res.n);
  res.weeks = Object.keys(res.byWeek).map(Number).sort(function (a, b) { return a - b; });
  res.lowWeeks = res.weeks.filter(function (w) { return pctOf(res.byWeek[w].right, res.byWeek[w].n) < 70; });
  return res;
}

function rowCls(r) { var p = pctOf(r.right, r.n); return p < 70 ? "low" : (p >= 85 ? "strong" : ""); }
function head(first) { return '<table><tr><th class="c1">' + first + '</th><th class="num c2">Score</th><th class="num c3">%</th><th class="c4"><span class="hidden">Bar</span></th></tr>'; }
function row(label, r, cls) {

function tbl(title, first, rows, colour) {

}

  });
  return h + '</table>';
}

function missed() { var m = []; QS.forEach(function (q, i) { if (S.answers[i] !== q.correct) m.push(i); }); return m; }
function reviewScreen() {

  if (list.indexOf(S.cur) < 0) S.cur = list[0];

    var c = j === q.correct ? " correct" : (j === a ? " wrongpick" : "");
    var tag = j === q.correct ? " (correct answer)" : (j === a ? " (your answer)" : "");
    h += '<div class="opt' + c + '"><span class="let">' + LET[j] + '</span><span class="txt">' + esc(o) + '<b>' + tag + '</b></span></div>';
  });
  h += '<div class="why"><b>Why ' + LET[q.correct] + '. ' + esc(q.options[q.correct]) + ' is correct:</b> ' + esc(q.why) + '</div>';
  if (a !== null && a !== q.correct) h += '<div class="pick"><b>Why your answer, ' + LET[a] + '. ' + esc(q.options[a]) + ', misses:</b> ' + esc(q.wrong[a]) + '</div>';
  h += '<details class="others"><summary>Why each other option misses</summary>';
  q.options.forEach(function (o, j) { if (j !== q.correct) h += '<p><b>' + LET[j] + '. ' + esc(o) + ':</b> ' + esc(q.wrong[j]) + '</p>'; });
  var tags = [q.weeks.map(weekLabel).join(" + ")].concat([q.disc, q.species, q.type].filter(Boolean));
  h += '</details><p class="meta" style="margin-top:12px">' + esc(tags.join(" · ")) + '</p>' +
    '<div class="navrow"><button type="button" id="rprev"' + (pos === 0 ? " disabled" : "") + '>Previous</button><button type="button" id="back">Back to results</button>' +
    '<button type="button" class="primary" id="rnext"' + (pos === list.length - 1 ? " disabled" : "") + '>Next</button></div></section>' +
    '<section class="sheet"><h3 style="margin-top:0">All questions</h3>' + gridHtml(true) + '<div class="legend">Green = correct, red = missed<span></span>flagged during the exam</div></section>';
  app.innerHTML = h;
  document.getElementById("rprev").onclick = function () { S.cur = list[pos - 1]; render(); toTop(); };
  document.getElementById("rnext").onclick = function () { S.cur = list[pos + 1]; render(); toTop(); };
  document.getElementById("back").onclick = function () { S.screen = "results"; render(); toTop(); };
  document.getElementById("mo").onchange = function () { S.missedOnly = this.checked; render(); };
  Array.prototype.forEach.call(document.querySelectorAll("[data-go]"), function (b) { b.onclick = function () { var g = +b.getAttribute("data-go"); if (S.missedOnly && missed().indexOf(g) < 0) S.missedOnly = false; S.cur = g; render(); toTop(); }; });
}
function render() {
  showTimer();
  if (S.screen === "disclaimer") disclaimerScreen();
  else if (S.screen === "start") startScreen();
  else if (S.screen === "exam") examScreen();
  else if (S.screen === "results") resultsScreen();
  else reviewScreen();
}
render();
</script>
