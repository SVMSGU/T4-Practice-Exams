<script>
var CFG = {"id":"m2","title":"Module 2 Practice Exam: Systems 4 IIO","intro":"60 questions from Weeks 4-7, built from the Systems 4 IIO lecture slides. 90 minutes: 3 blocks of 20, about 30 minutes each.","minutes":90,"block":20,"final":false,"xnote":"Some questions combine material from two or more weeks. They count toward every week they draw on.","submitNote":"You will see your score by week and by lecture, then review every question with explanations."};
var QS = [{"stem":"In late winter, a UK sheep flock has many lambs born dead or with severe malformations of the limbs and spine. The ewes were in early pregnancy the previous late summer, when Culicoides midges were active, and at that time several ewes and cows on the farm had a brief fever, diarrhea, and reduced milk yield. Which virus is most likely?","options":["Bluetongue virus","Louping ill virus","Lumpy skin disease virus","Epizootic hemorrhagic disease virus","Schmallenberg virus"],"correct":4,"why":"Schmallenberg virus is a midge-borne (Culicoides) orthobunyavirus of cattle, sheep, and goats that causes transient illness in adults (fever, diarrhea, reduced milk yield) and severe congenital malformations or abortions when animals are infected during pregnancy. There is no treatment, infected animals develop long-lasting immunity, and vaccines are available in some regions.","wrong":{"0":"Bluetongue is also midge-borne, but its signs come from vascular permeability: fever, facial edema, hemorrhages, erosions, and coronitis.","1":"Louping ill is a tick-borne (Ixodes) flavivirus causing neurological signs and a leaping gait in lambs.","2":"Lumpy skin disease causes firm skin nodules in cattle and buffalo.","3":"EHD is clinical in deer and cattle; sheep rarely develop signs and goats are not susceptible."},"lec":"W5: Livestock VBD","weeks":[5],"mods":[2]},{"stem":"A 3-year-old Holstein heifer is clinically normal at a pre-purchase examination. Her BLV antibody ELISA is positive, the herd has never used a BLV vaccine, and two CBCs 3 months apart show persistent lymphocytosis. The buyer asks whether she has lymphoma. What do these results establish?","options":["Confirmed lymphosarcoma","Prior BLV vaccination","Sporadic juvenile lymphoma","BLV infection only","Infection since cleared"],"correct":3,"why":"There is no BLV vaccine, so a positive antibody ELISA means the heifer is infected, and the virus survives in lymphocytes (Week 5). Most infected cattle never develop disease, and only about 1-5% develop lymphosarcoma. The Week 7 large animal tumor lecture states that neither a positive BLV test nor persistent lymphocytosis equals lymphoma; a tumor diagnosis requires sampling an affected site.","wrong":{"0":"A positive BLV test and persistent lymphocytosis do not equal lymphoma; a lesion must be sampled.","1":"There is no BLV vaccine, so the antibodies reflect infection.","2":"Sporadic forms occur independently of BLV, and she has no lesion to diagnose.","4":"BLV survives in lymphocytes, and a positive test without vaccination means current infection."},"lec":"Integration W5+W7: BLV test meaning","weeks":[5,7],"mods":[2]},{"stem":"In a rural Virginia county, where the American dog tick transmits Rickettsia rickettsii, three unrelated dogs from one neighborhood are diagnosed with Rocky Mountain spotted fever within 2 weeks. The county health officer asks what these cases mean for the people living there. What is the best interpretation?","options":["Direct dog-to-human spread","Dogs are the maintenance reservoir","Sentinel for human risk","Dead-end hosts, no human relevance","Deer maintain the local cycle"],"correct":2,"why":"Dogs are highly susceptible to R. rickettsii and have more tick exposure than people, so disease in dogs can serve as a sentinel for human risk, and dogs and people exposed to the same infected ticks produce clusters in time and place. In most of the USA the agent is maintained between small mammals and ticks, with dogs usually incidental, dead-end hosts; dogs act as potential reservoirs where the brown dog tick is the vector.","wrong":{"0":"The lecture describes tick transmission, with dogs and people exposed to the same infected ticks.","1":"Dogs are potential reservoirs only where the brown dog tick is the vector; here the cycle is small mammals and ticks.","3":"Dogs are usually dead-end hosts, but their cases still signal infected ticks near people.","4":"Deer feed ticks in the Lyme disease cycle; R. rickettsii is maintained in small mammals such as rodents and lagomorphs."},"lec":"W4: Intro to Vector-Borne Disease","weeks":[4],"mods":[2]},{"stem":"During a wellness ultrasound, a 9-year-old spayed female Labrador retriever with no clinical signs is found to have a non-ruptured splenic mass. There is no free abdominal fluid, and her PCV is normal. The owner asks how likely the mass is to be malignant. Based on the lecture, what is the approximate chance?","options":["About 64%","About 87.5%","About 70%","About 30%","About 86%"],"correct":3,"why":"For incidental, non-ruptured splenic masses treated with splenectomy, the lecture reports about 70% benign and 30% malignant. The higher figure of 64% malignant applies to non-traumatic hemoabdomen from a ruptured splenic mass, and 87.5% of those malignant masses are hemangiosarcoma. Histopathology provides the diagnosis.","wrong":{"0":"This is the malignancy rate for ruptured splenic masses causing non-traumatic hemoabdomen.","1":"This is the proportion of malignant ruptured masses that are hemangiosarcoma.","2":"About 70% of incidental masses are benign, not malignant.","4":"About 86% of non-traumatic canine hemoabdomens are caused by a splenic mass."},"lec":"W7: Sarcomas","weeks":[7],"mods":[2]},{"stem":"A 16-year-old pony mare with 2 months of weight loss has a chronic anemia (PCV 17%, reference interval 32-48%). She now presents after 2 days of profuse diarrhea. Findings include pale mucous membranes, a hemoglobin of 5.8 g/dL (reference interval 11-19), a low RBC count, and slow jugular fill. Which finding indicates that she is now also hypovolemic, not just anemic?","options":["Pale mucous membranes","Low hemoglobin","Low RBC count","Low PCV","Slow jugular fill"],"correct":4,"why":"The CBL's pale patient table separates anemia (pale membranes and decreased RBC mass: low PCV, Hct, Hgb, and RBC count) from hypovolemia, shock, or poor perfusion (pale membranes, prolonged CRT, raised heart rate, poor pulses, low blood pressure, slow jugular fill in the horse, cold extremities, reduced urine output). Slow jugular fill is only in the poor perfusion column, so it shows the diarrhea has added hypovolemia.","wrong":{"0":"Pale membranes appear in both columns, so they cannot separate anemia from hypovolemia.","1":"Low hemoglobin measures decreased RBC mass, the anemia column.","2":"A low RBC count reflects decreased RBC mass, already explained by her chronic anemia.","3":"A low PCV reflects decreased RBC mass, the anemia column."},"lec":"W4: CBL Pale Patient","weeks":[4],"mods":[2]},{"stem":"A 4-year-old neutered male dog in Grenada has generalized lymphadenopathy. Lymph node cytology shows a mixed population of small lymphocytes, plasma cells, and some larger lymphocytes. PARR on the node aspirate shows a polyclonal pattern. How is this PARR result best interpreted?","options":["Monoclonal neoplastic population","Confirmed B-cell lymphoma","Reactive hyperplasia","Confirmed T-cell lymphoma","Acute lymphoid leukemia"],"correct":2,"why":"PARR examines the antigen receptor genes of lymphocytes. A polyclonal population, with many different receptor rearrangements, usually reflects hyperplastic (reactive) cells, as in a normal immune response to infection or inflammation, whereas a monoclonal population usually indicates neoplastic cells. A mixed node population with plasma cells fits reactive hyperplasia.","wrong":{"0":"Monoclonal means one clone with identical receptors; this result is polyclonal.","1":"PARR identifies a B or T clone only when the population is monoclonal.","3":"PARR identifies a T or B clone only when the population is monoclonal.","4":"Acute leukemia is recognized by blasts in blood and marrow, with markers such as CD34, not a polyclonal node."},"lec":"W7: Bone Marrow and Leukemia","weeks":[7],"mods":[2]},{"stem":"A 6-year-old Holstein cow, 90 days in milk, has a sudden drop in milk yield, a fever of 39.7°C, and reduced rumen contractions, and she stands with her back arched. When the veterinarian performs a withers pinch, she stays rigid and grunts instead of dipping her back. What does this finding most suggest?","options":["Metritis","Pyelonephritis","Traumatic reticuloperitonitis","Caecal dilatation","Ketosis from negative energy balance"],"correct":2,"why":"The withers pinch (Kalchschmidt pain test) detects cranial abdominal pain in cattle. A healthy cow ventroflexes (dips her spine), while a painful cow resists, stays still, or grunts, as this cow does. The CBL links this response to hardware disease, traumatic reticuloperitonitis.","wrong":{"0":"Metritis is diagnosed from uterine findings and smelly vaginal discharge; the withers pinch tests cranial abdominal pain.","1":"Pyelonephritis is supported by urine analysis and ultrasound, not a withers pinch.","3":"Caecal dilatation is suggested by a ping in the right paralumbar fossa.","4":"Ketosis is assessed with blood ketones and NEFA, not a pain response."},"lec":"W6: CBL Fever","weeks":[6],"mods":[2]},{"stem":"A 1-year-old spayed female Bengal cat with effusive feline infectious peritonitis started oral GS-441524 at 15 mg/kg q24h. At the 2-week recheck she is brighter and eating, but ultrasound still shows a moderate amount of abdominal effusion and her AGP remains elevated. What is the most appropriate change to her treatment?","options":["Same dose for 6 more weeks","Stop the antiviral now","Switch to remdesivir","Switch to zidovudine (AZT)","20 mg/kg/day split q12h"],"correct":4,"why":"The CBL follow-up plan states that effusion should be resolved by 2 weeks of GS-441524; if it is not, the dose is increased to 20 mg/kg and split into 12-hour dosing. Treatment then continues for at least 2 weeks past resolution of clinical signs and normalization of biochemistry, and AGP should normalize within about 4 weeks.","wrong":{"0":"Persistent effusion at 2 weeks is the CBL's trigger to raise the dose rather than wait.","1":"Antivirals continue at least 2 weeks after signs resolve and biochemistry normalizes; effusion is still present.","2":"Remdesivir is another listed antiviral, but the CBL's plan for slow resolution is a higher GS-441524 dose.","3":"AZT is the retrovirus antiviral discussed for FIV and FeLV, and it can cause non-regenerative anemia."},"lec":"W5: CBL Pale Patient","weeks":[5],"mods":[2]},{"stem":"A 13-year-old neutered male domestic shorthair cat has 2 weeks of rapidly worsening anorexia, vomiting, and weight loss. Abdominal palpation reveals an intestinal mass, and ultrasound shows mesenteric lymph node enlargement. Fine needle aspirate cytology of the mass shows a population of large lymphoblasts without cytoplasmic granules. Which treatment is most appropriate?","options":["Chlorambucil and prednisolone","CHOP-based chemotherapy","Radiation therapy alone","Diet change with prednisolone","Lomustine as a single agent"],"correct":1,"why":"A rapid course, an intestinal mass with mesenteric lymph node enlargement, and large lymphoblasts on cytology fit intermediate- or high-grade alimentary lymphoma, which cytology can diagnose. The lecture's therapy for this grade is CHOP, with about a 60% response (about 30% complete) and a median survival of about 6 months, longer with complete response.","wrong":{"0":"Chlorambucil and prednisolone treat low-grade (small cell) alimentary lymphoma, which progresses slowly.","2":"Radiation therapy is for solitary lymphoma such as nasal lymphoma.","3":"Diet change with or without prednisolone is the IBD plan, the differential for small cell lymphoma.","4":"Lomustine is listed for canine lymphoma that is refractory to CHOP."},"lec":"W7: Lymphoma","weeks":[7],"mods":[2]},{"stem":"At ante-mortem inspection, a 6-year-old beef cow with a hard, swollen tongue and enlarged retropharyngeal lymph nodes is designated suspect. At post-mortem, granulomatous lesions are found in the tongue and the mandibular and retropharyngeal lymph nodes, and also in the lungs and liver; the mandible is normal. What is the correct post-mortem judgment?","options":["Entire carcass condemned","Head condemned, carcass passed","Tongue condemned, carcass passed","Passed without restriction","Lungs condemned, carcass passed"],"correct":0,"why":"Soft tissue lesions of the tongue and regional lymph nodes with a normal mandible identify actinobacillosis (wooden tongue) rather than actinomycosis, which affects bone. For actinobacillosis, localized lesions mean the affected organs or tissues are condemned, but systemic or generalized infection means the entire carcass is condemned. Lesions in the lungs and liver show generalized infection.","wrong":{"1":"Condemning the head and passing the carcass is the usual judgment for actinomycosis (lumpy jaw), a bone disease.","2":"Condemning only affected tissues applies to localized actinobacillosis; these lesions extend to the lungs and liver.","3":"Granulomatous lesions in several organs make this carcass unfit.","4":"Removing one organ is a localized judgment; generalized infection condemns the whole carcass."},"lec":"W6: Ante-Mortem Inspection","weeks":[6],"mods":[2]},{"stem":"A 12-year-old Morgan mare in New York has 3 months of neck stiffness, unwillingness to raise her head above horizontal, muscle atrophy, and dysphagia. Other neurologic diseases have been ruled out, and she is seropositive for Borrelia burgdorferi with a high OspC antibody level. Her previous veterinarian suggested enrofloxacin. Which antimicrobial is the most appropriate choice?","options":["Enrofloxacin","Ceftriaxone","Metronidazole","Ceftiofur","Imidocarb"],"correct":3,"why":"Neck stiffness with reluctance to lift the head, muscle atrophy, and cranial nerve signs such as dysphagia fit neuroborreliosis, and the ACVIM consensus supports treating seropositive horses with compatible signs once other causes are excluded. The lecture recommends penicillin, ceftiofur, and tetracyclines, and lists ceftriaxone, metronidazole, and enrofloxacin as not recommended.","wrong":{"0":"The lecture lists enrofloxacin as not recommended for equine Lyme disease.","1":"Ceftriaxone is on the lecture's not recommended list, unlike ceftiofur.","2":"Metronidazole is on the lecture's not recommended list.","4":"Imidocarb treats piroplasmosis, a protozoal disease, not a spirochete infection."},"lec":"W5: Equine VBD and Viruses","weeks":[5],"mods":[2]},{"stem":"A 9-year-old spayed female domestic shorthair cat has bacterial pneumonia confirmed by tracheal wash. The clinician plans the lecture's combination therapy: high-dose ampicillin with a fluoroquinolone, which in the dog protocol is enrofloxacin at 20 mg/kg q24h. Which fluoroquinolone plan should be used for this cat?","options":["Enrofloxacin at 20 mg/kg","Enrofloxacin at half dose","Marbofloxacin","Doxycycline","Chloramphenicol"],"correct":2,"why":"The lecture's bacterial pneumonia combination is high-dose ampicillin q6h with enrofloxacin at 20 mg/kg q24h in dogs, and it states that cats use marbofloxacin. Enrofloxacin can cause blindness in cats, so the feline protocol swaps the drug rather than adjusting the enrofloxacin dose.","wrong":{"0":"This is the dog dose; enrofloxacin can cause blindness in cats.","1":"The lecture replaces enrofloxacin with marbofloxacin in cats rather than lowering the dose.","3":"Doxycycline is not a fluoroquinolone, and in cats it can cause esophageal strictures.","4":"Chloramphenicol is not a fluoroquinolone and carries an aplastic anemia risk for humans."},"lec":"W6: Antimicrobial Stewardship","weeks":[6],"mods":[2]},{"stem":"A 4-year-old neutered male cat has a regressive FeLV infection confirmed by the laboratory. He is healthy, indoor only, and has never fought with other cats. His owner wants to adopt a second cat. Which companion fits the lecture's guidance?","options":["Unvaccinated adult cat","Vaccinated 10-week-old kitten","Unvaccinated 10-week-old kitten","Vaccinated 4-month-old cat","Vaccinated adult cat"],"correct":4,"why":"The lecture says FeLV-positive cats can live with other cats if they have a regressive infection and the other cats are adults vaccinated against FeLV. Both conditions, adult and vaccinated, must be met, while progressive FeLV infections need individual discussion.","wrong":{"0":"Adult status alone is not enough; the companion must also be vaccinated against FeLV.","1":"The guidance requires an adult cat; a 10-week-old kitten does not qualify even if vaccinated.","2":"This companion meets neither condition.","3":"A 4-month-old is still a kitten (the testing table separates kittens under 6 months), so it is not an adult."},"lec":"W5: Companion Animal Viruses","weeks":[5],"mods":[2]},{"stem":"A 6-year-old Holstein cow is bleeding heavily from a middle uterine artery tear after calving, with pale mucous membranes, a heart rate of 110 beats/min, and a PCV of 14%. The farm is 2 hours from any laboratory. A healthy, mature donor cow of the same breed is chosen and her PCV is checked. How should compatibility be assessed before the full volume of whole blood is given?","options":["Card typing of donor and recipient","Start at 20 mL/kg/hr","Skip checks for a first transfusion","Major crossmatch at the laboratory","Give 200 mL, observe 10 minutes"],"correct":4,"why":"On the farm with no laboratory, the lecture's field (emergency) method is to give about 200 mL of donor blood first, observe for 10 minutes, and if there is no reaction, slowly transfuse the rest. A formal major crossmatch mixes recipient serum with donor RBCs in a laboratory. The recipient infusion starts slowly (0.1 mL/kg over 5-10 minutes) before increasing up to 20 mL/kg/hr.","wrong":{"0":"Card typing is described for dogs and cats; the lecture's cattle field method is a small test volume and observation.","1":"20 mL/kg/hr is the maximum rate after a slow start, not the starting rate or a compatibility check.","2":"The \"first transfusion, give anything\" rule is canine guidance; for cattle in the field the lecture still gives a 200 mL test volume and watches 10 minutes.","3":"A formal major crossmatch needs a laboratory, which is 2 hours away for this bleeding cow."},"lec":"W4: Transfusion Medicine","weeks":[4],"mods":[2]},{"stem":"A 30-year-old man develops sudden abdominal pain and vomiting 4 hours after eating home-made raw marinated herring from a wild-caught fish. No one else at the meal ate the herring, and he did not eat shellfish, tuna, or deli meats. Which agent is most likely?","options":["Diphyllobothrium latum","Scombrotoxin","Vibrio parahaemolyticus","Anisakis larvae","Listeria monocytogenes"],"correct":3,"why":"Symptoms within hours of eating raw or undercooked wild-caught fish fit anisakiasis: humans are infected by eating fish containing the larvae, and the lecture states that symptoms appear within hours. The broad fish tapeworm also comes from raw fish, but it causes long-lasting infections that are mostly asymptomatic.","wrong":{"0":"Diphyllobothrium causes long-lasting, mostly asymptomatic infections (up to 25 years), not pain within hours.","1":"Scombrotoxin is histamine poisoning from poorly refrigerated fish such as tuna and mahi-mahi, which he did not eat.","2":"Vibrio infections mostly follow raw shellfish such as oysters, which he did not eat.","4":"Listeria is linked to ready-to-eat foods such as deli meats and soft cheeses."},"lec":"W6: Food Safety","weeks":[6],"mods":[2]},{"stem":"A 4-year-old neutered male mixed-breed dog has gingival bleeding, epistaxis, and petechiae on the ventral abdomen. Platelets are 310,000/µL (reference interval 200,000-500,000) on a clean draw with no clumps on the smear, PT and aPTT are normal, and he receives no medications. Which test should be performed next?","options":["PT and aPTT panel","Buccal mucosal bleeding time","Bone marrow aspirate","Repeat platelet count","Abdominal ultrasound for bleeding"],"correct":1,"why":"Petechiae, epistaxis, and mucosal bleeding are signs of a primary hemostatic disorder (platelets and vasculature). With a normal platelet count, the next question is platelet function or the vessel wall, and the lecture's platelet testing moves to function tests such as the buccal mucosal bleeding time, clot retraction, aggregation, and thromboelastography. PT and aPTT assess secondary hemostasis and are already normal.","wrong":{"0":"PT and aPTT assess coagulation factors (secondary hemostasis), and they are already normal.","2":"Marrow sampling is for multiple non-regenerating cell lines or suspected neoplasia; his platelet count is normal.","3":"A clean draw with no clumps already confirms the normal count.","4":"Ultrasound looks for cavity bleeds, a secondary hemostatic pattern; his bleeding is surface bleeding."},"lec":"W4: Anemia and Thrombocytopenia","weeks":[4],"mods":[2]},{"stem":"A 12-year-old white-eared domestic shorthair cat has squamous cell carcinoma of the nasal planum that cannot be fully excised. The oncologist plans radiation therapy for local control and gives a chemotherapy drug during the radiation course. Which indication for systemic therapy does this use represent?","options":["Downstaging before surgery","Sensitizing tissues to radiation","Adjuvant treatment of micrometastasis","Treating a measurable sensitive tumor","Curing localized disease"],"correct":1,"why":"The lecture lists four indications for systemic cancer therapy: a measurable sensitive tumor (lymphoma), adjuvant therapy after surgery for micrometastasis (osteosarcoma, hemangiosarcoma), downstaging before definitive therapy, and sensitizing tissues to radiation therapy, with SCC and TCC as the examples. Chemotherapy given with radiation for SCC fits radiosensitization.","wrong":{"0":"Downstaging shrinks a tumor before definitive therapy; no surgery is planned here.","2":"Adjuvant chemotherapy treats micrometastasis after surgery, as in osteosarcoma and hemangiosarcoma.","3":"A measurable sensitive tumor is the lymphoma example, where chemotherapy is the main treatment.","4":"The lecture presents chemotherapy as delaying, not curing, cancer."},"lec":"W7: Intro to Oncology","weeks":[7],"mods":[2]},{"stem":"A 2-year-old neutered male Labrador retriever in Florida had a draining cutaneous mass on the hind limb diagnosed as pythiosis by histology and a Mira Vista ELISA. The mass was removed with wide margins, and he is on itraconazole, terbinafine, and prednisone. Which follow-up plan does the lecture support for monitoring?","options":["Urine antigen test monthly","Serum antigen titer monthly","No monitoring after resection","ELISA about every 3 months","Fungal culture every 2 weeks"],"correct":3,"why":"Pythiosis, caused by an oomycete in the southeastern USA, affects the GI tract and skin. The lecture states the Mira Vista ELISA has over 99% sensitivity and specificity and can be used for diagnosis and for monitoring about every 3 months. Treatment is wide surgical resection when possible, and itraconazole, terbinafine, and prednisone cure only 10-25%.","wrong":{"0":"Urine antigen testing is the monitoring tool for blastomycosis.","1":"Monthly serum antigen titers monitor cryptococcosis.","2":"Medical therapy cures only 10-25%, and the lecture uses the ELISA for monitoring.","4":"Culture is a diagnostic option, not the lecture's monitoring tool."},"lec":"W6: Systemic Fungal Infections","weeks":[6],"mods":[2]},{"stem":"A 13-year-old spayed female cocker spaniel has a large oral melanoma with pulmonary metastases. The owner declines surgery and chemotherapy and wants to keep her comfortable and eating at home for as long as possible, within a limited budget. Which radiation protocol best fits these goals?","options":["Fine fractionation","Stereotactic body radiation","Brachytherapy implant","Systemic radioisotope (I131)","Coarse fractionation"],"correct":4,"why":"With metastatic disease and a goal of comfort at lower cost, the aim is palliation. The review describes coarse fractionation (palliative intent) as larger doses once or twice weekly for about 4-6 treatments, less expensive, aimed at pain relief, comfort, and quality of life, with oral melanoma as an example. Fine fractionation and stereotactic radiation aim at definitive or long-term control.","wrong":{"0":"Fine fractionation (18-21 weekday treatments) is more expensive and aims at definitive long-term control.","1":"Stereotactic radiation is very specialized and aims at long-term control of discrete tumors.","2":"Brachytherapy injects a radioactive isotope into the tumor and is uncommon in veterinary medicine.","3":"Systemic radioisotopes such as I131 treat feline hyperthyroidism and canine thyroid cancer."},"lec":"W7: Oncology NAVLE Review","weeks":[7],"mods":[2]},{"stem":"A 5-year-old spayed female Doberman pinscher has been on trimethoprim-sulfa for 12 days for a skin infection. She now has shifting-leg lameness with swollen joints and petechiae on her gums. Platelets are 14,000/µL (reference interval 200,000-500,000) on a clean venipuncture with no clumps on the smear, PCV is 40% (reference interval 37-55%), and there is no bleeding into body cavities. How is this thrombocytopenia best categorized?","options":["Increased destruction","Consumption","Decreased production","Platelet clumping artifact","Genetic macrothrombocytopenia"],"correct":0,"why":"The Week 6 stewardship lecture lists sulfonamide side effects as blood dyscrasias and polyarthritis in Dobermans, which matches this dog's joint signs and petechiae on trimethoprim-sulfa. The Week 4 thrombocytopenia lecture places drug or toxin causes (TMS) under increased destruction and lists sulfa drugs as a less common trigger of immune-mediated thrombocytopenia.","wrong":{"1":"Consumption means platelets are used up in bleeding, vasculitis, or DIC; none is present.","2":"Decreased production comes from bone marrow disease and is rare; the sulfa drug points to destruction.","3":"A clean draw with no clumps on the smear rules out a falsely low count.","4":"Genetic macrothrombocytes are a sighthound finding in otherwise normal dogs; this Doberman has petechiae."},"lec":"Integration W4+W6: Sulfa thrombocytopenia","weeks":[4,6],"mods":[2]},{"stem":"A 12-year-old neutered male domestic shorthair cat has weight loss and vomiting. Abdominal ultrasound shows a single small intestinal mass, and fine needle aspirate cytology shows round cells packed with cytoplasmic granules, consistent with a mast cell tumor. Thoracic radiographs are normal. Which treatment does the lecture recommend?","options":["Surgery with wide margins","Prednisone alone","Vinblastine and prednisone","Tigilanol tiglate injection","Electrochemotherapy"],"correct":0,"why":"Granulated round cells identify a mast cell tumor, and its location makes it a feline intestinal mast cell tumor. The lecture's treatment for this form is surgery with wide margins, because metastasis to lymph nodes, liver, and spleen is common; prognosis ranges from 2 months to 1.5 years with surgery and/or tyrosine kinase inhibitors.","wrong":{"1":"Prednisone alone is the least aggressive option for non-resectable canine MCT, with about a 20% response.","2":"Vinblastine and prednisone is the post-operative protocol for high-risk canine MCT.","3":"Tigilanol tiglate is listed among options for canine MCT, not a resectable feline intestinal mass.","4":"Electrochemotherapy is listed for non-resectable canine MCT, not a resectable intestinal mass."},"lec":"W6: Mast Cell Tumors","weeks":[6],"mods":[2]},{"stem":"An 8-year-old neutered male Labrador retriever with multicentric lymphoma relapsed and is now refractory to CHOP. The oncologist starts lomustine (CCNU). Beyond a CBC for bone marrow suppression, which additional monitoring targets this drug's unique toxicity in dogs?","options":["Urinalysis for hematuria","Echocardiography","Thoracic radiographs","Liver enzymes","Urine protein measurement"],"correct":3,"why":"Lomustine (CCNU) is one of the review's options for lymphoma refractory to CHOP. Its common toxicity is bone marrow suppression, and its unique toxicity in dogs is liver injury, so liver enzymes are monitored; it is also lipophilic and crosses the blood-brain barrier.","wrong":{"0":"Sterile hemorrhagic cystitis is the unique toxicity of cyclophosphamide.","1":"Cumulative dose-related cardiotoxicity is the unique toxicity of doxorubicin.","2":"Pulmonary fibrosis is the unique toxicity of rabacfosadine (Tanovea).","4":"Protein-losing nephropathy is a toxicity of toceranib (Palladia)."},"lec":"W7: Oncology NAVLE Review","weeks":[7],"mods":[2]},{"stem":"A 6-year-old spayed female German shepherd in Grenada was treated for acute Ehrlichia canis infection with doxycycline 10 mg/kg PO q24h for 28 days, and her fever and thrombocytopenia resolved. A PCR on blood 2 weeks after the last dose is positive for E. canis. What is the most appropriate next step?","options":["Recheck PCR in 8 weeks","Stop and monitor antibody titers","Switch to imidocarb dipropionate","Continue doxycycline 4 more weeks","Begin immunosuppressive prednisone"],"correct":3,"why":"The lecture's monitoring plan is a PCR 2 weeks after treatment ends. If it is positive, treatment continues for 4 more weeks; if it is negative, PCR is rechecked in 8 weeks. Antibody titers may or may not become negative, so they do not replace the PCR plan.","wrong":{"0":"This is the plan after a negative PCR; a positive PCR means the infection has not cleared.","1":"Antibody titers may stay positive after treatment, so they cannot replace the PCR-based plan.","2":"Imidocarb is the lecture's drug for Babesia canis, not Ehrlichia.","4":"Immunosuppression does not clear a persistent infection; the lecture continues doxycycline."},"lec":"W4: Small Animal VBD","weeks":[4],"mods":[2]},{"stem":"A 4-year-old intact male German shorthaired pointer from Wisconsin has been on itraconazole for 4 months for disseminated blastomycosis. His cough and skin lesions have resolved, but the left eye has panophthalmitis, is blind, and remains painful despite treatment. The owner worries about the disease coming back. Which additional step does the lecture suggest?","options":["Topical clotrimazole infusion","Switch to fluconazole","Enucleation of the left eye","Stop itraconazole now","Add potassium iodide"],"correct":2,"why":"Ocular blastomycosis can include anterior uveitis, panophthalmitis, chorioretinitis, retinal detachment, and optic neuritis. The lecture advises considering enucleation if the eye could be a recurring source of infection, and recurrence occurs in about 20% of dogs. Itraconazole continues until there are no clinical signs, for at least 3-6 months.","wrong":{"0":"Topical clotrimazole is the treatment for nasal aspergillosis.","1":"Fluconazole is the lower-cost azole option; it does not address a blind, painful eye that may harbor infection.","3":"Itraconazole continues until there are no clinical signs, and the eye is still affected.","4":"Potassium iodide is listed for sporotrichosis, not blastomycosis."},"lec":"W6: Systemic Fungal Infections","weeks":[6],"mods":[2]},{"stem":"A 7-year-old spayed female boxer with lymphoma develops diarrhea after chemotherapy, and the oncologist prescribes metronidazole at 10 mg/kg PO q12h. A student asks which dosing change would most increase metronidazole's antibacterial effect, based on its pharmacodynamic class. Which change is supported by the lecture material?","options":["Larger dose, same interval","Same dose, more often","Same dose, longer course","Smaller dose, more often","Same dose, with a fatty meal"],"correct":0,"why":"The Week 7 oncology review lists metronidazole (10 mg/kg BID) for chemotherapy diarrhea and classifies it as concentration dependent and bactericidal. The Week 6 stewardship lecture states that for concentration-dependent drugs, dose is most important, so increasing the dose increases efficacy, while time-dependent drugs need more frequent dosing. The stewardship lecture also lists CNS side effects for metronidazole.","wrong":{"1":"More frequent dosing raises efficacy for time-dependent drugs, not concentration-dependent ones.","2":"Duration matters most for time-dependent drugs; it is not the lever for a concentration-dependent drug.","3":"Smaller, more frequent doses lower each dose, the opposite of what a concentration-dependent drug needs.","4":"A fatty meal is the slides' instruction for drugs such as atovaquone, not a pharmacodynamic lever."},"lec":"Integration W6+W7: Metronidazole dosing","weeks":[6,7],"mods":[2]},{"stem":"An alpaca farm in Pennsylvania borders woodland with many white-tailed deer, and the wet pastures have abundant snails. Last fall, two alpacas developed ascending hind limb weakness that progressed to recumbency, and CSF from one showed eosinophilia. The owner asks how to protect the rest of the herd. Which preventive plan does the lecture support?","options":["Monthly oral ivermectin","Monthly injectable ivermectin","Monthly ivermectin pour-on","Fenbendazole with steroids","Insecticide ear tags for flies"],"correct":1,"why":"Ascending paralysis beginning in the hind limbs with CSF eosinophilia, in camelids exposed to deer and snails, fits meningeal worm (Parelaphostrongylus tenuis). The lecture's prevention is reducing exposure to deer and snails plus avermectins as monthly injections, because oral dosing is not efficacious and pour-ons are not for camelids.","wrong":{"0":"The lecture states oral avermectin is not efficacious for this prevention.","2":"Pour-ons are listed for other species but not for camelids.","3":"Fenbendazole with or without steroids is treatment for affected animals, not herd prevention.","4":"Ear tags are a localized insecticide; P. tenuis reaches camelids through snails, not insects."},"lec":"W5: Livestock VBD","weeks":[5],"mods":[2]},{"stem":"On a commercial unit, several 5-month-old finishing pigs from a never-vaccinated herd develop a fever of 41°C, raised diamond-shaped skin plaques, and swollen joints, and they start eating within 12 hours of procaine penicillin G. The farmer starts the primary vaccination course in all in-contact pigs today. When can he expect the vaccine to protect them?","options":["2 weeks after the primary course","Immediately after the first dose","24 hours after the first dose","After the first booster a year later","Within 12 hours, like penicillin"],"correct":0,"why":"Fever, skin lesions, joint swelling, and a rapid response to penicillin in grower pigs fit erysipelas. The CBL notes that vaccination in the face of the outbreak has a delayed effect: no immunity is established until 2 weeks after the end of the primary course. Meanwhile, in-contact pigs have daily temperatures taken and febrile pigs are treated with penicillin.","wrong":{"1":"Vaccination does not give instant protection; immunity takes 2 weeks after the primary course.","2":"No immunity is established until 2 weeks after the primary course ends.","3":"Protection begins 2 weeks after the primary course, not after a later booster.","4":"The 12-hour response describes penicillin treatment of sick pigs, not vaccine immunity."},"lec":"W7: CBL Fever","weeks":[7],"mods":[2]},{"stem":"A bison ranch shares a fence line with a sheep flock. Shortly after the flock's lambing season, two bison develop high fever, corneal opacity starting at the edge of the cornea, mucopurulent nasal discharge, and oral erosions, and both die within days. PCR confirms the diagnosis. Which measure is most important to prevent further cases?","options":["Vaccinate the remaining bison","Isolate sick bison from herdmates","Control Culicoides midges","Treat in-contact bison with antivirals","Separate bison from lambing sheep"],"correct":4,"why":"Fever, corneal opacity beginning at the edge, mucopurulent discharge, and mucosal erosions in bison exposed to sheep fit malignant catarrhal fever. MCF is transmitted from asymptomatic carrier species such as sheep and goats, especially around lambing, and is generally not spread between affected animals. There is no vaccine, so the primary control is preventing contact between susceptible species and carriers.","wrong":{"0":"The lecture states there is no vaccine for MCF.","1":"MCF is generally not transmitted between affected animals, so isolating cases misses the source.","2":"Midge control applies to vector-borne bluetongue and EHD; MCF spreads from carrier sheep.","3":"Treatment of MCF is supportive and rarely effective; no antiviral is named."},"lec":"W5: Production Animal Viruses","weeks":[5],"mods":[2]},{"stem":"A 6-year-old neutered male dog with pemphigus has been on prednisone and azathioprine for 8 weeks, and his skin lesions have resolved. He now has pollakiuria, a urine culture grows Escherichia coli, and a new patch of pustules on the trunk grows Staphylococcus. He is bright and eating well. How are these new problems best interpreted?","options":["Relapse of pemphigus","Opportunistic infection","Expected PU/PD effect","Azathioprine anti-inflammatory failure","Glucocorticoid withdrawal"],"correct":1,"why":"The Immunomodulation lecture lists opportunistic infections, GI signs, and systemic effects as what to monitor during immunosuppressive treatment, adjusting the dose based on response and side effects. A culture-positive UTI and a new bacterial skin infection in a dog on prednisone and azathioprine are opportunistic infections; the Immune-Mediated Diseases lecture also warns that immunosuppression can cause resistant UTIs or skin infections that merit a call to the veterinarian.","wrong":{"0":"His pemphigus lesions resolved, and the new lesions grew bacteria.","2":"Pollakiuria with a positive urine culture is infection, not the expected PU/PD of glucocorticoids.","3":"Azathioprine is immunosuppressive and is not used for anti-inflammatory effects.","4":"He is still receiving prednisone, so the warning about stopping it abruptly does not apply."},"lec":"W4: Immunomodulation","weeks":[4],"mods":[2]},{"stem":"A closed dairy herd free of Mycoplasma bovis plans to buy 20 lactating cows from another dairy. A previous purchase brought in cattle that developed otitis, arthritis, treatment-resistant mastitis, and pneumonia. Which screening step does the lecture recommend for these lactating cows before purchase?","options":["Source herd bulk tank culture","Intradermal PPD skin test","Erysipelas ELISA serology","Pasteurized colostrum and milk","RB51 vaccination on arrival"],"correct":0,"why":"Otitis, arthritis, mastitis, and pneumonia in purchased cattle describe multisystemic Mycoplasma bovis infection, in which mastitis and arthritis carry a poor prognosis. The lecture's control is biosecurity: a closed herd or quarantine and screening, and for dairy cows, culture of the bulk tank from the herd of origin or of the individual animal if lactating.","wrong":{"1":"The intradermal PPD test screens for tuberculosis.","2":"Erysipelas ELISA monitors swine herd exposure and cannot separate vaccinated from infected pigs.","3":"Pasteurizing colostrum and milk is the calf measure; it does not screen purchased adult cows.","4":"RB51 is the Brucella abortus vaccine for heifers 4-12 months old."},"lec":"W5: Livestock Bacterial Disease","weeks":[5],"mods":[2]},{"stem":"A 2-year-old intact male boxer has a small, raised, hairless, button-like mass on the pinna. A fine needle aspirate is highly cellular, with many individual, discrete cells that have round nuclei and scant to moderate cytoplasm. There are no cytoplasmic granules, no pigment, and no cohesive clusters. Which tumor category fits these findings?","options":["Epithelial (carcinoma)","Mesenchymal (sarcoma)","Melanocytic tumor","Round cell tumor","Neuroendocrine tumor"],"correct":3,"why":"Discrete round cells in a highly cellular sample are the lecture's round cell pattern (discrete round cells plus high cellularity points to a round cell tumor). Epithelial cells are cohesive and polygonal in sheets, mesenchymal cells are spindle-shaped with wispy cytoplasm and low cellularity, melanoma is suggested by pigment, and neuroendocrine tumors form clusters or rosettes with naked nuclei.","wrong":{"0":"Epithelial cells are cohesive and polygonal, forming sheets or clusters, which are absent.","1":"Mesenchymal cells are spindle-shaped with wispy cytoplasm and give poorly cellular samples.","2":"Melanoma is suggested by pigment, which is absent.","4":"Neuroendocrine tumors form small clusters or rosettes with many naked nuclei."},"lec":"W7: Cytology of Lesions","weeks":[7],"mods":[2]},{"stem":"A 3-year-old intact male Labrador retriever that swims in farm ponds has 2 days of fever, vomiting, and lethargy. He is azotemic, and leptospirosis is confirmed by PCR on blood. Which antimicrobial does the lecture recommend for this bacteremic phase?","options":["Doxycycline","Enrofloxacin","Amoxicillin/clavulanate","Neomycin","Ampicillin"],"correct":4,"why":"Fever, vomiting, azotemia, and a positive blood PCR place this dog in the bacteremic phase of leptospirosis. The lecture's urogenital section lists ampicillin for leptospiral bacteremia and doxycycline for renal carriers, so ampicillin comes first and doxycycline follows to clear the carrier state.","wrong":{"0":"Doxycycline is the lecture's choice for renal carriers, the later phase of treatment.","1":"Enrofloxacin is listed for prostate infection and pneumonia combinations, not leptospiral bacteremia.","2":"Amoxicillin/clavulanate is the lecture's choice for UTI.","3":"Neomycin acts on the gut microbiota (hepatic encephalopathy), not systemic infection."},"lec":"W6: Antimicrobial Stewardship","weeks":[6],"mods":[2]},{"stem":"A 2-month-old beef calf has pneumonia, and transtracheal wash culture grows Mycoplasma bovis. The veterinarian reviews the drugs the lecture lists as labeled for M. bovis (tulathromycin, florfenicol, gamithromycin, and enrofloxacin) and considers adjusting the dose of one of them. For which drug is extra-label use prohibited in food animals?","options":["Tulathromycin","Florfenicol","Enrofloxacin","Gamithromycin","Oxytetracycline"],"correct":2,"why":"The Week 5 bacterial disease lecture lists Draxxin (tulathromycin), Nuflor (florfenicol), Zactran (gamithromycin), and Baytril (enrofloxacin) as labeled for M. bovis, with about 3 weeks of coverage. Enrofloxacin is a fluoroquinolone, and the Week 6 lectures list fluoroquinolones among the drugs whose extra-label use is never permitted in any food-producing animal, so a dose change would be prohibited ELDU.","wrong":{"0":"Tulathromycin is not on the prohibited ELDU list.","1":"The prohibited list names chloramphenicol, not florfenicol.","3":"Gamithromycin is not on the prohibited ELDU list.","4":"Oxytetracycline is not on the prohibited ELDU list."},"lec":"Integration W5+W6: M. bovis drug rules","weeks":[5,6],"mods":[2]},{"stem":"A 5-year-old spayed female mixed-breed dog in Grenada has acute hemolytic anemia with spherocytes and a positive saline agglutination test, meeting the lecture's criteria for IMHA. She has received no drugs or vaccines in the past 2 months. Which infectious testing best follows the lecture's approach to looking for an associative trigger?","options":["General infectious disease panel","FeLV and FIV testing","Toxoplasma serology","Babesia and Mycoplasma tests","Fungal blood culture"],"correct":3,"why":"After IMHA is diagnosed, the next step is to decide whether it is associative (secondary) by looking for triggers: a thorough history of drugs, recent vaccines, and toxins; infectious disease testing based on geography, especially Babesia and Mycoplasma; and imaging for neoplasia or inflammatory disease. The lecture stresses testing for the specific triggers known for each immune-mediated disease rather than a general infectious disease panel.","wrong":{"0":"The lecture says to test for specific diseases, not a general infectious disease panel.","1":"FeLV and FIV are feline retroviruses; this patient is a dog.","2":"Toxoplasma is named as a danger of immunosuppression in cats, not as an IMHA trigger in dogs.","4":"Fungal infection is not among the infectious triggers the lecture names for IMHA."},"lec":"W4: Immune-Mediated Diseases","weeks":[4],"mods":[2]},{"stem":"A 3-year-old spayed female indoor-outdoor cat that hunts around a barn used by bats has 6 weeks of depression, intermittent fever, and weight loss. She has pale mucous membranes and hepatosplenomegaly. CBCs over 3 weeks show persistent, unexplained pancytopenia without a reticulocyte response, and FeLV and FIV tests are negative. Which test is most likely to identify the cause?","options":["Bone marrow aspirate cytology","Fungal antibody serology","Fungal culture of blood","PARR clonality on peripheral blood","Flow cytometry of blood"],"correct":0,"why":"Insidious depression, fever, weight loss, pale membranes, and hepatosplenomegaly in a young cat exposed to a bat habitat fit histoplasmosis, which disseminates to lymph nodes, liver, spleen, bone marrow, and eyes; definitive diagnosis is identifying the organism, with cytology the key tool and serology poor (Week 6). The Week 7 bone marrow lecture lists persistent, unexplained cytopenias, especially more than one, and hunting for infectious organisms as reasons for a marrow aspirate.","wrong":{"1":"The fungal lecture rates serology as poor for histoplasmosis.","2":"Culture is rarely needed for histoplasmosis; cytology identifies the organism.","3":"PARR assesses lymphoid clonality for lymphoma, not fungal infection.","4":"Flow cytometry types leukemias and lymphomas, not fungal organisms."},"lec":"Integration W6+W7: Histoplasmosis in marrow","weeks":[6,7],"mods":[2]},{"stem":"An 8-year-old neutered male Labrador retriever has generalized peripheral lymphadenopathy. Lymph node cytology shows high-grade lymphoma, flow cytometry shows a B-cell phenotype, and he is substage a. He received no prednisone before diagnosis. Thoracic radiographs show cranial mediastinal lymph node enlargement. Which finding carries a negative prognosis?","options":["B-cell immunophenotype","Substage a","No prednisone before diagnosis","Cranial mediastinal enlargement","Multicentric peripheral nodal location"],"correct":3,"why":"The lecture's prognostic table lists cranial mediastinal lymph node enlargement as a negative factor. The other findings in this dog are not negative: the poorer prognosis goes with T-cell phenotype (unless T zone), substage b, prolonged steroid pretreatment, and locations such as GI, cutaneous, CNS, hepatosplenic, or primary lymphoblastic leukemia.","wrong":{"0":"T-cell phenotype is the negative factor; B cell typically has the better prognosis.","1":"Substage a is a positive factor; substage b is negative.","2":"Prolonged steroid pretreatment is negative, so no prednisone before diagnosis is not a negative finding.","4":"The negative locations are GI, cutaneous, CNS, hepatosplenic, and primary lymphoblastic leukemia, not multicentric disease."},"lec":"W7: Lymphoma","weeks":[7],"mods":[2]},{"stem":"In winter, several beef cows fed a new batch of spoiled, moldy sweet clover hay develop large subcutaneous hematomas and prolonged bleeding after dehorning. PT and aPTT are prolonged, platelet counts are within reference intervals, and liver enzymes are normal. Which cause is most likely?","options":["Bracken fern toxicity","Dicoumarol toxicity","BVDV type 2 infection","Hepatic disease","Chronic copper toxicity"],"correct":1,"why":"Hematomas and prolonged bleeding with prolonged PT and aPTT but normal platelets point to a clotting defect rather than thrombocytopenia. The lecture lists moldy sweet clover hay or silage, in which coumarin plus mold forms dicoumarol, as a cause of clotting defects in cattle. Liver disease also prolongs PT and aPTT, but liver enzymes are normal here.","wrong":{"0":"Bracken fern suppresses the marrow, causing thrombocytopenia, leukopenia, and anemia; platelets are normal.","2":"BVDV type 2 destroys megakaryocytes and causes thrombocytopenia; platelets are normal.","3":"Liver disease prolongs PT and aPTT, but normal liver enzymes and the feed history point to dicoumarol.","4":"Chronic copper toxicity causes intravascular hemolysis with liver damage, not a clotting defect."},"lec":"W5: Large Animal Anemia","weeks":[5],"mods":[2]},{"stem":"A 7-year-old neutered male Labrador retriever has a 6 cm mast cell tumor on the distal forelimb. Biopsy shows a high-grade tumor, staging is negative, and the surgeon cannot remove it with adequate margins at its current size. The oncologist starts chemotherapy now and plans surgery later. What is the purpose of starting systemic therapy before surgery?","options":["Replace surgery altogether","Predict response with a panel","Reduce risk in a low-grade tumor","Shrink the tumor for surgery","Treat already confirmed metastasis"],"correct":3,"why":"The mast cell tumor lecture lists three settings for systemic therapy: after surgery for high grade II or grade III tumors or negative prognostic factors, for non-resectable or too-numerous tumors, and as neoadjuvant therapy to shrink a tumor for surgery. This high-grade tumor cannot be excised with margins at its current size, so chemotherapy comes first to shrink it so surgery can follow.","wrong":{"0":"The plan is surgery after shrinkage; neoadjuvant therapy prepares for surgery rather than replacing it.","1":"The lecture states prognostic panels will not predict response to therapy.","2":"This tumor is high grade, and chemotherapy does not reduce recurrence in low-grade tumors.","4":"Staging is negative, so there is no confirmed metastasis to treat."},"lec":"W6: Mast Cell Tumors","weeks":[6],"mods":[2]},{"stem":"A 4-year-old neutered male Labrador retriever in Wisconsin, vaccinated against Lyme disease every year, has acute lameness in several joints and a fever of 39.8°C. Synovial fluid from multiple joints shows non-degenerate neutrophils, and an IFA for Borrelia burgdorferi is positive. Which test best distinguishes natural infection from his vaccine response?","options":["Paired IFA titers","Western immunoblot","ELISA antibody test","Synovial fluid cytology","Complete blood count"],"correct":1,"why":"Vaccinated dogs remain seropositive for years, so the lecture warns that IFA or ELISA results might not help in a vaccinated dog. The Western immunoblot distinguishes infected from vaccinated animals, although it is not widely available. Non-degenerate neutrophils in multiple joints fit acute Lyme polyarthritis, but cytology does not identify vaccine status.","wrong":{"0":"IFA detects antibodies that vaccination also produces, so repeat IFA cannot separate the two.","2":"The lecture groups ELISA with IFA as tests that might not help in vaccinated dogs.","3":"Abnormal synovial fluid is common in acute Lyme disease but does not separate infection from vaccination.","4":"The lecture notes the CBC is usually normal in Lyme borreliosis, and it says nothing about vaccine status."},"lec":"W4: Small Animal VBD","weeks":[4],"mods":[2]},{"stem":"During a foot-and-mouth disease outbreak in a previously free country, authorities vaccinate cattle and pigs on farms surrounding the infected premises to create a disease buffer. No marker (DIVA) vaccine is available. Once the outbreak is under control, what is expected to happen to the vaccinated animals?","options":["Released after negative ELISA","Kept as a permanent buffer","Culled after the outbreak","Boosted every year","Exported to FMD-free countries"],"correct":2,"why":"The lecture states that eradication is preferred for FMD and that vaccination is sometimes used only to create disease buffers, with the vaccinated animals culled once the disease is under control. With no marker (DIVA) vaccine, vaccinated animals cannot be distinguished from infected ones, and a country that keeps vaccinating would lose trade.","wrong":{"0":"Without a DIVA vaccine, an antibody ELISA cannot separate vaccinated from infected animals.","1":"Eradication, not ongoing vaccination, is preferred because a vaccinating country loses trade.","3":"One vaccine does not protect against all 7 serotypes and over 80 subtypes, and routine vaccination costs trade.","4":"Vaccinated animals cannot be shown free of infection without a DIVA test, so they are culled, not traded."},"lec":"W5: Production Animal Viruses","weeks":[5],"mods":[2]},{"stem":"A 9-year-old gelding shared a pasture, and a reused vaccination needle, with a horse that tested Coggins positive for equine infectious anemia 10 days ago. The gelding is healthy, and his Coggins test today is negative. What is the most appropriate next step?","options":["Release from isolation now","Euthanize as a lifelong carrier","Vaccinate against EIA","Annual Coggins only","Repeat Coggins in 6 weeks"],"correct":4,"why":"The gelding had two exposures the lecture describes: biting flies on shared pasture and iatrogenic spread through a reused needle. Horses seroconvert 16-42 days after infection, so a negative Coggins test 10 days after exposure does not rule out infection, and he should stay isolated and be retested after that window. A positive horse would be a lifelong carrier needing euthanasia or strict permanent isolation.","wrong":{"0":"A test at 10 days falls inside the 16-42 day seroconversion window, so a negative result is not reliable yet.","1":"Euthanasia or permanent isolation applies to positive horses; he has not tested positive.","2":"The lecture states there is no vaccine or treatment for EIA.","3":"Annual testing is routine screening, not follow-up after a known exposure."},"lec":"W5: Equine VBD and Viruses","weeks":[5],"mods":[2]},{"stem":"A 3-year-old Devon Rex cat with severe anemia needs a whole blood transfusion. Card typing shows she is blood type B, and she has never been transfused. Four healthy donor cats are available: Mocha (type A, FeLV and FIV negative), Pepper (type B, FIV positive), Tiger (type B, FeLV and FIV negative), and Luna (domestic shorthair, untyped, FeLV and FIV negative). Which donor is most appropriate?","options":["Tiger","Mocha","Pepper","Luna","A healthy dog donor"],"correct":0,"why":"Type B cats have strong naturally occurring anti-A antibodies, so type A blood given to a type B cat causes a severe acute hemolytic reaction, and less than 1 mL can be fatal (Week 4). The Week 5 companion animal viral lecture adds that blood donor cats must be screened for FIV and FeLV. Tiger is the only donor who is both type B and retrovirus negative.","wrong":{"1":"Type A blood given to a type B cat can be fatal even in volumes under 1 mL.","2":"Pepper's type matches, but donor cats must be screened, and an FIV-positive cat should not donate.","3":"Cats must be typed; most domestic shorthairs in the USA are type A, so an untyped donor risks a fatal mismatch.","4":"Xenotransfusion is described only for emergent situations, and a compatible, screened feline donor is available."},"lec":"Integration W4+W5: Feline donor selection","weeks":[4,5],"mods":[2]},{"stem":"A 9-month-old intact male Labrador retriever that chews household objects has 4 days of lethargy and red-brown urine today. Mucous membranes are pale and mildly icteric. PCV is 17% (reference interval 37-55%) with polychromasia and reticulocytosis, and the plasma is pink. The saline agglutination test is negative and no spherocytes are seen. Which test should be prioritized next?","options":["Abdominal radiographs","Thoracic radiographs for triggers","Bone marrow aspirate","PT and aPTT panel","Abdominal FAST for cavity fluid"],"correct":0,"why":"Pigmenturia with pink plasma, a regenerative response, and no spherocytes or autoagglutination point to intravascular hemolysis rather than blood loss or IMHA. For increased destruction, the lecture's imaging starts with abdominal radiographs and links intravascular hemolysis to \"pennies\" (metal objects), which fits a young dog that chews objects. Toxin and oxidative causes such as metals are found through history and imaging.","wrong":{"1":"Thoracic imaging looks for immune triggers such as neoplasia; nothing here suggests an immune-mediated process.","2":"A marrow aspirate is for multiple non-regenerating cell lines or suspected neoplasia; this anemia is regenerative.","3":"Coagulation tests investigate cavity bleeds (secondary hemostasis); this is hemolysis, not blood loss.","4":"Looking for cavity fluid investigates whole blood loss, but pigmenturia and pink plasma indicate hemolysis."},"lec":"W4: Anemia and Thrombocytopenia","weeks":[4],"mods":[2]},{"stem":"A sheep producer with a valid VCPR asks the veterinarian to treat lame market lambs with an NSAID that is FDA-approved for cattle but not labeled for sheep. No approved drug for this use in sheep is available, and a FARAD withdrawal interval is assigned. Which record-keeping requirement applies?","options":["Keep records at least 6 months","Keep records at least 2 years","Keep records until slaughter only","Keep records for 1 year","Keep records only if a residue occurs"],"correct":1,"why":"Using a cattle-labeled drug in sheep, a minor species, is extra-label drug use because the species differs from the label. AMDUCA permits it with a valid VCPR, a diagnosis, an FDA-approved drug, no effective approved alternative, and a science-based withdrawal interval from FARAD, and records of ELDU must be kept for at least 2 years.","wrong":{"0":"Six months is shorter than the lecture's 2-year minimum for ELDU records.","2":"Records must be kept at least 2 years, not only until the lambs are sold.","3":"One year is shorter than the lecture's 2-year minimum.","4":"Records are required for every extra-label use, not only when a residue is found."},"lec":"W6: Livestock Prescribing","weeks":[6],"mods":[2]},{"stem":"A 30 kg neutered male springer spaniel with primary immune-mediated hemolytic anemia was discharged on prednisone at 2 mg/kg/day. Three weeks later he is bright, his PCV has risen from 14% to 38% (reference interval 37-55%), and spherocytes are no longer seen. Following the lecture's weaning plan, what should his new daily prednisone dose be?","options":["30 mg/day","15 mg/day","45 mg/day","54 mg/day","7.5 mg/day"],"correct":2,"why":"His starting dose is 30 kg × 2 mg/kg/day = 60 mg/day. The lecture's plan is to wean slowly by about 25% every 2-4 weeks over 4-6 months, so the next step is 60 - 15 = 45 mg/day. Immunosuppressive doses cannot be stopped suddenly, and the goal is to get the dog off immunosuppression over time.","wrong":{"0":"This halves the dose, a faster cut than the roughly 25% step the lecture recommends.","1":"This keeps only 25% of the dose instead of removing 25%.","3":"This is a 10% reduction, smaller than the lecture's roughly 25% step.","4":"This is the physiologic dose (0.25 mg/kg/day); dropping straight to it would stop immunosuppression abruptly."},"lec":"W4: Immune-Mediated Diseases","weeks":[4],"mods":[2]},{"stem":"A 6-year-old Warmblood gelding has a flat-to-nodular, partly warty skin lesion growing at an old wound scar on his lower limb. A fine needle aspirate yields very few cells, mostly spindle cells with mild atypia. Which next step does the lecture recommend to confirm the diagnosis?","options":["Biopsy for histopathology","Diagnose sarcoid on cytology","Treat as reactive fibroplasia","BLV antibody ELISA","Ionized calcium measurement"],"correct":0,"why":"A skin lesion at a scar on the limb with a variable warty or nodular surface fits an equine sarcoid. The lecture warns that fibrous lesions often yield few cells and that spindle cells overlap with reactive fibroplasia, so histopathology confirms the diagnosis, and biopsy and treatment planning belong together.","wrong":{"1":"A poorly cellular spindle cell sample cannot separate sarcoid from reactive fibroplasia.","2":"Reactive fibroplasia is the overlap that makes cytology unreliable here; it cannot be assumed.","3":"BLV status relates to bovine lymphoma, not equine skin lesions.","4":"Ionized calcium investigates hypercalcemia, which is not reported here."},"lec":"W7: Large Animal Tumors","weeks":[7],"mods":[2]},{"stem":"At a beef slaughter plant, several feedlot steers from the same farm have small cysts (cysticerci) in their muscles. The feedlot irrigates its feed crops with water from a stream that runs past a workers' camp with no toilets. How did these cattle most likely become infected?","options":["Eating raw beef containing cysts","Ingesting pork with cysticerci","Ingesting human tapeworm eggs","Contact with infected cattle","Mosquito bites near the stream"],"correct":2,"why":"Cysticerci in beef muscle are the larval stage of Taenia saginata, the beef tapeworm, for which humans are the definitive host. Cattle are infected by consuming food or water contaminated with human tapeworm eggs, which hatch and develop into cysticerci. Proper human waste management and meat inspection are intervention points.","wrong":{"0":"Eating raw or undercooked beef with cysticerci is how humans get taeniasis, not how cattle are infected.","1":"Pork with cysticerci transmits T. solium taeniasis to humans; cattle are not infected this way.","3":"The life cycle needs a human definitive host; cattle do not infect each other directly.","4":"Taenia spreads through eggs in the environment, not by mosquitoes."},"lec":"W6: Food Safety","weeks":[6],"mods":[2]},{"stem":"An 8-year-old spayed female golden retriever collapses at home with a distended abdomen and no history of trauma. Ultrasound shows a ruptured splenic mass, and abdominocentesis yields non-clotting blood. PCV is 15% (reference interval 37-55%), she is tachycardic with weak pulses, and PT, aPTT, and platelet count are normal. She goes to surgery for splenectomy and needs red cells during the procedure. Which blood source is most appropriate?","options":["Salvaged abdominal blood","Donor whole blood","Fresh frozen plasma","Albumin","Cryoprecipitate"],"correct":1,"why":"Non-traumatic hemoabdomen in dogs is caused by a splenic mass in about 86% of cases, and 64% of ruptured splenic masses are malignant, most of them hemangiosarcoma, which spreads by seeding (Week 7). The Week 4 transfusion lecture allows emergency autotransfusion of intraoperatively salvaged blood but specifically excludes neoplastic effusions. She needs oxygen-carrying capacity, so donor whole blood is appropriate.","wrong":{"0":"Autotransfusion is excluded for neoplastic effusions, and a ruptured splenic mass is most often hemangiosarcoma.","2":"Plasma replaces coagulation factors; her clotting tests are normal and she needs red cells.","3":"Albumin addresses oncotic pressure in hypoalbuminemia, not oxygen-carrying capacity.","4":"Cryoprecipitate is a listed transfusion product but does not restore red cell mass."},"lec":"Integration W4+W7: Hemoabdomen transfusion","weeks":[4,7],"mods":[2]},{"stem":"An oncologist reviews five dogs referred for surgery to decide which can go straight to definitive surgery without a pretreatment biopsy. Which dog fits the lecture's criteria for skipping the pretreatment biopsy?","options":["Oral mass needing complex reconstruction","Mass whose type would change surgery","Nondiagnostic FNA, type unknown","Facial mass with difficult margins","Dog scheduled for limb amputation"],"correct":4,"why":"The review recommends a pretreatment biopsy when the type of treatment or surgery would change, when the area is difficult to reconstruct or to obtain complete margins, or when tumor type and prognosis are needed and FNA has not provided them. It is not recommended when surgical treatment would not be altered, as with a bleeding splenic mass, spinal cord or brain tumors, or amputation.","wrong":{"0":"A difficult area to reconstruct is a reason to biopsy first.","1":"When tumor type changes the surgery, a pretreatment biopsy is recommended.","2":"When tumor type is needed and FNA has not provided it, biopsy first is recommended.","3":"Difficulty obtaining complete margins is a reason to biopsy first."},"lec":"W7: Oncology NAVLE Review","weeks":[7],"mods":[2]},{"stem":"A 2-year-old unvaccinated dog adopted from a rescue survived an illness with fever, cough, and mucopurulent ocular discharge as a puppy. He now has thickened, hyperkeratotic footpads and nasal planum, enamel defects on his adult teeth, and persistent rhythmic muscle twitching (myoclonus). To which virus family does the most likely cause belong?","options":["Parvoviridae","Herpesviridae","Paramyxoviridae","Rhabdoviridae","Orthomyxoviridae"],"correct":2,"why":"Hyperkeratosis of the footpads and nasal planum and enamel hypoplasia in dogs that survive the acute phase, plus myoclonus, are the lecture's signs of canine distemper. The companion animal viral lecture places canine distemper virus in the paramyxoviruses (genus Morbillivirus), and the viral families lecture lists it in Paramyxoviridae with measles, rinderpest, and peste des petits ruminants viruses.","wrong":{"0":"Parvoviridae contains canine parvovirus; the footpad, enamel, and myoclonus findings are the distemper signs.","1":"Canine herpesvirus is in Herpesviridae; these findings are the lecture's distemper signs.","3":"Rabies (Rhabdoviridae) progresses to death within days of paralysis and does not leave a dog with chronic signs.","4":"Orthomyxoviridae contains the influenza viruses of birds, horses, pigs, and people."},"lec":"W5: Viral Family Epidemiology","weeks":[5],"mods":[2]},{"stem":"A 6-year-old spayed female cocker spaniel collapses with icteric mucous membranes and a PCV of 11% (reference interval 37-55%). A saline agglutination test shows macroscopic clumping that does not disperse, and spherocytes are present. Before a pRBC transfusion, a major and minor crossmatch is run with a donor unit, and the patient's control tube also shows agglutination. How should the crossmatch be interpreted?","options":["Major crossmatch incompatibility","Results cannot be interpreted","Minor crossmatch incompatibility","Compatible; transfuse the unit","Positive from prior pregnancy"],"correct":1,"why":"Persistent agglutination in saline, spherocytes, and icterus fit immune-mediated hemolytic anemia, with antibodies on the patient's own RBCs making them stick together. The lecture states that if the control tubes show agglutination or hemolysis, the crossmatch cannot be interpreted, and it names IMHA as the reason. Otherwise a crossmatch is positive when either agglutination or hemolysis is seen.","wrong":{"0":"The major crossmatch tests donor RBCs with patient plasma, but a positive control tube means no tube can be read.","2":"The minor crossmatch tests donor plasma with patient RBCs; her RBCs already agglutinate on their own.","3":"A compatible reading needs clean controls, and this control tube is positive.","4":"The lecture says crossmatching follows previous transfusion, not pregnancy, and pregnancy does not explain a positive control."},"lec":"W4: Transfusion Medicine","weeks":[4],"mods":[2]},{"stem":"A beef herd under quarantine for bovine tuberculosis has whole-herd caudal fold testing. One 2-year-old cow, bought from an infected herd 2 weeks before the test, is negative. She is sent to slaughter 4 months later, and culture of granulomatous lymph node lesions confirms Mycobacterium bovis. Which explanation best accounts for her negative skin test?","options":["Exposure to Johne's disease","Exposure to environmental mycobacteria","Reading the test at 72 hours","Infection too recent to react","High specificity of the CFT test"],"correct":3,"why":"A negative test in a truly infected animal is a false negative. The lecture lists infection at an early stage, before the animal mounts a detectable cell-mediated immune response, as a cause, along with suppressed immunity and imperfect test accuracy. This cow was exposed only 2 weeks before testing, so early infection explains the result.","wrong":{"0":"Exposure to M. avium subsp. paratuberculosis causes false positive results, not false negatives.","1":"Atypical environmental mycobacteria also cause false positives.","2":"Reading at about 72 hours by the same person is the correct procedure.","4":"Specificity concerns correct negatives in uninfected animals; a missed infected animal reflects sensitivity."},"lec":"W6: Bovine TB and Testing","weeks":[6],"mods":[2]},{"stem":"A 7-year-old neutered male FIV-positive cat started zidovudine (AZT) 6 weeks ago and is now lethargic with pale mucous membranes. PCV is 17% (reference interval 30-45%), the anemia is normocytic and normochromic, and the reticulocyte count is inadequate for the degree of anemia. He is FeLV negative, is not icteric, has no spherocytes, and his fecal occult blood test is negative. Which cause is most likely?","options":["Immune-mediated hemolysis","Zidovudine adverse effect","Chronic GI blood loss","FeLV-related marrow disease","Feline infectious peritonitis"],"correct":1,"why":"A normocytic, normochromic anemia without an adequate reticulocyte response is non-regenerative, and the lecture warns that AZT should be used with care because it can cause non-regenerative anemia. The timing after starting AZT, a negative FeLV test, and no evidence of hemolysis or blood loss make the drug the most likely cause.","wrong":{"0":"Immune-mediated hemolysis is regenerative and brings icterus or spherocytes, which are absent.","2":"Chronic GI bleeding causes iron deficiency, and fecal occult blood is negative.","3":"FeLV is a listed cause of bone marrow disease, but this cat is FeLV negative.","4":"FIP is supported by effusions, a low A:G ratio, and high AGP, none of which are described."},"lec":"W5: Companion Animal Viruses","weeks":[5],"mods":[2]},{"stem":"A dairy cow that responded to the caudal fold tuberculin test is classified as a reactor on the comparative cervical test by a regulatory veterinarian and is sent to slaughter. How should she be handled under meat inspection?","options":["Routine slaughter and inspection","Condemned at ante-mortem","US Suspect, special post-mortem","Euthanized on the farm","Passed if she looks healthy"],"correct":2,"why":"A comparative cervical test reactor must be removed from the herd. At meat inspection, tuberculin reactors are handled as U.S. Suspects and undergo a special post-mortem examination at a USDA-designated slaughter facility, where lymph nodes, lungs, and other organs are examined and suspicious lesions may be sent to NVSL. Confirmed TB cases lead to carcass condemnation.","wrong":{"0":"Reactors need a special post-mortem, not routine inspection, because their findings support TB surveillance.","1":"Reactors are not condemned before slaughter; condemnation follows confirmed TB at post-mortem.","3":"Euthanasia instead of slaughter applies to non-ambulatory cattle, not ambulatory reactors.","4":"Infected cattle may show only decreased production, so a normal appearance does not clear a reactor."},"lec":"W6: Ante-Mortem Inspection","weeks":[6],"mods":[2]},{"stem":"A 3-year-old retired racing greyhound has fever, icterus, and hemoglobinuria. PCV is 15% (reference interval 37-55%), and a Giemsa-stained blood smear shows large, irregular intraerythrocytic piroplasms. PCR confirms Babesia canis, and the clinician plans imidocarb dipropionate. Which drug should be given before the injection?","options":["Maropitant","Heparin","Clindamycin","Dexamethasone","Atropine"],"correct":4,"why":"Large, irregular piroplasms and PCR in a greyhound identify Babesia canis, which the lecture says affects greyhounds more severely. The B. canis protocol is imidocarb dipropionate 5-6.6 mg/kg SC once, repeated in 2-3 weeks, with pretreatment using atropine or glycopyrrolate to prevent SLUD signs. Clindamycin, metronidazole, and doxycycline form a separate triple therapy.","wrong":{"0":"Maropitant is an anti-emetic used for chemotherapy nausea, not the pretreatment for imidocarb.","1":"Heparin is part of the cytauxzoonosis protocol in cats.","2":"Clindamycin belongs to the triple therapy given with imidocarb; it does not prevent SLUD signs.","3":"Glucocorticoids treat immune-mediated disease and transfusion reactions; they are not the imidocarb pretreatment."},"lec":"W4: Small Animal VBD","weeks":[4],"mods":[2]},{"stem":"A 14-year-old Thoroughbred gelding has 3 months of poor performance and mild lethargy. He eats a balanced diet and has no history of trauma or visible bleeding. PCV is 23% (reference interval 32-48%), and the anemia is microcytic and hypochromic with low serum iron. White cells, platelets, and total protein are within reference intervals. Which underlying process should be investigated first?","options":["Chronic GI blood loss","Dietary iron deficiency","Anemia of chronic disease","Bone marrow failure","Acute internal hemorrhage"],"correct":0,"why":"A mild, microcytic, hypochromic anemia with low iron points to iron deficiency, a decreased production anemia. The Week 4 anemia lecture lists chronic GI bleeding as the cause of iron deficiency, and the Week 5 equine anemia lecture states that iron deficiency comes from chronic blood loss because dietary deficiency is rare in adults with good iron storage. GI signs and fecal occult blood are the next diagnostics.","wrong":{"1":"Dietary deficiency is rare in adults because of good storage; it occurs mainly in stalled foals.","2":"Anemia of chronic disease is normocytic and normochromic, not microcytic and hypochromic.","3":"Bone marrow disease causes pancytopenia; white cells and platelets are normal.","4":"After acute blood loss, RBC parameters start normal and PCV falls over about 24 hours; this anemia is chronic."},"lec":"Integration W4+W5: Equine iron deficiency","weeks":[4,5],"mods":[2]},{"stem":"A 5-year-old Holstein cow is euthanized after 2 days of fever and anorexia. At necropsy the left hind quarter of the udder is swollen and firm and oozes creamy yellow pus when cut; the other three quarters are normal. A pathology resident writes the morphologic diagnosis as \"Mastitis, suppurative, acute, severe.\" Which required component of a morphologic diagnosis is missing?","options":["Distribution","Duration","Severity","Etiology","Specific anatomic location"],"correct":0,"why":"A morphologic diagnosis needs at least three components: organ or tissue, process, and distribution. \"Mastitis\" gives the tissue and \"suppurative\" gives the process, while \"acute\" and \"severe\" are modifiers, so the pattern within the tissue (focal, multifocal, locally extensive, or diffuse) is missing. The lecture lists severity, duration, and specific anatomic location as useful but not always required.","wrong":{"1":"Duration is already present (\"acute\"), and the lecture treats it as an additional modifier, not a required component.","2":"Severity is already present (\"severe\") and is a modifier, the most subjective descriptor.","3":"Etiology names the causative agent only; a morphologic diagnosis generally does not identify the cause.","4":"Specific anatomic location is an additional modifier that is useful but not always required."},"lec":"W4: Morphologic Diagnosis","weeks":[4],"mods":[2]},{"stem":"A 9-year-old spayed female cat has a firm subcutaneous mass at the site of her last vaccination. Records show it appeared after that injection, given 4 months ago; it now measures 1.4 cm and has not changed in size over the last 6 weeks. Which finding meets the lecture's criterion to investigate the mass?","options":["Diameter of 1.4 cm","No growth over 6 weeks","Present more than 3 months","Located at a vaccination site","Firm subcutaneous texture"],"correct":2,"why":"The 3-2-1 rule calls for investigating a mass at a vaccination site if it is present more than 3 months after vaccination, is larger than 2 cm, or is increasing in size 1 month after injection. This mass is 1.4 cm and stable, but it has persisted 4 months, which meets the 3-month criterion. Cytology is supportive, and incisional, not excisional, biopsy follows if needed.","wrong":{"0":"The size criterion is greater than 2 cm; 1.4 cm does not meet it.","1":"The growth criterion is a mass that is increasing 1 month after injection; this one is stable.","3":"The rule applies to masses at vaccination sites, but location is not one of its three triggers.","4":"Texture is not part of the 3-2-1 rule."},"lec":"W7: Sarcomas","weeks":[7],"mods":[2]},{"stem":"In late autumn, a 10-year-old Quarter horse gelding kept in a paddock lined with red maple trees develops lethargy, icterus, and dark brown urine. Methemoglobinemia is detected, and the blood smear shows numerous Heinz bodies. His Coggins test is negative and no ticks are found. Which diagnosis is most likely?","options":["Equine infectious anemia","Equine piroplasmosis","Immune-mediated hemolytic anemia","Brassica toxicity","Red maple leaf toxicity"],"correct":4,"why":"Heinz bodies and methemoglobinemia indicate oxidative damage to RBCs. The lecture lists red maple leaf (Acer rubrum) as an oxidative cause of hemolysis with camelids and horses the species at risk, and the equine work-up diagnoses it from exposure history, Heinz bodies, and methemoglobinemia. Treatment is dilution and supportive care, and prevention is no access.","wrong":{"0":"EIA is diagnosed with a Coggins test, which is negative here.","1":"Piroplasmosis is tick-borne and diagnosed by smear, PCR, or serology; no ticks or piroplasms are reported.","2":"Equine IMHA is a diagnosis of exclusion with spherocytes; Heinz bodies point to oxidative injury instead.","3":"The lecture names cattle as the species at risk from brassicas, not horses under maple trees."},"lec":"W5: Large Animal Anemia","weeks":[5],"mods":[2]},{"stem":"A 6-year-old spayed female golden retriever with multicentric lymphoma lives on a farm and runs with the horses every day. Eight days after a chemotherapy dose she is bright, eating, and afebrile, with no bleeding. The CBC shows platelets of 35,000/µL (reference interval 200,000-500,000), neutrophils of 4,200/µL (reference interval 3,000-11,500), and a normal hematocrit. What is the most appropriate plan?","options":["Hospitalize for IV antibiotics","Limit activity; reduce dose","Platelet transfusion today","Start immunosuppressive prednisone","Stop chemotherapy permanently"],"correct":1,"why":"Thrombocytopenia soon after a chemotherapy dose, with normal neutrophils and no fever, is a myelosuppressive side effect. The lecture's management is to prevent traumatic events (dog parks, running with horses or cows, climbing trees) and to reduce the dose of that drug. Antibiotics and hospitalization are for neutropenia, particularly febrile neutropenia.","wrong":{"0":"Hospitalization with IV antibiotics is for febrile neutropenia; her neutrophils are normal.","2":"The lecture manages chemotherapy thrombocytopenia with activity restriction and dose reduction, and she is not bleeding.","3":"Immunosuppressive prednisone treats immune-mediated thrombocytopenia; this drop follows chemotherapy.","4":"The lecture reduces the dose of that drug rather than stopping chemotherapy."},"lec":"W7: Intro to Oncology","weeks":[7],"mods":[2]}];
var LET = ["A", "B", "C", "D", "E"];
