<script>
var CFG = {"id":"m4","title":"Module 4 Practice Exam: Systems 4 SSI","intro":"60 questions from Weeks 12-15, built from the Systems 4 SSI lecture slides. 90 minutes: 3 blocks of 20, about 30 minutes each.","minutes":90,"block":20,"final":false,"xnote":"Some questions combine material from two or more weeks. They count toward every week they draw on.","submitNote":"You will see your score by week and by lecture, then review every question with explanations."};
var QS = [{"stem":"A 4-year-old, 30-kg spayed standard poodle has multifocal patchy alopecia with marked scaling and follicular casts. Biopsy shows lymphocytic-plasmacytic inflammation directed against the sebaceous glands. Along with topical oil therapy, the plan adds oral omega-3 fatty acids at the lecture's dose. How much combined EPA and DHA should she receive?","options":["180 mg daily","540 mg daily","5,400 mg daily","1,080 mg twice daily","1,080 mg daily"],"correct":4,"why":"Scaling with follicular casts and inflammation targeting the sebaceous glands in a poodle is sebaceous adenitis. The systemic treatment slide gives 180 mg of combined EPA and DHA per 5 kg of body weight daily, so 30 kg / 5 kg x 180 mg = 1,080 mg once daily.","wrong":{"0":"180 mg is the amount for each 5 kg, not the total for a 30-kg dog.","1":"540 mg is half the dose, as if she weighed 15 kg.","2":"5,400 mg comes from giving 180 mg per kilogram instead of per 5 kg.","3":"The slide gives a daily amount, so twice daily doubles the dose."},"lec":"W13: Alopecia","weeks":[13],"mods":[4]},{"stem":"A 4-year-old spayed domestic shorthair cat has been on oral prednisolone for 3 weeks for presumed eosinophilic facial dermatitis that began after a stressful house move. The ulcers and crusts on her nose and eyelids are worse, and she now has conjunctivitis with a geographic corneal ulcer in the left eye. Cytology of the facial lesions shows eosinophilic inflammation. Which plan fits both lectures?","options":["Raise the prednisolone dose","Add topical steroid drops","Add cyclosporine","Antiviral; lower the steroid","Tetracycline for every cat at home"],"correct":3,"why":"Facial ulcers with eosinophilic inflammation, a poor response to steroids, stress, and concurrent eye disease support FHV-1 dermatitis; the Week 13 treatment slide lists famciclovir and dose reduction of immunosuppressive drugs. The Week 14 conjunctiva lecture names steroid administration as a trigger of recurrent FHV-1 and says steroids are contraindicated in cytolytic disease such as a geographic ulcer.","wrong":{"0":"Steroids are a flare factor for FHV-1, and the lesions worsened on them.","1":"Topical steroids are contraindicated in cytolytic herpetic disease.","2":"Cyclosporine belongs to immunopathologic herpetic keratitis, not cytolytic ulceration.","4":"Treating every cat with tetracycline is the plan for Chlamydia, which causes chemosis without corneal involvement."},"lec":"Integration W13+W14: FHV-1 on steroids","weeks":[13,14],"mods":[4]},{"stem":"A 7-month-old male Labrador retriever puppy has had pruritus of the face, axillae, and front feet for 2 months. Fleas and Sarcoptes have been ruled out, a secondary pyoderma has been treated, and a strict 8-week elimination diet trial with provocation was negative, so atopic dermatitis is diagnosed. He is due for his final puppy vaccines. The owner wants a daily oral tablet that gives relief within hours and can be used long term, without glucocorticoids. Which drug fits the lecture?","options":["Oclacitinib","Ilunocitinib","Atinvicitinib","Cyclosporine A","Prednisolone"],"correct":2,"why":"JAK inhibitors give rapid relief of allergic pruritus within hours and suit long-term management, but the slides list young dogs as a caution for oclacitinib and ilunocitinib. The activity review notes that atinvicitinib (Numelvi) can be used in puppies 6 months and older.","wrong":{"0":"Oclacitinib is listed with a caution for young dogs.","1":"Ilunocitinib carries cautions for young dogs and vaccines, and this puppy is due for vaccines.","3":"Cyclosporine has a slow onset of 2-4 weeks and may need bridging therapy.","4":"Glucocorticoids are described as best for short-term control, and the owner wants to avoid them."},"lec":"W12: Pruritic Diseases Part II","weeks":[12],"mods":[4]},{"stem":"Ten days after 40 unvaccinated weaned beef calves arrive at a backgrounding yard, many have reddened, crusted muzzles, nasal discharge, and bilateral serous ocular discharge with conjunctival hyperemia and chemosis. Some have corneal edema that begins at the limbus. Fluorescein shows no ulcers, and the farm keeps no sheep. Which diagnosis fits best?","options":["Infectious bovine keratoconjunctivitis","Malignant catarrhal fever","Silage eye (Listeria)","Infectious bovine rhinotracheitis","Ocular squamous cell carcinoma"],"correct":3,"why":"IBR (BHV-1) affects the upper respiratory tract ('red nose') and the eyes, with conjunctival hyperemia and chemosis, possible diffuse corneal edema, and usually bilateral serous discharge. The lesion-location slide places IBR and MCF lesions peripherally, unlike the central lesions of IBK, and MCF is transmitted from sheep.","wrong":{"0":"IBK tends to be unilateral, with central corneal lesions and ulceration.","1":"MCF (OvHV-2) is transmitted from sheep, and this farm has none.","2":"Silage eye presents as uveitis in animals eating silage.","4":"Ocular SCC is a proliferative mass, not a herd outbreak of conjunctivitis."},"lec":"W15: Large Animal Eye Disease","weeks":[15],"mods":[4]},{"stem":"At the first recheck of a 2-year-old spayed mixed-breed dog with pruritic ears and paws, cytology shows that the secondary bacterial and yeast infections have resolved, but she is still itchy. The team plans a strict 8-12 week elimination diet trial with a prescription hydrolyzed diet. The owner gives a flavored chewable heartworm preventive, a beef-flavored joint chew, and dental chews. Which instruction must the team add?","options":["Stop all antipruritics now","Switch to an OTC limited-ingredient food","Challenge with the old diet at week 3","Run IgE serology first","Stop flavored chews and medications"],"correct":4,"why":"With infections resolved but pruritus persisting, the CBL's next step is a diet trial, and the pruritus lesson it refers to lists what makes a trial strict. The owner must stop non-prescription treats, flavored medications, flavored toothpaste, and animal by-product chew toys for the full 8-12 weeks.","wrong":{"0":"Antipruritics may be used to support the patient early in the trial (first 4-6 weeks).","1":"Up to 83% of OTC diets tested contained contamination or unlabeled ingredients.","2":"The challenge comes after clinical improvement at the end of the 8-12 week trial.","3":"Allergy testing selects allergens for immunotherapy and does not diagnose food allergy."},"lec":"W12: CBL The Itchy Pet Sessions 1-2","weeks":[12],"mods":[4]},{"stem":"A 12-year-old spayed domestic shorthair cat has had flat, brown iris freckles in the left eye for 4 years. The pigment has now thickened and spread, the pupil is misshapen, and IOP is 41 mmHg OS (right eye 18 mmHg). There is no lens luxation. Which plan fits the lecture?","options":["Topical latanoprost","Monitor every 6 months","Enucleation","Lensectomy","Intravitreal gentamicin"],"correct":2,"why":"Thickening pigment, dyscoria, and raised IOP are signs that feline diffuse iris melanosis has turned into melanoma, which may metastasize to the liver, spleen, and lungs. The glaucoma lecture says to enucleate when diffuse iris melanoma causes secondary glaucoma.","wrong":{"0":"Prostaglandin analogues cause miosis in cats but fail to lower IOP in about half, and they do not address the tumor.","1":"Monitoring suits flat, unchanged freckles, and this lesion shows transformation and glaucoma.","3":"Lensectomy may help aqueous misdirection glaucoma, which this cat does not have.","4":"Intravitreal gentamicin ablates the ciliary body but does not address uveitis or remove the tumor."},"lec":"W15: Glaucoma","weeks":[15],"mods":[4]},{"stem":"A 7-year-old neutered male Lhasa apso has thick mucoid discharge, corneal pigmentation, and vascularization in both eyes. STT is 6 mm/min OD and 9 mm/min OS, and fluorescein is negative. He starts topical cyclosporine, artificial tears, and a topical steroid. When should the first recheck be scheduled?","options":["In 3-4 months","In 3-5 days","In 4-6 weeks","Once a year","Only if signs worsen"],"correct":2,"why":"Low STT values (below 15 mm/min) with mucoid discharge, pigment, and vessels fit keratoconjunctivitis sicca. The CBL discharge plan for KCS sets re-evaluation at 4-6 weeks, then, depending on response, at least twice yearly.","wrong":{"0":"Three to four months is how long cyclosporine is given before calling it a treatment failure, not the first recheck.","1":"A 3-5 day recheck is the CBL plan for a simple corneal ulcer.","3":"After the first recheck, the plan calls for at least twice-yearly visits.","4":"KCS is chronic and needs scheduled rechecks, not only visits when signs worsen."},"lec":"W14: CBL Eye Cases and Woody the Alpaca","weeks":[14],"mods":[4]},{"stem":"A 4-year-old neutered male golden retriever was diagnosed with atopic dermatitis after parasites and infections were controlled and a strict elimination diet trial with provocation ruled out a food reaction. He has been on allergen-specific immunotherapy for 4 months. He now has a flare of pruritus on the ventral abdomen, and tape cytology shows many cocci with neutrophils. Which plan fits the CBL wrap-up for this flare?","options":["Repeat the elimination diet trial","Stop the immunotherapy","Repeat the serum allergy test","Restart the full pruritus work-up","Treat itch and infection"],"correct":4,"why":"The CBL wrap-up calls atopic dermatitis a lifelong commitment in which flares can occur, managed symptomatically with antipruritic therapy and treatment of secondary infection as needed. Cocci with neutrophils show a secondary infection that needs treating along with the itch.","wrong":{"0":"Food reaction was already ruled out by a strict trial with provocation.","1":"Pruritus Part II says immunotherapy results should not be judged before 9 months.","2":"Serum allergy testing selects allergens for immunotherapy, which is already under way.","3":"The diagnosis was made by exclusion, and flares are expected in this lifelong disease."},"lec":"W13: CBL Red Eye and Itchy Pet 3-4","weeks":[13],"mods":[4]},{"stem":"A 5-year-old neutered male English cocker spaniel stumbles on the stairs at night and hesitates in dim rooms but sees well in daylight. Both eyes show tapetal hyperreflectivity and attenuated retinal vessels, and the PLRs are sluggish. Which cells are lost first in this disease?","options":["Cone photoreceptors","Rod photoreceptors","Retinal ganglion cells","Retinal pigment epithelium","Tapetal cells"],"correct":1,"why":"Night blindness first, with tapetal hyperreflectivity and vessel attenuation, fits progressive retinal atrophy, an inherited photoreceptor dysplasia or degeneration. The slides state that rods are lost first and then cones, so night vision fails before day vision.","wrong":{"0":"Cones are lost after rods, which is why day vision is preserved early.","2":"Retinal ganglion cell death is the mechanism of glaucomatous optic nerve damage.","3":"The retinal pigment epithelium sets non-tapetal color; PRA is a photoreceptor disease.","4":"The tapetum is a reflective choroidal layer, and PRA is a disease of the photoreceptors."},"lec":"W15: Posterior Segment","weeks":[15],"mods":[4]},{"stem":"A 9-year-old spayed Miniature poodle had a mature cataract in the left eye a year ago, and the owner declined surgery. Today the lens shows sparkling plaques and a wrinkled, irregular anterior capsule, the anterior chamber is deeper than in the right eye, and a faint fundic reflection has returned in parts of the pupil. Which stage is this cataract?","options":["Hypermature","Mature","Immature","Incipient","Nuclear sclerosis"],"correct":0,"why":"Hypermature cataracts are resorbing, with sparkling plaques, a wrinkled irregular capsule, a deep anterior chamber, and sometimes a returning fundic reflex. The slide plan is to treat lens-induced uveitis and monitor IOP.","wrong":{"1":"A mature cataract is 100% opaque with no fundic reflex and no resorption changes.","2":"An immature cataract (15-99%) has a fundic reflex but no capsule wrinkling or resorbing plaques.","3":"An incipient cataract is a focal opacity under 15%, the earliest change.","4":"Nuclear sclerosis is a normal aging change of densely packed normal fibers with a preserved tapetal reflection."},"lec":"W14: Disorders of the Lens","weeks":[14],"mods":[4]},{"stem":"An 11-year-old neutered male domestic shorthair cat has a firm, ulcerated mass filling the right horizontal ear canal and recurrent otitis externa. Biopsy confirms ceruminous gland adenocarcinoma, and a total ear canal ablation is planned. Which step should come before surgery?","options":["MRI of the inner ear","Myringotomy for culture","Bacterial culture of the canal","Lymph node and chest staging","No staging; benign in cats"],"correct":3,"why":"Ceruminous adenocarcinomas are locally invasive and can spread to regional lymph nodes and occasionally the lungs or other organs, and ear canal tumors in cats are more likely to be malignant. The staging slide recommends regional lymph node assessment and thoracic imaging before definitive TECA.","wrong":{"0":"MRI is the best imaging for inner ear and neurological involvement, not the staging step listed for adenocarcinoma.","1":"Myringotomy collects middle ear samples when the tympanic membrane is intact in otitis media.","2":"Culture is used for chronic, non-responsive otitis, not for staging a malignant tumor.","4":"Ear canal tumors in cats are more likely malignant, and the slide recommends staging."},"lec":"W13: Otitis Externa and Media/Interna","weeks":[13],"mods":[4]},{"stem":"A 7-year-old spayed Labrador retriever has a dilated right pupil noticed this week. She runs an obstacle course without error, and the menace response is present in both eyes. Light in the right eye constricts the left pupil but not the right; light in the left eye constricts the left pupil but not the right. No eye drops have been used, IOP is normal, and there are no synechiae or iris defects. Where is the lesion most likely?","options":["Right retina or optic nerve","Visual cortex","Right CN III (oculomotor)","Right CN VII (facial)","Right CN V (trigeminal)"],"correct":2,"why":"A visual eye with absent PLRs points to an efferent problem (CN III or the iris sphincter) or mechanical or drug interference, and drugs, synechiae, and iris defects are excluded. Light in the right eye still drives the left pupil, so the afferent arm is intact, and only the right pupil fails to respond, which localizes to its parasympathetic fibers along CN III.","wrong":{"0":"A retina or optic nerve lesion causes blindness with absent PLRs, and light in the right eye still constricts the left pupil.","1":"Cortical disease causes blindness with normal PLRs, and this dog can see.","3":"CN VII is the efferent arm of the menace and palpebral responses, and the menace is present.","4":"CN V is the afferent arm of the palpebral reflex and does not control pupil size."},"lec":"W14: Eye Exam and Ocular Pharmacology","weeks":[14],"mods":[4]},{"stem":"A 6-year-old male Bernese mountain dog has a firm, 4-cm subcutaneous mass over the left elbow that has grown over 6 weeks. Biopsy confirms the localized form of histiocytic sarcoma, and thoracic and abdominal imaging show no internal lesions. Which plan fits the lecture?","options":["Watchful waiting","Excision alone","Cryotherapy if not regressing","Vincristine alone","Excision plus chemotherapy"],"correct":4,"why":"Histiocytic sarcoma affects Bernese mountain dogs, Rottweilers, and retrievers, and the localized form is most often found on the extremities around joints, where surgical excision is recommended. Chemotherapy is recommended for both forms because progression from one form to the other is common.","wrong":{"0":"Watchful waiting suits histiocytomas in young dogs, and the slides advise more aggressive action in Bernese mountain dogs.","1":"Excision alone is curative for benign tumors such as plasmacytoma, but histiocytic sarcoma also needs chemotherapy.","2":"Cryotherapy is for histiocytomas that fail to regress or cause discomfort.","3":"Vincristine (or radiation) is the slide's treatment for transmissible venereal tumors."},"lec":"W13: Nodular Diseases","weeks":[13],"mods":[4]},{"stem":"A 9-year-old intact male Beagle has had progressive multifocal-to-generalized alopecia with comedones, scale, and mild pruritus for 6 weeks; his skin was normal as a young dog. Deep skin scrapings from several sites show many live Demodex canis adults and eggs, and cytology shows cocci in a few pustules. An isoxazoline and topical antiseptics are started. Which further step does the lecture's plan call for in this dog?","options":["Castration","Benign neglect","Stop at the first negative scrape","Monthly fungal cultures","Search for underlying disease"],"correct":4,"why":"Generalized demodicosis that starts at 9 years is adult-onset disease, and the lesson summary says to investigate underlying disease in adult-onset cases. Spay or neuter is the recommendation for juvenile-onset cases.","wrong":{"0":"Spay or neuter is advised for juvenile-onset demodicosis, not adult-onset disease.","1":"Benign neglect (90% spontaneous resolution) applies to localized juvenile demodicosis, and this disease is generalized.","2":"Treatment continues 1 month beyond two consecutive negative monthly scrapings.","3":"Fungal culture tests for dermatophytosis, and deep scrapings already confirm Demodex."},"lec":"W12: Focal-to-Multifocal Alopecia","weeks":[12],"mods":[4]},{"stem":"A sheep farmer whose flock has never had contagious ecthyma (orf) hears of an outbreak on a neighboring farm and asks to vaccinate all of this spring's lambs right away. The flock is closed, and no new animals have arrived. What should the veterinarian advise about the vaccine?","options":["Vaccinate lambs in the first days","Apply it to the lips","Expect no reaction at the site","Do not use it in this flock","Boost every 5 years"],"correct":3,"why":"The orf vaccine is a live virus applied to a scarified area, and the management slide says not to use it in a naive herd. Prevention in this closed, unaffected flock relies on isolating and quarantining any new animals.","wrong":{"0":"Vaccinating in the first days of life is the protocol where orf is present, not in a naive flock.","1":"The vaccine is applied along a scarified area of the pinna, axilla, or inner thigh.","2":"A local reaction should develop after vaccination.","4":"Natural immunity lasts less than 1 year, and the vaccine is effective about 2 years."},"lec":"W14: Farm Animal Dermatology","weeks":[14],"mods":[4]},{"stem":"A 5-year-old spayed Boxer was diagnosed with a cutaneous adverse food reaction by an 8-week hydrolyzed diet trial and a provocation challenge, and she is now comfortable on the hydrolyzed diet. To find more food options, the owner adds plain cooked beef as a single new ingredient. On day 5, her pruritus returns at the ears and feet. Which next step fits the lecture?","options":["Continue beef to day 14","Withdraw beef, await resolution","Add the next ingredient now","Repeat the full elimination trial","Add oclacitinib, keep feeding beef"],"correct":1,"why":"Individual ingredient challenges come after the diagnosis is confirmed and test one food item for 2 weeks at a time. If a flare occurs, the item must be withdrawn, and the next item is started only after the clinical signs resolve.","wrong":{"0":"The 14-day period applies to the provocation challenge that confirms the diagnosis, not to an ingredient that has already caused a flare.","2":"A new item is started only after the flare resolves.","3":"The diagnosis is already established by elimination trial plus provocation.","4":"The protocol withdraws a flaring item rather than feeding it under antipruritic cover."},"lec":"W12: Pruritic Diseases Part I","weeks":[12],"mods":[4]},{"stem":"A 6-year-old spayed Labrador retriever has had red, painful eyes for 5 days. Both eyes show aqueous flare, miosis, keratic precipitates, and low IOP. Fluorescein is negative, the lenses are clear, there is no history of trauma, and the peripheral lymph nodes are normal in size. The clinician begins a work-up for an underlying cause. Which test belongs in the initial minimum database?","options":["Aqueocentesis","Thoracic radiographs","Bone marrow aspiration","CSF cytology","Lymph node biopsy"],"correct":1,"why":"Bilateral anterior uveitis without an ulcer, cataract, or trauma calls for a search for systemic disease. The uveitis minimum database is a thorough eye and physical exam, CBC, chemistry, urinalysis, regional serology or PCR, and thoracic and abdominal radiographs; the other tests belong to the advanced work-up.","wrong":{"0":"Aqueous centesis is an advanced, invasive test with low yield except for lymphoma.","2":"Bone marrow sampling is part of the expanded work-up, not the minimum database.","3":"CSF cytology is part of the expanded work-up.","4":"Lymph node biopsy is an advanced test, and these lymph nodes are normal."},"lec":"W15: Diseases of the Uvea","weeks":[15],"mods":[4]},{"stem":"A 10-week-old kitten from a shelter has sneezing, bilateral serous nasal discharge, ulcers on the tongue, and red conjunctivae with superficial conjunctival erosions in both eyes. Chemosis is mild, and the corneas do not take up fluorescein. Conjunctival cytology shows suppurative inflammation without intracytoplasmic inclusions. Which cause fits best?","options":["Feline herpesvirus 1","Chlamydia felis","Mycoplasma spp.","Feline calicivirus","Eosinophilic keratitis"],"correct":3,"why":"The conjunctiva lecture describes calicivirus as erosive (ulcerative) conjunctivitis concurrent with an active upper respiratory infection, with oral ulcers and suppurative inflammation on cytology. Treatment is supportive care and time, with lubricants and topical antibiotic ointment.","wrong":{"0":"FHV-1 causes conjunctivitis with respiratory signs and possible corneal ulcers, but the slides tie oral ulcers and erosive conjunctivitis to calicivirus.","1":"Chlamydia causes marked chemosis with cytoplasmic inclusions and no corneal involvement.","2":"Mycoplasma shows multiple very small intracytoplasmic inclusions on cytology.","4":"Eosinophilic keratitis causes proliferative white to pink corneal plaques, not oral ulcers."},"lec":"W14: Conjunctiva and Lacrimal System","weeks":[14],"mods":[4]},{"stem":"A 5-year-old spayed Labrador retriever has acute vision loss in both eyes. Both retinas are detached with subretinal fluid, and there are signs of posterior uveitis. Systolic blood pressure is 140 mmHg, there has been no trauma or eye surgery, and infectious disease serology and PCR are negative, so an immune-mediated cause is diagnosed. Which treatment fits?","options":["Amlodipine","Surgical reattachment","Prednisolone acetate drops","Enrofloxacin","Systemic corticosteroids"],"correct":4,"why":"The retinal detachment slide says to treat the underlying cause: inflammatory and immune-mediated detachments need medical therapy such as systemic steroids. Prompt treatment matters because the detached retina loses its main glucose and oxygen supply from the choroid.","wrong":{"0":"Antihypertensives treat metabolic (hypertensive) detachments, and this blood pressure is normal.","1":"Surgical reattachment is for tractional, traumatic, and post-surgical detachments.","2":"Topical drugs treat the front of the eye; the back of the eye is treated systemically.","3":"Enrofloxacin causes retinal degeneration and does not treat detachment."},"lec":"W15: Posterior Segment","weeks":[15],"mods":[4]},{"stem":"A 7-year-old neutered male mixed-breed dog has anterior uveitis in the right eye, with aqueous flare, miosis, keratic precipitates, and an IOP of 8 mmHg. Fluorescein stain is negative, and the work-up for an underlying cause has begun. The clinician wants the topical anti-inflammatory that will best reach the anterior uvea. Which product fits?","options":["Prednisolone acetate 1%","Prednisolone sodium phosphate","Flurbiprofen drops","Topical cyclosporine","Oral carprofen alone"],"correct":0,"why":"Anterior uveitis is treated topically, and corticosteroids have better efficacy than NSAIDs but are contraindicated with corneal ulcers, so the negative stain matters (Week 15). The pharmacology lecture ranks topical penetration as acetate >> alcohol >> phosphate and lists fluorescein staining before any steroid use (Week 14).","wrong":{"1":"Phosphate formulations penetrate least in the acetate >> alcohol >> phosphate ranking.","2":"Topical NSAIDs are an option, but corticosteroids have better efficacy for uveitis.","3":"Cyclosporine does not penetrate the eye when applied topically.","4":"Anterior uveitis is treated topically; a systemic drug alone is the approach for the posterior segment."},"lec":"Integration W14+W15: Steroid choice for anterior uveitis","weeks":[14,15],"mods":[4]},{"stem":"A 4-year-old spayed Labrador retriever has had a painful right eye for 2 days after running through brush. The lower eyelid margin is rolled inward, and fluorescein shows a superficial corneal ulcer. After a topical anesthetic is applied, the blepharospasm eases and the lower lid margin returns to its normal position. Which interpretation fits?","options":["Spastic entropion","Anatomic entropion","Trichiasis","Ectropion","Macroblepharon"],"correct":0,"why":"The entropion slides advise applying a topical anesthetic to tell spastic from anatomic entropion; inversion driven by pain resolves when the pain is blocked. This lid returns to normal, so the plan is to treat the painful ulcer rather than perform a permanent correction.","wrong":{"1":"Anatomic entropion is a structural inversion that persists after topical anesthesia.","2":"Trichiasis is hair from a normal follicle pointing toward the cornea, not an inverted lid margin.","3":"Ectropion is eversion of the lid margin.","4":"Macroblepharon is an oversized palpebral fissure seen in brachycephalic breeds."},"lec":"W14: Diseases of the Eyelids","weeks":[14],"mods":[4]},{"stem":"A 9-year-old neutered male golden retriever has seemed lost in the house for 2 weeks, walking into door frames, and his owners report pacing and a change in behavior. He has postural reaction deficits in the right limbs. Ocular exams, including the fundus, are normal, and the PLRs are normal in both eyes. Which imaging test does the lecture's diagnostic approach include for this dog?","options":["CT of the skull","Skull radiographs","Ocular ultrasound","MRI of the brain","Thoracic radiographs"],"correct":3,"why":"Vision loss with normal PLRs, a normal fundus, and forebrain signs (behavior change, pacing, contralateral postural deficits) localizes the problem to the brain behind the reflex arc. The cortical vision loss slide lists MRI, VEPs, CSF tap, and regional infectious titers as the diagnostic approach.","wrong":{"0":"The otitis lecture describes CT as superior for bony changes, while MRI is best for neurological involvement.","1":"Radiographs are not part of the cortical vision loss work-up, which lists MRI, VEPs, CSF tap, and titers.","2":"Ocular ultrasound evaluates the back of the eye when opacities block the view, and this fundus is visible and normal.","4":"Thoracic imaging belongs to the systemic minimum database, not the imaging for a forebrain lesion."},"lec":"W15: Investigating Vision Loss","weeks":[15],"mods":[4]},{"stem":"A 4-year-old spayed West Highland white terrier with atopic dermatitis has dry, scaly skin and recurrent flares despite good itch control with a daily oral antipruritic. Her secondary infections are controlled. The clinician explains that her skin barrier is defective, with an abnormal lipid layer that lets allergens in and water out, and wants to add a topical product aimed at that defect. Which ingredient fits that goal?","options":["Hydrocortisone 0.5-1%","Chlorhexidine","Triamcinolone spray","Phytosphingosine","Gentamicin-betamethasone spray"],"correct":3,"why":"The pathogenesis slides describe epidermal barrier dysfunction in atopic dermatitis, with a normal lipid layer of 40-50% ceramides, 25-35% cholesterol, and 10-15% free fatty acids. The adjunct therapy slide lists barrier support with ceramides or their precursors (phytosphingosine), free fatty acids, cholesterol, and hyaluronic acid to limit transepidermal water loss.","wrong":{"0":"Hydrocortisone is a topical glucocorticoid for short-term anti-inflammatory use, not barrier repair.","1":"Chlorhexidine is a topical antimicrobial, and her infections are already controlled.","2":"Triamcinolone spray is a topical glucocorticoid for short-term use only.","4":"The slides say to avoid antibiotic-steroid combination sprays."},"lec":"W12: Pruritic Diseases Part II","weeks":[12],"mods":[4]},{"stem":"A 9-year-old Quarter Horse mare has a corneal ulcer in the right eye that began after a hay stem poked the eye 2 weeks ago. It has not vascularized despite topical antibiotics, and corneal cytology shows fungal hyphae. A topical antifungal is started. How long should the antifungal be given?","options":["Only during active disease","Every 6-8 hours for 1 week","At least 4-6 weeks","Until vessels reach the ulcer","Until fluorescein is negative"],"correct":2,"why":"An ulcer that follows organic material and fails to vascularize fits keratomycosis, which is common in horses. The antifungal slide calls for an extended duration of therapy, a minimum of 4-6 weeks and often longer.","wrong":{"0":"Using a drug only during active disease is the slide's rule for antivirals, not antifungals.","1":"Every 6-8 hours is the prophylactic antibiotic frequency for simple ulcers, and 1 week is far short of 4-6 weeks.","3":"Vascularization signals healing, but antifungal therapy runs a minimum of 4-6 weeks.","4":"Duration is set at a minimum of 4-6 weeks, often longer, not by stain uptake."},"lec":"W14: Corneal Injury and Disease","weeks":[14],"mods":[4]},{"stem":"A 2-year-old female Samoyed had bilateral uveitis with photophobia and blepharospasm 6 weeks ago and now has depigmentation and erosions of the nasal planum and lips, with whitening of the facial hair. Skin biopsy shows a histiocytic lichenoid interface dermatitis with melanophages containing dust-like melanin. Which systemic plan fits both lectures?","options":["Prednisone plus azathioprine","Prednisone alone","Topical prednisolone drops only","Doxycycline-niacinamide","Sun protection alone"],"correct":0,"why":"Uveitis that comes before depigmenting, erosive facial lesions in an arctic breed, with interface dermatitis and melanophages, is uveodermatologic syndrome. Week 12 calls for early aggressive therapy with prednisone plus a second agent such as azathioprine started concurrently, and Week 15 lists azathioprine among the immunomodulators for immune-mediated uveitis.","wrong":{"1":"A second agent is typically started at the same time because of the high steroid dose.","2":"Topical therapy treats the uveitis but not the autoimmune disease of the skin and eyes.","3":"Doxycycline-niacinamide is listed for DLE and pemphigus, not uveodermatologic syndrome.","4":"Sun protection is central to DLE management and does not prevent blindness here."},"lec":"Integration W12+W15: Uveodermatologic syndrome treatment","weeks":[12,15],"mods":[4]},{"stem":"A 9-year-old neutered male Labrador retriever has chronic, painful otitis externa of the left ear with purulent, malodorous exudate. Cytology shows numerous rods and neutrophils, and the tympanic membrane cannot be seen through the exudate, so a rupture is possible. A topical fluoroquinolone is chosen. Which ear flush pairs best with this plan?","options":["Acetic acid astringent","Tris-EDTA flush","Squalene cerumenolytic","Ketoconazole cleanser","Chlorhexidine cleanser"],"correct":1,"why":"Rods in chronic otitis mean organisms such as Pseudomonas, with biofilm and middle ear involvement common. Chelators such as Tris-EDTA are drug potentiators and anti-biofilm agents, generally considered safe in the middle ear, and alkalinizing, which suits fluoroquinolones because they work best in an alkaline environment.","wrong":{"0":"Acetic acid is a drying (astringent) agent, not a chelator, potentiator, or anti-biofilm agent.","2":"Squalene is a cerumenolytic for waxy debris, and this exudate is purulent.","3":"Ketoconazole is an antifungal antiseptic, and cytology shows rods, not yeast.","4":"Chlorhexidine is an antiseptic cleanser, while the slides name chelators as the anti-biofilm agents generally safe in the middle ear."},"lec":"W13: Otitis Externa and Media/Interna","weeks":[13],"mods":[4]},{"stem":"In late winter, several housed ewes eating baled silage from hay racks each develop one cloudy eye with miosis, aqueous flare, and photophobia. Fluorescein is negative, the silage is poorly fermented, and none of the ewes has conjunctival swelling or keratitis. Which treatment fits the lecture?","options":["Systemic penicillin","Topical cloxacillin","Ciprofloxacin drops","Gentamicin drops","Fly control ear tags"],"correct":0,"why":"Uveitis in housed animals whose heads go into poorly fermented silage fits silage eye from Listeria monocytogenes, which affects sheep as it does cattle. The treatment slide lists systemic penicillin or oxytetracycline, analgesia, and subconjunctival antibiotics.","wrong":{"1":"Topical cloxacillin is the lecture's IBK treatment for Moraxella keratoconjunctivitis.","2":"Ciprofloxacin drops are illegal in food animals.","3":"Gentamicin drops carry a prolonged 18-month withdrawal time.","4":"Fly control is the control measure for IBK; silage eye comes from the silage itself."},"lec":"W15: Large Animal Eye Disease","weeks":[15],"mods":[4]},{"stem":"An 11-year-old neutered male Labrador retriever has a chronic left hind lameness from a cruciate ligament injury managed without surgery, and he now bears more weight on his other limbs. Thick, cracked hyperkeratosis has developed on the right hind footpads only. The nasal planum and other pads are normal, he has no pustules or crusts elsewhere, and he is otherwise healthy. Which cause fits best?","options":["Idiopathic nasodigital hyperkeratosis","Hereditary footpad hyperkeratosis","Zinc-responsive dermatosis","Pemphigus foliaceus","Mechanical hyperkeratosis"],"correct":4,"why":"The hyperkeratotic footpad slides list secondary mechanical hyperkeratosis from abnormal gait due to orthopedic or neurologic disease, altered weight distribution, or chronic pain causing lameness. Lesions limited to the pads bearing extra weight in a dog with chronic orthopedic lameness fit that cause.","wrong":{"0":"Age-related idiopathic hyperkeratosis is often accompanied by nasal hyperkeratosis and is not limited to the pads of one limb.","1":"Hereditary hyperkeratosis affects young dogs of breeds such as Irish terriers and Dogues de Bordeaux.","2":"Zinc-responsive dermatosis also crusts mucocutaneous junctions, ears, elbows, and pressure points.","3":"Pemphigus foliaceus causes pustules and crusts, often on the face as well as the pads."},"lec":"W13: Butts, Paws, and Others","weeks":[13],"mods":[4]},{"stem":"Strangles is confirmed by PCR in one horse on a 30-horse boarding farm, and that horse is isolated. The other 29 horses shared pasture and water with it but have no fever, nasal discharge, or lymph node swelling today. The manager wants a plan that will catch the next case before that horse starts shedding Streptococcus equi. Which plan fits the lecture?","options":["SeM antibody ELISA testing","Rectal temperature monitoring","Intranasal live vaccination","Rebreathing exams","Thoracic ultrasound of each horse"],"correct":1,"why":"The ACVIM consensus slide says infected horses shed bacteria starting 2-3 days after a fever and keep shedding for 2-3 weeks. Its key points are to monitor temperatures in any suspect horse and isolate any horse with a fever, so a fever flags a new case before shedding begins.","wrong":{"0":"SeM serology is used to judge the need for vaccination, recent infection, and bastard strangles, not to catch a new case early.","2":"The vaccine slide says never to give the vaccine to an exposed animal, and these horses are exposed.","3":"The rebreathing exam is the first test for lower airway disease, while strangles is an upper airway infection.","4":"Thoracic ultrasound is a lower airway test and would not detect the fever that comes before shedding."},"lec":"W12: Equine Respiratory Conditions","weeks":[12],"mods":[4]},{"stem":"A 1,100-lb (500-kg) Appaloosa gelding has blepharospasm, miosis, aqueous flare, and fibrin in the anterior chamber of the right eye. Fluorescein stain is negative, and IOP is 24 mmHg (reference interval 15-30 mmHg). The plan follows the CBL treatment: prednisolone acetate 1% drops, atropine drops, and flunixin meglumine at 1.1 mg/kg IV. What flunixin dose should he receive?","options":["550 mg IV every 12 hours","55 mg IV every 12 hours","1,210 mg IV every 12 hours","550 mg IV every 72 hours","5,500 mg IV every 12 hours"],"correct":0,"why":"Negative fluorescein with miosis, flare, and fibrin fits anterior uveitis, and the CBL plan pairs topical prednisolone acetate and atropine with flunixin at 1.1 mg/kg IV twice a day. For 500 kg, 1.1 mg/kg x 500 kg = 550 mg, given every 12 hours.","wrong":{"1":"This is a tenfold underdose.","2":"This dose comes from multiplying 1.1 by the weight in pounds instead of kilograms.","3":"The CBL gives flunixin twice a day, not every 72 hours.","4":"This is a tenfold overdose."},"lec":"W13: CBL Red Eye and Itchy Pet 3-4","weeks":[13],"mods":[4]},{"stem":"A 5-year-old spayed Chow Chow is treated for acute primary angle-closure glaucoma in the left eye. The right eye has an IOP of 17 mmHg and looks normal, and a topical beta-blocker is started in that eye. The owner asks what to expect for the right eye. Which answer fits the lecture?","options":["Glaucoma in about 7 months, treated","No risk; primary glaucoma is unilateral","Glaucoma within a few days","Onset delayed to about 35 months","Risk only if IOP is high now"],"correct":3,"why":"Essentially all primary open-angle and angle-closure glaucoma is bilateral, so the normotensive fellow eye is treated with a topical beta-blocker, prostaglandin, or miotic. The mean time for the fellow eye to develop glaucoma is 7 months, and medical treatment can delay onset to a mean of 35 months.","wrong":{"0":"Seven months is the mean time to onset without treatment.","1":"Primary glaucoma is always bilateral.","2":"The slides give a mean of 7 months to onset even without treatment.","4":"The fellow eye is treated while its IOP is normal because primary glaucoma is always bilateral."},"lec":"W15: Glaucoma","weeks":[15],"mods":[4]},{"stem":"A 10-year-old neutered male Bichon frise has bilateral mature cataracts, with no tapetal reflection and no view of the fundus in either eye, and he bumps into furniture. When a bright light is directed into each eye, he blinks briskly each time. What does this response tell the clinician?","options":["The dog can see","The visual cortex is intact","The menace pathway is intact","He is a surgical candidate","Potential for vision"],"correct":4,"why":"A blink to a bright light directed at the fundus is the dazzle reflex, a subcortical reflex with the retina and optic nerve as its afferent arm and the facial nerve as its efferent arm. The slide states it is not a test of vision but a test for potential vision.","wrong":{"0":"The dazzle reflex is not a test of vision, and this dog bumps into furniture.","1":"The dazzle reflex is subcortical (rostral colliculi), so it does not test the visual cortex.","2":"The menace response is a separate learned response that needs vision.","3":"The lens lecture also requires ocular ultrasound and electroretinography before cataract surgery."},"lec":"W14: Eye Exam and Ocular Pharmacology","weeks":[14],"mods":[4]},{"stem":"A 7-year-old spayed Cocker spaniel with chronic otitis externa now has a bulging left tympanic membrane, head shaking, and pain on opening the mouth. Over the past week the left pupil has become smaller than the right, the upper eyelid droops, the globe sits deeper in the orbit, and the third eyelid is elevated. There is no aqueous flare, IOP is 16 mmHg in each eye, and she blinks normally. Which condition explains the eye changes?","options":["Anterior uveitis","Facial nerve paralysis","Horner syndrome","Prolapsed third eyelid gland","Retrobulbar abscess"],"correct":2,"why":"The otitis lecture lists Horner syndrome and facial paralysis among the neurologic signs specific to otitis media/interna (Week 13). The conjunctiva lecture defines Horner syndrome by miosis, ptosis, enophthalmos, and an elevated third eyelid, which match this eye (Week 14).","wrong":{"0":"Uveitis causes miosis but with aqueous flare and low IOP, both absent here.","1":"Facial paralysis prevents blinking, and this dog blinks normally.","3":"A prolapsed gland protrudes above the free border of the third eyelid, without miosis or ptosis.","4":"A retrobulbar abscess can elevate the third eyelid but does not explain the miosis and ptosis."},"lec":"Integration W13+W14: Otitis media and the eye","weeks":[13,14],"mods":[4]},{"stem":"After a storm drops branches into their paddock, three ponies eat wilted leaves from a fallen red maple. Two days later, one pony is depressed and anorexic with icteric membranes and dark red-brown urine. PCV is 10% (reference interval 32-48%), Heinz bodies are numerous on the smear, and methemoglobin is 35% of total hemoglobin. Fluids and a whole blood transfusion are started. Which drug does the lecture give for the methemoglobinemia in this pony?","options":["Methylene blue","Vitamin K1","Thiamine","Ascorbic acid","Hydroxocobalamin"],"correct":3,"why":"Wilted red maple leaves overwhelm the RBC glutathione system in horses, causing abrupt hemolysis 1-2 days later with Heinz bodies and methemoglobin up to 50%. The red maple slide lists supportive care with fluids and whole blood, plus ascorbic acid at 30 mg/kg for the methemoglobinemia.","wrong":{"0":"Methylene blue is the lecture's treatment for nitrate poisoning in ruminants, not the drug listed for red maple.","1":"Vitamin K1 treats the coagulopathy of sweet clover (dicoumarol) poisoning.","2":"Thiamine treats bracken fern (thiaminase) toxicity in horses.","4":"Hydroxocobalamin is an antidote for cyanide from Prunus species."},"lec":"W12: CV and Respiratory Toxins","weeks":[12],"mods":[4]},{"stem":"A 7-year-old Appaloosa mare has had two episodes of uveitis in the right eye over 8 months, each with miosis, aqueous flare, and fibrin, and equine recurrent uveitis is diagnosed. The left eye is normal today. The owner asks what to expect for the left eye. Which answer fits both lectures?","options":["High risk of disease in it","Low risk; ERU stays in one eye","Risk only from herdmates","Vaccination will protect it","Risk ends after this episode"],"correct":0,"why":"The CBL notes that Appaloosas are 8.3 times more prone to ERU than other breeds, are more prone to bilateral disease, and that many Appaloosas have bilateral ERU (Week 13). The uveitis lecture describes ERU as a chronic immune-mediated disease of repeated or persistent inflammation, the most common cause of blindness in horses, with an insidious form in Appaloosas (Week 15).","wrong":{"1":"Many Appaloosas have bilateral ERU.","2":"ERU is not contagious, so herdmates are not a source.","3":"The CBL states that ERU cannot be prevented.","4":"ERU is defined by repeated or persistent bouts of inflammation."},"lec":"Integration W13+W15: ERU and the fellow eye","weeks":[13,15],"mods":[4]},{"stem":"An 8-year-old spayed golden retriever with weight gain and lethargy has a low total T4 and a high TSH. Both corneas have non-painful, white, shiny stromal deposits, and there is no facial paralysis, ulcer, or uveitis. Serum chemistry has been submitted. Which blood lipid change does the lecture link to these corneal deposits?","options":["High triglycerides","Hypercalcemia","Hyperbilirubinemia","High cholesterol","Hyperglycemia"],"correct":3,"why":"Hypothyroidism is a secondary cause of altered lipid metabolism, and corneal lipid deposits appear on its ocular signs slide. The OMSD lecture links increased cholesterol to lipid keratopathy, while increased triglycerides cause lipid-laden aqueous and lipemia retinalis.","wrong":{"0":"High triglycerides cause lipid-laden aqueous humor and lipemia retinalis.","1":"Calcium deposition is a separate, non-lipid biochemical cause of corneal deposits.","2":"Bilirubin causes icterus of the ocular tissues.","4":"Hyperglycemia causes diabetic cataracts through sorbitol in the lens."},"lec":"W15: Ocular Signs of Systemic Disease","weeks":[15],"mods":[4]},{"stem":"A 6-year-old neutered male domestic shorthair cat has soft, purple-hued swelling of the central pads of all four feet, with mild lameness. Fine-needle aspirates show many plasma cells, and globulins are increased. The clinician prescribes doxycycline at 5 mg/kg twice daily. Which home instruction belongs with this prescription?","options":["Give it dry, without food","Follow each dose with water","Stop once the swelling shrinks","Use clay litter during ulceration","Expect cure in 2 weeks"],"correct":1,"why":"Soft, purple pad swelling with plasma cells on FNA and hypergammaglobulinemia is plasma cell pododermatitis. The treatment slide gives doxycycline 5 mg/kg q12h until resolved, averaging about 8 weeks, and warns to prevent esophagitis by following each dose with food or water.","wrong":{"0":"Giving doxycycline dry risks esophagitis, which the slide prevents with food or water.","2":"Doxycycline continues until resolution, averaging about 8 weeks.","3":"The slide recommends paper litter when pads are ulcerated or ruptured.","4":"Average treatment is about 8 weeks."},"lec":"W13: Feline Dermatoses","weeks":[13],"mods":[4]},{"stem":"An 8-month-old female American Cocker spaniel has a prolapsed gland of the third eyelid repositioned with a pocket technique. Surgery goes well, and topical antibiotics, a systemic NSAID, and an E-collar are prescribed. Which long-term follow-up plan fits the lecture?","options":["Recheck until sutures are out","Excise the gland if it recurs","Topical steroid from day 1","Schirmer tests for 1-2 years","Recheck only for recurrence"],"correct":3,"why":"Even with gland repositioning, about 14% of dogs develop KCS, so the potential for dry eye persists. The post-operative slide says to monitor tear production with the Schirmer I tear test and follow the dog for 1 to 2 years for tear production and recurrence.","wrong":{"0":"Follow-up continues for 1-2 years, not just until healing.","1":"The slides say not to amputate the gland, because 68% of dogs develop KCS after excision.","2":"Corticosteroids are added later, once the pocket is well healed.","4":"Tear production must be monitored as well as recurrence."},"lec":"W14: Conjunctiva and Lacrimal System","weeks":[14],"mods":[4]},{"stem":"A 12-year-old white domestic shorthair cat that sunbathes for hours on a window ledge has a non-healing, crusted ulcer on the nasal planum that has slowly enlarged over 4 months; earlier the area had light-colored scale. Squamous cell carcinoma is suspected, and the clinician wants a definitive diagnosis. Which sampling method does the lecture recommend for this site?","options":["Punch biopsy","Shave biopsy","Impression cytology","Nasal planectomy","Fungal culture of the crust"],"correct":1,"why":"Actinic SCC in cats arises on sparsely haired, non-pigmented skin such as the nasal planum, beginning as scale and progressing to non-healing crusts and ulcers. The diagnosis slide calls for a shave biopsy for the pinnae and nasal planum and a punch biopsy for other regions.","wrong":{"0":"Punch biopsy is the slide's choice for regions other than the pinnae and nasal planum.","2":"The lesson summary says cytology only narrows the differential list; biopsy is needed for a definitive diagnosis.","3":"Nasal planectomy is a treatment, done after the diagnosis is confirmed.","4":"Fungal culture tests for dermatophytosis, which does not fit a slowly enlarging ulcer on sun-exposed white skin."},"lec":"W12: Erosive and Crusting Dermatoses","weeks":[12],"mods":[4]},{"stem":"A 4-year-old spayed mixed-breed dog developed crusting and alopecia of the pinnal margins, tail tip, and footpads a few months after a subcutaneous rabies vaccine, and generalized vaccine-associated ischemic dermatopathy was diagnosed. Pentoxifylline has controlled the lesions. The rabies booster is now due. What should the clinician do about the booster?","options":["Give it subcutaneously as usual","Skip it without notifying anyone","Discuss risk; ask about exemption","Apply tacrolimus at the site first","Excise the old vaccine site first"],"correct":2,"why":"When an ischemic dermatopathy is thought to be vaccine-induced, the slides say the clinician must discuss the risk that revaccination will trigger recrudescence, and local health officials may need to be consulted about a vaccine exemption. The alopecia lecture adds that revaccination with subcutaneous rabies vaccine is not recommended.","wrong":{"0":"Revaccination with subcutaneous rabies vaccine is not recommended after post-injection disease.","1":"The slides direct consultation with local health officials about an exemption rather than simply skipping the vaccine.","3":"Topical tacrolimus is listed only for early post-injection alopecia, not for planning revaccination.","4":"Excision is a cosmetic option for a localized lesion and does not address the revaccination risk."},"lec":"W13: Butts, Paws, and Others","weeks":[13],"mods":[4]},{"stem":"A 6-year-old spayed Cocker spaniel has bilateral otitis externa with cocci and neutrophils on cytology; because of two earlier recurrences, a culture was also submitted and grew Staphylococcus pseudintermedius. After 2 weeks of cleaning and twice-daily topical therapy, the owner says the head shaking has stopped and asks whether the medication can end. How should the clinician decide when to stop topical treatment?","options":["Repeat culture and susceptibility","Stop now that shaking has stopped","CT of both tympanic bullae","Finish a fixed 14-day course","Repeat ear cytology"],"correct":4,"why":"Cytology is the most important diagnostic tool in every otitis case, and topical treatment continues 1-2 times a day until cytologic resolution is reached. The culture slides state that culture cannot help judge resolution; only cytology can.","wrong":{"0":"Culture identifies organisms in chronic or recurrent cases but cannot judge resolution.","1":"Owner-reported comfort does not show cytologic resolution, and failing to recheck progress is one of the five common mistakes.","2":"CT and other advanced imaging are reserved for complicated cases.","3":"Treatment length is set by cytologic resolution, not a fixed number of days."},"lec":"W13: Otitis Externa and Media/Interna","weeks":[13],"mods":[4]},{"stem":"On a dairy farm in winter, 15 calves have raised, gray-white, crusted, non-pruritic lesions around the eyes and on the neck, and not all are round. The farmer heard that a Wood's lamp diagnoses ringworm, and the lamp shows no fluorescence on any lesion. How should the negative Wood's lamp result be interpreted?","options":["Expected with T. verrucosum","Rules out dermatophytosis","Points to dermatophilosis","Points to Microsporum canis","Shows the lesions have healed"],"correct":0,"why":"Gray-white crusts on the face, neck, and periocular area of cattle are classic ringworm from Trichophyton verrucosum, and the farm animal lecture warns that many fungi do not fluoresce under a Wood's lamp (Week 14). The Week 12 lecture explains why: only Microsporum canis produces apple-green fluorescence, so a negative lamp does not exclude other dermatophytes.","wrong":{"1":"Many dermatophytes do not fluoresce, so a negative lamp does not rule out ringworm.","2":"Dermatophilosis forms pyramid-shaped paintbrush crusts on wet, damaged skin and is diagnosed by smear or scrape.","3":"Microsporum canis is the species that fluoresces, so a negative lamp argues against it.","4":"The lesions are active crusts; the negative lamp reflects the species, not healing."},"lec":"Integration W12+W14: Wood's lamp in calf ringworm","weeks":[12,14],"mods":[4]},{"stem":"A 3-year-old neutered male Labrador retriever has nonseasonal pruritus of the ears, feet, and ventral abdomen, and his last two flares each began within a day of eating chicken jerky treats. He is on year-round isoxazoline flea control, and skin and ear cytology show no bacteria or yeast. For 10 weeks he has eaten only a partially hydrolyzed chicken-based diet, with no treats and unflavored medications, and the owner's diary confirms full compliance. His pruritus has not improved. Which factor best explains the failed trial?","options":["Reaction to the parent protein","Food intolerance","Trial too short","Hidden flavored products","Secondary Malassezia overgrowth"],"correct":0,"why":"Hydrolyzed diets cleave proteins to reduce binding to allergen-specific IgE, but a partially hydrolyzed diet can still trigger an IgE-mediated reaction in a patient allergic to the parent protein; up to 40% of chicken-allergic dogs react to hydrolyzed chicken. With compliance, infection, and fleas excluded, the slide's confounders of cross-reactivity and partial hydrolysates fit this dog.","wrong":{"1":"Food intolerance is not immune-mediated and is dose dependent, while these flares fit an allergy provoked by any exposure.","2":"Ten weeks falls within the 8-12 week trial, and about 80% resolution is expected after 5-6 weeks.","3":"The diary confirms no treats and unflavored medications.","4":"Cytology shows no yeast, so secondary overgrowth does not explain the pruritus."},"lec":"W12: Pruritic Diseases Part I","weeks":[12],"mods":[4]},{"stem":"A 5-year-old neutered male Boxer has a 3-mm stromal ulcer in the left eye after a scratch. The eye also shows miosis, aqueous flare, and an IOP of 8 mmHg (right eye 17 mmHg). The ulcer has no cellular infiltrate or melting, and a broad-spectrum topical antibiotic is started. Which addition treats the accompanying intraocular inflammation?","options":["Prednisolone acetate drops","Topical atropine plus oral NSAID","Flurbiprofen drops","Topical anesthetic drops","Atropine plus dexamethasone drops"],"correct":1,"why":"All corneal ulcers are accompanied by reflex anterior uveitis, seen here as miosis, flare, and low IOP. The cornea lecture treats it with a topical mydriatic-cycloplegic (atropine) and systemic NSAIDs such as carprofen or meloxicam, because topical corticosteroids are contraindicated with ulceration.","wrong":{"0":"Topical corticosteroids are contraindicated with corneal ulceration and potentiate proteases.","2":"Topical NSAIDs may initiate or worsen keratomalacia, so the lecture says to avoid them.","3":"The analgesia slide says not to use topical anesthetics.","4":"Atropine fits, but dexamethasone is a topical steroid and is contraindicated with an ulcer."},"lec":"W14: Corneal Injury and Disease","weeks":[14],"mods":[4]},{"stem":"In early autumn, 60 beef cows are moved from dry, overgrazed summer range onto a lush regrowth of alfalfa. Seven days later, eight cows have abrupt labored breathing, loud expiratory grunts, open-mouth breathing, and frothy salivation, and two die within a day. The pasture has no purple mint, the cows have eaten no sweet potatoes, brassicas, or hay, and their mucous membranes are pink. Which compound causes the lung injury in this condition?","options":["Dimethyl sulfide","Nitrite","3-methylindole","Furan ketones","4-ipomeanol"],"correct":2,"why":"A sudden switch from dry, low-protein feed to lush, high-protein alfalfa, with signs 5-10 days later, fits acute bovine pulmonary edema and emphysema (fog fever). Rumen bacteria convert excess tryptophan to 3-methylindole, which the lung's mixed function oxidases turn into the toxin that destroys type I pneumocytes.","wrong":{"0":"Dimethyl sulfide is the ruminal hemolysin from brassicas such as kale and turnip tops, which cause Heinz body anemia.","1":"Nitrite from nitrate-rich forage forms methemoglobin, with bluish or dark membranes rather than pink ones.","3":"Furan ketones come from Perilla (purple mint), which is absent from this pasture.","4":"4-ipomeanol comes from moldy sweet potatoes, which these cows did not eat."},"lec":"W12: CV and Respiratory Toxins","weeks":[12],"mods":[4]},{"stem":"A 5-year-old Angus cow, 6 months pregnant, has a red, painful eye with marked conjunctival swelling. The owner has a bottle of injectable dexamethasone and wants to use it to bring the swelling down, and fluorescein has not yet been applied. Besides the risk of worsening a corneal ulcer, which risk does the lecture give for this drug in this cow?","options":["Abortion","18-month drug withdrawal","Illegal use in food animals","Keratoconjunctivitis sicca","Retinal degeneration"],"correct":0,"why":"The field treatment slide lists NSAIDs (meloxicam, flunixin, firocoxib, phenylbutazone) for analgesia and flags dexamethasone: no corticosteroids for ulcers, and abortion risks in ruminants. A pregnant cow with an unstained painful eye carries both risks.","wrong":{"1":"The 18-month withdrawal applies to gentamicin eye drops.","2":"Ciprofloxacin drops are the product listed as illegal in food animals.","3":"Keratoconjunctivitis sicca is the ocular toxicity of sulfonamides.","4":"Retinal degeneration is linked to fluoroquinolones."},"lec":"W15: Large Animal Eye Disease","weeks":[15],"mods":[4]},{"stem":"A 12-year-old Warmblood gelding has a hot, painful, markedly swollen left hind limb from hoof to stifle that developed overnight. He has a fever of 103.5°F (39.7°C), is lethargic, and is 4/5 lame, and a small scrape is found on the pastern. The owner thinks he has simply stocked up from standing in his stall. Which plan fits the lecture?","options":["Stall rest with NSAIDs only","Wait for culture before antibiotics","Antibiotics, NSAID, hand walking","Benign neglect","Cold salt hydrotherapy"],"correct":2,"why":"Extreme, hot swelling of one hind limb with fever, lethargy, and 4/5 lameness after a skin wound is cellulitis, which the slide stresses is not stocking up. Immediate broad-spectrum antibiotic and NSAID treatment is essential, and walking the horse is important for lymph drainage.","wrong":{"0":"The slide says walking the horse is important for lymph drainage.","1":"Immediate antibiotic treatment is described as essential.","3":"Benign neglect is used for lesions such as small sarcoids, not febrile cellulitis.","4":"Cold salt hydrotherapy is an adjunct for degloving wounds and does not replace immediate antibiotics."},"lec":"W14: Equine Dermatology","weeks":[14],"mods":[4]},{"stem":"A 4-year-old neutered male Cocker spaniel is presented for red eyes. Both eyes have hyphema, and the fundus shows retinal hemorrhages. Systolic blood pressure is 135 mmHg, platelets are 290,000/µL (200,000-500,000), and PT is 38 seconds (reference interval 7-10 seconds). The owner then finds an opened box of rodent bait in the garage. Which treatment addresses the cause?","options":["Amlodipine","Vitamin K1","Platelet transfusion","Prednisolone acetate drops","Methylene blue"],"correct":1,"why":"Ocular hemorrhage with normal blood pressure and platelets but a long PT points to a coagulopathy, and the OMSD lecture lists vitamin K-associated toxins among the non-infectious causes of ocular hemorrhage (Week 15). Warfarin-type rodenticides inhibit vitamin K epoxide reductase, depleting factors II, VII, IX, and X so the PT rises, and treatment is vitamin K therapy (Week 12).","wrong":{"0":"Amlodipine treats hypertensive retinopathy, and blood pressure is normal.","2":"Platelet numbers are normal; the defect is in vitamin K-dependent clotting factors.","3":"Topical steroids treat uveitis signs but do not correct the clotting factor deficiency.","4":"Methylene blue treats methemoglobinemia from nitrate poisoning."},"lec":"Integration W12+W15: Hyphema from rodenticide","weeks":[12,15],"mods":[4]},{"stem":"A 3-year-old spayed mixed-breed dog became blind in both eyes over 2 days. Both pupils are widely dilated with absent direct and consensual PLRs. Both optic discs are swollen and hyperemic with fuzzy margins and small hemorrhages. IOP is 14 mmHg in each eye, the retinas are attached, and the eyes are not painful. Which diagnosis fits?","options":["SARDS","Acute glaucoma","Cortical blindness","Retinal detachment","Optic neuritis"],"correct":4,"why":"Optic neuritis causes complete mydriasis, vision loss, and absent PLRs, with a swollen, hyperemic optic papilla with fuzzy margins and hemorrhages. The vision loss lecture recommends imaging and diagnostics (minimum database, CSF tap, serology) before steroids or immunomodulators.","wrong":{"0":"SARDS has a normal fundus at first and PLRs that are incomplete but not usually absent.","1":"Acute glaucoma requires a raised IOP, and IOP is normal.","2":"Cortical blindness leaves the PLRs normal.","3":"The retinas are attached."},"lec":"W15: Investigating Vision Loss","weeks":[15],"mods":[4]},{"stem":"A 7-month-old black-and-white Jack Russell terrier has progressive, symmetric hair loss with scaling confined to the black-haired patches; the white-haired areas are normal. She is bright, eating well, and has no systemic signs, and skin scrapings and cytology are negative. Which diagnosis fits best?","options":["Color dilution alopecia","Pattern alopecia","Black hair follicular dysplasia","Alopecia X","Recurrent (cyclic flank) alopecia"],"correct":2,"why":"Follicular dysplasias are breed-specific genetic diseases of young animals without systemic signs. Black hair follicular dysplasia is described as a variant of color dilution alopecia that presents in the black hairs of bi- and tri-color dogs, with symmetric progressive alopecia affecting all black hairs.","wrong":{"0":"CDA affects all diluted (blue, gray, fawn) areas of dilute-coated dogs, and this dog is black and white.","1":"Pattern alopecia affects the pinnae, post-auricular region, ventral neck, and caudomedial thighs regardless of hair color.","3":"Alopecia X affects plush-coated breeds aged 1-5 years, starting on the rear thighs with loss of primary hairs.","4":"Recurrent flank alopecia is seasonal, well-demarcated flank alopecia in young adult Boxers, Airedales, and Bulldogs."},"lec":"W13: Alopecia","weeks":[13],"mods":[4]},{"stem":"A 7-year-old spayed German shepherd has widespread deep pyoderma with draining tracts and crusts on the trunk, and cytology shows cocci with pyogranulomatous inflammation. Culture grows Staphylococcus pseudintermedius resistant to oxacillin, amoxicillin-clavulanate, cephalexin, clindamycin, doxycycline, trimethoprim-sulfamethoxazole, and enrofloxacin, and susceptible to rifampin and amikacin. Systemic therapy is started with one of the susceptible drugs, along with topical antiseptics. Which step must go with this drug choice?","options":["Household decolonization","Laboratory monitoring","Isolation from the family","Stopping topical antiseptics","A cefovecin trial if no response"],"correct":1,"why":"Oxacillin resistance identifies MRSP, which is resistant to all beta-lactams. The MRSP slide lists rifampin, chloramphenicol, amikacin, and gentamicin as reserved drugs that are never prescribed without C&S and carry a high risk of side effects, so laboratory monitoring is always required.","wrong":{"0":"The slides call decolonization impractical and impossible and recommend normal hygiene instead.","2":"MRSP carries a low zoonotic risk, so gloves, hand washing, and sanitizer are advised rather than isolation.","3":"Adjunctive topical antiseptic therapy is strongly recommended for deep pyoderma.","4":"Cefovecin is a cephalosporin, and MRSP is resistant to all beta-lactams."},"lec":"W12: Focal-to-Multifocal Alopecia","weeks":[12],"mods":[4]},{"stem":"A 17-year-old grey Arabian gelding has several firm, black dermal masses under the tail and around the anus. Two have enlarged over the past year, and FNA confirms melanoma. The largest masses are too extensive for simple excision. Which drug-based treatment fits the lecture best?","options":["BCG immunotherapy","Acyclovir","Imiquimod cream","Cisplatin","Ivermectin"],"correct":3,"why":"Melanomas develop in about 80% of grey horses over 15 years, often under the tail and around the anus, and are slowly progressive. The wounds and skin conditions lecture lists cisplatin for melanoma with greater than 80% success, alongside surgical excision, laser, and cryosurgery.","wrong":{"0":"BCG is immune stimulation used for sarcoids.","1":"Acyclovir is a sarcoid treatment.","2":"Imiquimod is used for sarcoids and aural plaques.","4":"Ivermectin treats habronemiasis (summer sores)."},"lec":"W14: Equine Wounds and Skin Conditions","weeks":[14],"mods":[4]},{"stem":"A 3-year-old neutered male Australian shepherd has two soft subcutaneous nodules on the left flank that drain pink, oily fluid. An emergency clinic lanced one 2 weeks ago without improvement. Wedge biopsies show pyogranulomatous panniculitis with fat necrosis, special stains are negative, and bacterial and fungal cultures are negative. Which initial treatment fits?","options":["Lancing and draining","Prednisone 1-2 mg/kg/day","Systemic antibiotics for 6 weeks","Minocycline 5 mg/kg BID","Wide surgical excision"],"correct":1,"why":"Sterile nodular panniculitis is an immune-mediated disease of subcutaneous fat that is often misdiagnosed as an abscess and lanced; diagnosis needs histopathology plus negative microbiology. Initial treatment is prednisone at 1-2 mg/kg/day, with long-term immunomodulators such as cyclosporine or oclacitinib.","wrong":{"0":"Lance and drain is the common ER misdiagnosis approach and has already failed.","2":"Cultures are negative, so antimicrobials do not address this immune-mediated disease.","3":"Minocycline is used for mineral chelation in calcinosis cutis.","4":"Wide excision is the plan for mast cell tumors, not immune-mediated panniculitis."},"lec":"W13: Nodular Diseases","weeks":[13],"mods":[4]},{"stem":"A 4-year-old Hereford cow cannot blink her left eye after a facial nerve injury in a chute, and the cornea is drying. A temporary tarsorrhaphy is planned under auriculopalpebral and eyelid ring blocks. Which suture placement fits the lecture?","options":["Mattress around the T-cartilage","Vertical mattress sutures","Horizontal mattress sutures","Michel suture clips","Figure-of-eight at the margin"],"correct":2,"why":"Impaired blinking and facial nerve trauma are listed indications for tarsorrhaphy to protect the cornea. The procedure uses 3-4 horizontal mattress sutures of 2-0 to 3-0 nylon emerging at the meibomian gland orifices (grey line), tied over stents and removed after 10-21 days.","wrong":{"0":"A mattress around the T-cartilage holds a third eyelid flap, not a tarsorrhaphy.","1":"Vertical mattress sutures are used for temporary tacking of entropion in puppies.","3":"Michel clips evert the lower lids of lambs with entropion.","4":"A figure-of-eight suture aligns the lid margin when repairing an eyelid laceration."},"lec":"W14: Large Animal Eye Exam and Surgery","weeks":[14],"mods":[4]},{"stem":"A 2-year-old, 12-kg male French bulldog has crusting and scale along both pinnal margins, with milder crusts on the muzzle, elbows, and hocks. Skin scrapings and fungal culture are negative, and a biopsy shows parakeratotic hyperkeratosis consistent with zinc-responsive dermatosis. Which daily zinc plan matches the lecture's dose?","options":["2.4-3.6 mg elemental zinc","240-360 mg elemental zinc","Dose set by serum zinc level","Zinc with high-dose prednisone","24-36 mg elemental zinc"],"correct":4,"why":"French bulldogs and Boston terriers are predisposed to the localized form, with pinnal margin crusting and scaling. The treatment slide gives 2-3 mg/kg of elemental zinc, so 12 kg x 2-3 mg/kg = 24-36 mg daily, ideally as zinc methionine or gluconate.","wrong":{"0":"This is a tenfold underdose of 2-3 mg/kg elemental zinc.","1":"This is a tenfold overdose, and high-dose zinc carries a risk of hemolysis.","2":"The slides state zinc levels are not helpful for diagnosis or management.","3":"Only ultra-low doses of glucocorticoids are listed to enhance zinc co-absorption."},"lec":"W12: Erosive and Crusting Dermatoses","weeks":[12],"mods":[4]},{"stem":"A 6-year-old spayed domestic shorthair cat was rescued from a house fire 2 hours ago. She smells of smoke and has soot around the nose and mouth. After supplemental oxygen her breathing has settled, but she now squints with the left eye, which is tearing and has a cloudy patch on the cornea. Which test identifies the eye lesion the fire most likely caused?","options":["Fluorescein stain","Schirmer tear test","Tonometry","Ocular ultrasound","Electroretinography"],"correct":0,"why":"The smoke inhalation lecture lists corneal ulcerations among the clinical signs and ophthalmic medications in the treatment plan (Week 12). The cornea lecture says to fluorescein stain every eye that shows signs of pain, such as squinting, tearing, or cloudiness, because fluorescein identifies corneal ulcers (Week 14).","wrong":{"1":"The Schirmer tear test measures tear production and does not identify an ulcer.","2":"Tonometry estimates IOP for glaucoma or uveitis, not corneal ulceration.","3":"Ocular ultrasound evaluates the posterior segment when opacities block the view.","4":"Electroretinography tests retinal function, not the cornea."},"lec":"Integration W12+W14: Smoke and the painful eye","weeks":[12,14],"mods":[4]},{"stem":"A 4-year-old Thoroughbred gelding in race training has had a fever of 103.6°F (39.8°C), a moist cough, and bilateral mucopurulent nasal discharge for 4 days. A rebreathing exam brings out crackles over the cranioventral lung fields, and thoracic ultrasound shows patchy cranioventral consolidation with no pleural fluid. The clinician suspects a septic, bacterial lower airway process and wants an airway sample for cytology and culture. Which sample fits best?","options":["Transtracheal wash","Bronchoalveolar lavage","Thoracocentesis","Lung biopsy","Guttural pouch endoscopy"],"correct":0,"why":"The TTW versus BAL table says a transtracheal wash collects secretions from the distal trachea and assesses both central and peripheral airways, with a low risk of cellulitis at the incision site. BAL samples only one localized region and is listed for diffuse lower airway disorders, typically nonseptic ones, so a suspected septic process points to the TTW.","wrong":{"1":"BAL samples only one localized region and is listed for diffuse, typically nonseptic lower airway disease.","2":"Thoracocentesis collects pleural fluid, and the ultrasound shows none.","3":"Lung biopsy is kept for when all less invasive tests have failed and carries complications up to death.","4":"Guttural pouch endoscopy is an upper airway test, and these findings localize to the lower airway."},"lec":"W12: Equine Respiratory Conditions","weeks":[12],"mods":[4]},{"stem":"A 15-year-old spayed domestic shorthair cat has been blind for 5 days. Both pupils are dilated with poor PLRs, and both retinas are detached with retinal hemorrhages. Systolic blood pressure is 240 mmHg, chronic kidney disease is found, and amlodipine is started the same day. What should the owner be told about vision?","options":["Blindness is permanent","Only surgery can restore it","Vision may return","Full recovery is expected","Too late after 48 hours"],"correct":2,"why":"Hypertensive retinopathy, common in older cats with renal disease, often presents as acute blindness with retinal detachment and hemorrhage. The prognosis is guarded, but prompt antihypertensive therapy may allow the retinas to reattach and vision to return, up function modOfWeek(w) { return w <= 3 ? 1 : (w <= 7 ? 2 : (w <= 11 ? 3 : 4)); }
function weekLabel(w) { return "Week " + w + " " + COURSE[modOfWeek(w)]; }
function isX(q) { return q.weeks.length > 1; }
function lecLabel(q) { return isX(q) ? "Integration questions" : q.lec.replace(/^W\d+:\s*/, ""); }
function pctOf(right, n) { return n ? Math.round(100 * right / n) : 0; }
function band(p) { return p < 50 ? "under-50" : (p < 70 ? "50-69" : (p < 85 ? "70-84" : "85-up")); }
function score(answers) {
  var res = { total: 0, n: QS.length, byWeek: {}, byLec: {}, byModule: {}, byDisc: {}, bySpecies: {}, cross: { right: 0, n: 0 } };
  function add(map, key, ok) { if (!map[key]) map[key] = { right: 0, n: 0 }; map[key].n++; if (ok) map[key].right++; }
  QS.forEach(function (q, i) {
    var ok = answers[i] === q.correct;
    if (ok) res.total++;
    q.weeks.forEach(function (w) {
      add(res.byWeek, w, ok);
      if (!res.byLec[w]) res.byLec[w] = {};
      add(res.byLec[w], lecLabel(q), ok);
    });
    q.mods.forEach(function (m) { add(res.byModule, m, ok); });
    if (q.disc) add(res.byDisc, q.disc, ok);
    if (q.species) add(res.bySpecies, q.species, ok);
    if (isX(q)) { res.cross.n++; if (ok) res.cross.right++; }
  });
  res.pct = pctOf(res.total, res.n);
  res.weeks = Object.keys(res.byWeek).map(Number).sort(function (a, b) { return a - b; });
  res.lowWeeks = res.weeks.filter(function (w) { return pctOf(res.byWeek[w].right, res.byWeek[w].n) < 70; });
  return res;
}

function rowCls(r) { var p = pctOf(r.right, r.n); return p < 70 ? "low" : (p >= 85 ? "strong" : ""); }

function row(label, r, cls) {

}

    var c = j === q.correct ? " correct" : (j === a ? " wrongpick" : "");
    var tag = j === q.correct ? " (correct answer)" : (j === a ? " (your answer)" : "");
    h += '<div class="opt' + c + '"><span class="let">' + LET[j] + '</span><span class="txt">' + esc(o) + '<b>' + tag + '</b></span></div>';
  });
  h += '<div class="why"><b>Why ' + LET[q.correct] + '. ' + esc(q.options[q.correct]) + ' is correct:</b> ' + esc(q.why) + '</div>';
  if (a !== null && a !== q.correct) h += '<div class="pick"><b>Why your answer, ' + LET[a] + '. ' + esc(q.options[a]) + ', misses:</b> ' + esc(q.wrong[a]) + '</div>';
  h += '<details class="others"><summary>Why each other option misses</summary>';
  q.options.forEach(function (o, j) { if (j !== q.correct) h += '<p><b>' + LET[j] + '. ' + esc(o) + ':</b> ' + esc(q.wrong[j]) + '</p>'; });
  var tags = [q.weeks.map(weekLabel).join(" + ")].concat([q.disc, q.species, q.type].filter(Boolean));
  h += '</details><p class="meta" style="margin-top:12px">' + esc(tags.join(" · ")) + '</p>' +
    '<div class="navrow"><button type="button" id="rprev"' + (pos === 0 ? " disabled" : "") + '>Previous</button><button type="button" id="back">Back to results</button>' +
    '<button type="button" class="primary" id="rnext"' + (pos === list.length - 1 ? " disabled" : "") + '>Next</button></div></section>' +
    '<section class="sheet"><h3 style="margin-top:0">All questions</h3>' + gridHtml(true) + '<div class="legend">Green = correct, red = missed<span></span>flagged during the exam</div></section>';
  app.innerHTML = h;
  document.getElementById("rprev").onclick = function () { S.cur = list[pos - 1]; render(); toTop(); };
  document.getElementById("rnext").onclick = function () { S.cur = list[pos + 1]; render(); toTop(); };
  document.getElementById("back").onclick = function () { S.screen = "results"; render(); toTop(); };
  document.getElementById("mo").onchange = function () { S.missedOnly = this.checked; render(); };
  Array.prototype.forEach.call(document.querySelectorAll("[data-go]"), function (b) { b.onclick = function () { var g = +b.getAttribute("data-go"); if (S.missedOnly && missed().indexOf(g) < 0) S.missedOnly = false; S.cur = g; render(); toTop(); }; });
}
function render() {
  showTimer();
  if (S.screen === "disclaimer") disclaimerScreen();
  else if (S.screen === "start") startScreen();
  else if (S.screen === "exam") examScreen();
  else if (S.screen === "results") resultsScreen();
  else reviewScreen();
}
render();
</script>
