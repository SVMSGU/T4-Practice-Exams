<style>
:root {
  --navy:#14294B; --teal:#1F7A8C; --aqua:#E8F4F6; --yellow:#F5C518; --ink:#16202E; --muted:#4F5D6E; --rule:#C9D6DD;

* { box-sizing:border-box; }
html { -webkit-text-size-adjust:100%; }
body { margin:0; font-family:var(--serif); color:var(--ink); background:var(--bg); font-size:17px; line-height:1.55; overflow-wrap:break-word; }
header { background:var(--bg); border-bottom:3px solid var(--navy); position:sticky; top:0; z-index:5; }
.hwrap { max-width:760px; margin:0 auto; padding:10px 16px 9px; display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; }
.kicker { font-family:var(--sans); font-size:13px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; color:var(--teal); text-decoration:none; }
header h1 { font-size:21px; margin:0; color:var(--navy); line-height:1.25; }
.timer { font-family:var(--sans); font-size:19px; font-weight:700; color:var(--navy); display:flex; align-items:center; gap:10px; font-variant-numeric:tabular-nums; }
.timer.low { color:var(--red); }
main { max-width:760px; margin:0 auto; padding:18px 16px 32px; }
section.sheet { background:var(--paper); border:1px solid var(--rule); border-radius:2px; padding:22px 24px; margin-bottom:18px; }
h2 { color:var(--navy); margin:0 0 12px; font-size:26px; line-height:1.25; }
h3 { color:var(--navy); margin:22px 0 8px; font-size:19px; padding-bottom:4px; border-bottom:1px solid var(--rule); }
p { margin:0 0 12px; }
.lead { color:var(--muted); }
button, .btn { font-family:var(--sans); font-size:16px; font-weight:600; border-radius:3px; border:1px solid var(--navy); background:var(--paper); color:var(--navy); padding:9px 16px; cursor:pointer; line-height:1.3; }
button.primary { background:var(--navy); color:var(--on); }
button.teal { background:var(--teal); border-color:var(--teal); color:var(--on); }
button:disabled { opacity:.4; cursor:default; }
button:focus-visible, input:focus-visible, summary:focus-visible { outline:3px solid var(--yellow); outline-offset:2px; }
header button { padding:5px 12px; font-size:15px; }
ol.steps { padding-left:22px; }
ol.steps li { margin-bottom:8px; }
.notice { border-left:4px solid var(--yellow); background:var(--aqua); padding:14px 16px; margin:0 0 16px; }
.notice p:last-child { margin-bottom:0; }
.agree { font-family:var(--sans); font-size:17px; font-weight:600; display:flex; align-items:center; gap:10px; margin:6px 0 4px; cursor:pointer; }
.agree input { width:22px; height:22px; margin:0; accent-color:var(--navy); }
.qhead { display:flex; justify-content:space-between; align-items:baseline; gap:6px 12px; flex-wrap:wrap; margin-bottom:12px; padding-bottom:8px; border-bottom:1px solid var(--rule); }
.qnum { color:var(--navy); font-weight:700; font-size:21px; }
.meta { font-family:var(--sans); color:var(--muted); font-size:14px; }
.stem { margin:0 0 16px; white-space:pre-wrap; }
.opt { display:flex; align-items:flex-start; gap:12px; width:100%; text-align:left; border:1px solid var(--rule); background:var(--paper); color:var(--ink); border-radius:3px; padding:10px 12px; margin-bottom:8px; font-family:var(--serif); font-weight:400; font-size:inherit; }
.opt .let { flex:0 0 30px; height:30px; border:1px solid var(--navy); border-radius:50%; color:var(--navy); font-family:var(--sans); font-weight:700; display:flex; align-items:center; justify-content:center; }
.opt.sel { border-color:var(--navy); background:var(--aqua); box-shadow:inset 3px 0 0 var(--navy); }
.opt.sel .let { background:var(--navy); color:var(--on); }
.opt.correct { border-color:var(--green); background:var(--greenbg); }
.opt.correct .let { background:var(--green); border-color:var(--green); color:var(--on); }
.opt.wrongpick { border-color:var(--red); background:var(--redbg); }
.opt.wrongpick .let { background:var(--red); border-color:var(--red); color:var(--on); }
.opt .txt { padding-top:2px; min-width:0; }
.navrow { display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; margin-top:16px; }
.flagbtn.on { background:var(--yellow); border-color:var(--yellow); color:#16202E; }

.grid button.ans { background:var(--aqua); }

.grid button.r-ok { background:var(--greenbg); border-color:var(--green); color:var(--green); }
.grid button.r-bad { background:var(--redbg); border-color:var(--red); color:var(--red); }
.legend { font-family:var(--sans); font-size:14px; color:var(--muted); margin-top:8px; }
.legend span { display:inline-block; width:10px; height:10px; border-radius:50%; background:var(--yellow); border:1px solid #8A6D00; margin:0 4px 0 10px; }
.big { font-size:42px; font-weight:700; color:var(--navy); line-height:1.2; margin-bottom:6px; }
table { table-layout:fixed; border-collapse:collapse; width:100%; font-size:16px; margin-bottom:10px; }
th { font-family:var(--sans); font-size:14px; text-transform:uppercase; letter-spacing:.04em; color:var(--navy); text-align:left; padding:6px 8px; border-bottom:2px solid var(--navy); }
td { border-bottom:1px solid var(--rule); padding:7px 8px; vertical-align:top; }
td.num, th.num { text-align:right; white-space:nowrap; font-variant-numeric:tabular-nums; }
th.c1 { width:52%; } th.c2 { width:18%; } th.c3 { width:12%; } th.c4 { width:18%; }
tr.low td { background:var(--redbg); }
tr.low td:first-child { box-shadow:inset 4px 0 0 var(--red); }
tr.strong td { background:var(--greenbg); }
tr.tip td { background:var(--redbg); color:var(--red); font-family:var(--sans); font-weight:700; font-size:15px; padding-top:0; }
tr.tip td:first-child { box-shadow:inset 4px 0 0 var(--red); }
.bar { height:8px; background:var(--aqua); border:1px solid var(--rule); overflow:hidden; margin-top:7px; }
.bar i { display:block; height:100%; background:var(--teal); }
tr.low .bar i { background:var(--red); }
tr.strong .bar i { background:var(--green); }
.callout { border:1px solid var(--red); background:var(--redbg); padding:12px 14px; margin:12px 0; }
.callout b { color:var(--red); }
.callout.ok { border-color:var(--green); background:var(--greenbg); }
.callout.ok b { color:var(--green); }
details.wk { border-bottom:1px solid var(--rule); padding:6px 0; }
details.wk summary { cursor:pointer; font-family:var(--sans); font-weight:700; color:var(--navy); font-size:16px; padding:4px 0; }
details.wk summary .s { font-weight:400; color:var(--muted); }
details.wk.low summary { color:var(--red); }
details.wk table { margin-top:6px; }
.why { background:var(--aqua); border-left:4px solid var(--navy); padding:12px 14px; margin-top:14px; }
.why b { color:var(--navy); }
.pick { border:1px solid var(--red); border-left-width:4px; padding:12px 14px; margin-top:10px; }
details.others { margin-top:12px; }
details.others summary { cursor:pointer; font-family:var(--sans); font-weight:600; color:var(--navy); }
.pill { display:inline-block; font-family:var(--sans); border:1px solid var(--teal); color:var(--teal); border-radius:2px; padding:1px 8px; font-size:14px; font-weight:600; }
.chk { font-family:var(--sans); font-size:15px; display:flex; align-items:center; gap:8px; }
.modal { position:fixed; inset:0; background:rgba(15,24,38,.6); display:flex; align-items:center; justify-content:center; padding:16px; z-index:10; }
.modal section.sheet { max-width:480px; width:100%; margin:0; }
.hidden { display:none !important; }
footer { max-width:760px; margin:0 auto; text-align:center; color:var(--muted); font-size:14px; padding:14px 16px 28px; border-top:1px solid var(--rule); }
.paused { text-align:center; padding:44px 20px; }
@media (max-width:600px) {
  body { font-size:16px; }
  .grid { grid-template-columns:repeat(5, minmax(0, 1fr)); }
  h2 { font-size:22px; }
  .big { font-size:34px; }
  section.sheet { padding:16px 14px; }
  .navrow button { flex:1 1 40%; }
  header h1 { font-size:18px; }
  th.c1 { width:56%; } th.c2 { width:26%; } th.c3 { width:18%; }
  th.c4, td.c4 { display:none; }
  table { font-size:15px; }
}
@media print {
  header { position:static; }
  .navrow, .grid, .legend, .timer { display:none !important; }
}

<script>
var CFG = {"id":"m3","title":"Module 3 Practice Exam: Systems 4 CVR","intro":"60 questions from Weeks 8-11, built from the Systems 4 CVR lecture slides. 90 minutes: 3 blocks of 20, about 30 minutes each.","minutes":90,"block":20,"final":false,"xnote":"Some questions combine material from two or more weeks. They count toward every week they draw on.","submitNote":"You will see your score by week and by lecture, then review every question with explanations."};
var QS = [{"stem":"A 4-year-old intact male mixed-breed dog that roams along a river in Grenada has a sudden black, cold area on his tongue consistent with a lingual thrombus. He is azotemic. He has no murmur or arrhythmia, he is eating normally without vomiting or diarrhea, albumin and cholesterol are within reference intervals, and his urine protein:creatinine ratio is normal. Which test is most likely to identify the cause of the thrombus?","options":["ACTH stimulation test","Echocardiography","Thromboelastography (TEG)","Pancreatic lipase test","Leptospira PCR and titer"],"correct":4,"why":"A patient presenting with a thrombus is worked through the Virchow's triad differentials. Leptospirosis is the differential whose clue is a lingual thrombus or PTE, and its diagnostics are bloodwork plus Lepto PCR and/or titer; his azotemia fits, while heart disease, PLN, PLE, pancreatitis, and hyperadrenocorticism lack their clues here.","wrong":{"0":"ACTH stimulation or LDDS testing is for hyperadrenocorticism, which has its own PE and bloodwork clues.","1":"Echocardiography looks for heart disease, and he has no murmur or arrhythmia.","2":"TEG can show a hypercoagulable state, but it does not identify the underlying disease.","3":"Pancreatitis is suggested by vomiting and decreased appetite, which he does not have."},"lec":"W9: Coagulation Disorders","weeks":[9],"mods":[3]},{"stem":"A 12-year-old male neutered Cavalier King Charles Spaniel with a known left apical murmur is carried in open-mouth breathing, orthopneic with abducted elbows, and anxious. He has crackles over both lung fields and a heart rate of 190 bpm. He has been placed in oxygen and given butorphanol, and the owners cannot afford referral. Which imaging should guide treatment at this point?","options":["Three-view thoracic radiographs","Thoracic CT","Referral echocardiography","Point-of-care ultrasound","Fluoroscopy"],"correct":3,"why":"Unstable respiratory patients are stabilized first with no stress, and the respiratory emergency lecture warns that radiographs can kill, so imaging waits until after initial stabilization (Week 10). The Week 8 CHF and Staying Alive slides use POCUS or T-FAST for emergencies and when finances limit referral: in a dog in respiratory distress, B-lines with left atrial enlargement mean treat for CHF.","wrong":{"0":"Radiographs wait until the patient is stable, because the stress of positioning can kill.","1":"CT is an imaging step after stabilization, useful for bullae and blebs.","2":"Referral is not possible here, and he is too unstable to move.","4":"Fluoroscopy diagnoses dynamic tracheal collapse."},"lec":"Integration W8+W10: Imaging the unstable patient","weeks":[8,10],"mods":[3]},{"stem":"A 1-year-old male neutered domestic shorthair cat has a holosystolic murmur heard best on the right side. Echocardiography confirms a membranous ventricular septal defect with left atrial and left ventricular dilation from volume overload. He is not yet in respiratory distress. The owner asks whether they can simply recheck him next year. Which plan does the lecture support?","options":["Recheck echocardiogram in 12 months","Sildenafil","Pimobendan, ACEI, furosemide","Atenolol and exercise restriction","Periodic phlebotomy"],"correct":2,"why":"Most VSDs are membranous, with a systolic murmur loudest on the right and volume overload of the RV outflow, pulmonary circulation, LA, and LV. For cats with a VSD and volume overload, the slide lists pimobendan, an ACE inhibitor, and furosemide, and it warns: don't watch and wait. Only small defects carry a normal life span, and some close by 2 years of age.","wrong":{"0":"Watching and waiting is what the slide warns against once there is volume overload.","1":"Sildenafil treats a reversed PDA with pulmonary hypertension.","3":"Beta-blockers and exercise restriction are the SAS management plan.","4":"Periodic phlebotomy treats erythrocytosis in tetralogy of Fallot."},"lec":"W8: Congenital Cardiac Disease","weeks":[8],"mods":[3]},{"stem":"A sheep flock tests positive for ovine progressive pneumonia virus, with several thin ewes that have chronic pneumonia and hard udders. The producer will test and cull, but lambing is about to start and she wants to protect this season's lambs. Which measure does the lecture list to reduce transmission to the lambs?","options":["Vaccinate lambs at birth","Test lambs at 2 months of age","Treat ewes with tilmicosin","No colostrum from positives","Shear ewes before lambing"],"correct":3,"why":"OPPV is a small ruminant lentivirus spread directly, especially through colostrum and milk and also respiratory secretions, causing pneumonia, arthritis, hard bag mastitis, and wasting. There is no treatment; control is test and cull, a closed herd, buying from negative herds, and not using colostrum or milk from positive animals.","wrong":{"0":"The OPPV control slide lists no vaccine; control relies on testing, culling, and colostrum management.","1":"Maternal antibodies interfere with testing lambs up to about 6 months of age.","2":"The slides state there is no treatment for OPPV.","4":"Recent shearing in cold weather is a pneumonia risk factor, not an OPPV control step."},"lec":"W11: Production Animal Lower Airway","weeks":[11],"mods":[3]},{"stem":"A 13-year-old spayed female Chihuahua has had exercise intolerance for 3 weeks and now coughs at night. Her resting respiratory rate at home has risen from 20 to 44 breaths/min. She has a grade V/VI holosystolic plateau murmur loudest at the left apex, a regular rhythm at 150 bpm, strong synchronous pulses, and crackles over the caudodorsal lung fields. Which underlying heart disease is most likely?","options":["Dilated cardiomyopathy","Mitral valve dysplasia","Infective endocarditis","Subaortic stenosis","Mitral endocardiosis"],"correct":4,"why":"Valvular endocardiosis is the most common cause of heart failure in the dog and affects older small to mid-size breeds such as Chihuahuas, with a holosystolic plateau murmur at the left apex. Her rising resting respiratory rate and crackles fit left-sided backward failure, the same picture as the Staying Alive patient whose final diagnosis was MMVD.","wrong":{"0":"DCM affects large and giant breeds and commonly brings atrial fibrillation; she is a toy breed with a regular rhythm.","1":"Mitral dysplasia gives signs like degenerative disease but in younger dogs, such as Bull Terriers.","2":"Infective endocarditis is more common in young large-breed dogs with fever and a new murmur.","3":"SAS gives a crescendo-decrescendo murmur at the left heart base, not a plateau at the apex."},"lec":"W8: CBL Staying Alive I and II","weeks":[8],"mods":[3]},{"stem":"An 11-year-old male neutered Labrador Retriever had a unilateral arytenoid lateralization (tie-back) for idiopathic laryngeal paralysis 2 weeks ago and is breathing quietly. At discharge the owner says the dog loves the lake and asks about activities from now on. Which advice matches the lecture?","options":["Swimming for weight loss","Neck collar on walks","No swimming","Exercise in hot weather","Long-term high-dose steroids"],"correct":2,"why":"After tie-back surgery for laryngeal paralysis the prognosis is fair to good, with 90% alive at more than 1 year and a median survival over 5 years, but aspiration pneumonia is a key complication. The lecture's advice is no swimming, together with weight loss, avoiding heat, and avoiding collars.","wrong":{"0":"Weight loss is advised, but the slide's specific rule is no swimming.","1":"Collars are to be avoided in laryngeal paralysis.","3":"Heat is to be avoided because it worsens airway distress.","4":"Glucocorticoids are used short and tapering in emergency management, not long term."},"lec":"W11: SA Upper and Lower Airway 1","weeks":[11],"mods":[3]},{"stem":"A 3-year-old male neutered English Bulldog with BOAS and gastroesophageal reflux is scheduled for corrective airway surgery. His premedication plan includes a full mu opioid, and the anesthetist is concerned about vomiting and aspiration. In addition to gastroprotectants, which drug from the case's complementary drug list is given before the procedure to address this concern?","options":["Trazodone","Gabapentin","Maropitant","Glycopyrrolate","Acepromazine"],"correct":2,"why":"BOAS patients carry a high anesthetic risk that includes gastroesophageal reflux, hiatal hernia, and aspiration pneumonia, and full mu opioids such as morphine (like alpha-2 agonists) can induce vomiting. The case's complementary drugs list maropitant as the antiemetic given before the procedure, alongside gastroprotectants and prokinetics.","wrong":{"0":"Trazodone is an oral tranquilizer given at home to reduce stress.","1":"Gabapentin is also an at-home tranquilizer, not an antiemetic.","3":"Glycopyrrolate is the anticholinergic for vagal bradycardia that lowers blood pressure.","4":"Acepromazine is a sedative for premedication or recovery, not an antiemetic."},"lec":"W10: CBL Airway Cases","weeks":[10],"mods":[3]},{"stem":"A 6-year-old spayed female Doberman Pinscher stumbled on a walk last week. She has an irregularly irregular rhythm at 190 bpm with pulses of variable intensity. The ECG confirms atrial fibrillation, echocardiography shows dilated cardiomyopathy, and thoracic radiographs show no congestive heart failure. You, the client, and the cardiologist are agreeing on her discharge medications. Which combination fits the follow-up plan used for this patient in the Staying Alive cases?","options":["Pimobendan and atenolol","Diltiazem alone","Pimobendan with quinidine conversion","Enalapril alone","Pimobendan and diltiazem"],"correct":4,"why":"The Staying Alive IV follow-up plan for the Doberman with DCM and atrial fibrillation started pimobendan and diltiazem, with a blood pressure recheck in 1 week and a cardiologist recheck in 3 months. Pimobendan supports contractility and prolongs survival in DCM, and diltiazem slows AV conduction toward the dog target of under 150 bpm, because conversion to sinus rhythm is rare.","wrong":{"0":"Beta-blockers carry a caution with myocardial failure, which is the problem in DCM.","1":"Diltiazem controls rate but leaves the failing myocardium without pimobendan.","2":"Quinidine conversion belongs to the horse AF plan; in dogs sinus conversion is rare and rate control is the goal.","3":"In the plan, enalapril is added later, once blood pressure starts to rise."},"lec":"W9: CBL Staying Alive IV","weeks":[9],"mods":[3]},{"stem":"A 7-month-old male Labrador Retriever adopted from a shelter has a productive cough, fever, and crackles. Radiographs show a cranioventral alveolar pattern, and an airway wash is submitted for cytology and culture. The proposed plan includes oxygen, systemic IV fluids, saline nebulization with coupage, broad-spectrum antimicrobials, and furosemide to 'dry out the lungs.' Which item should be removed from the plan?","options":["IV fluids","Furosemide","Saline nebulization","Coupage","Broad-spectrum antimicrobials"],"correct":1,"why":"A cranioventral alveolar pattern with fever and crackles in a young shelter dog fits bacterial pneumonia, with young age and community contact as risk factors. Pneumonia care hydrates the airway (systemic fluids, humidification, saline nebulization), adds physiotherapy and antimicrobials, and the slide says to avoid diuretics, cough suppressants, and corticosteroids.","wrong":{"0":"Systemic fluid therapy is part of airway hydration.","2":"Saline nebulization hydrates the airways.","3":"Coupage is the physiotherapy on the slide.","4":"Broad-spectrum antimicrobials are used while susceptibility testing is pending."},"lec":"W11: SA Lower Airway 2","weeks":[11],"mods":[3]},{"stem":"A 2-year-old Thoroughbred filly reared and fell over backward while being loaded into a trailer. An hour later she has bilateral epistaxis, but her neurologic exam is normal. Endoscopy shows blood draining from the guttural pouch openings, with no fungal plaque and no purulent material visible. Which diagnosis is most likely?","options":["Rectus capitis avulsion","Guttural pouch mycosis","Guttural pouch empyema","Progressive ethmoid hematoma","Nasal septum deformity"],"correct":0,"why":"A young horse that rears or falls over during loading can avulse the rectus capitis and/or longus capitis muscles, with hemorrhage into the guttural pouch. It is a differential for blood coming from the pouch, it can be managed conservatively, and the prognosis is poor only if neurologic signs develop.","wrong":{"1":"Mycosis shows an Aspergillus plaque over the internal carotid artery, and none is seen.","2":"Empyema is pus in the guttural pouch after an upper respiratory infection such as strangles.","3":"A PEH is a green, yellow, or red mass on the ethmoids with blood-tinged discharge.","4":"Septum deformity reduces nasal airflow and causes stertor, not acute epistaxis after a fall."},"lec":"W10: Equine Airway Surgery 1","weeks":[10],"mods":[3]},{"stem":"A 3-year-old pregnant Angus heifer developed brisket edema and jugular distension at 7,000 ft and was moved to a valley pasture 5 days ago. She still has ventral edema, tachypnea, and signs of congestive heart failure. The owner may sell her for beef after calving and wants CHF therapy that carries no withdrawal time. Which drug fits?","options":["Furosemide 1 mg/kg IM","Digoxin","Deworming","Low-dose heparin","Antibiotics"],"correct":3,"why":"Pregnant animals are the notable adult exception for high mountain disease, and moving to a lower altitude is the initial treatment. If CHF signs persist, the slide lists low-dose heparin (30 U/kg SC q12h) with no withdrawal time, furosemide with a 48-hour milk and meat withdrawal, and digoxin, whose feasibility in food animals is questioned.","wrong":{"0":"Furosemide carries a 48-hour milk and meat withdrawal.","1":"Digoxin is listed, but the slide questions whether it is feasible in food-producing animals.","2":"The slide lists deworming to treat a primary lung disease, not CHF.","4":"The slide lists antibiotics to treat a primary lung disease, which she does not have."},"lec":"W9: LA Vascular Disease","weeks":[9],"mods":[3]},{"stem":"A 5-year-old Warmblood mare has had colic signs and profuse watery diarrhea for 12 hours. Abdominocentesis yields far more than the normal volume of yellow, slightly cloudy fluid. Analysis shows a high total protein and a moderately increased nucleated cell count, cytology shows non-degenerate neutrophils with no bacteria and no red blood cells, and peritoneal lactate is not increased. Which interpretation fits?","options":["Strangulating lesion","Septic peritonitis","Colitis or enteritis","Simple obstruction","Normal peritoneal fluid"],"correct":2,"why":"Normal equine peritoneal fluid is under 5 mL (10 mL at most) and contains zero RBCs, so this volume is abnormal. The effusions lecture describes colitis or enteritis as high protein, a moderate cell count, and non-degenerate neutrophils, which matches; strangulation adds serosanguinous fluid with RBCs and high lactate, and peritonitis adds bacteria and degenerate neutrophils.","wrong":{"0":"Strangulation turns the fluid orange to red with RBCs, with more than 90% neutrophils and high lactate.","1":"Peritonitis gives cloudy fluid with bacteria, degenerate neutrophils, and high lactate.","3":"Obstruction fluid has lower protein, with macrophages and mature neutrophils.","4":"Normal fluid is a small volume of clear, straw-colored fluid."},"lec":"W10: Effusions","weeks":[10],"mods":[3]},{"stem":"In late spring on a Kentucky breeding farm, several mares abort within the same month. A 6-year-old gelding on the same pastures develops fever, tachycardia, muffled heart sounds, and jugular distension. Echocardiography shows a pericardial effusion with fibrin strands, and the fluid from pericardiocentesis is a septic exudate. Which cause is most likely?","options":["Immune-mediated pericarditis","Pericardial lymphoma","Hardware disease","Heartwater","Eastern tent caterpillars"],"correct":4,"why":"Eastern tent caterpillars cause septic fibrinous pericarditis in horses: their barbed setae penetrate the intestinal lining and let gut bacteria reach the bloodstream. They are also associated with mare reproductive loss syndrome, which fits the cluster of abortions on the same farm.","wrong":{"0":"Immune-mediated pericarditis is on the equine list, but it would not give a septic exudate.","1":"Tumors cause aseptic effusions, and lymphoma is the bovine heart base tumor.","2":"Hardware disease (TRP) is the classic cause in cattle, from a swallowed wire.","3":"Heartwater is a tick-borne disease of cattle caused by Ehrlichia ruminantium."},"lec":"W9: Pericardial Disease","weeks":[9],"mods":[3]},{"stem":"A 9-year-old spayed female Labrador Retriever with multicentric lymphoma has received several doses of doxorubicin over 4 months. She eats a WSAVA-approved commercial diet, lives indoors, and has never traveled. She now has exercise intolerance and tachypnea. Echocardiography shows a dilated left ventricle with poor contractility, and the ECG shows VPCs. Which cause of her myocardial failure is most likely?","options":["Diet-associated DCM","L-carnitine deficiency","Chagas myocarditis","Parvoviral myocarditis","Doxorubicin toxicity"],"correct":4,"why":"Toxic myocardial disease from doxorubicin causes acute and chronic damage with decreased cardiac output, arrhythmias, and myocyte damage; it depends on the cumulative dose and presents much like DCM. Repeated doses over months, a DCM-like echo, and VPCs fit, while her diet, environment, and history point away from the other secondary causes.","wrong":{"0":"Diet-associated DCM is linked to boutique or grain-free diets, and she eats a WSAVA-approved diet.","1":"L-carnitine deficiency is listed for Cockers, Goldens, and Newfoundlands; her doxorubicin doses are the clearer cause.","2":"Chagas disease needs reduviid bug exposure, and she lives indoors without travel.","3":"The slide lists parvovirus as an uncommon cause of myocarditis now, and nothing here suggests it."},"lec":"W8: Acquired Cardiac Disease","weeks":[8],"mods":[3]},{"stem":"A 5-year-old male German Shorthaired Pointer ran onto a broken branch while hunting. A 2-cm-wide stick is lodged in his left lateral thoracic wall and enters the pleural space. He is breathing with effort but ventilating, and his mucous membranes are pink on oxygen. What should be done with the stick during stabilization and transport to surgery?","options":["Immediate removal","Removal and wound packing","Removal, then a chest tube","Leave it in place","Removal, then thoracocentesis"],"correct":3,"why":"A penetrating thoracic wound such as an impalement creates an open pneumothorax. The thoracic trauma lecture states that keeping the impaling object in place may aid ventilation by maintaining negative pressure in the chest, whereas removing it may lead to respiratory collapse.","wrong":{"0":"Immediate removal is what the slide warns may lead to respiratory collapse.","1":"Packing after removal still loses the seal the object provides, risking collapse.","2":"A chest tube does not replace the seal; the slide says to keep the object in place.","4":"Draining after removal still risks the collapse the slide describes."},"lec":"W10: Thoracic Trauma","weeks":[10],"mods":[3]},{"stem":"A 12-week-old female Pomeranian has a continuous murmur loudest at the left heart base and bounding, water-hammer femoral pulses. Radiographs show an enlarged left atrium and ventricle, overcirculated pulmonary vessels, and a ductus bump. The owner declines transcatheter or surgical repair and asks what to expect without treatment. Which prognosis matches the lecture?","options":["Normal life span expected","Half die within a year","Over half die suddenly by 3 years","Survival to middle age","Closure by 2 years of age"],"correct":1,"why":"A continuous left basilar murmur, bounding pulses, and left heart volume overload with a ductus bump are classic for a left-to-right PDA. The PDA slide states that without treatment 50% will die within a year, whereas catching it early and fixing it before changes develop can allow a normal life span.","wrong":{"0":"A normal life span is possible only when the PDA is fixed early, before changes develop.","2":"More than half dying suddenly within 3 years is the SAS prognosis with a high Doppler gradient.","3":"Living to middle age is the outlook for mild tetralogy of Fallot.","4":"Closure within 2 years is described for small VSDs, not a PDA."},"lec":"W8: Congenital Cardiac Disease","weeks":[8],"mods":[3]},{"stem":"A 10-year-old Warmblood gelding has atrial fibrillation with moderate mitral regurgitation and left atrial enlargement on echocardiography. He is scheduled for transvenous electrical cardioversion under general anesthesia. The draft plan is acepromazine, a low-dose alpha-2 agonist, and butorphanol for premedication; isoflurane with a lidocaine CRI for maintenance; and low-dose dobutamine if he becomes hypotensive. Which drug should be removed from the plan?","options":["Low-dose alpha-2 agonist","Acepromazine","Butorphanol","Lidocaine CRI","Dobutamine"],"correct":1,"why":"Equine AF without structural heart changes is lone (idiopathic) or paroxysmal, but this horse has structural disease, with mitral regurgitation and left atrial enlargement. The TVEC anesthesia plan limits acepromazine to lone cases, while a low-dose alpha-2 with butorphanol, isoflurane with a lidocaine CRI, and low-dose dobutamine for hypotension stay in the protocol.","wrong":{"0":"A low-dose alpha-2 agonist is part of the TVEC premedication.","2":"Butorphanol at 0.05 mg/kg is listed with the low-dose alpha-2.","3":"Isoflurane with or without a lidocaine CRI is the listed maintenance.","4":"Low-dose dobutamine is the listed plan for hypotension."},"lec":"W11: Cardiovascular Anesthesia","weeks":[11],"mods":[3]},{"stem":"A 7-year-old spayed female Labrador Retriever has had bilateral mucopurulent nasal discharge and sneezing for 4 months. CT shows no lysis or mass. Rhinoscopic biopsy shows lymphoplasmacytic inflammation, fungal culture is negative, and no foreign body or mites are found. She improves only briefly on antibiotics for secondary infection. Which additional treatment option does the lecture list for dogs with this condition?","options":["Topical clotrimazole","Milbemycin oxime","Radiation therapy","Piroxicam","Itraconazole"],"correct":3,"why":"Canine chronic lymphoplasmacytic rhinitis is managed like feline idiopathic rhinitis once other causes are ruled out: drainage, nebulization, flushes, fewer irritants, control of secondary infection, and possibly antihistamines or corticosteroids. The canine slide adds one extra option: some dogs respond to piroxicam.","wrong":{"0":"Topical clotrimazole is the treatment of choice for nasal aspergillosis, and fungal culture was negative.","1":"Milbemycin oxime treats Pneumonyssoides nasal mites, which were not found.","2":"Radiation is for nasal tumors, and CT showed no mass.","4":"Azoles such as itraconazole treat fungal disease, which was ruled out."},"lec":"W10: SA Nasal Disorders","weeks":[10],"mods":[3]},{"stem":"A 2-year-old spayed female Border Collie that attends doggy day care has had a non-productive cough for 3 weeks. She now has fever, mucopurulent nasal discharge, and lethargy, and several other dogs at the day care are coughing. Which test does the lecture direct toward a more serious pathogen in this situation?","options":["Bordetella culture only","Heartworm antigen test","Fecal Baermann","Fluoroscopy","Canine influenza PCR"],"correct":4,"why":"Kennel cough is usually self-limiting over about 2 weeks, so additional signs or a course longer than 2 weeks call for a workup for systemic illness, secondary infection, or a more serious pathogen such as canine influenza, tested by PCR. Influenza spreads in kennels and day care and can look like kennel cough with mucopurulent nasal discharge.","wrong":{"0":"Bordetella is one of the usual CIRDC agents; the slide's more serious pathogen is canine influenza.","1":"Heartworm causes cough and hemoptysis in advanced cases, not a day care outbreak.","2":"Baermann testing looks for lungworms, not a contagious day care outbreak.","3":"Fluoroscopy diagnoses dynamic tracheal collapse."},"lec":"W11: SA Upper and Lower Airway 1","weeks":[11],"mods":[3]},{"stem":"A 9-year-old male neutered Golden Retriever has idiopathic pericardial effusion. He has needed pericardiocentesis three times in 2 months for recurrent tamponade, with no mass on repeated echocardiography and a hemorrhagic effusion on cytology. The clinician recommends the procedure the pericardial lecture lists for worsening cases. Which lateral thoracotomy does the surgical approaches lecture list for that procedure?","options":["Right 4th interspace","Left 4th interspace","Right 5th interspace","Left 9th interspace","Left 6th intercostal space"],"correct":0,"why":"Recurrent idiopathic effusion is handled by repeating pericardiocentesis based on clinical signs and, if worsening, considering a subtotal pericardectomy (Week 9). The Week 10 lateral thoracotomy table lists the pericardium at the right 4th interspace, together with an esophageal foreign body at the heart base.","wrong":{"1":"The left 4th space is for PDA, pulmonic stenosis, and PRAA.","2":"The right 5th space is for a cranial lung lobectomy.","3":"The left 9th space is for the caudal esophagus.","4":"The left 6th space is a pericardiocentesis site, not the listed thoracotomy for the pericardium."},"lec":"Integration W9+W10: Pericardectomy approach","weeks":[9,10],"mods":[3]},{"stem":"A 13-year-old Thoroughbred gelding had a progressive ethmoid hematoma treated by laser ablation 2 months ago. He now has a unilateral, malodorous, purulent, blood-tinged nasal discharge from the same side. Endoscopy shows yellow and black plaques in the nasal passage near the treated site, and fungal culture grows Aspergillus. Which treatment does the lecture recommend?","options":["Plaque removal and topical enilconazole","Repeated 10% formalin injection into the mass","Sinus trephination with daily flushing","Proximal and distal arterial occlusion","Antimicrobials tried once"],"correct":0,"why":"Fungal rhinitis in horses is usually secondary to trauma, surgery, or a PEH, and it causes a unilateral, malodorous, purulent or blood-tinged discharge with yellow or black plaques on endoscopy. Treatment is removal of the fungal plaques and necrotic bone with a topical antifungal such as enilconazole, and the prognosis is good.","wrong":{"1":"Formalin injection treats the PEH itself, not fungal plaques.","2":"Trephination and flushing drain sinusitis; these plaques are in the nasal passage.","3":"Arterial occlusion treats guttural pouch mycosis over the internal carotid artery.","4":"A single antimicrobial trial is for primary sinusitis."},"lec":"W10: Equine Airway Surgery 1","weeks":[10],"mods":[3]},{"stem":"A 9-year-old spayed female Siamese cat has a presumptive diagnosis of feline asthma after heartworm antigen and antibody tests, fecal Baermann and zinc sulfate tests, and radiographs (bronchial pattern). She also has hyperthyroidism, now controlled on medication. She is stable at home, and the clinician wants to add a maintenance bronchodilator. Which choice fits the case's caution list?","options":["Oral terbutaline","Injectable terbutaline","Butorphanol","Inhaled albuterol","Furosemide"],"correct":3,"why":"Bronchodilators can be systemic, inhaled, or nebulized, with albuterol given by pressurized metered-dose inhaler with a spacer. The case warns that oral terbutaline needs caution with heart disease, diabetes mellitus, hyperthyroidism, hypertension, or seizures, so an inhaled bronchodilator suits this cat.","wrong":{"0":"Oral terbutaline carries a caution in hyperthyroid cats.","1":"Injectable terbutaline is for cats in status asthmaticus, and she is stable.","2":"Cough suppressants are generally avoided in feline asthma.","4":"Diuretics are avoided in bronchial disease."},"lec":"W11: CBL Purrsistent Signs","weeks":[11],"mods":[3]},{"stem":"A 9-year-old male neutered Cavalier King Charles Spaniel has a grade III/VI holosystolic murmur at the left apex. He has no cough or exercise intolerance, and his resting respiratory rate at home is 18 breaths/min. Echocardiography is not available. On a lateral radiograph the vertebral left atrial size (VLAS) measures 3.0 vertebral bodies, and the lung fields and pulmonary veins are normal. How should he be staged?","options":["Stage B1","Stage C (acute)","Stage A","Stage B2","Stage D"],"correct":3,"why":"VLAS estimates left atrial size on radiographs for general practice when echo is not available, and it should be under 2.3 vertebral bodies, so 3.0 means left atrial enlargement. A murmur without clinical signs is stage B, and radiographic or echocardiographic changes move it to B2, the stage the ACVIM table marks for treatment.","wrong":{"0":"B1 requires no imaging abnormalities, and his VLAS is enlarged.","1":"Stage C needs past or current clinical signs of heart failure; he has none, and his lungs are normal.","2":"Stage A is at risk with no murmur; he already has a murmur.","4":"Stage D is end-stage disease refractory to standard treatment."},"lec":"W8: Congestive Heart Failure","weeks":[8],"mods":[3]},{"stem":"A 4-year-old male Border Collie was hit by a car 24 hours ago and has a flail segment of three ribs, managed with local blocks and systemic analgesia. Despite oxygen supplementation his hypoxemia is worsening, his A-a gradient has widened on serial arterial blood gases, and radiographs show increasing diffuse opacity with no pneumothorax or pleural effusion. Which support does the lecture recommend next?","options":["Tube thoracostomy","Surgical rib stabilization","Ventilation with PEEP","Furosemide infusion","Repeat thoracocentesis"],"correct":2,"why":"Flail chest can be complicated by ARDS, in which gas exchange can be severely compromised. The lecture says to monitor ABGs and the A-a gradient and that these patients may need ventilator support with PEEP; a widening A-a gradient means V/Q mismatch, and oxygen alone is no longer enough.","wrong":{"0":"A chest tube drains pleural air or fluid, and he has neither.","1":"Surgery is considered only if necessary after stabilization, and it does not treat ARDS.","3":"Furosemide treats cardiogenic edema; this is ARDS after trauma.","4":"Thoracocentesis removes pleural air or fluid, which radiographs rule out."},"lec":"W10: Respiratory Emergencies","weeks":[10],"mods":[3]},{"stem":"A 5-year-old spayed female Cocker Spaniel being treated for immune-mediated hemolytic anemia suddenly develops tachypnea, dyspnea, and hypoxemia. Thoracic radiographs are nearly normal, echocardiography shows no structural heart disease, and her platelet count, PT, and aPTT are within reference intervals. A pulmonary thromboembolism is suspected. Along with oxygen, which anticoagulant fits the lectures?","options":["Heparin","Clopidogrel","Aspirin","Vitamin K1","Desmopressin"],"correct":0,"why":"IMHA is on the Week 9 list of diseases that invoke Virchow's triad, and the Week 11 PTE slide lists IMHA among associated conditions, notes that radiographs can be normal, and includes oxygen, fluids, and anticoagulant therapy with heparin. Week 9 also separates venous thrombi from increased coagulation (heparin, enoxaparin, rivaroxaban) from arterial thrombi of heart disease (clopidogrel, aspirin).","wrong":{"1":"Clopidogrel is for arterial thrombi from platelet activation, more common with heart disease.","2":"Aspirin is grouped with clopidogrel for arterial thrombi.","3":"Vitamin K1 treats anticoagulant rodenticide toxicity, and her PT is normal.","4":"Desmopressin releases von Willebrand factor before surgery in vWD."},"lec":"Integration W9+W11: Thrombosis after IMHA","weeks":[9,11],"mods":[3]},{"stem":"Two adult Quarter Horses broke into a feed room and ate a cattle ration that lists monensin on its label. Two days later both are lethargic, with heart rates of 70 bpm, irregular rhythms, and no murmurs. Rectal temperatures are normal, and the CBCs show no inflammatory changes. Serum cardiac troponin I is elevated in both horses, and serum selenium is within the reference interval. Which category of myocardial disease is most likely?","options":["Bacterial myocarditis","Toxic myocarditis","Viral myocarditis","Selenium deficiency","Cardiac neoplasia"],"correct":1,"why":"Tachycardia, arrhythmias, and an elevated troponin point to myocardial damage; the equine myocarditis slide uses troponin for diagnosis and lists ionophores among its toxic causes. The large animal cardiomyopathy slide names monensin among the cardiac toxins, and two horses sharing one feed exposure without fever or inflammation fits a toxic rather than infectious cause.","wrong":{"0":"Bacterial myocarditis (Strep, Staph, Clostridium) would usually bring fever and inflammatory changes.","2":"Viral causes such as EIA, influenza, and EVA fit fever or an outbreak, not a shared meal.","3":"Selenium deficiency causes cardiomyopathy, but their selenium is normal.","4":"Neoplasia is a listed cause but would not strike two horses after the same meal."},"lec":"W9: LA Cardiac Disease","weeks":[9],"mods":[3]},{"stem":"A 9-year-old Warmblood mare developed a firm, painful swelling over the left jugular groove after an intravenous injection given there 3 weeks ago. She now makes an inspiratory noise at the canter. Endoscopy shows that the left arytenoid fails to abduct, the guttural pouches are normal, and she has no access to lead or organophosphates. Which cause of her laryngeal dysfunction is most likely?","options":["Perivascular injection","Idiopathic distal axonopathy","Guttural pouch mycosis","Lead toxicosis","Fourth branchial arch defect"],"correct":0,"why":"Recurrent laryngeal neuropathy is usually a distal axonopathy of the left recurrent laryngeal nerve, but the lecture lists secondary causes: infection (guttural pouch, upper airway), inflammation from perineural or perivascular injection, and toxicosis from lead or organophosphates. A painful swelling after a left jugular injection, with normal pouches and no toxin access, points to the injection.","wrong":{"1":"Idiopathic RLN is common in large horses, but hers followed an injection injury on the same side.","2":"Mycosis can cause laryngeal neuropathy, but her guttural pouches are normal.","3":"She has no access to lead or organophosphates.","4":"A 4-BAD is congenital, often right-sided, with rostral displacement of the palatopharyngeal arch."},"lec":"W11: Equine Airway Surgery 2","weeks":[11],"mods":[3]},{"stem":"An 8-year-old spayed female cat in Texas lives partly on a screened porch and has never received preventives. She has had intermittent coughing and vomiting for a month. A heartworm antibody test is positive, the antigen test and a modified Knott's test are negative, and radiographs show an enlarged right caudal pulmonary artery with a bronchointerstitial pattern. Which management plan does the lecture recommend?","options":["Three-dose melarsomine protocol","Two-dose melarsomine protocol","Surgical worm extraction","Doxycycline and ivermectin only","Supportive care and preventive"],"correct":4,"why":"Cats carry low worm burdens, so antigen and microfilaria tests are often negative, while a positive antibody test shows exposure and radiographs can show an enlarged right caudal pulmonary artery. The canine versus feline table states that cats receive no adulticide: treatment is supportive care plus macrocyclic lactone preventives, which are critical because even low burdens can kill.","wrong":{"0":"The three-dose melarsomine protocol is the canine AHS protocol; cats get no adulticide.","1":"The two-dose melarsomine protocol is a canine shelter option with lower efficacy.","2":"Surgical extraction is for caval syndrome, which is extremely rare in cats.","3":"The non-arsenical protocol is a canine option that leaves adult worms in place for months to years."},"lec":"W9: Vascular Parasites","weeks":[9],"mods":[3]},{"stem":"A 7-year-old spayed female Cocker Spaniel has had two episodes of weakness on walks. On a lead II ECG the P waves occur at a regular rate, every conducted beat has the same P-R interval, and every few P waves are not followed by a QRS complex. She takes no medications, and she has chronic intermittent vomiting, which may raise vagal tone. Before choosing treatment, the clinician wants to know how much vagal tone contributes to the block. Which test answers that question?","options":["Ambulatory Holter monitoring","Atropine challenge","Vagal maneuver","Serum potassium","Echocardiography"],"correct":1,"why":"P waves that are intermittently not conducted mean second-degree AV block, and the AV block slide lists drugs, high vagal tone (including GI disease), and nodal disease among its causes. The second-degree AV block slide states that an atropine challenge determines the degree of vagal influence. Medical therapy is often ineffective, and a pacemaker is the treatment if the block is clinical or progressive.","wrong":{"0":"Holter monitoring is for rechecks and reassessing therapy, not for measuring vagal influence.","2":"A vagal maneuver is used to slow a reentrant SVT, not to test an AV block.","3":"Serum potassium is the first check in atrial standstill, where hyperkalemia must be ruled out.","4":"Echocardiography images structure; the slide names the atropine challenge for vagal influence."},"lec":"W8: Arrhythmias","weeks":[8],"mods":[3]},{"stem":"A 6-year-old male Labrador Retriever that has never received preventives has had a cough and exercise intolerance for 3 months. There is no murmur. Thoracic radiographs show right ventricular enlargement, a bulging main pulmonary artery, enlarged and tortuous caudal lobar pulmonary arteries, and patchy peripheral alveolar opacities. Which diagnosis best fits these radiographic findings?","options":["Heartworm disease","Pulmonic stenosis","Dilated cardiomyopathy","Mitral valve disease","Pericardial effusion"],"correct":0,"why":"Right ventricular hypertrophy with a dilated main pulmonary artery and enlarged, tortuous parenchymal pulmonary arteries is the heartworm pattern in the cardiac imaging lecture. Peripheral alveolar opacities can come from thromboembolism by dead worm fragments or from allergic pneumonitis, and his lack of prevention fits.","wrong":{"1":"Pulmonic stenosis also dilates the main pulmonary artery, but its parenchymal vessels are usually normal or small.","2":"DCM gives generalized cardiomegaly with left atrial and pulmonary vein dilation.","3":"Mitral valve disease enlarges the left atrium and ventricle, with distended pulmonary veins.","4":"Pericardial effusion gives a large, round, globoid silhouette."},"lec":"W9: Imaging of the Heart","weeks":[9],"mods":[3]},{"stem":"A 4-year-old male neutered Labrador Retriever has had severe watery diarrhea for 3 days without vomiting. Venous blood gas and electrolytes: pH 7.24 (7.35-7.46), PCO2 29 mmHg (30.8-42.8), HCO3- 13 mEq/L (18.8-25.6), Na+ 146 mEq/L, K+ 4.0 mEq/L, and Cl- 124 mEq/L. Lactate, glucose, and renal values are normal, and urine ketones are negative. What is the mechanism of his acidosis?","options":["Lactic acid gain","Ketoacid gain","Uremic acid retention","Loss of bicarbonate","Ethylene glycol ingestion"],"correct":3,"why":"A low pH with a low HCO3- is a metabolic acidosis, and the PCO2 has fallen as respiratory compensation. The anion gap is (146 + 4) - (124 + 13) = 13 mEq/L, within the slide's normal of 12-24, and a normal anion gap acidosis is a loss of base with hyperchloremia, as in severe diarrhea or renal tubular acidosis.","wrong":{"0":"Lactic acid is an endogenous acid that raises the anion gap, and his lactate is normal.","1":"Ketoacids, as in DKA, raise the anion gap, and his urine ketones are negative.","2":"Uremic acids raise the anion gap, and his renal values are normal.","4":"Ethylene glycol raises the anion gap, and his gap is normal."},"lec":"W11: Acid-Base and A-a Gradient","weeks":[11],"mods":[3]},{"stem":"A 2-year-old male neutered Australian Shepherd was hit by a car 20 minutes ago. He is dyspneic with pale mucous membranes, a CRT of 3 seconds, weak pulses, and a heart rate of 180 bpm. He is on flow-by oxygen, a short, large-bore IV catheter has just been placed, and the first isotonic crystalloid bolus is drawn up. What should happen before that bolus is started?","options":["Complete CBC, chemistry, and UA results","Thoracic radiographs","Abdominal ultrasound","Urinary catheter placement","Quick assessment blood sample"],"correct":4,"why":"Stabilization comes first, with oxygen, an IV catheter, and fluids, but the respiratory emergency lecture says to get samples before fluids without delaying emergency stabilization. The quick assessment (QATS) database is PCV, TS, blood glucose, lactate, Azostick, and a blood smear, and the Week 9 shock steps also draw a basal sample right after the catheter is placed.","wrong":{"0":"Full CBC, chemistry, and UA follow after initial stabilization; waiting for results would delay the bolus.","1":"Radiographs come after stabilization; the lecture warns that rads can kill an unstable patient.","2":"Imaging such as ultrasound follows initial stabilization.","3":"Urine output is monitored after stabilization, not placed ahead of the first bolus."},"lec":"W10: Respiratory Emergencies","weeks":[10],"mods":[3]},{"stem":"A 4-month-old Holstein heifer housed in a calf barn at sea level has had a cough, nasal discharge, and increased cranioventral lung sounds for 2 months despite treatment. She now has brisket and submandibular edema, distended and pulsing jugular veins, and tachycardia. There is no murmur, her heart sounds are not muffled, and she has no fever. Which diagnosis best explains her new signs?","options":["High mountain disease","Traumatic pericarditis","Cor pulmonale","Tricuspid endocarditis","Ventricular septal defect"],"correct":2,"why":"Chronic pneumonia in a housed, preweaned Holstein calf fits enzootic pneumonia (Week 11). Cor pulmonale is right ventricular hypertrophy or dilation caused by a primary respiratory disorder through pulmonary hypertension, with right heart failure signs of brisket, submandibular, and limb edema plus jugular distension and pulses; pneumonia is on the farm animal list of causes (Week 9).","wrong":{"0":"High mountain disease needs altitude above 5,000 ft, and she lives at sea level.","1":"Hardware pericarditis gives muffled heart sounds, a washing-machine sound, and fever.","3":"Endocarditis in cattle is often tricuspid, with a murmur and signs of infection.","4":"A VSD gives a bilateral, plateau, pansystolic murmur."},"lec":"Integration W9+W11: Calf right heart failure","weeks":[9,11],"mods":[3]},{"stem":"A 6-year-old, 28-kg male Labrador Retriever has a lead II ECG recorded at 50 mm/sec. The rhythm is regular at 120 bpm, and every P wave is followed by a QRS complex. The P wave is 0.03 seconds and 0.3 mV. The QRS complex is wide, spanning 4.5 small boxes, with a positive R wave of 2.6 mV and no deep S wave. Which interpretation fits these measurements?","options":["Right bundle branch block","Left ventricular enlargement","Right ventricular enlargement","Left bundle branch block","Left atrial enlargement"],"correct":3,"why":"At 50 mm/sec each small box is 0.02 seconds, so 4.5 boxes is a QRS of 0.09 seconds, above the slide's limit of 0.06 seconds for dogs over 20 kg. The R wave of 2.6 mV is under the 3.0 mV limit, so the problem is R-wave duration rather than amplitude, and the quick and dirty slide links increased R duration to left bundle branch block.","wrong":{"0":"Right bundle branch block is increased S-wave duration, and this complex has no deep S wave.","1":"LV enlargement is increased R amplitude, and 2.6 mV is within the limit for dogs over 20 kg.","2":"RV enlargement is increased S-wave amplitude, which is absent here.","4":"Atrial enlargement shows in the P wave, which is normal in duration and amplitude."},"lec":"W8: Interpreting ECGs","weeks":[8],"mods":[3]},{"stem":"A 3-year-old male neutered Doberman Pinscher has had two episodes of unilateral epistaxis this month and bled heavily after a recent tooth extraction. Blood pressure and the fundic exam are normal, and tick-borne disease testing is negative. Platelet count is 310,000/µL (200,000-500,000), PT and aPTT are within reference intervals, and the buccal mucosal bleeding time is prolonged. Which test should come next?","options":["vWF quantification","Factor VIII activity","PIVKA testing","Thromboelastography","Rhinoscopic biopsy"],"correct":0,"why":"Epistaxis with hemorrhage calls for a CBC, platelet count, and coagulation panel, plus a BMBT and von Willebrand factor assay in dogs (Week 10). Week 9 describes vWD as the most common inherited bleeding disorder in dogs, with a normal platelet count, mostly normal screening tests, a prolonged BMBT, and diagnosis by quantifying vWF; Dobermans carry type 1.","wrong":{"1":"Factor VIII deficiency (hemophilia A) is a secondary defect; his normal coagulation tests and long BMBT point to a primary one.","2":"PIVKA rises with vitamin K antagonist rodenticides, which prolong the PT first.","3":"TEG is the test for hypercoagulability.","4":"Rhinoscopy is an advanced diagnostic under anesthesia; the initial hemorrhage workup comes first."},"lec":"Integration W9+W10: Epistaxis workup","weeks":[9,10],"mods":[3]},{"stem":"A 10-year-old spayed female mixed-breed dog has a 4-cm solitary mass in the right caudal lung lobe, found on radiographs taken for a mild cough. CT shows no other nodules and no tracheobronchial lymph node enlargement, and fine-needle aspirate cytology is consistent with a primary lung carcinoma. Which treatment does the lecture recommend?","options":["Chemotherapy alone","Radiation therapy","Palliative antitussives","Lung lobectomy","Thoracocentesis"],"correct":3,"why":"Primary pulmonary tumors are mostly malignant carcinomas. Lobectomy, with or without chemotherapy, is for solitary tumors only, which fits this dog, while chemotherapy is not effective for most lung tumors; clinical signs and lymph node involvement also affect survival.","wrong":{"0":"The slide says chemotherapy is not effective for most lung tumors.","1":"Radiation is the treatment the nasal lecture calls highly effective for nasal tumors, not this lung mass.","2":"Antitussives, NSAIDs, and pain control are palliative options when surgery is not possible.","4":"Thoracocentesis drains pleural fluid, and none is present."},"lec":"W11: SA Lower Airway 2","weeks":[11],"mods":[3]},{"stem":"A 12-year-old male neutered Chihuahua with stage C myxomatous mitral valve disease has a left apical murmur and a history of pulmonary edema. Echocardiography shows severe left atrial enlargement and a tricuspid regurgitation velocity of 3.6 m/sec. The owner has read about sildenafil and asks whether it should be started for pulmonary hypertension. Which approach does the lecture put first?","options":["Add sildenafil now","Treat the mitral disease","Add tadalafil now","Add amlodipine now","Exercise restriction alone"],"correct":1,"why":"A TR velocity above 3.0 m/sec increases the probability of PH, and with advanced MMVD this is group 2, PH due to left heart disease, a postcapillary form. The PH treatment slide puts specific treatment of the primary disease first and states that PDE5 inhibitors such as sildenafil and tadalafil are for precapillary PH and not first line for left heart disease.","wrong":{"0":"Sildenafil is a PDE5 inhibitor for precapillary PH, not first line for left heart disease.","2":"Tadalafil is the other PDE5 inhibitor and carries the same limitation.","3":"Amlodipine is a calcium channel blocker for systemic hypertension, first choice in cats.","4":"Exercise restriction is an additional consideration, not a substitute for treating the primary disease."},"lec":"W9: Systemic and Pulmonary Hypertension","weeks":[9],"mods":[3]},{"stem":"A 2-year-old male neutered domestic shorthair cat has stertor and a right head tilt. Six months ago a pink nasopharyngeal polyp was removed by traction, and histopathology confirmed a benign polyp. The stertor has returned, and radiographs now show a soft tissue opacity above the soft palate and an opaque right tympanic bulla. Which treatment does the lecture list for this situation?","options":["Repeat traction removal","Radiation therapy","Chemotherapy","Bulla osteotomy","Topical clotrimazole"],"correct":3,"why":"Nasopharyngeal polyps are benign growths from the eustachian tube, middle ear, pharynx, or nasal cavity, and radiographs can show bulla involvement. Traction removal can regrow, as it has here, and the slide's other surgical option is bulla osteotomy with or without rhinotomy. The prognosis is excellent, though the polyp may return and Horner syndrome may be transient.","wrong":{"0":"Traction is the method that has already regrown.","1":"Radiation is for nasal tumors, and this is a benign polyp.","2":"Chemotherapy is for nasal lymphoma.","4":"Clotrimazole is the topical treatment for canine nasal aspergillosis."},"lec":"W10: SA Nasal Disorders","weeks":[10],"mods":[3]},{"stem":"A 4-year-old spayed female domestic shorthair cat has intermittent coughing and expiratory wheezes. Thoracic radiographs show many ring shadows and tram lines. On the lateral view the diaphragm is flattened, with more space between the cardiac silhouette and the diaphragm, and on the VD view the diaphragm is tented. What causes the diaphragm changes?","options":["Lobar collapse","Air trapping","Bronchial mineralization","Alveolar flooding","Pleural fluid"],"correct":1,"why":"Donuts and tram lines are a bronchial pattern, typical of feline asthma. Pulmonary hyperinflation in chronic airway disease, especially in cats, comes from air trapping as the bronchial lumen narrows from spasm, inflammation, or fibrosis; when advanced, the hyperinflated lung pushes the diaphragm caudally, flattening it on the lateral view and tenting it on the VD.","wrong":{"0":"Lobar collapse, most often of the right middle lobe, follows chronic bronchial obstruction and loses volume.","2":"Bronchial mineralization marks chronic bronchitis on the bronchial walls, not the diaphragm.","3":"Alveolar flooding gives air bronchograms and a lobar sign, not hyperinflation.","4":"The slide links a flattened, tented diaphragm to hyperinflation, not pleural fluid."},"lec":"W8: Pulmonary Patterns","weeks":[8],"mods":[3]},{"stem":"A sheep farmer in Grenada has ewes that are nose pressing, head shaking, stomping, and sneezing, with mucopurulent nasal discharge, in February. Larvae are seen at the nostrils, and the affected ewes improved after parenteral avermectin. The farmer asks how to keep the problem from returning. Which plan fits the lecture?","options":["Summer-only fly control","Repeat avermectin monthly","Year-round fly control","Depopulate and restock","Vaccinate the ewes"],"correct":2,"why":"Nose pressing, head shaking, stomping, and nasal discharge with visible larvae are nasal bots (Oestrus ovis). Parenteral avermectins treat cases when needed, but prevention is fly management and control; in warm regions the fly season is year-round, whereas in cold regions it runs from early summer to autumn.","wrong":{"0":"Summer-only control matches the fly season in cold regions, not a warm island.","1":"Parenteral avermectins are the treatment when needed; the lecture's prevention is fly control.","3":"Depopulation and restocking is the atrophic rhinitis control measure in pigs.","4":"Vaccination of sows and gilts is the atrophic rhinitis prevention measure, not nasal bot control."},"lec":"W9: Herd Respiratory Approach","weeks":[9],"mods":[3]},{"stem":"A 5-year-old Holstein cow with chronic mastitis was diagnosed with tricuspid valve endocarditis after a right-sided murmur was found; a blood culture taken before any antibiotics grew a penicillin-susceptible bacterium. She has now finished 6 weeks of a bactericidal antimicrobial chosen from culture and sensitivity, with analgesia, and she is eating well. The farmer asks how to confirm the infection has cleared. Which follow-up does the lecture recommend?","options":["Culture during the final week","Milk culture at drying off","Cardiac troponin I","Holter monitoring","Culture 1-2 months off drugs"],"correct":4,"why":"Endocarditis in cattle is often tricuspid, from infection returning from elsewhere in the body, and treatment is long-term (4-6+ weeks) bactericidal antimicrobials based on culture and sensitivity. The lecture's follow-up is to repeat blood cultures 1-2 months after treatment stops, because a culture taken while the animal is on antibiotics is likely to be falsely negative.","wrong":{"0":"A culture while she is still on antibiotics is likely to be falsely negative.","1":"The lecture's follow-up for endocarditis is a repeat blood culture; milk culture checks the udder.","2":"Troponin marks myocardial damage, not clearance of a valve infection.","3":"A Holter monitor records rhythm, not infection."},"lec":"W9: LA Cardiac Disease","weeks":[9],"mods":[3]},{"stem":"A 10-week-old female Shetland Sheepdog has a continuous left basilar murmur and bounding, water-hammer pulses, and radiographs show left heart enlargement with a ductus bump. During surgical ligation through a left thoracotomy, her heart rate drops abruptly from 150 to 60 bpm at the moment the ductus is occluded. No alpha-2 agonist was given, and her temperature is normal. Which event best explains the bradycardia?","options":["Branham's reflex","Shunt reversal","Bezold-Jarisch reflex","Hypothermic bradycardia","Atrial standstill"],"correct":0,"why":"The continuous left basilar murmur, bounding pulses, and ductus bump are a left-to-right PDA (Week 8). The Week 11 PDA anesthesia slide warns that Branham's reflex, a severe vagal reflex, may occur during surgery for PDA occlusion, which matches a sudden drop in rate as the ductus closes.","wrong":{"1":"Shunt reversal (right to left) causes severe hypoxemia, not a vagal drop at occlusion.","2":"The Bezold-Jarisch reflex is the cardioinhibitory reflex of the feline shock triad.","3":"Hypothermia causes bradycardia, but her temperature is normal.","4":"Atrial standstill is a rhythm diagnosis that requires ruling out hyperkalemia, not an intraoperative reflex."},"lec":"Integration W8+W11: PDA surgery reflex","weeks":[8,11],"mods":[3]},{"stem":"A 2-year-old intact female Maine Coon is being considered for breeding. She has no murmur, and her echocardiogram is normal. Genetic testing shows she is homozygous for the A31P MYBPC3 mutation. The breeder asks what this result means for her own risk of hypertrophic cardiomyopathy. Which interpretation does the lecture support?","options":["18-fold higher risk","1.8-fold higher risk","Normal risk for the breed","Certain to develop HCM","Carrier status only"],"correct":0,"why":"MYBPC3 mutations in Maine Coons are autosomal dominant with incomplete penetrance: carriers are 1.8 times more likely to develop HCM, and homozygous cats are 18 times more likely to be affected. A normal echo at 2 years does not clear her, because most clinical cases are identified by 4 years of age.","wrong":{"1":"1.8 times is the figure for heterozygous carriers, not homozygous cats.","2":"Most clinical cases appear by 4 years, so a normal echo at 2 years does not remove her risk.","3":"Incomplete penetrance means the mutation raises risk without guaranteeing disease.","4":"She is homozygous, and the slide gives homozygous cats their own 18-fold risk."},"lec":"W8: Acquired Cardiac Disease","weeks":[8],"mods":[3]},{"stem":"A 3-year-old intact male outdoor cat that fights often has pyothorax: thoracocentesis yields foul-smelling, turbid fluid with degenerate neutrophils and mixed bacteria. He has been stabilized with oxygen, careful handling, and drainage. While culture results are pending, which test addresses a predisposing factor the lecture lists for cats with pyothorax?","options":["Feline coronavirus serology","FeLV and FIV testing","Heartworm testing","Fluid triglycerides","Cryptococcal antigen titer"],"correct":1,"why":"Pyothorax is a septic exudate; in cats it is usually obligate and facultative anaerobes similar to oropharyngeal flora, spread from wounds or other routes. The lecture's predisposing questions for cats are URTI, with an impaired mucociliary escalator, and immunocompromise, which prompts a check of retrovirus status.","wrong":{"0":"Feline coronavirus testing addresses FIP, a non-septic exudate.","2":"Heartworm testing is part of the chylothorax workup.","3":"Comparing triglycerides confirms chylothorax, not a septic exudate.","4":"The cryptococcal antigen test is for the most common fungal infection of cats."},"lec":"W10: Effusions","weeks":[10],"mods":[3]},{"stem":"A 9-year-old male Great Dane has dilated cardiomyopathy, with marked myocardial failure (poor contractility) on echocardiography, and a sustained supraventricular tachycardia at 240 bpm. He is stable, with good mentation and no congestive heart failure on radiographs, so this is not an emergent case. The clinician wants one oral drug for the tachycardia that also suits his weak myocardium. Which drug fits best?","options":["Atenolol","Pimobendan","Digoxin","Sotalol","Procainamide"],"correct":2,"why":"The SVT slide lists diltiazem, beta-blockers, combinations, and digoxin, with procainamide and amiodarone kept for emergent cases. Beta-blockers carry a caution with myocardial failure, while digoxin both increases contractility and slows the speed of nodal conduction, which suits a stable dog with poor contractility. The DCM treatment slide also lists digoxin as an option.","wrong":{"0":"Atenolol is a beta-blocker, and the slides caution beta-blockers with myocardial failure.","1":"Pimobendan raises contractility, but the slides list digoxin as the drug that slows nodal conduction.","3":"Sotalol is class III, used to prevent ventricular tachycardias and sudden death.","4":"Procainamide is listed for emergent SVT; this dog is stable."},"lec":"W8: Arrhythmias","weeks":[8],"mods":[3]},{"stem":"A group of 14-week-old grow-finish pigs has a persistent nonproductive cough, fever, poor growth, and uneven pen weights, and injectable antimicrobials give only temporary improvement. At necropsy the lungs are diffusely tan-gray and do not collapse, lymph nodes are enlarged throughout the body, and there is no cranioventral consolidation or pleuritis. Which pathogen is most likely?","options":["PRRS virus","Mycoplasma hyopneumoniae","Actinobacillus pleuropneumoniae","Pasteurella multocida","Influenza A virus"],"correct":0,"why":"The pig lecture's necropsy table describes PRRSV as diffuse tan-gray, non-collapsing lungs with enlarged lymph nodes: a diffuse interstitial pneumonia with generalized lymphadenopathy. The bacterial causes and influenza produce cranioventral or dorsocaudal consolidation, which is absent here.","wrong":{"1":"M. hyopneumoniae gives cranioventral purple-red consolidation.","2":"APP gives hemorrhagic necrotizing pneumonia of the dorsocaudal lobes with fibrinous pleuritis.","3":"P. multocida gives a suppurative cranioventral bronchopneumonia.","4":"Influenza A gives sharp cranioventral plum-red consolidation across several lobes."},"lec":"W11: Lower Airway Disease in Pigs","weeks":[11],"mods":[3]},{"stem":"A 3-year-old spayed female Jack Russell Terrier was hit by a car 10 hours ago and has a closed traumatic pneumothorax. Dorsal thoracocentesis has relieved her dyspnea three times, but air reaccumulates within a few hours each time. She is otherwise stable, and radiographs show no other injuries. Which step does the lecture recommend now?","options":["Cage rest and observation","Fourth needle thoracocentesis","Tube thoracostomy","Bilateral chest tube lavage","Oxygen therapy alone"],"correct":2,"why":"Closed pneumothorax is managed by severity, with thoracocentesis first for moderate cases. Both trauma lectures say that when thoracocentesis is needed repeatedly (more than 3 times), a thoracostomy tube should be placed, because it allows rapid, repeated, or continuous drainage without puncturing the thorax again.","wrong":{"0":"Cage rest and observation is for mild pneumothorax, not air that keeps returning.","1":"Repeated needle drainage is what the slides say to replace with a chest tube.","3":"Bilateral tubes with lavage are the pyothorax drainage plan.","4":"Oxygen helps, but it does not remove pleural air that keeps accumulating."},"lec":"W10: Thoracic Trauma","weeks":[10],"mods":[3]},{"stem":"A 30-kg male neutered Boxer was hit by a car 1 hour ago. He is dull, with pale mucous membranes, a CRT of 3 seconds, weak pulses, and a heart rate of 170 bpm. Thoracic ultrasound shows a moderate pleural effusion, and diagnostic thoracocentesis yields blood. The clinician starts isotonic crystalloid resuscitation in aliquots and will reassess after each one. What volume is the first aliquot for this patient?","options":["450-600 mL","150-300 mL","300-450 mL","90-150 mL","1,800-2,700 mL"],"correct":1,"why":"Hemothorax can make a trauma patient hypovolemic and send it into shock (Week 10), and his pale membranes, weak pulses, and tachycardia fit hemorrhagic shock. The Week 9 fluid slide gives aliquots of 15-20 mL/kg for dogs but 5-10 mL/kg for cats and dogs with hemorrhage, so 30 kg x 5-10 mL/kg = 150-300 mL over 15-30 minutes.","wrong":{"0":"15-20 mL/kg is the aliquot for dogs without hemorrhage.","2":"10-15 mL/kg is the bolus for cats with the shock triad.","3":"3-5 mL/kg is the hypertonic saline dose, not an isotonic aliquot.","4":"60-90 mL/kg is the total shock dose, which is divided into aliquots."},"lec":"Integration W9+W10: Hemothorax fluid aliquot","weeks":[9,10],"mods":[3]},{"stem":"A 7-year-old Standardbred pacer has a respiratory noise on both inspiration and expiration, reduced exercise tolerance, and coughing during eating. On resting endoscopy the epiglottis is visible, but its edge is smooth, with no serrated margin and no dorsal vascular pattern. The soft palate is in normal position, and nothing moves in and out of view when he swallows. Which diagnosis fits?","options":["Dorsal displacement of the soft palate","Subepiglottic cyst","Axial deviation of the aryepiglottic folds","Arytenoid chondritis","Epiglottic entrapment"],"correct":4,"why":"In epiglottic entrapment, loose subepiglottic tissue wraps over the epiglottis, causing an inspiratory and/or expiratory noise, reduced exercise tolerance, and coughing during eating. On endoscopy the serrated margin and dorsal vascular pattern of the epiglottis are lost, which the lecture contrasts with DDSP, where the epiglottis is hidden.","wrong":{"0":"In DDSP the epiglottis is hidden under the soft palate, and his palate is in normal position.","1":"A subepiglottic cyst pops in and out of view as the horse swallows.","2":"ADAF is seen in young racing Thoroughbreds and causes a harsh inspiratory noise.","3":"Arytenoid chondritis shows projections or nodules of cartilage and a thickened, twisted arytenoid."},"lec":"W11: Equine Airway Surgery 2","weeks":[11],"mods":[3]},{"stem":"A 7-year-old male neutered Beagle with chronic kidney disease is in uremic crisis: BUN 168 mg/dL (reference interval 7-27) and creatinine 9.4 mg/dL (0.5-1.8). He oozes blood from venipuncture sites and has gingival bleeding. He has never had bleeding problems, including at his neuter. Platelet count is 285,000/µL (200,000-500,000), and PT and aPTT are within reference intervals. Which bleeding disorder is most likely?","options":["von Willebrand disease","Thrombocytopenia","Acquired thrombopathy","Anticoagulant rodenticide","Disseminated intravascular coagulation"],"correct":2,"why":"Mucosal and venipuncture bleeding with a normal platelet count and normal PT and aPTT points to a platelet function problem. The coagulation lecture lists uremia among acquired thrombopathies, with drugs, liver disease, and dysproteinemias, and his azotemia is severe. The slide also reminds you to check platelet numbers first, because thrombopathies are rarer than thrombocytopenias.","wrong":{"0":"vWD is inherited, and most affected dogs bleed during or after surgery; he did not bleed at his neuter.","1":"His platelet count is within the reference interval.","3":"Rodenticides prolong the PT first, often before clinical bleeding; his PT is normal.","4":"DIC causes abnormalities across platelets, coagulation tests, and FDPs or d-dimers."},"lec":"W9: Coagulation Disorders","weeks":[9],"mods":[3]},{"stem":"A 13-year-old spayed female domestic shorthair cat has lost weight over 2 months. She has a new grade III/VI sternal systolic murmur and a heart rate of 240 bpm, and her Doppler systolic pressure is within the reference interval on repeated readings. Total T4 is 9.6 µg/dL (reference interval 0.8-4.0). A focused ultrasound exam shows a thickened left ventricle with a hyperkinetic myocardium and only mild left atrial enlargement. Which diagnosis best explains the cardiac changes?","options":["Hypertrophic cardiomyopathy","Thyrotoxic cardiomyopathy","Restrictive cardiomyopathy","Hypertensive heart disease","Dilated cardiomyopathy"],"correct":1,"why":"The acquired disease lecture lists thyrotoxicosis among secondary feline cardiomyopathies and says to check BP and total T4 in a cat with an auscultation abnormality. The focused ultrasound exam separates the two forms: a hyperkinetic myocardium points to thyrotoxic disease, whereas HCM shows a hypokinetic, damaged myocardium. Her total T4 is more than twice the upper limit.","wrong":{"0":"HCM is idiopathic hypertrophy, and the slide pairs it with a hypokinetic, damaged myocardium.","2":"Restrictive cardiomyopathy is endomyocardial fibrosis with a near-normal LV and a big left atrium.","3":"Hypertension is a secondary cause, but her repeated pressures are normal.","4":"DCM is poor contractility, the opposite of a hyperkinetic myocardium."},"lec":"W8: Acquired Cardiac Disease","weeks":[8],"mods":[3]},{"stem":"An 18-month-old male intact French Bulldog is discharged after ala-vestibuloplasty, staphylectomy, and laryngeal saccule removal for BOAS; radiographs also showed a hypoplastic trachea. He is bright and breathing comfortably. The owner asks how to walk him from now on. Which client education point does the case follow-up plan include?","options":["Slip collar for better control","Walks in midday heat","Daily strenuous exercise","Harness instead of a collar","Breeding after recovery"],"correct":3,"why":"The BOAS follow-up plan tells owners to avoid collars and use a harness to prevent pressure damage to the trachea and larynx, along with preventing overheating, short walks during cool hours, weight management, and avoiding smoke and dust. Spay or neuter is recommended because the condition is genetic, and no surgery can correct a hypoplastic trachea.","wrong":{"0":"Collars are what the plan says to avoid, because of tracheal and laryngeal pressure damage.","1":"The plan calls for short walks in cool hours to prevent overheating.","2":"Strenuous exercise is to be limited.","4":"BOAS is genetic, so the plan recommends spay or neuter."},"lec":"W10: CBL Airway Cases","weeks":[10],"mods":[3]},{"stem":"A 6-year-old intact female Labrador Retriever with an open pyometra has received two isotonic crystalloid boluses but remains hypotensive. She is dull, with a heart rate of 170 bpm, a respiratory rate of 48, brick-red mucous membranes, a capillary refill time under 1 second, bounding femoral pulses, and a rectal temperature of 40.4°C (104.7°F). Systolic arterial pressure is 82 mmHg, and MAP is 58 mmHg. Which shock pattern does she show?","options":["Hypodynamic septic shock","Hyperdynamic septic shock","Compensated shock","Early decompensated hypovolemic shock","Cardiogenic shock"],"correct":1,"why":"Septic shock is sepsis with hypotension despite adequate fluid replacement, and she remains hypotensive after boluses, with SAP under 90 and MAP under 65 mmHg. Dogs in hyperdynamic septic shock have brick-red membranes, a rapid CRT, bounding pulses, tachycardia, and hyperthermia from vasodilation, whereas the hypodynamic form brings pale membranes, weak pulses, and hypothermia.","wrong":{"0":"Hypodynamic septic shock brings pale membranes, a slow CRT, weak pulses, and hypothermia.","2":"Compensated shock is normotensive; she is hypotensive.","3":"Early decompensated shock has pale membranes, a prolonged CRT, weak pulses, and hypothermia.","4":"Cardiogenic shock is low forward flow from heart disease; a pyometra with vasodilation points to sepsis."},"lec":"W9: Shock and Sepsis","weeks":[9],"mods":[3]},{"stem":"A 6-year-old male neutered Labrador Retriever has an esophageal foreign body lodged in the caudal thoracic esophagus, just cranial to the diaphragm, that cannot be removed endoscopically. The surgeon wants a targeted intercostal approach rather than a sternotomy. Which approach does the surgical approaches lecture list for this location?","options":["Right 4th intercostal space","Median sternotomy","Left 9th intercostal space","Left 4th intercostal space","Right 8th intercostal space"],"correct":2,"why":"The lateral thoracotomy table lists the caudal esophagus at the left 9th interspace, whereas an esophageal foreign body at the heart base is approached through the right 4th. A median sternotomy gives wide bilateral access but limited access to the dorsal mediastinum and is not ideal for the esophagus.","wrong":{"0":"The right 4th space is for an esophageal foreign body at the heart base or the pericardium.","1":"Median sternotomy has limited dorsal mediastinal access and is not ideal for the esophagus.","3":"The left 4th space is for PDA, pulm
