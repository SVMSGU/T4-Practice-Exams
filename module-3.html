onic stenosis, and PRAA.","4":"The 8th space on either side is for the thoracic duct."},"lec":"W10: Surgical Approaches to the Thorax","weeks":[10],"mods":[3]},{"stem":"A 12-year-old spayed female Miniature Poodle with known myxomatous mitral valve disease has coughed for 6 weeks. Her resting respiratory rate at home stays near 20 breaths/min, and she is otherwise active. NT-proBNP is elevated. Thoracic radiographs show marked left atrial enlargement with elevation and narrowing of the left mainstem bronchus, normal pulmonary veins, no pleural fluid, and no interstitial or alveolar pattern. What best explains the cough?","options":["Cardiogenic pulmonary edema","Primary respiratory disease","Pulmonary venous hypertension","Pleural effusion","Bronchial compression"],"correct":4,"why":"The CHF lecture lists mainstem bronchus compression by an enlarged heart as a cardiac cause of cough, and the acquired disease lecture lists left bronchial compression as a sequel of mitral valve disease. Her radiographs show the left atrium narrowing the left mainstem bronchus with normal veins and lungs, and her steady resting rate argues against edema, whose earliest sign is a rising resting rate.","wrong":{"0":"Edema would add a hazy interstitial to alveolar pattern and usually raise the resting respiratory rate.","1":"An elevated NT-proBNP points to heart disease; a normal value would favor respiratory disease.","2":"Pulmonary venous hypertension shows as veins larger than arteries, and her veins are normal.","3":"Her radiographs show no pleural fluid."},"lec":"W8: Congestive Heart Failure","weeks":[8],"mods":[3]},{"stem":"A 6-year-old male neutered Maine Coon has a grade III/VI sternal systolic murmur and a gallop rhythm. Echocardiography shows left ventricular hypertrophy with left atrial enlargement, and secondary causes have been ruled out. He is not in heart failure and needs anesthesia for a dental extraction. The draft protocol is butorphanol and a benzodiazepine for premedication, propofol given slowly to effect, isoflurane with a fentanyl CRI, and ketamine for extra analgesia. Which drug should be removed?","options":["Ketamine","Butorphanol","A benzodiazepine","Slow propofol","Fentanyl CRI"],"correct":0,"why":"A sternal systolic murmur, gallop, and idiopathic LV hypertrophy in a Maine Coon is HCM (Week 8). The Week 11 HCM anesthesia slide calls ketamine relatively contraindicated because it increases contractility, myocardial oxygen demand, and arrhythmia risk, while the goals are a low heart rate and no excess contractility.","wrong":{"1":"An opioid at 0.3-0.5 mg/kg is part of the HCM premedication.","2":"A benzodiazepine at 0.2-0.3 mg/kg is part of the HCM premedication.","3":"Propofol given slowly to effect is the listed induction.","4":"A fentanyl CRI is the PIVA that lowers inhalant needs and hypotension risk."},"lec":"Integration W8+W11: HCM anesthesia","weeks":[8,11],"mods":[3]},{"stem":"A 10-year-old male neutered domestic shorthair cat with hypertrophic cardiomyopathy has runs of ventricular tachycardia at 280 bpm on his ECG, with wide, bizarre QRS complexes. He is weak during the runs but has a pulse. Electrolytes, including potassium and magnesium, are within reference intervals, and he is not in congestive heart failure. Which drug matches the slide's V-tac option for cats?","options":["Atenolol","Lidocaine","Diltiazem","Digoxin","Hyoscyamine"],"correct":0,"why":"The V-tac therapy slide lists IV lidocaine, IV amiodarone, sotalol, IV procainamide, and IM or oral quinidine for dogs, and gives a separate option for cats: a beta-blocker. Atenolol is a class II beta-blocker used for SVT and ventricular tachycardias, and the HCM slide also lists ultra-low-dose atenolol for a malignant tachyarrhythmia.","wrong":{"1":"IV lidocaine heads the dog list; the slide's cat option is a beta-blocker.","2":"Diltiazem is a class IV calcium channel blocker for SVT, not VT.","3":"Digoxin slows nodal conduction for SVT and atrial fibrillation.","4":"Hyoscyamine is an anticholinergic for symptomatic sinus bradycardia."},"lec":"W8: Arrhythmias","weeks":[8],"mods":[3]},{"stem":"In a wet autumn, first-season beef calves grazing a permanent pasture develop paroxysmal coughing, loud widespread crackles, and weight loss over 3 weeks. A Baermann exam of fresh feces finds larvae, and a transtracheal wash shows eosinophils. Which plan matches the lecture?","options":["Tulathromycin for the group","Irradiated larval vaccine now","Deworm and change pasture","Modified-live vaccine today","NSAIDs alone"],"correct":2,"why":"Subacute lungworm disease is the most common form: a 3-4 week course with paroxysmal coughing, loud widespread crackles, and weight loss, diagnosed by Baermann exam, airway washes, and eosinophilia. Treatment is to deworm with macrocyclic lactones or benzimidazoles and move the calves to clean pasture, because reinfection is common.","wrong":{"0":"Antimicrobials are supportive for secondary bacterial infection; the parasites need deworming.","1":"The irradiated larval vaccine is a European prevention tool, not treatment of active disease.","3":"Modified-live vaccines target viral BRD agents, not lungworms.","4":"NSAIDs are supportive care alongside deworming, not a substitute."},"lec":"W11: Production Animal Lower Airway","weeks":[11],"mods":[3]},{"stem":"A 450-kg Thoroughbred gelding lacerated a large vessel in his forelimb an hour ago. The bleeding is now controlled, but he is tachycardic with pale membranes and weak pulses. He was eating and drinking normally until the injury and is not dehydrated. Because of his size, the clinician chooses 7.5% hypertonic saline for rapid intravascular expansion, to be followed by isotonic crystalloids. What volume of hypertonic saline matches the lecture's dose?","options":["2,250-4,500 mL","4,500-6,750 mL","6,750-9,000 mL","27,000-40,500 mL","1,350-2,250 mL"],"correct":4,"why":"The shock lecture says 7.5% hypertonic saline is especially useful for very large animals, expands the intravascular space by about 3 times its own volume within 30 minutes, must always be followed by isotonic crystalloids, and must not be used in dehydrated patients. The dose is 3-5 mL/kg over 10 minutes: 450 kg x 3-5 mL/kg = 1,350-2,250 mL.","wrong":{"0":"5-10 mL/kg is the synthetic colloid dose for dogs.","1":"10-15 mL/kg is the crystalloid bolus for cats in the shock triad.","2":"15-20 mL/kg is the isotonic crystalloid aliquot for dogs.","3":"60-90 mL/kg is the total isotonic shock dose for dogs."},"lec":"W9: Shock and Sepsis","weeks":[9],"mods":[3]},{"stem":"A 2-year-old male Golden Retriever with severe subaortic stenosis (Doppler gradient 110 mmHg) needs general anesthesia for a fractured tooth. He received a chill protocol at home and is premedicated with an opioid and a benzodiazepine. Which induction agent does the lecture recommend for this patient?","options":["Ketamine","Etomidate","Rapid propofol bolus","High-dose dexmedetomidine","Alfaxalone"],"correct":1,"why":"SAS is an LV pressure overload with concentric hypertrophy, poor relaxation, a fixed stroke volume, and high myocardial oxygen demand; a gradient over 80 mmHg is severe, with a risk of sudden death. The goals are to avoid tachycardia, bradycardia, and hypotension, and the SAS slide recommends etomidate for induction because of its minimal cardiovascular depression, though it can cause excitement.","wrong":{"0":"Ketamine raises contractility, myocardial oxygen demand, and arrhythmia risk, as the HCM slide warns.","2":"Induction agents are given slowly to avoid hypotension, which risks coronary hypoperfusion in SAS.","3":"Only low-dose alpha-2 agonists (1-2 mcg/kg) are suggested for SAS, used cautiously.","4":"Alfaxalone has a negative inotropic effect, and the SAS slide names etomidate."},"lec":"W11: Cardiovascular Anesthesia","weeks":[11],"mods":[3]}];
var LET = ["A", "B", "C", "D", "E"];
var COURSE = { 1: "FCM", 2: "IIO", 3: "CVR", 4: "SSI" };
var MODS = { 1: "Module 1: Systems 4 FCM (Weeks 1-3)", 2: "Module 2: Systems 4 IIO (Weeks 4-7)", 3: "Module 3: Systems 4 CVR (Weeks 8-11)", 4: "Module 4: Systems 4 SSI (Weeks 12-15)" };
var DISC = ["Anesthesia", "Surgery", "Imaging", "Clinical pathology", "Infectious disease", "Oncology", "Cardiorespiratory", "Dermatology", "Ophthalmology", "Public health and pharmacology"];
var SPEC = ["Dog", "Cat", "Horse", "Cattle", "Small ruminant", "Pig", "Camelid", "Multiple"];
var TOTAL_SECONDS = CFG.minutes * 60;
var REVIEW_TIP = "Review this week's Socratic questions and Hard Practice Sets.";

function modOfWeek(w) { return w <= 3 ? 1 : (w <= 7 ? 2 : (w <= 11 ? 3 : 4)); }
function weekLabel(w) { return "Week " + w + " " + COURSE[modOfWeek(w)]; }
function isX(q) { return q.weeks.length > 1; }
function lecLabel(q) { return isX(q) ? "Integration questions" : q.lec.replace(/^W\d+:\s*/, ""); }
function pctOf(right, n) { return n ? Math.round(100 * right / n) : 0; }
function band(p) { return p < 50 ? "under-50" : (p < 70 ? "50-69" : (p < 85 ? "70-84" : "85-up")); }
function score(answers) {
  var res = { total: 0, n: QS.length, byWeek: {}, byLec: {}, byModule: {}, byDisc: {}, bySpecies: {}, cross: { right: 0, n: 0 } };
  function add(map, key, ok) { if (!map[key]) map[key] = { right: 0, n: 0 }; map[key].n++; if (ok) map[key].right++; }
  QS.forEach(function (q, i) {
    var ok = answers[i] === q.correct;
    if (ok) res.total++;
    q.weeks.forEach(function (w) {
      add(res.byWeek, w, ok);
      if (!res.byLec[w]) res.byLec[w] = {};
      add(res.byLec[w], lecLabel(q), ok);
    });
    q.mods.forEach(function (m) { add(res.byModule, m, ok); });
    if (q.disc) add(res.byDisc, q.disc, ok);
    if (q.species) add(res.bySpecies, q.species, ok);
    if (isX(q)) { res.cross.n++; if (ok) res.cross.right++; }
  });
  res.pct = pctOf(res.total, res.n);
  res.weeks = Object.keys(res.byWeek).map(Number).sort(function (a, b) { return a - b; });
  res.lowWeeks = res.weeks.filter(function (w) { return pctOf(res.byWeek[w].right, res.byWeek[w].n) < 70; });
  return res;
}
function gc(name) { try { if (window.goatcounter && window.goatcounter.count) { window.goatcounter.count({ path: name, title: name, event: true }); } } catch (e) {} }

var S = { screen: "disclaimer", cur: 0, answers: [], flags: [], left: TOTAL_SECONDS, paused: false, timerId: null, missedOnly: false, submitted: false };
for (var k = 0; k < QS.length; k++) { S.answers.push(null); S.flags.push(false); }
var KEY = "t4-practice-" + CFG.id;
function store(key, val) { try { window.localStorage.setItem(key, JSON.stringify(val)); } catch (e) {} }
function load(key) { try { var v = window.localStorage.getItem(key); return v ? JSON.parse(v) : null; } catch (e) { return null; } }
function save() { store(KEY, { answers: S.answers, flags: S.flags, left: S.left, cur: S.cur, submitted: S.submitted }); }

function esc(t) { return String(t).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
function fmt(s) { var m = Math.floor(s / 60), r = s % 60; return (m < 10 ? "0" : "") + m + ":" + (r < 10 ? "0" : "") + r; }
function toTop() { try { window.scrollTo(0, 0); } catch (e) {} }
var app = document.getElementById("app");

function tick() {
  if (S.paused || S.screen !== "exam") return;
  S.left = Math.max(0, S.left - 1);
  showTimer();
  if (S.left % 15 === 0) save();
  if (S.left === 0) { finish(); alert("Time is up. Your exam has been submitted."); }
}
function startTimer() { stopTimer(); S.timerId = setInterval(tick, 1000); }
function stopTimer() { if (S.timerId) clearInterval(S.timerId); S.timerId = null; }
function showTimer() {
  var box = document.getElementById("timerBox");
  box.classList.toggle("hidden", S.screen !== "exam");
  document.getElementById("timer").textContent = fmt(S.left);
  box.classList.toggle("low", S.left <= 600);
  document.getElementById("pauseBtn").textContent = S.paused ? "Resume" : "Pause";
}
document.getElementById("pauseBtn").onclick = function () { S.paused = !S.paused; render(); };

function disclaimerScreen() {

function startScreen() {
  var saved = load(KEY);

    '<h3>How it works</h3><ol class="steps">' +

    '<div class="navrow"><span></span><span>';

  h += '<button class="primary" type="button" id="begin">Start the exam</button></span></div></section>';
  app.innerHTML = h;
  document.getElementById("begin").onclick = function () {
    for (var i = 0; i < QS.length; i++) { S.answers[i] = null; S.flags[i] = false; }

  };
  var r = document.getElementById("resume");
  if (r) r.onclick = function () {

    if (S.submitted) { S.screen = "results"; } else { S.screen = "exam"; S.paused = false; startTimer(); }

function gridHtml(review) {
  var h = '<div class="grid">';
  QS.forEach(function (q, i) {
    var c = [];
    if (review) c.push(S.answers[i] === q.correct ? "r-ok" : "r-bad");
    else if (S.answers[i] !== null) c.push("ans");
    if (S.flags[i]) c.push("flg");
    if (i === S.cur) c.push("cur");
    h += '<button type="button" class="' + c.join(" ") + '" data-go="' + i + '" aria-label="Question ' + (i + 1) + '">' + (i + 1) + '</button>';
  });
  return h + '</div>';
}
function bindGrid() { Array.prototype.forEach.call(document.querySelectorAll("[data-go]"), function (b) { b.onclick = function () { S.cur = +b.getAttribute("data-go"); render(); toTop(); }; }); }

function examScreen() {
  if (S.paused) { app.innerHTML = '<section class="sheet paused"><h2>Paused</h2><p>The timer is stopped and the question is hidden. Select Resume to continue.</p><button class="primary" type="button" id="res2">Resume</button></section>'; document.getElementById("res2").onclick = function () { S.paused = false; render(); }; return; }
  var q = QS[S.cur], i = S.cur, answered = S.answers.filter(function (a) { return a !== null; }).length, nb = Math.ceil(QS.length / CFG.block);
  var h = '<section class="sheet"><div class="qhead"><span class="qnum">Question ' + (i + 1) + ' of ' + QS.length + '</span><span class="meta">Block ' + (Math.floor(i / CFG.block) + 1) + ' of ' + nb + ' &middot; ' + answered + ' answered</span></div>' +
    '<p class="stem">' + esc(q.stem) + '</p>';
  q.options.forEach(function (o, j) { h += '<button type="button" class="opt' + (S.answers[i] === j ? " sel" : "") + '" data-opt="' + j + '" aria-pressed="' + (S.answers[i] === j) + '"><span class="let">' + LET[j] + '</span><span class="txt">' + esc(o) + '</span></button>'; });
  h += '<div class="navrow"><button type="button" id="prev"' + (i === 0 ? " disabled" : "") + '>Previous</button>' +
    '<button type="button" class="flagbtn' + (S.flags[i] ? " on" : "") + '" id="flag">' + (S.flags[i] ? "Flagged" : "Flag for review") + '</button>' +
    (i < QS.length - 1 ? '<button type="button" class="primary" id="next">Next</button>' : '<button type="button" class="teal" id="sub2">Submit exam</button>') + '</div></section>' +
    '<section class="sheet"><h3 style="margin-top:0">Question navigator</h3>' + gridHtml(false) +
    '<div class="legend">Shaded = answered<span></span>flagged</div><div class="navrow"><span></span><button type="button" class="teal" id="sub">Submit exam</button></div></section>';
  app.innerHTML = h;
  Array.prototype.forEach.call(document.querySelectorAll("[data-opt]"), function (b) { b.onclick = function () { S.answers[i] = +b.getAttribute("data-opt"); save(); render(); }; });
  document.getElementById("prev").onclick = function () { S.cur--; render(); toTop(); };
  var nx = document.getElementById("next"); if (nx) nx.onclick = function () { S.cur++; render(); toTop(); };
  document.getElementById("flag").onclick = function () { S.flags[i] = !S.flags[i]; save(); render(); };
  document.getElementById("sub").onclick = askSubmit;
  var s2 = document.getElementById("sub2"); if (s2) s2.onclick = askSubmit;
  bindGrid();
}
function askSubmit() {
  var un = S.answers.filter(function (a) { return a === null; }).length, fl = S.flags.filter(Boolean).length;
  document.getElementById("modalText").textContent = (un ? un + " question" + (un === 1 ? " is" : "s are") + " unanswered and will be scored as wrong. " : "All " + QS.length + " questions are answered. ") +
    (fl ? fl + " question" + (fl === 1 ? " is" : "s are") + " still flagged. " : "") + "You cannot change answers after you submit.";
  document.getElementById("modal").classList.remove("hidden");
}
document.getElementById("cancelSubmit").onclick = function () { document.getElementById("modal").classList.add("hidden"); };
document.getElementById("confirmSubmit").onclick = function () { document.getElementById("modal").classList.add("hidden"); finish(); };
function finish() {
  if (S.submitted) return;
  stopTimer(); S.submitted = true; S.screen = "results"; S.cur = 0; save();
  var R = score(S.answers);
  gc(CFG.id + "-submit"); gc(CFG.id + "-score-" + band(R.pct));
  render(); toTop();
}

function rowCls(r) { var p = pctOf(r.right, r.n); return p < 70 ? "low" : (p >= 85 ? "strong" : ""); }
function head(first) { return '<table><tr><th class="c1">' + first + '</th><th class="num c2">Score</th><th class="num c3">%</th><th class="c4"><span class="hidden">Bar</span></th></tr>'; }
function row(label, r, cls) {
  var p = pctOf(r.right, r.n);
  return '<tr class="' + (cls || "") + '"><td>' + esc(label) + '</td><td class="num">' + r.right + ' / ' + r.n + '</td><td class="num">' + p + '%</td><td class="c4"><div class="bar"><i style="width:' + p + '%"></i></div></td></tr>';
}
function tbl(title, first, rows, colour) {
  var h = '<h3>' + title + '</h3>' + head(first);
  rows.forEach(function (r) { h += row(r[0], r[1], colour ? rowCls(r[1]) : ""); });
  return h + '</table>';
}
function weekTable(R) {
  var h = '<h3>Score by week</h3>' + head("Week");
  R.weeks.forEach(function (w) {
    var r = R.byWeek[w], c = rowCls(r);
    h += row(weekLabel(w), r, c);
    if (c === "low") h += '<tr class="tip"><td colspan="4">' + REVIEW_TIP + '</td></tr>';
  });
  return h + '</table>';
}
function lectureBlocks(R) {
  var h = '<h3>Score by lecture</h3><p class="meta">' + (CFG.final ? "Select a week to see its lectures. Weeks below 70% are open." : "Lectures are grouped by week.") + '</p>';
  R.weeks.forEach(function (w) {
    var wr = R.byWeek[w], low = pctOf(wr.right, wr.n) < 70, open = low || !CFG.final;
    var names = Object.keys(R.byLec[w]).sort(function (a, b) {
      var ia = a === "Integration questions", ib = b === "Integration questions";
      if (ia !== ib) return ia ? 1 : -1; return a < b ? -1 : (a > b ? 1 : 0);
    });
    h += '<details class="wk' + (low ? " low" : "") + '"' + (open ? " open" : "") + '><summary>' + esc(weekLabel(w)) + ' <span class="s">&middot; ' + wr.right + ' / ' + wr.n + ' (' + pctOf(wr.right, wr.n) + '%)</span></summary>' + head("Lecture");
    names.forEach(function (nm) { h += row(nm, R.byLec[w][nm], ""); });
    h += '</table>' + (low ? '<div class="callout"><b>' + REVIEW_TIP + '</b></div>' : '') + '</details>';
  });
  return h;
}
function resultsScreen() {
  var R = score(S.answers), used = TOTAL_SECONDS - S.left;
  var h = '<section class="sheet"><h2>Your results</h2><div class="big">' + R.total + ' / ' + R.n + ' (' + R.pct + '%)</div>' +
    '<p class="meta">Time used: ' + fmt(used) + ' of ' + CFG.minutes + ':00.</p>';
  if (R.lowWeeks.length) h += '<div class="callout"><b>Weeks below 70%:</b> ' + R.lowWeeks.map(weekLabel).join(", ") + '. ' + REVIEW_TIP + '</div>';
  else h += '<div class="callout ok"><b>Every week is at 70% or higher.</b> Use the lecture rows below to find the topics still worth a second look.</div>';
  h += '<p>Integration questions count toward every week they draw on, so week rows add up to more than ' + R.n + '.</p>' +
    weekTable(R) + lectureBlocks(R);
  if (CFG.final) {
    h += tbl("Score by module", "Module", [1, 2, 3, 4].map(function (m) { return [MODS[m], R.byModule[m] || { right: 0, n: 0 }]; }), true) +
      tbl("Score by discipline", "Discipline", DISC.filter(function (d) { return R.byDisc[d]; }).map(function (d) { return [d, R.byDisc[d]]; }), true) +
      tbl("Score by species", "Species", SPEC.filter(function (d) { return R.bySpecies[d]; }).map(function (d) { return [d, R.bySpecies[d]]; }), true) +
      tbl("Cross-module questions", "Type", [["All cross-module questions", R.cross]], true);
  } else if (R.cross.n) {
    h += tbl("Integration questions", "Type", [["All integration questions", R.cross]], true);
  }
  h += '<h3>Group your misses, then fix them</h3><ol class="steps"><li><b>Didn\'t know it:</b> Brain Dump the lecture where these misses cluster, then retest it with Run Socratic.</li>' +
    '<li><b>Misread it:</b> Read the last line (the lead-in) first, then read the case looking for the clues it asks about.</li>' +
    '<li><b>Changed my answer:</b> Keep your first answer unless something in the case proves it wrong.</li></ol>' +
    '<p><b>Start with your lowest week' + (CFG.final ? ", then your lowest module and discipline." : ", then your lowest lectures.") + '</b> Check those topics against your class notes and bring questions to faculty.</p>' +
    '<div class="navrow"><button type="button" id="again">Start a new attempt</button><span><button type="button" id="revMiss">Review missed only</button> <button type="button" class="primary" id="revAll">Review all questions</button></span></div></section>';
  app.innerHTML = h;
  document.getElementById("revAll").onclick = function () { S.missedOnly = false; S.screen = "review"; S.cur = 0; render(); toTop(); };
  document.getElementById("revMiss").onclick = function () { S.missedOnly = true; S.screen = "review"; var m = missed(); S.cur = m.length ? m[0] : 0; render(); toTop(); };
  document.getElementById("again").onclick = function () { if (confirm("Clear this attempt and start over?")) { S.screen = "start"; S.submitted = false; for (var i = 0; i < QS.length; i++) { S.answers[i] = null; S.flags[i] = false; } S.left = TOTAL_SECONDS; save(); render(); toTop(); } };
}
function missed() { var m = []; QS.forEach(function (q, i) { if (S.answers[i] !== q.correct) m.push(i); }); return m; }
function reviewScreen() {
  var list = S.missedOnly ? missed() : QS.map(function (q, i) { return i; });
  if (!list.length) { app.innerHTML = '<section class="sheet"><h2>No missed questions</h2><p>You answered every question correctly.</p><button type="button" id="back">Back to results</button></section>'; document.getElementById("back").onclick = function () { S.screen = "results"; render(); }; return; }
  if (list.indexOf(S.cur) < 0) S.cur = list[0];
  var pos = list.indexOf(S.cur), i = S.cur, q = QS[i], a = S.answers[i];
  var h = '<section class="sheet"><div class="qhead"><span class="qnum">Question ' + (i + 1) + (a === q.correct ? ' &middot; Correct' : (a === null ? ' &middot; Not answered' : ' &middot; Missed')) + '</span><span class="pill">' + esc(q.lec) + '</span></div>' +
    '<label class="chk"><input type="checkbox" id="mo"' + (S.missedOnly ? " checked" : "") + '> Show missed only (' + missed().length + ')</label>' +
    '<p class="stem" style="margin-top:12px">' + esc(q.stem) + '</p>';
  q.options.forEach(function (o, j) {
    var c = j === q.correct ? " correct" : (j === a ? " wrongpick" : "");
    var tag = j === q.correct ? " (correct answer)" : (j === a ? " (your answer)" : "");
    h += '<div class="opt' + c + '"><span class="let">' + LET[j] + '</span><span class="txt">' + esc(o) + '<b>' + tag + '</b></span></div>';
  });
  h += '<div class="why"><b>Why ' + LET[q.correct] + '. ' + esc(q.options[q.correct]) + ' is correct:</b> ' + esc(q.why) + '</div>';
  if (a !== null && a !== q.correct) h += '<div class="pick"><b>Why your answer, ' + LET[a] + '. ' + esc(q.options[a]) + ', misses:</b> ' + esc(q.wrong[a]) + '</div>';
  h += '<details class="others"><summary>Why each other option misses</summary>';
  q.options.forEach(function (o, j) { if (j !== q.correct) h += '<p><b>' + LET[j] + '. ' + esc(o) + ':</b> ' + esc(q.wrong[j]) + '</p>'; });
  var tags = [q.weeks.map(weekLabel).join(" + ")].concat([q.disc, q.species, q.type].filter(Boolean));
  h += '</details><p class="meta" style="margin-top:12px">' + esc(tags.join(" · ")) + '</p>' +
    '<div class="navrow"><button type="button" id="rprev"' + (pos === 0 ? " disabled" : "") + '>Previous</button><button type="button" id="back">Back to results</button>' +
    '<button type="button" class="primary" id="rnext"' + (pos === list.length - 1 ? " disabled" : "") + '>Next</button></div></section>' +
    '<section class="sheet"><h3 style="margin-top:0">All questions</h3>' + gridHtml(true) + '<div class="legend">Green = correct, red = missed<span></span>flagged during the exam</div></section>';
  app.innerHTML = h;
  document.getElementById("rprev").onclick = function () { S.cur = list[pos - 1]; render(); toTop(); };
  document.getElementById("rnext").onclick = function () { S.cur = list[pos + 1]; render(); toTop(); };
  document.getElementById("back").onclick = function () { S.screen = "results"; render(); toTop(); };
  document.getElementById("mo").onchange = function () { S.missedOnly = this.checked; render(); };
  Array.prototype.forEach.call(document.querySelectorAll("[data-go]"), function (b) { b.onclick = function () { var g = +b.getAttribute("data-go"); if (S.missedOnly && missed().indexOf(g) < 0) S.missedOnly = false; S.cur = g; render(); toTop(); }; });
}
function render() {
  showTimer();
  if (S.screen === "disclaimer") disclaimerScreen();
  else if (S.screen === "start") startScreen();
  else if (S.screen === "exam") examScreen();
  else if (S.screen === "results") resultsScreen();
  else reviewScreen();
}
render();
</script>
